name = "dosbuhos-ops"
main = "src/index.js"
compatibility_date = "2025-02-24"

# Nightly Zoho import at 2:15 am Central (08:15 UTC)
[triggers]
crons = ["15 8 * * *"]

[vars]
ZOHO_ORG_ID = "843697568"
ZOHO_ACCOUNTS_URL = "https://accounts.zoho.com"
ZOHO_API_URL = "https://www.zohoapis.com/inventory/v1"
ADMIN_EMAILS = "emaycotte@gmail.com,cabosari@dosbuhos.com,carlostapia@dosbuhos.com"
# Set after creating the Access application (see SETUP.md):
ACCESS_TEAM_DOMAIN = "dosbuhos.cloudflareaccess.com"
ACCESS_AUD = "93cccbeb578bb85754f0f55d7edd994cd684075c0074954b7c511a6eea20b6d4"

[[d1_databases]]
binding = "DB"
database_name = "muestras"
database_id = "a6d21c0e-2d03-4d03-9233-d295ccfed6d3"

