<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Registros de bodega</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3ef;--paper:#fffefb;--ink:#1f2426;--muted:#5d6568;--rule:#dcd9d1;--wine:#5c1f33;--wine-soft:#f2e5e8;--red:#b3261e;--red-bg:#fbe2df;--amber:#8f6200;--amber-bg:#faefd3;--green:#2f6b34;--green-bg:#e3f0e1;--blue:#2d5c8a;--blue-bg:#e6eef7;
--f-d:"Barlow Condensed","Arial Narrow",sans-serif;--f-b:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--f-m:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-b)}
header{position:sticky;top:0;z-index:5;background:var(--wine);color:#fff;padding:10px 16px 0}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font:700 24px/1.1 var(--f-d);letter-spacing:.04em;text-transform:uppercase;flex:1}
header a{color:#f6e9ee;font-size:13px}
.tabs{display:flex;gap:4px;margin-top:8px}
.tabs button,.tabs a{border:0;background:transparent;color:#f6e9ee;padding:8px 14px;font:600 15px var(--f-b);border-radius:10px 10px 0 0;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--bg);color:var(--wine)}
.banner{margin:12px 16px 0;padding:10px 12px;border-radius:10px;background:var(--amber-bg);color:#5a3d00;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner b{font-family:var(--f-d);font-size:16px;letter-spacing:.06em}
.banner button{margin-left:auto}
main{padding:12px 16px 40px;max-width:1500px;margin:0 auto}
.btn{border:1px solid var(--rule);background:var(--paper);border-radius:9px;padding:6px 12px;font:600 14px var(--f-b);cursor:pointer;color:var(--ink)}
.btn.primary{background:var(--wine);border-color:var(--wine);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.chips button{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:5px 12px;font:600 13px var(--f-b);cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chips small{font-weight:400;opacity:.7;margin-left:3px}
h2{font:700 18px var(--f-d);letter-spacing:.06em;text-transform:uppercase;color:var(--wine);margin:18px 0 8px;display:flex;gap:8px;align-items:baseline}
h2 small{font:500 13px var(--f-b);letter-spacing:0;text-transform:none;color:var(--muted)}
h2.over{color:var(--red)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.wo{background:var(--paper);border:1px solid var(--rule);border-left:4px solid var(--blue);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.wo.p-urgent{border-left-color:var(--red)}.wo.p-high{border-left-color:var(--amber)}
.wo .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.wo .lot{font-weight:600;color:var(--ink);font-size:14px}
.wo .when{margin-left:auto;font:500 12px var(--f-m)}
.wo .when.over{color:var(--red);font-weight:600}
.wo .txt{font-size:14px;line-height:1.4}
.wo .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font:600 11px var(--f-m);padding:1px 7px;border-radius:999px;background:var(--rule);color:var(--ink);letter-spacing:.03em}
.tag.urgent{background:var(--red);color:#fff}.tag.high{background:var(--amber-bg);color:var(--amber)}
.tag.who{background:var(--wine-soft);color:var(--wine)}
.wo .act{display:flex;gap:6px;margin-top:2px}
.wo .act .btn{flex:1;padding:8px}
.lots{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.lotc{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.lotc:hover{border-color:var(--wine)}
.lotc b{display:block;font-size:15px}
.lotc .tabn{font:12px var(--f-m);color:var(--muted)}
.lotc .nums{display:flex;gap:10px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.lotc .nums .open{color:var(--wine);font-weight:600}
.lothead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.lothead h3{margin:0;font:700 22px var(--f-d);text-transform:uppercase;color:var(--wine);letter-spacing:.03em}
.lothead .tabn{font:12.5px var(--f-m);color:var(--muted)}
.lothead input{margin-left:auto;border:1px solid var(--rule);border-radius:999px;padding:6px 12px;font:inherit;min-width:0;width:220px;background:var(--paper)}
/* Spreadsheet grid (desktop) */
.grid-wrap{overflow:auto;max-height:75vh;border:1px solid var(--rule);border-radius:10px;background:var(--paper)}
table.g{border-collapse:separate;border-spacing:0;font-size:13px;min-width:1200px;width:100%}
table.g th{position:sticky;top:0;background:var(--paper);border-bottom:2px solid var(--ink);font:500 10.5px var(--f-m);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px 6px;white-space:nowrap;z-index:1}
table.g td{border-bottom:1px solid var(--rule);padding:6px;vertical-align:top}
table.g td.n{text-align:right;font-family:var(--f-m);font-size:12.5px;white-space:nowrap}
table.g td.d{font-family:var(--f-m);font-size:12px;white-space:nowrap}
table.g td.note{min-width:340px}
table.g tr.open td{background:#fffaf0}
table.g tr.xx td{color:var(--muted);text-decoration:line-through}
table.g td.rn{color:var(--muted);font:11px var(--f-m)}
/* Phone: log as cards */
.logcards{display:none;flex-direction:column;gap:8px}
.lc{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:9px 11px}
.lc .h{display:flex;gap:8px;font:12px var(--f-m);color:var(--muted);align-items:baseline}
.lc .h .st{margin-left:auto}
.lc .t{font-size:14px;margin:4px 0}
.lc .v{display:flex;gap:5px;flex-wrap:wrap}
.lc .v span{font:12px var(--f-m);background:var(--blue-bg);color:var(--blue);border-radius:6px;padding:1px 6px}
.lc.open{border-left:4px solid var(--amber)}
.lc.xx{opacity:.55}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
dialog{border:0;border-radius:14px;padding:0;width:min(520px,calc(100vw - 24px));box-shadow:0 12px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(20,22,24,.45)}
dialog form{padding:16px;display:flex;flex-direction:column;gap:10px}
dialog h3{margin:0;font:700 20px var(--f-d);text-transform:uppercase;color:var(--wine);letter-spacing:.03em}
dialog .ctx{font-size:13px;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px}
dialog label{display:flex;flex-direction:column;gap:3px;font:600 11px var(--f-m);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
dialog input,dialog select,dialog textarea{width:100%;min-width:0;font:16px var(--f-b);text-transform:none;letter-spacing:0;color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:8px;background:#fff}
dialog .g2{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
dialog .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
dialog .row{display:flex;gap:8px;justify-content:flex-end;align-items:center}
dialog .chk{flex-direction:row;align-items:center;gap:8px;font:500 14px var(--f-b);text-transform:none;letter-spacing:0;color:var(--ink)}
dialog .err{color:var(--red);font-size:13px;min-height:1em}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90vw}
.newbtn{margin:0 0 10px}
@media (max-width:760px){dialog .g2{grid-template-columns:repeat(2,1fr)}dialog .g3{grid-template-columns:1fr}}
@media (max-width:760px){
  header{padding:8px 12px 0}h1{font-size:20px}
  .banner{font-size:12px;padding:6px 10px}.banner span{display:none}
  main{padding:10px 12px 40px}.banner{margin:10px 12px 0}
  .cards{grid-template-columns:1fr}
  .grid-wrap{display:none}.logcards{display:flex}
  .lothead input{width:100%;margin-left:0}
}

/* ===== Lot pager: one lot per screen ===== */
.lp-head{position:sticky;top:var(--hh,96px);z-index:4;background:var(--bg);margin:0 -16px;padding:8px 8px 8px;display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;gap:4px;border-bottom:1px solid var(--rule)}
.lp-arrow{width:44px;height:44px;border:1px solid var(--rule);border-radius:12px;background:var(--paper);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.lp-arrow:disabled{opacity:.3}
.lp-arrow svg{width:22px;height:22px}
.lp-title{border:0;background:none;text-align:center;cursor:pointer;padding:2px 4px;min-width:0;color:var(--ink)}
.lp-title b{display:flex;align-items:center;justify-content:center;gap:6px;font:700 22px/1.1 var(--f-d);text-transform:uppercase;letter-spacing:.03em;color:var(--wine);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp-title b::after{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-3px);flex:none}
.lp-title small{display:block;font:12px var(--f-m);color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:2px;vertical-align:1px}
.lp-body{max-width:860px;margin:0 auto;padding:12px 0 110px;transition:transform .18s ease,opacity .18s ease}
.lp-body.out-l{transform:translateX(-24px);opacity:0}.lp-body.out-r{transform:translateX(24px);opacity:0}
.sec{margin:0 0 18px}
.sec h4{display:flex;align-items:baseline;gap:8px;margin:0 0 8px;font:700 13px var(--f-d);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sec h4 small{font:500 12px var(--f-b);letter-spacing:0;text-transform:none}
.sec h4 .r{margin-left:auto}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:8px 10px;min-width:0}
.tile i{display:block;font:600 10px var(--f-m);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-style:normal}
.tile b{display:block;font:700 22px/1.15 var(--f-d);color:var(--ink);margin-top:2px}
.tile small{display:block;font:11px var(--f-m);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.none b{color:var(--rule)}
.tile.old small{color:var(--amber)}
.ocard{background:var(--paper);border:1px solid var(--rule);border-left:4px solid var(--blue);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ocard.p-urgent{border-left-color:var(--red)}.ocard.p-high{border-left-color:var(--amber)}
.ocard .oh{display:flex;gap:8px;align-items:center;font:600 12.5px var(--f-b);color:var(--muted)}
.ocard .oh .late{color:var(--red)}
.ocard .oh .r{margin-left:auto;font:12px var(--f-m)}
.ocard .ot{margin:6px 0 8px;font-size:14.5px;line-height:1.42}
.ocard .oa{display:flex;gap:8px}
.ocard .oa .btn{flex:1;min-height:42px}
.xlog{display:flex;flex-direction:column;gap:10px}
.xe{border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--paper);cursor:pointer}
.xe-h{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:7px 12px;background:#3a4043;color:#fff;font:600 12.5px var(--f-m)}
.xe-u{color:#d9dde0;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
.xe-st{margin-left:auto;padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.14);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.xe-st.open{background:#ffb13d;color:#3a2500}.xe-st.done{background:#9ad39f;color:#10351a}.xe-st.xx{background:#c9ced3;color:#333}
.xe-b{padding:9px 12px 10px}
.xe-r{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 6px;font:600 15px var(--f-m)}
.xe-r span{white-space:nowrap}
.xe-r i{display:block;font:500 9.5px var(--f-m);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-style:normal}
.xe-n{margin:0;font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.xe.xx{opacity:.55}
.mon{font:700 12px var(--f-d);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
.lp-bar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(244,243,239,.96);backdrop-filter:blur(6px);border-top:1px solid var(--rule)}
.lp-bar .btn{flex:1;min-height:48px;font-size:15px;border-radius:12px}
.lp-hint{text-align:center;font:12px var(--f-b);color:var(--muted);margin:6px 0 0}
.viewtog{display:flex;justify-content:flex-end;margin:0 0 8px;gap:4px}
.viewtog button{border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:5px 10px;font:600 12.5px var(--f-b);cursor:pointer;color:var(--muted)}
.viewtog button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
/* Order controls, same as the main app: Prioridad · Asignado · Estado always visible */
.ctl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--rule)}
.ctl label{display:flex;flex-direction:column;gap:3px;min-width:0;font:600 10px var(--f-m);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ctl select,.ctl .who{width:100%;min-width:0;min-height:42px;font:600 13.5px var(--f-b);padding:6px 8px;border-radius:10px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ctl select.pri-URGENT{background:#f6c8c8;color:#8a1c1c;border-color:#e7a3a3}.ctl select.pri-HIGH{background:#fbe3b0;color:#7a4d00;border-color:#efcd84}
.ctl select.st{background:#e3eefc;color:#12417a;border-color:#b7cff0}
.ctl.busy{opacity:.5;pointer-events:none}
.pen{width:36px;height:36px;flex:none;border:1px solid var(--rule);border-radius:10px;background:var(--paper);display:inline-flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;padding:0}
.pen svg{width:17px;height:17px}
.crewpick{display:flex;flex-wrap:wrap;gap:6px}
.crewpick .cp{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);font:500 14px var(--f-b);cursor:pointer;color:var(--ink)}
.crewpick .cp[aria-pressed=true]{background:var(--wine);border-color:var(--wine);color:#fff;font-weight:600}
/* lot picker */
.pick-q{width:100%;min-height:44px;border:1px solid var(--rule);border-radius:12px;padding:0 12px;font:16px var(--f-b);background:#fff}
.pick-list{display:flex;flex-direction:column;gap:2px;max-height:60dvh;overflow:auto;margin:4px -4px 0}
.pick-list button{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:10px 8px;border-radius:10px;font:inherit;color:var(--ink);cursor:pointer}
.pick-list button:hover,.pick-list button[aria-current=true]{background:var(--wine-soft)}
.pick-list b{font-size:15px;flex:1;min-width:0}
.pick-list small{font:12px var(--f-m);color:var(--muted)}
.pick-list .oc{font:700 11px var(--f-m);background:var(--wine);color:#fff;border-radius:999px;padding:1px 7px}
@media (max-width:760px){
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .lp-head{margin:0 -12px}
  dialog{width:100%;max-width:none;margin:auto 0 0;border-radius:20px 20px 0 0}
  dialog form{max-height:88dvh;overflow:auto}
  .viewtog{display:none}
}
@media (min-width:761px){.lp-bar{left:50%;transform:translateX(-50%);max-width:860px;border:1px solid var(--rule);border-radius:16px 16px 0 0}}
</style>
</head>
<body>
<header>
  <div class="hrow"><h1>Registros de bodega</h1><a href="/">← Calendario</a></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-t="lotes" aria-selected="true">Lotes</button>
    <button role="tab" data-t="ordenes" aria-selected="false">Órdenes abiertas</button>
    <a role="tab" href="/purchases" aria-selected="false" style="text-decoration:none">Compras ↗</a>
  </nav>
</header>
<div class="banner" id="banner"><b>MODO PRUEBA</b><span id="bannerTxt">Cargando…</span><button class="btn" id="importBtn">Sincronizar ahora</button></div>
<main id="main"><div class="empty">Cargando…</div></main>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const today = new Date(Date.now() - 6 * 3600e3).toISOString().slice(0, 10);
  const S = { view: 'lotes', mode: (() => { try { return localStorage.getItem('db.mode') || 'cards'; } catch (e) { return 'cards'; } })(), groups: {}, who: 'Todos', tabs: [], open: [], names: {}, lot: null, rows: [], q: '', me: {}, at: 0 };
  const DOW = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
  const fmtD = iso => { if (!iso) return 'sin fecha'; const d = new Date(iso + 'T12:00:00'); return DOW[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1); };
  const lotName = tab => S.names[tab] || tab;
  const priCls = p => /URG/i.test(p) ? 'urgent' : /HIGH|ALTA/i.test(p) ? 'high' : '';
  const priLbl = p => /URG/i.test(p) ? 'URGENTE' : /HIGH|ALTA/i.test(p) ? 'ALTA' : '';
  const people = a => String(a || '').toUpperCase().split(/[\/,&\s]+/).filter(Boolean);
  const PEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
  S.staff = [];
  const staffFind = t => { t = String(t || '').toUpperCase(); return S.staff.find(c => String(c.tag).toUpperCase() === t || (c.aliases || []).map(a => String(a).toUpperCase()).includes(t)); };
  const nameOf = t => { const c = staffFind(t); return c ? c.name : t; };
  const asigLabel = a => people(a).map(nameOf).join(' + ') || '—';
  function ctlHTML(r) {
    const key = esc(r.tab) + '|' + r.row, pri = /URG/i.test(r.pri) ? 'URGENT' : /HIGH|ALTA/i.test(r.pri) ? 'HIGH' : 'NORMAL';
    return `<div class="ctl" data-key="${key}"><label>Prioridad<select class="pri-${pri}" data-cpri>${['NORMAL', 'HIGH', 'URGENT'].map(p => `<option${p === pri ? ' selected' : ''}>${p}</option>`).join('')}</select></label>
      <label>Asignado<button type="button" class="who" data-cwho>${esc(asigLabel(r.asig))}</button></label>
      <label>Estado<select class="st" data-cst><option value="open" selected>Open</option><option value="done">Done</option><option value="roll">Roll over → mañana</option><option value="xx">Cancel (XX)</option></select></label></div>`;
  }
  const CREW = () => [...new Set(['P/J', 'P', 'J', 'D', 'EM', 'EM/D', ...S.open.map(r => String(r.asig || '').toUpperCase()).filter(Boolean)])];
  const toast = t => { const e = $('#toast'); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { e.hidden = true; }, 3500); };
  const ago = ms => { const m = Math.round((Date.now() - ms) / 60000); return m < 1 ? 'hace menos de 1 min' : 'hace ' + m + ' min'; };
  async function post(path, body) {
    const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.message || 'Error ' + r.status); return j;
  }

  async function load() {
    const [t, o, lots, me, staff] = await Promise.all([
      fetch('/api/xl/tabs').then(r => r.json()), fetch('/api/xl/open').then(r => r.json()),

  }
  function banner() {

  }

  function renderOrdenes() {
    const counts = {}; for (const r of S.open) for (const p of people(r.asig)) counts[p] = (counts[p] || 0) + 1;
    const whoList = ['Todos', ...Object.keys(counts).sort((a, b) => counts[b] - counts[a])];

    let h = `<button class="btn primary newbtn" data-new>+ Nueva orden</button><div class="chips">${whoList.map(w => `<button data-who="${esc(w)}" aria-pressed="${S.who === w}">${esc(w === 'Todos' ? w : nameOf(w))}<small>${w === 'Todos' ? S.open.length : counts[w]}</small></button>`).join('')}</div>`;

          <div class="txt">${esc(r.note)}</div>

  }

  const GCOL = { red: '#7a1f2b', rose: '#e0849a', white: '#d8b43c', orange: '#d9822b', sparkling: '#7fa7b8', routine: '#9aa5b1' };
  const order = () => S.tabs.slice().sort((a, b) => a.tab.localeCompare(b.tab, 'es', { numeric: true }));
  const MES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  const ICL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
  const ICR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
  function renderLotes() {
    if (!S.lot) return '<div class="empty">Todavía no hay lotes. Pulsa «Sincronizar ahora».</div>';
    const list = order(), i = list.findIndex(t => t.tab === S.lot), t = list[i] || { tab: S.lot };
    const g = S.groups[t.tab];
    const head = `<div class="lp-head"><button class="lp-arrow" data-go="-1" ${i <= 0 ? 'disabled' : ''} aria-label="Lote anterior">${ICL}</button>
      <button class="lp-title" data-pick aria-label="Elegir lote"><b>${esc(lotName(t.tab))}</b><small>${g ? `<span class="lp-dot" style="background:${GCOL[g] || '#999'}"></span>` : ''}${esc(t.tab)} · ${i + 1} de ${list.length}</small></button>

    return head + `<div class="lp-body" id="lpBody">${tog}${renderLotCards()}</div>` + bar;
  }
  const READ = [['volf', 'Litros', ''], ['ph', 'pH', ''], ['at', 'AT', ''], ['am', 'Málico', ''], ['sl', 'SO₂ L', ''], ['st', 'SO₂ T', ''], ['aa', 'AV', ''], ['bx', 'Brix', ''], ['tp', 'T °C', '']];
  const daysAgo = iso => iso ? Math.round((new Date(today) - new Date(iso)) / 864e5) : null;
  function renderLotCards() {
    const rows = S.rows.slice().sort((a, b) => a.row - b.row);
    // 1. Latest numbers
    const last = {}; for (const r of rows) for (const [k] of READ) if (r[k] != null && String(r[k]).trim() !== '' && String(r[k]).trim() !== '?') last[k] = { v: String(r[k]).trim(), d: r.date };
    const shown = READ.filter(([k]) => last[k] || ['ph', 'am', 'sl', 'aa', 'volf', 'at'].includes(k));
    let h = `<section class="sec"><h4>Últimos números</h4><div class="tiles">${shown.map(([k, l, u]) => { const x = last[k]; const ago = x ? daysAgo(x.d) : null;

    // 2. Open orders for this lot
    const open = rows.filter(r => r.asig && !r.ini).sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')));

      return `<article class="ocard p-${priCls(r.pri)}"><div class="oh">${priLbl(r.pri) ? `<span class="tag ${priCls(r.pri)}">${priLbl(r.pri)}</span>` : ''}<span class="${late ? 'late' : ''}">${late ? 'Atrasada ' + daysAgo(r.date) + ' d' : r.date === today ? 'Hoy' : fmtD(r.date)}</span><span class="r">${esc(r.ubi || '')}</span><button class="pen" data-res="${esc(r.tab)}|${r.row}" aria-label="Editar">${PEN}</button></div>
        <div class="ot">${esc(r.note)}</div>${ctlHTML(r)}</article>`; }).join('') + `</section>`;
    // 3. Log, newest first, grouped by month
    const q = S.q.toLowerCase();

    let lastM = '';

      const m = r.date ? r.date.slice(0, 7) : ''; let sep = '';

      const st = r.ini === 'XX' ? '<span class="xe-st xx">Cancelada</span>' : r.ini ? `<span class="xe-st done">Hecha · ${esc(r.ini)}</span>` : '';
      const reads = READ.filter(([k]) => r[k] != null && String(r[k]).trim() !== '').map(([k, l]) => `<span><i>${l}</i>${esc(r[k])}</span>`).join('');
      return sep + `<article class="xe${r.ini === 'XX' ? ' xx' : ''}" data-res="${esc(r.tab)}|${r.row}"><div class="xe-h"><span>${esc(fmtD(r.date))}</span>${r.ubi ? `<span class="xe-u">${esc(r.ubi)}</span>` : ''}${st}</div><div class="xe-b">${reads ? `<div class="xe-r">${reads}</div>` : ''}${r.note ? `<p class="xe-n">${esc(r.note)}</p>` : ''}</div></article>`;
    }).join('') + `</div></section><p class="lp-hint">Desliza ← → para cambiar de lote</p>`;
    return h;
  }
  function renderTable() {

      rows.map(r => `<tr class="${st(r)}"><td class="rn">${r.row}</td>${COLS.map(([k, , c]) => `<td class="${c || ''}">${esc(r[k])}</td>`).join('')}<td style="white-space:nowrap">${act(r)}<button class="btn" data-res="${esc(r.tab)}|${r.row}">Editar</button></td></tr>`).join('') + `</tbody></table></div><div style="height:90px"></div>`;

  const COLS = [['date_raw', 'Fecha', 'd'], ['ubi', 'Ubi'], ['voli', 'Vol I', 'n'], ['volf', 'Vol F', 'n'], ['ph', 'pH', 'n'], ['bx', 'Bx', 'n'], ['tp', 'T°', 'n'], ['at', 'AT', 'n'], ['am', 'Málico', 'n'], ['sl', 'SO₂ L', 'n'], ['st', 'SO₂ T', 'n'], ['aa', 'AV', 'n'], ['note', 'Acción', 'note'], ['pri', 'Pri'], ['by_', 'Por'], ['asig', 'Asig'], ['ini', 'Ini']];
  const LAB = [['volf', 'Vol F (L)'], ['ph', 'pH'], ['tp', 'T° (°C)'], ['at', 'AT (g/L)'], ['am', 'Málico (g/L)'], ['sl', 'SO₂ libre'], ['st', 'SO₂ total'], ['aa', 'AV (g/L)'], ['bx', 'Brix']];
  async function goLot(tab, dir) {

    const b = $('#lpBody'); if (b && dir) { b.classList.add(dir > 0 ? 'out-l' : 'out-r'); }

    S.rows = (await (await fetch('/api/xl/rows?tab=' + encodeURIComponent(tab))).json()).rows || [];
    render(); window.scrollTo(0, 0);
  }
  function step(d) { const list = order(), i = list.findIndex(t => t.tab === S.lot), n = list[i + d]; if (n) goLot(n.tab, d); }
  function openPicker() {
    const list = order();
    const d = $('#dlg'), f = $('#dlgForm');
    const draw = q => list.filter(t => !q || (lotName(t.tab) + ' ' + t.tab).toLowerCase().includes(q.toLowerCase())).map(t => `<button type="button" data-pickgo="${esc(t.tab)}" aria-current="${t.tab === S.lot}"><span class="lp-dot" style="background:${GCOL[S.groups[t.tab]] || '#ccc'}"></span><b>${esc(lotName(t.tab))}<br><small>${esc(t.tab)}</small></b>${t.open ? `<span class="oc">${t.open}</span>` : ''}</button>`).join('');
    f.innerHTML = `<h3>Lotes</h3><input class="pick-q" placeholder="Buscar lote" id="pq"><div class="pick-list" id="pl">${draw('')}</div><div class="row"><button type="button" class="btn" data-cancel>Cerrar</button></div>`;
    f.onsubmit = e => e.preventDefault();
    f.querySelector('[data-cancel]').onclick = () => d.close();
    f.querySelector('#pq').oninput = e => { f.querySelector('#pl').innerHTML = draw(e.target.value); };
    f.querySelector('#pl').onclick = e => { const b = e.target.closest('[data-pickgo]'); if (b) { d.close(); goLot(b.dataset.pickgo); } };
    d.showModal(); setTimeout(() => { const c = f.querySelector('[aria-current="true"]'); if (c) c.scrollIntoView({ block: 'center' }); }, 30);
  }
  // Swipe between lots (horizontal swipe on the lot body; vertical scrolling is untouched).
  let sx = null, sy = null;
  document.addEventListener('touchstart', e => { if (S.view !== 'lotes' || e.target.closest('dialog,input,textarea,.grid-wrap')) { sx = null; return; } sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  document.addEventListener('touchend', e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null; if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) step(dx < 0 ? 1 : -1); }, { passive: true });
  document.addEventListener('keydown', e => { if (S.view === 'lotes' && !$('#dlg').open && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1); } });

  function render() {

  }

  // ---------- dialogs ----------
  const findRow = key => { const [tab, row] = key.split('|'); return [...S.open, ...S.rows].find(r => r.tab === tab && r.row === +row); };
  const opts = (list, sel) => list.map(v => `<option value="${esc(v)}"${v === sel ? ' selected' : ''}>${esc(v)}</option>`).join('');
  function openDlg(html, onSubmit) {

      e.preventDefault(); const ok = $('#dOk'); ok.disabled = true; ok.textContent = 'Guardando en Excellovint…';

  function dlgDone(r) {
    openDlg(`<h3>Marcar como hecha</h3><div class="ctx"><b>${esc(lotName(r.tab))}</b> · ${esc(r.ubi)} · ${fmtD(r.date)}<br>${esc(r.note)}</div>

      async fd => {

  function dlgNew(tab, entry) {

      ${entry ? `<label>Hecha por<select name="ini">${opts(CREW(), S.me.initials || 'EM')}</select></label>` : ''}</div>`,

  function dlgWho(r) {

    const go = e.target.closest('[data-go]'); if (go) { step(+go.dataset.go); return; }
    if (e.target.closest('[data-pick]')) { openPicker(); return; }
    const md = e.target.closest('[data-mode]'); if (md) { S.mode = md.dataset.mode; try { localStorage.setItem('db.mode', S.mode); } catch (e2) {} render(); return; }
    const w = e.target.closest('[data-who]'); if (w) { S.who = w.dataset.who; render(); return; }
    const dn = e.target.closest('[data-done]'); if (dn) { const r = findRow(dn.dataset.done); if (r) dlgDone(r); return; }
    const rs = e.target.closest('[data-res]'); if (rs) { const r = findRow(rs.dataset.res); if (r) dlgRes(r); return; }
    const nw = e.target.closest('[data-new]'); if (nw) { dlgNew(nw.dataset.new || S.lot); return; }
    const en = e.target.closest('[data-entry]'); if (en) { dlgNew(en.dataset.entry, true); return; }
    const l = e.target.closest('[data-lot]'); if (l) { S.view = 'lotes'; goLot(l.dataset.lot); return; }
  });
  $('#importBtn').addEventListener('click', async () => {
    const b = $('#importBtn'); b.disabled = true; b.textContent = 'Sincronizando…';
    try { const j = await post('/api/xl/import', {}); toast('✓ ' + j.rows + ' registros de ' + j.tabs + ' lotes · ' + j.changed + ' cambios'); await load(); }
    catch (err) { toast('Error: ' + err.message); }
    b.disabled = false; b.textContent = 'Sincronizar ahora';
  });
  // Keep it fresh while open (the server pulls from Excellovint every 5 min).
  setInterval(() => { if (document.visibilityState === 'visible' && !$('#dlg').open) load().catch(() => {}); }, 60000);
  setInterval(banner, 30000);
  load().catch(err => { $('#main').innerHTML = `<div class="empty">No se pudo cargar: ${esc(err.message)}</div>`; });
})();
</script>
</body>
</html>
