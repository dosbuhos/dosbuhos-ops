<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Registros de bodega</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3ef;--paper:#fffefb;--ink:#1f2426;--muted:#5d6568;--rule:#dcd9d1;--wine:#5c1f33;--wine-soft:#f2e5e8;--red:#b3261e;--red-bg:#fbe2df;--amber:#8f6200;--amber-bg:#faefd3;--green:#2f6b34;--green-bg:#e3f0e1;--blue:#2d5c8a;--blue-bg:#e6eef7;
--f-d:"Barlow Condensed","Arial Narrow",sans-serif;--f-b:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--f-m:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-b)}
header{position:sticky;top:0;z-index:5;background:var(--wine);color:#fff;padding:10px 16px 0}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font:700 24px/1.1 var(--f-d);letter-spacing:.04em;text-transform:uppercase;flex:1}
header a{color:#f6e9ee;font-size:13px}
.tabs{display:flex;gap:4px;margin-top:8px}
.tabs button{border:0;background:transparent;color:#f6e9ee;padding:8px 14px;font:600 15px var(--f-b);border-radius:10px 10px 0 0;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--bg);color:var(--wine)}
.banner{margin:12px 16px 0;padding:10px 12px;border-radius:10px;background:var(--amber-bg);color:#5a3d00;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner b{font-family:var(--f-d);font-size:16px;letter-spacing:.06em}
.banner button{margin-left:auto}
main{padding:12px 16px 40px;max-width:1500px;margin:0 auto}
.btn{border:1px solid var(--rule);background:var(--paper);border-radius:9px;padding:6px 12px;font:600 14px var(--f-b);cursor:pointer;color:var(--ink)}
.btn.primary{background:var(--wine);border-color:var(--wine);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.chips button{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:5px 12px;font:600 13px var(--f-b);cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chips small{font-weight:400;opacity:.7;margin-left:3px}
h2{font:700 18px var(--f-d);letter-spacing:.06em;text-transform:uppercase;color:var(--wine);margin:18px 0 8px;display:flex;gap:8px;align-items:baseline}
h2 small{font:500 13px var(--f-b);letter-spacing:0;text-transform:none;color:var(--muted)}
h2.over{color:var(--red)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.wo{background:var(--paper);border:1px solid var(--rule);border-left:4px solid var(--blue);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.wo.p-urgent{border-left-color:var(--red)}.wo.p-high{border-left-color:var(--amber)}
.wo .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.wo .lot{font-weight:600;color:var(--ink);font-size:14px}
.wo .when{margin-left:auto;font:500 12px var(--f-m)}
.wo .when.over{color:var(--red);font-weight:600}
.wo .txt{font-size:14px;line-height:1.4}
.wo .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font:600 11px var(--f-m);padding:1px 7px;border-radius:999px;background:var(--rule);color:var(--ink);letter-spacing:.03em}
.tag.urgent{background:var(--red);color:#fff}.tag.high{background:var(--amber-bg);color:var(--amber)}
.tag.who{background:var(--wine-soft);color:var(--wine)}
.wo .act{display:flex;gap:6px;margin-top:2px}
.wo .act .btn{flex:1;padding:8px}
.lots{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.lotc{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.lotc:hover{border-color:var(--wine)}
.lotc b{display:block;font-size:15px}
.lotc .tabn{font:12px var(--f-m);color:var(--muted)}
.lotc .nums{display:flex;gap:10px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.lotc .nums .open{color:var(--wine);font-weight:600}
.lothead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.lothead h3{margin:0;font:700 22px var(--f-d);text-transform:uppercase;color:var(--wine);letter-spacing:.03em}
.lothead .tabn{font:12.5px var(--f-m);color:var(--muted)}
.lothead input{margin-left:auto;border:1px solid var(--rule);border-radius:999px;padding:6px 12px;font:inherit;min-width:0;width:220px;background:var(--paper)}
/* Spreadsheet grid (desktop) */
.grid-wrap{overflow:auto;max-height:75vh;border:1px solid var(--rule);border-radius:10px;background:var(--paper)}
table.g{border-collapse:separate;border-spacing:0;font-size:13px;min-width:1200px;width:100%}
table.g th{position:sticky;top:0;background:var(--paper);border-bottom:2px solid var(--ink);font:500 10.5px var(--f-m);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px 6px;white-space:nowrap;z-index:1}
table.g td{border-bottom:1px solid var(--rule);padding:6px;vertical-align:top}
table.g td.n{text-align:right;font-family:var(--f-m);font-size:12.5px;white-space:nowrap}
table.g td.d{font-family:var(--f-m);font-size:12px;white-space:nowrap}
table.g td.note{min-width:340px}
table.g tr.open td{background:#fffaf0}
table.g tr.xx td{color:var(--muted);text-decoration:line-through}
table.g td.rn{color:var(--muted);font:11px var(--f-m)}
/* Phone: log as cards */
.logcards{display:none;flex-direction:column;gap:8px}
.lc{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:9px 11px}
.lc .h{display:flex;gap:8px;font:12px var(--f-m);color:var(--muted);align-items:baseline}
.lc .h .st{margin-left:auto}
.lc .t{font-size:14px;margin:4px 0}
.lc .v{display:flex;gap:5px;flex-wrap:wrap}
.lc .v span{font:12px var(--f-m);background:var(--blue-bg);color:var(--blue);border-radius:6px;padding:1px 6px}
.lc.open{border-left:4px solid var(--amber)}
.lc.xx{opacity:.55}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
@media (max-width:760px){
  header{padding:8px 12px 0}h1{font-size:20px}
  main{padding:10px 12px 40px}.banner{margin:10px 12px 0}
  .cards{grid-template-columns:1fr}
  .grid-wrap{display:none}.logcards{display:flex}
  .lothead input{width:100%;margin-left:0}
}
</style>
</head>
<body>
<header>
  <div class="hrow"><h1>Registros de bodega</h1><a href="/">← Calendario</a></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-t="ordenes" aria-selected="true">Órdenes abiertas</button>
    <button role="tab" data-t="lotes" aria-selected="false">Lotes</button>
  </nav>
</header>
<div class="banner" id="banner"><b>VISTA PREVIA</b><span id="bannerTxt">Cargando…</span><button class="btn" id="importBtn" hidden>Importar de Excellovint otra vez</button></div>
<main id="main"><div class="empty">Cargando…</div></main>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const today = new Date(Date.now() - 6 * 3600e3).toISOString().slice(0, 10);
  const S = { view: 'ordenes', who: 'Todos', tabs: [], open: [], names: {}, lot: null, rows: [], q: '' };
  const DOW = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
  const fmtD = iso => { if (!iso) return 'sin fecha'; const d = new Date(iso + 'T12:00:00'); return DOW[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1); };
  const lotName = tab => S.names[tab] || tab;
  const priCls = p => /URG/i.test(p) ? 'urgent' : /HIGH|ALTA/i.test(p) ? 'high' : '';
  const priLbl = p => /URG/i.test(p) ? 'URGENTE' : /HIGH|ALTA/i.test(p) ? 'ALTA' : '';
  const people = a => String(a || '').toUpperCase().split(/[\/,&\s]+/).filter(Boolean);

  async function load() {
    const [t, o, lots, me] = await Promise.all([
      fetch('/api/xl/tabs').then(r => r.json()), fetch('/api/xl/open').then(r => r.json()),
      fetch('/api/db/lots').then(r => r.json()).catch(() => ({ rows: [] })), fetch('/api/me').then(r => r.json()).catch(() => ({}))]);
    S.tabs = t.tabs || []; S.open = o.rows || [];
    for (const l of (lots.rows || [])) for (const s of (l.data.sheet || [])) if (s.tab && !S.names[s.tab]) S.names[s.tab] = l.data.name === 'Every lot' ? 'Bodega (general)' : l.data.name;
    const at = S.tabs.reduce((m, x) => Math.max(m, x.imported_at || 0), 0);
    $('#bannerTxt').textContent = at ? 'Copia de Excellovint del ' + new Date(at).toLocaleString('es-MX', { dateStyle: 'medium', timeStyle: 'short' }) + '. Nada de aquí se guarda todavía; Excellovint sigue siendo el original.' : 'Todavía no hay datos importados.';
    $('#importBtn').hidden = me.initials !== 'EM';
    render();
  }

  function renderOrdenes() {
    const counts = {}; for (const r of S.open) for (const p of people(r.asig)) counts[p] = (counts[p] || 0) + 1;
    const whoList = ['Todos', ...Object.keys(counts).sort((a, b) => counts[b] - counts[a])];
    const rows = S.open.filter(r => S.who === 'Todos' || people(r.asig).includes(S.who));
    const groups = [['over', 'Atrasadas', r => r.date && r.date < today], ['today', 'Hoy', r => r.date === today], ['next', 'Próximas', r => !r.date || r.date > today]];
    let h = `<div class="chips">${whoList.map(w => `<button data-who="${esc(w)}" aria-pressed="${S.who === w}">${esc(w)}<small>${w === 'Todos' ? S.open.length : counts[w]}</small></button>`).join('')}</div>`;
    for (const [k, label, fn] of groups) {
      const g = rows.filter(fn); if (!g.length) continue;
      h += `<h2 class="${k === 'over' ? 'over' : ''}">${label} <small>${g.length}</small></h2><div class="cards">` + g.map(r => `
        <article class="wo p-${priCls(r.pri)}">
          <div class="top"><span class="lot">${esc(lotName(r.tab))}</span><span>${esc(r.ubi)}</span><span class="when ${k === 'over' ? 'over' : ''}">${fmtD(r.date)}</span></div>
          <div class="txt">${esc(r.note)}</div>
          <div class="meta">${priLbl(r.pri) ? `<span class="tag ${priCls(r.pri)}">${priLbl(r.pri)}</span>` : ''}<span class="tag who">${esc(r.asig)}</span><span class="tag">${esc(r.tab)} · fila ${r.row}</span></div>
          <div class="act"><button class="btn primary" disabled title="Vista previa">✓ Hecho</button><button class="btn" disabled title="Vista previa">Anotar resultado</button></div>
        </article>`).join('') + `</div>`;
    }
    return h + (rows.length ? '' : '<div class="empty">No hay órdenes abiertas.</div>');
  }

  function renderLotes() {
    if (S.lot) return renderLot();
    const named = S.tabs.slice().sort((a, b) => a.tab.localeCompare(b.tab, 'es', { numeric: true }));
    return `<div class="lots">` + named.map(t => `<button class="lotc" data-lot="${esc(t.tab)}"><b>${esc(lotName(t.tab))}</b><span class="tabn">${esc(t.tab)}${t.vino ? ' · ' + esc(t.vino) : ''}</span>
      <div class="nums"><span>${t.n} registros</span><span>último ${fmtD(t.last)}</span>${t.open ? `<span class="open">${t.open} abiertas</span>` : ''}</div></button>`).join('') + `</div>`;
  }

  const COLS = [['date_raw', 'Fecha', 'd'], ['ubi', 'Ubi'], ['voli', 'Vol I', 'n'], ['volf', 'Vol F', 'n'], ['ph', 'pH', 'n'], ['bx', 'Bx', 'n'], ['tp', 'T°', 'n'], ['at', 'AT', 'n'], ['am', 'Málico', 'n'], ['sl', 'SO₂ L', 'n'], ['st', 'SO₂ T', 'n'], ['aa', 'AV', 'n'], ['note', 'Acción', 'note'], ['pri', 'Pri'], ['by_', 'Por'], ['asig', 'Asig'], ['ini', 'Ini']];
  const LAB = [['voli', 'Vol I'], ['volf', 'Vol F'], ['ph', 'pH'], ['bx', 'Bx'], ['tp', 'T°'], ['at', 'AT'], ['am', 'Mál'], ['sl', 'SO₂L'], ['st', 'SO₂T'], ['aa', 'AV']];
  function renderLot() {
    const t = S.tabs.find(x => x.tab === S.lot) || { tab: S.lot };
    const q = S.q.toLowerCase();
    const rows = S.rows.filter(r => !q || COLS.some(([k]) => String(r[k] || '').toLowerCase().includes(q))).slice().reverse();
    const st = r => r.ini === 'XX' ? 'xx' : (r.asig && !r.ini ? 'open' : '');
    return `<div class="lothead"><button class="btn" data-back>← Lotes</button><h3>${esc(lotName(t.tab))}</h3><span class="tabn">${esc(t.tab)} · ${S.rows.length} registros</span><input type="search" id="q" placeholder="Buscar en este lote" value="${esc(S.q)}"></div>
      <div class="grid-wrap"><table class="g"><thead><tr><th>#</th>${COLS.map(([, l]) => `<th>${l}</th>`).join('')}</tr></thead><tbody>` +
      rows.map(r => `<tr class="${st(r)}"><td class="rn">${r.row}</td>${COLS.map(([k, , c]) => `<td class="${c || ''}">${esc(r[k])}</td>`).join('')}</tr>`).join('') + `</tbody></table></div>
      <div class="logcards">` + rows.map(r => `<div class="lc ${st(r)}"><div class="h"><span>${fmtD(r.date)}</span><span>${esc(r.ubi)}</span><span class="st">${r.ini ? (r.ini === 'XX' ? 'cancelada' : '✓ ' + esc(r.ini)) : r.asig ? 'abierta · ' + esc(r.asig) : ''}</span></div>
        ${r.note ? `<div class="t">${esc(r.note)}</div>` : ''}<div class="v">${LAB.filter(([k]) => r[k]).map(([k, l]) => `<span>${l} ${esc(r[k])}</span>`).join('')}</div></div>`).join('') + `</div>`;
  }

  function render() {
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.t === S.view));
    $('#main').innerHTML = S.view === 'ordenes' ? renderOrdenes() : renderLotes();
    const q = $('#q'); if (q) q.addEventListener('input', () => { S.q = q.value; const pos = q.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); });
  }
  document.addEventListener('click', async e => {
    const t = e.target.closest('[data-t]'); if (t) { S.view = t.dataset.t; S.lot = null; render(); return; }
    const w = e.target.closest('[data-who]'); if (w) { S.who = w.dataset.who; render(); return; }
    const l = e.target.closest('[data-lot]'); if (l) { S.lot = l.dataset.lot; S.q = ''; S.rows = (await (await fetch('/api/xl/rows?tab=' + encodeURIComponent(S.lot))).json()).rows || []; render(); window.scrollTo(0, 0); return; }
    if (e.target.closest('[data-back]')) { S.lot = null; render(); }
  });
  $('#importBtn').addEventListener('click', async () => {
    const b = $('#importBtn'); b.disabled = true; b.textContent = 'Importando…';
    try { const r = await fetch('/api/xl/import', { method: 'POST' }); const j = await r.json(); if (!r.ok) throw new Error(j.message); b.textContent = '✓ ' + j.rows + ' registros de ' + j.tabs + ' lotes'; await load(); }
    catch (err) { b.textContent = 'Error: ' + err.message; }
    setTimeout(() => { b.disabled = false; b.textContent = 'Importar de Excellovint otra vez'; }, 4000);
  });
  load().catch(err => { $('#main').innerHTML = `<div class="empty">No se pudo cargar: ${esc(err.message)}</div>`; });
})();
</script>
</body>
</html>
