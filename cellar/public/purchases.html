<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#5c1f33">
<title>Compras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3ef;--paper:#fffefb;--ink:#1f2426;--muted:#5d6568;--rule:#dcd9d1;--wine:#5c1f33;--wine-soft:#f2e5e8;--red:#b3261e;--red-bg:#fbe2df;--amber:#8f6200;--amber-bg:#faefd3;--green:#2f6b34;--green-bg:#e3f0e1;--blue:#2d5c8a;--blue-bg:#e6eef7;
--f-d:"Barlow Condensed","Arial Narrow",sans-serif;--f-b:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--f-m:"IBM Plex Mono",ui-monospace,Menlo,monospace;--nav:60px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-b);padding-bottom:calc(var(--nav) + 96px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:5;background:var(--wine);color:#fff;padding:env(safe-area-inset-top,0px) 8px 0 16px;display:flex;align-items:center;gap:2px;min-height:56px}
header h1{margin:0;flex:1;font:700 22px/1 var(--f-d);letter-spacing:.05em;text-transform:uppercase}
header a,header button{width:44px;height:44px;border:0;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;border-radius:12px;text-decoration:none;padding:0}
header svg{width:24px;height:24px}
.tabs{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:4;display:flex;background:var(--wine);padding:0 8px}
.tabs button{flex:1;border:0;background:transparent;color:#e3c9d3;padding:10px 4px 12px;font:600 14px var(--f-b);border-bottom:3px solid transparent}
.tabs button[aria-selected=true]{color:#fff;border-bottom-color:#fff}
.tabs small{opacity:.8;font-weight:500;margin-left:4px}
main{padding:12px 12px 20px;max-width:900px;margin:0 auto}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -12px 12px;padding:2px 12px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);font:500 14px var(--f-b);color:var(--ink)}
.chips button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}
h2{display:flex;align-items:center;gap:8px;margin:16px 0 8px;font:700 13px var(--f-d);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h2 i{width:10px;height:10px;border-radius:50%;background:var(--muted)}
h2.high{color:var(--red)}h2.high i{background:var(--red)}
h2.medium{color:var(--amber)}h2.medium i{background:var(--amber)}
h2 small{font:500 12px var(--f-b);letter-spacing:0;text-transform:none;color:var(--muted)}
.cards{display:grid;gap:10px}
@media (min-width:700px){.cards{grid-template-columns:1fr 1fr}}
.pc{background:var(--paper);border:1px solid var(--rule);border-left:4px solid #9aa5b1;border-radius:14px;padding:12px 14px;box-shadow:0 1px 2px rgba(31,36,38,.05),0 4px 14px rgba(31,36,38,.05)}
.pc.high{border-left-color:var(--red)}.pc.medium{border-left-color:var(--amber)}
.pc.received{opacity:.6}
.pc .t{display:flex;gap:8px;align-items:flex-start}
.pc .t b{flex:1;font-size:16.5px;line-height:1.3}
.pc .qty{font:600 13px var(--f-m);color:var(--muted);white-space:nowrap;padding-top:2px}
.pc .n{margin:4px 0 0;font-size:14.5px;color:#3a4043;white-space:pre-wrap}
.pc .n a{color:var(--wine)}
.pc .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.tag{font:600 11px var(--f-m);padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--ink);letter-spacing:.03em}
.tag.who{background:var(--wine-soft);color:var(--wine)}
.tag.where{background:var(--blue-bg);color:var(--blue)}
.tag.st-ordered{background:var(--amber-bg);color:var(--amber)}
.tag.st-received{background:var(--green-bg);color:var(--green)}
.pc .by{margin-left:auto;font:12px var(--f-m);color:var(--muted)}
.pc .act{display:flex;gap:8px;margin-top:10px}
.pc .act .btn{flex:1}
.btn{min-height:44px;border:1px solid var(--rule);background:var(--paper);border-radius:12px;padding:0 14px;font:600 15px var(--f-b);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--wine);border-color:var(--wine);color:#fff}
.btn.ghost{color:var(--muted)}
.btn.sq{flex:0 0 44px;width:44px;padding:0;font-size:20px}
.empty{color:var(--muted);text-align:center;padding:48px 16px}
.fab{position:fixed;right:14px;bottom:calc(var(--nav) + 14px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:8px;height:52px;padding:0 20px 0 16px;border:0;border-radius:26px;background:var(--wine);color:#fff;font:600 16px var(--f-b);box-shadow:0 6px 20px rgba(92,31,51,.35)}
.fab svg{width:24px;height:24px}
dialog{border:0;border-radius:20px 20px 0 0;padding:0;width:100%;max-width:none;margin:auto 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.3);max-height:calc(100dvh - 20px)}
@media (min-width:700px){dialog{border-radius:16px;width:min(520px,calc(100vw - 24px));margin:auto}}
dialog::backdrop{background:rgba(20,22,24,.45)}
dialog form{padding:10px 16px 0;display:flex;flex-direction:column;gap:12px;max-height:calc(100dvh - 20px);overflow:auto}
dialog form::before{content:"";display:block;width:40px;height:4px;margin:0 auto;border-radius:2px;background:var(--rule)}
dialog h3{margin:0;font:700 20px var(--f-d);text-transform:uppercase;color:var(--wine);letter-spacing:.03em}
label{display:flex;flex-direction:column;gap:4px;font:600 11px var(--f-m);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
input,select,textarea{font:16px var(--f-b);text-transform:none;letter-spacing:0;color:var(--ink);border:1px solid var(--rule);border-radius:11px;padding:10px 12px;background:#fff;min-height:46px;width:100%}
textarea{min-height:80px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg input{display:none}
.seg span{display:flex;align-items:center;justify-content:center;min-height:44px;border:1px solid var(--rule);border-radius:11px;font:600 14px var(--f-b);color:var(--ink);text-transform:none;letter-spacing:0}
.seg input:checked+span{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg input[value=high]:checked+span{background:var(--red);border-color:var(--red)}
.seg input[value=medium]:checked+span{background:var(--amber);border-color:var(--amber)}
.row{position:sticky;bottom:0;display:flex;gap:8px;margin:4px -16px 0;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--rule)}
.row .btn{flex:1;min-height:48px}
.row .btn.danger{flex:0 0 auto;color:var(--red)}
.err{color:var(--red);font-size:13px;min-height:1em}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw}
nav.mnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--wine);padding:4px 4px calc(2px + env(safe-area-inset-bottom,0px))}
nav.mnav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;min-height:54px;color:#e3c9d3;text-decoration:none;font:500 11px/1.2 var(--f-b)}
nav.mnav a .mi{display:flex;align-items:center;justify-content:center;width:56px;height:30px;border-radius:15px}
nav.mnav a svg{width:24px;height:24px}
nav.mnav a[aria-current=page]{color:#fff;font-weight:600}nav.mnav a[aria-current=page] .mi{background:rgba(255,255,255,.2)}
@media (min-width:761px){nav.mnav{display:none}body{padding-bottom:40px}.fab{bottom:24px}}
</style>
</head>
<body>
<header>
  <h1>Compras</h1>
  <a href="/" aria-label="Calendario" title="Calendario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
  <a href="/settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
</header>
<nav class="tabs" role="tablist">
  <button role="tab" data-st="open" aria-selected="true">Pendientes<small id="nOpen"></small></button>
  <button role="tab" data-st="ordered" aria-selected="false">Pedidas<small id="nOrd"></small></button>
  <button role="tab" data-st="received" aria-selected="false">Recibidas<small id="nRec"></small></button>
</nav>
<main>
  <div class="chips" id="who"></div>
  <div id="list"><div class="empty">Cargando…</div></div>
</main>
<button class="fab" id="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Compra</button>
<dialog id="dlg"><form id="f" method="dialog"></form></dialog>
<div class="toast" id="toast" hidden></div>
<nav class="mnav" aria-label="Secciones">
  <a href="/#weeks"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"/></svg></span>Today</a>
  <a href="/#wines"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8l1 6a5 5 0 0 1-10 0z"/><path d="M12 14v6M8 21h8"/></svg></span>Wines</a>
  <a href="/#labs"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5.5 9A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-3L14 9V3"/></svg></span>Labs</a>
  <a href="/#protocols"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h4"/></svg></span>Protocols</a>
  <a href="/#blends"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v7l-4 8a2 2 0 0 0 1.8 3h5.4A2 2 0 0 0 12 18l-4-8V3"/><path d="M5 3h5"/><path d="M16 3v6l3 6a2 2 0 0 1-1.8 3h-2.4" opacity=".7"/><path d="M14 3h4" opacity=".7"/></svg></span>Trials</a>
</nav>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const linkify = s => esc(s).replace(/(https?:\/\/[^\s)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  const PRI = { high: 'Alta', medium: 'Media', low: 'Baja' };
  const WHERE = ['', 'EE. UU.', 'México', 'En línea'];
  const CREW = ['EM', 'D', 'P/J', 'P', 'J'];
  const S = { st: 'open', who: '', items: [], me: {} };
  const toast = t => { const e = $('#toast'); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { e.hidden = true; }, 3000); };
  const fmt = iso => iso ? new Date(iso).toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }) : '';
  const api = async (path, method, body) => { const r = await fetch('/api/db/purchases' + path, { method, headers: { 'content-type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) }); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.message || 'Error ' + r.status); return j; };

  async function load() {
    const [j, me] = await Promise.all([api('', 'GET'), fetch('/api/me').then(r => r.json()).catch(() => ({}))]);
    S.items = (j.rows || []).map(r => Object.assign({ id: r.id }, r.data)); S.me = me; render();
  }
  function render() {
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.st === S.st));
    const by = st => S.items.filter(i => (i.status || 'open') === st).length;
    $('#nOpen').textContent = by('open') || ''; $('#nOrd').textContent = by('ordered') || ''; $('#nRec').textContent = by('received') || '';
    const pool = S.items.filter(i => (i.status || 'open') === S.st);
    const people = [...new Set(pool.map(i => i.asig).filter(Boolean))].sort();
    $('#who').innerHTML = people.length > 1 ? ['', ...people].map(p => `<button data-who="${esc(p)}" aria-pressed="${S.who === p}">${p || 'Todos'}</button>`).join('') : '';
    const rows = pool.filter(i => !S.who || i.asig === S.who).sort((a, b) => ['high', 'medium', 'low'].indexOf(a.pri || 'medium') - ['high', 'medium', 'low'].indexOf(b.pri || 'medium') || String(b.at).localeCompare(String(a.at)));
    let h = '';
    for (const p of ['high', 'medium', 'low']) {
      const g = rows.filter(i => (i.pri || 'medium') === p); if (!g.length) continue;
      h += `<h2 class="${p}"><i></i>${PRI[p]} <small>${g.length}</small></h2><div class="cards">` + g.map(i => `
        <article class="pc ${p} ${i.status || 'open'}" data-id="${esc(i.id)}">
          <div class="t"><b>${esc(i.item)}</b>${i.qty ? `<span class="qty">${esc(i.qty)}</span>` : ''}</div>
          ${i.notes ? `<p class="n">${linkify(i.notes)}</p>` : ''}
          <div class="meta">${i.asig ? `<span class="tag who">${esc(i.asig)}</span>` : ''}${i.where ? `<span class="tag where">${esc(i.where)}</span>` : ''}${i.status === 'ordered' ? `<span class="tag st-ordered">Pedida ${fmt(i.orderedAt)}</span>` : ''}${i.status === 'received' ? `<span class="tag st-received">Recibida ${fmt(i.receivedAt)}</span>` : ''}<span class="by">${esc(i.by || '')} · ${fmt(i.at)}</span></div>
          <div class="act">${i.status === 'received' ? `<button class="btn ghost" data-set="open">Reabrir</button>` : i.status === 'ordered' ? `<button class="btn primary" data-set="received">✓ Recibida</button><button class="btn ghost" data-set="open">No pedida</button>` : `<button class="btn primary" data-set="ordered">Pedida</button><button class="btn" data-set="received">✓ Recibida</button>`}<button class="btn sq" data-edit aria-label="Editar">⋯</button></div>
        </article>`).join('') + '</div>';
    }
    $('#list').innerHTML = h || `<div class="empty">${S.st === 'open' ? 'Nada pendiente. Toca <b>+ Compra</b> para agregar.' : 'Nada aquí.'}</div>`;
  }
  function openForm(i) {
    const f = $('#f');
    f.innerHTML = `<h3>${i ? 'Editar compra' : 'Nueva compra'}</h3>
      <label>Qué hay que comprar<input name="item" required value="${esc(i ? i.item : '')}" placeholder="Metabisulfito 5 kg, tiras Sentia…"></label>
      <div class="g2"><label>Cantidad<input name="qty" value="${esc(i ? i.qty : '')}" placeholder="2 cajas"></label><label>Dónde<select name="where">${WHERE.map(w => `<option value="${w}"${(i ? i.where : '') === w ? ' selected' : ''}>${w || '—'}</option>`).join('')}</select></label></div>
      <label>Prioridad<div class="seg">${['high', 'medium', 'low'].map(p => `<label><input type="radio" name="pri" value="${p}"${(i ? i.pri : 'medium') === p ? ' checked' : ''}><span>${PRI[p]}</span></label>`).join('')}</div></label>
      <label>Asignar a<select name="asig">${CREW.map(c => `<option${(i ? i.asig : (S.me.initials || 'EM')) === c ? ' selected' : ''}>${c}</option>`).join('')}</select></label>
      <label>Notas / enlace<textarea name="notes" placeholder="Marca, modelo, proveedor, link…">${esc(i ? i.notes : '')}</textarea></label>
      <div class="err" id="err"></div>
      <div class="row">${i ? `<button type="button" class="btn danger" data-del>Borrar</button>` : ''}<button type="button" class="btn" data-cancel>Cancelar</button><button type="submit" class="btn primary" id="ok">Guardar</button></div>`;
    const d = $('#dlg');
    f.onsubmit = async e => {
      e.preventDefault(); const fd = new FormData(f); const ok = $('#ok'); ok.disabled = true;
      const body = { item: String(fd.get('item')).trim(), qty: String(fd.get('qty')).trim(), where: fd.get('where'), pri: fd.get('pri') || 'medium', asig: fd.get('asig'), notes: String(fd.get('notes')).trim() };
      try {
        if (i) await api('/' + encodeURIComponent(i.id), 'PATCH', body);
        else await api('/' + encodeURIComponent('p' + Date.now().toString(36)), 'PUT', Object.assign(body, { status: 'open', by: S.me.initials || '', at: new Date().toISOString() }));
        d.close(); toast(i ? 'Guardado' : 'Agregado a Compras'); await load();
      } catch (err) { $('#err').textContent = err.message; ok.disabled = false; }
    };
    f.querySelector('[data-cancel]').onclick = () => d.close();
    const del = f.querySelector('[data-del]'); if (del) del.onclick = async () => { if (!confirm('¿Borrar esta compra?')) return; await api('/' + encodeURIComponent(i.id), 'DELETE'); d.close(); toast('Borrada'); await load(); };
    d.showModal(); setTimeout(() => f.querySelector('[name=item]').focus(), 50);
  }
  document.addEventListener('click', async e => {
    const t = e.target.closest('[data-st]'); if (t) { S.st = t.dataset.st; S.who = ''; render(); return; }
    const w = e.target.closest('[data-who]'); if (w) { S.who = w.dataset.who; render(); return; }
    const card = e.target.closest('.pc'); const it = card && S.items.find(x => x.id === card.dataset.id);
    const st = e.target.closest('[data-set]');
    if (st && it) {
      const v = st.dataset.set, patch = { status: v };
      if (v === 'ordered') patch.orderedAt = new Date().toISOString(); if (v === 'received') patch.receivedAt = new Date().toISOString();
      card.style.opacity = .5;
      try { await api('/' + encodeURIComponent(it.id), 'PATCH', patch); toast(v === 'ordered' ? 'Marcada como pedida' : v === 'received' ? 'Recibida ✓' : 'Reabierta'); await load(); } catch (err) { toast(err.message); card.style.opacity = ''; }
      return;
    }
    if (e.target.closest('[data-edit]') && it) { openForm(it); return; }
  });
  $('#add').onclick = () => openForm(null);
  load().catch(err => { $('#list').innerHTML = `<div class="empty">No se pudo cargar: ${esc(err.message)}</div>`; });
})();
</script>
</body>
</html>
