  if(tab==='mant'){const f=$('amf');wireOtro(f);const cur=()=>f.querySelector('[data-amk][aria-checked="true"]').dataset.amk;

    $('amby').onchange=()=>{try{localStorage.setItem('fb-by',$('amby').value)}catch(e){}};
    p.querySelectorAll('[data-arm]').forEach(x=>x.onclick=async()=>{const id=x.dataset.arm,doc=A.logs.find(l=>l.id===id);if(!doc)return;A.logs=A.logs.filter(l=>l.id!==id);await api('barrel_log/'+enc(id),'DELETE').catch(()=>{});rebuild();keep(()=>{draw();panel()});
      snack('Registro borrado',async()=>{const {id:_,...d}=doc;A.logs.push(doc);await api('barrel_log/'+enc(id),'PUT',d).catch(()=>{});rebuild();keep(()=>{draw();panel()})})});
    f.onsubmit=async e=>{e.preventDefault();const k=cur(),d=$('amd').value;if(!/^\d{4}-\d\d-\d\d$/.test(d)||d>today){$('amfs').textContent='Fecha no válida.';return}
      const parts=[];const box=f.querySelector(`.steps[data-ak="${k}"]`);if(box){const cb=[...box.querySelectorAll('input')],n=cb.filter(x=>x.checked).length;if(!n){$('amfs').textContent='Marca al menos un paso.';return}if(n<cb.length)parts.push(n+'/'+cb.length+' pasos')}
      if(k==='otro'){const t=$('amo').value.trim();if(!t){$('amfs').textContent='Escribe qué se hizo.';return}parts.push(t)}
      const rw=f.querySelector(`.row2[data-ak="${k}"]`);let fillLot='';if(rw){const w=rw.querySelector('[data-f="w"]').value,l=rw.querySelector('[data-f="l"]').value.trim();fillLot=w;if(k==='fill'){if(!w){$('amfs').textContent='Elige el vino.';return}parts.unshift(wname(w)+(l?' · '+l+' L':''))}else if(l)parts.push('rellenada con '+(wname(w)||wine)+' '+l+' L')}
      const note=$('amn').value.trim();if(note)parts.push(note);
      const extra=parts.join(' · '),undo=await amphLog(cd,{at:d+'T12:00:00.000Z',proto:k,extra,text:(AMPH_PR[k]||[k])[0]+(extra?' · '+extra:''),by:$('amby').value||me()});
      if(k==='fill'||k==='ae'){await putPos(cd,Object.assign({},A.pos[cd]||{},{num:cd,here:true,empty:k==='ae',lot:k==='ae'?'':fillLot,by:me(),at:new Date().toISOString()}));delete (A.pos[cd]||{}).id;reload()}
      if(undo)snack((AMPH_PR[k]||[k])[0]+' registrado · '+fd(d),undo)}}}
// ---------- boot
for(const k in POS){const b=POS[k].b;if(b&&b.n&&!POS[k].amph)delete b.n} // the registry says which barrel is where; the plan keeps only the wine hints
const QS=new URLSearchParams(location.search);S.cardOnly=QS.has('b');if(S.cardOnly)document.body.classList.add('cardonly');
if(parent!==window)document.body.classList.add('embed');
// Inside the app's Barricas → Mapa the page has ONE scroll: the app's. This frame grows to its content (it never scrolls itself);
// the app tells it which part of it is on screen so the bottom bars, the dialog and "↑ Mapa" sit where the person is looking.
const EMBED=parent!==window&&!S.cardOnly;
function goTop(){if(EMBED){try{parent.postMessage({type:'bm:top'},location.origin)}catch(e){}}else scrollTo({top:0,behavior:'smooth'})}
if(EMBED){document.documentElement.classList.add('embedmap');
  const tell=()=>{try{parent.postMessage({type:'bm:h',h:Math.ceil(document.documentElement.getBoundingClientRect().height)},location.origin)}catch(e){}};
  try{new ResizeObserver(tell).observe(document.documentElement)}catch(e){setInterval(tell,1000)}tell();
  addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||e.data.type!=='bm:vp')return;const r=document.documentElement.style;r.setProperty('--vpt',e.data.top+'px');r.setProperty('--vph',e.data.h+'px');
    const mb=document.querySelector('.mmbox');if(mb)$('totop').hidden=e.data.top<mb.offsetTop+mb.offsetHeight*0.85||!!S.move});
  $('totop').onclick=goTop;
  window.__embedScroll=el=>{setTimeout(()=>{const h=Math.ceil(document.documentElement.getBoundingClientRect().height),y=Math.round(el.getBoundingClientRect().top+scrollY);try{parent.postMessage({type:'bm:scroll',y,h},location.origin)}catch(e){}},40)}}
draw();
load().then(()=>{if(S.cardOnly){const qb=QS.get('b'),cd=/^AN-0\d$/i.test(qb)?qb.toUpperCase():posOfCode(qb);if(!POS[cd].virtual&&VOF[POS[cd].rack]){S.view=VOF[POS[cd].rack];S.sec=VIEWS.find(v=>v.id===S.view).sec}S.sel=cd;S.selRack=POS[cd].rack;S.tab=QS.get('tab')||'res'}draw();panel()})
  .catch(e=>{$('dbst').textContent='No se pudo cargar: '+e.message});
setInterval(()=>{if(document.hidden||S.move)return;const a=document.activeElement;if(a&&a.closest&&a.closest('form,.qa-x,.dlg'))return;if(!$('qax')||$('qax').hidden)reload()},90000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!S.move)reload()});
</script>
