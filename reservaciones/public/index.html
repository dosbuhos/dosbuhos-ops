<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#07161e" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Pulso · Dos Búhos</title>
<script>/* Relative asset and API paths need the trailing slash (/reservaciones/ behind the Hub). */ if (!location.pathname.endsWith('/')) location.replace(location.pathname + '/' + location.search + location.hash);</script>
<link rel="icon" type="image/svg+xml" href="logo.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="preload" href="archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<aside class="lado">
  <div class="marca"><img class="logo" src="logo.svg" alt="" width="28" height="28"><span>Pulso</span></div>
  <nav id="nav-lado" aria-label="Secciones"></nav>
  <div class="yo" id="yo"></div>
</aside>
<div class="app">
  <header class="arriba">
    <div class="marca"><img class="logo" src="logo.svg" alt="" width="28" height="28"><h1 id="titulo">Pulso</h1></div>
    <button class="ico" id="recargar" type="button" aria-label="Actualizar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.600-5.900"/><path d="M20 4.500v4.200h-4.200"/></svg></button>
  </header>
  <div class="paso" id="paso" hidden>
    <img class="logo logo-paso" src="logo.svg" alt="Pulso" width="28" height="28">
    <button class="ico" id="antes" type="button" aria-label="Anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="donde" id="donde" aria-live="polite"></div>
    <button class="ico" id="despues" type="button" aria-label="Siguiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="hoy" id="hoy" type="button" hidden>Hoy</button>
    <button class="btn-nueva" id="nueva-paso" type="button" data-nueva="" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nueva reservación</button>
    <button class="ico recargar-ancho" id="recargar2" type="button" aria-label="Actualizar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.600-5.900"/><path d="M20 4.500v4.200h-4.200"/></svg></button>
  </div>
  <main id="main" tabindex="-1"><p class="nota relleno">Cargando…</p></main>
</div>
<nav class="pestanas" id="pestanas" aria-label="Secciones" hidden></nav>
<dialog class="hoja" id="hoja" aria-labelledby="hoja-nombre"></dialog>
<div class="globo" id="globo" role="tooltip" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
