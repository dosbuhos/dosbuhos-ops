<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
<title>Club de beneficios · Dos Búhos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css?app=club"><link rel="stylesheet" href="/kit/kit.css">
<link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#141719" media="(prefers-color-scheme: dark)">
<style>
/* Club de beneficios — staff + admin. Phone first: one column, nothing scrolls sideways, rows ≥ 44 px, steppers instead of
   button grids, secondary things collapsed. Bottom tab bar on phones, tabs under the top bar from 720 px. The programs ×
   benefits grid appears only from 900 px; below that it is a program picker and a list. */
:root { --hoy-gap: 22px; }
body { padding-bottom: calc(72px + var(--safe-b)); }
@media (min-width: 960px) { body { padding-bottom: 0; } }
.wrap { max-width: 860px; }
.wrap.wide { max-width: 1280px; }
h1.page { font-family: var(--f-display); font-weight: var(--w-display); font-size: 32px; line-height: 1; margin: 2px 0 4px; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
.blk { margin: 0 0 var(--hoy-gap); }
.blk > h2 { font-family: var(--f-display); font-size: 22px; font-weight: var(--w-display); margin: 0 0 8px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.blk > h2 small { font: 400 13px var(--f-body); color: var(--muted); }
.muted { color: var(--muted); }
.hint { font-size: 13px; color: var(--muted); margin: 6px 0 0; }

/* Shell, laid out like Join It: a left sidebar grouped Socios · Portal del socio · Finanzas · Reportes, a member search in
   the top bar. Phones: the same sidebar opens as a drawer from Menú, and a short bar keeps Hoy, Socios and Escanear at
   the thumb. */
.topbar-in { max-width: none; }
.tsearch { display: none; }
.menu-btn { min-height: 40px; padding: 0 12px; border-radius: var(--radius-sm); border: var(--bw) solid var(--rule); background: var(--paper); color: var(--ink); font: 500 14px var(--f-body); cursor: pointer; }
@media (min-width: 720px) {
  .tsearch { display: flex; gap: 6px; align-items: center; flex: 0 1 420px; margin-left: 8px; }
  .tsearch input { min-height: 38px; font-size: 14px; padding: 0 10px; }
  .tsearch button { min-height: 38px; padding: 0 12px; border-radius: var(--radius-sm); border: var(--bw) solid var(--accent); background: none; color: var(--accent); font: 600 12.5px var(--f-body); letter-spacing: .04em; cursor: pointer; white-space: nowrap; }
}
.side { position: fixed; z-index: 50; top: 0; bottom: 0; left: 0; width: min(290px, 86vw); background: var(--paper); border-right: var(--bw) solid var(--rule); transform: translateX(-102%); transition: transform .18s ease; overflow-y: auto; display: flex; flex-direction: column; padding: calc(10px + var(--safe-t)) 10px calc(14px + var(--safe-b)); }
.side.open { transform: none; box-shadow: var(--shadow); }
.scrim { position: fixed; inset: 0; z-index: 45; background: rgba(20, 15, 15, .4); }
.org { display: flex; align-items: center; gap: 10px; padding: 8px 8px 14px; border-bottom: var(--bw) solid var(--rule); margin-bottom: 8px; }
.org .ico { width: 36px; height: 36px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.org .ico svg { width: 20px; height: 20px; }
.org small { display: block; font-size: 10.5px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
.org b { font-size: 15px; }
.side a.si, .side summary { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border-radius: var(--radius-sm); color: var(--ink); text-decoration: none; font: 500 14.5px var(--f-body); cursor: pointer; list-style: none; position: relative; }
.side summary::-webkit-details-marker { display: none; }
.side summary::after { content: "›"; margin-left: auto; color: var(--muted); font-size: 18px; transform: rotate(90deg); transition: transform .15s; }
.side details[open] > summary::after { transform: rotate(-90deg); }
.side svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
.side a.si:hover, .side summary:hover, .side .sub a:hover { background: var(--paper-2); }
.side a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.side a[aria-current="page"] svg { color: var(--accent); }
.side .sub { display: flex; flex-direction: column; padding: 0 0 6px 38px; }
.side .sub a { display: flex; align-items: center; min-height: 38px; padding: 0 10px; border-radius: var(--radius-sm); color: var(--muted); text-decoration: none; font-size: 14px; }
.side .sub a[aria-current="page"] { font-weight: 600; }
.side .dot { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--bad); color: #fff; font-size: 11.5px; line-height: 20px; text-align: center; }
.side .portal { margin-top: auto; padding-top: 14px; }
.side .portal a { display: flex; justify-content: center; align-items: center; gap: 8px; min-height: 44px; border-radius: var(--radius-sm); background: var(--accent); color: #fff; text-decoration: none; font: 600 14px var(--f-body); }
.qbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; background: var(--paper); border-top: var(--bw) solid var(--rule); padding: 0 4px var(--safe-b); }
.qbar a, .qbar button { flex: 1; min-width: 0; min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--muted); font: 500 11.5px var(--f-body); position: relative; background: none; border: 0; cursor: pointer; }
.qbar svg { width: 22px; height: 22px; }
.qbar [aria-current="page"] { color: var(--accent); }
.qbar .dot { position: absolute; top: 8px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }
@media (min-width: 960px) {
  body { padding-bottom: 0; }
  .qbar, .menu-btn, .scrim { display: none; }
  .side { top: calc(55px + var(--safe-t)); transform: none; width: 248px; z-index: 5; padding-top: 12px; }
  #app { margin-left: 248px; }
  .wrap, .wrap.wide { max-width: none; padding-left: 28px; padding-right: 28px; }
  #app > * { max-width: 1120px; }
}
.bc { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); margin: 0 0 12px; }
.bc a { color: var(--muted); text-decoration: none; }
.bc a:hover { color: var(--ink); text-decoration: underline; }
.bc i { font-style: normal; opacity: .6; }
.phead { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; flex-wrap: wrap; margin: 0 0 14px; }
.phead h1.page { margin: 0; }

/* Socios: status tiles + table */
.stiles { display: flex; gap: 8px; margin: 0 -16px 12px; padding: 0 16px 2px; overflow-x: auto; scrollbar-width: none; }
.stiles button { flex: none; min-width: 108px; }
@media (min-width: 720px) { .stiles { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); margin: 0 0 12px; padding: 0; } .stiles button { min-width: 0; } }
.stiles button { all: unset; box-sizing: border-box; cursor: pointer; background: var(--paper); border: var(--bw) solid var(--rule); border-radius: var(--radius); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-height: 64px; }
.stiles button .label { font-size: 12px; color: var(--muted); }
.stiles button .value { font: 500 22px var(--f-mono); }
.stiles button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.stiles button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin: 0 0 12px; }
.filters .field { flex: 1 1 180px; }
.mtable { display: none; }
@media (min-width: 900px) {
  .mlist { display: none; }
  .mtable { display: block; background: var(--paper); border: var(--bw) solid var(--rule); border-radius: var(--radius); overflow: hidden; }
  .mtable table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .mtable th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); padding: 10px 12px; background: var(--paper-2); border-bottom: var(--bw) solid var(--rule); white-space: nowrap; }
  .mtable td { padding: 10px 12px; border-bottom: var(--bw) solid var(--rule); vertical-align: middle; }
  .mtable tr:last-child td { border-bottom: 0; }
  .mtable tbody tr { cursor: pointer; }
  .mtable tbody tr:hover { background: var(--paper-2); }
  .mtable .nm a { color: var(--ink); font-weight: 600; text-decoration: none; }
  .mtable .nm small { display: block; color: var(--muted); font-size: 12.5px; }
  .mtable .mono { font-family: var(--f-mono); font-size: 13px; white-space: nowrap; }
}
.av { width: 34px; height: 34px; border-radius: 50%; background: var(--c, var(--paper-2)); color: #fff; display: inline-grid; place-items: center; font: 600 13px var(--f-body); flex: none; }
.spill { display: inline-flex; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.spill.ok { background: var(--ok-soft); color: var(--ok); }
.spill.warn { background: var(--warn-soft); color: var(--warn); }
.spill.bad { background: var(--bad-soft); color: var(--bad); }
.spill.muted { background: var(--paper-2); color: var(--muted); }

/* Ficha del socio: Join It's member record — actions row, two columns, tabs */
.pacts { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
.pgrid { display: grid; gap: 14px; }
@media (min-width: 900px) { .pgrid { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); align-items: start; } }
.pcol { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card2 { background: var(--paper); border: var(--bw) solid var(--rule); border-radius: var(--radius); padding: 14px; }
.card2 > h3 { font: var(--w-display) 20px var(--f-display); margin: 0 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card2 > h3 small { font: 400 13px var(--f-body); color: var(--muted); }
.prof { display: flex; gap: 14px; align-items: flex-start; }
.prof .av { width: 56px; height: 56px; font-size: 20px; }
.prof h1 { font-family: var(--f-display); font-weight: var(--w-display); font-size: clamp(28px, 7vw, 36px); line-height: 1; margin: 0 0 6px; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 14px; margin-top: 12px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.mcard { border-radius: var(--radius); padding: 14px; background: #1f2426; color: #f4f3ef; border-left: 6px solid var(--c, var(--accent)); }
.mcard + .mcard { margin-top: 10px; }
.mcard .lbl { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
.mcard .nm { font: var(--w-display) 24px var(--f-display); margin: 2px 0 8px; }
.mcard .row { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 13.5px; opacity: .92; }
.mcard .acts { margin-top: 10px; }
.mcard .btn { background: rgba(255,255,255,.08); color: #fff; border-color: rgba(255,255,255,.3); }
.mcard .btn.primary { background: #fff; color: #1f2426; border-color: #fff; }
.ptabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: var(--bw) solid var(--rule); margin: 18px 0 12px; scrollbar-width: none; }
.ptabs button { flex: none; min-height: 44px; padding: 0 14px; border: 0; background: none; color: var(--muted); font: 500 14.5px var(--f-body); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.ptabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.cardprev { display: grid; gap: 14px; }
@media (min-width: 720px) { .cardprev { grid-template-columns: 240px minmax(0, 1fr); align-items: start; } }
.gcard { border-radius: 16px; padding: 16px; background: #1f1a1b; color: #f3ead7; text-align: center; }
.gcard .mk { font: var(--w-display) 15px var(--f-display); letter-spacing: .14em; text-transform: uppercase; opacity: .8; }
.gcard .gn { font: var(--w-display) 24px var(--f-display); margin: 6px 0 4px; overflow-wrap: anywhere; }
.gcard .qr { background: #fff; border-radius: 12px; padding: 8px; margin: 12px auto 0; width: 170px; }
.gcard .qr svg { display: block; width: 100%; height: auto; }
.slist { display: grid; gap: 10px; }
@media (min-width: 720px) { .slist { grid-template-columns: 1fr 1fr; } }
.slist a { display: flex; gap: 12px; align-items: flex-start; padding: 14px; background: var(--paper); border: var(--bw) solid var(--rule); border-radius: var(--radius); text-decoration: none; color: inherit; }
.slist a:hover { background: var(--paper-2); }
.slist .ico { width: 38px; height: 38px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.slist .ico svg { width: 20px; height: 20px; }
.slist b { display: block; font-size: 15.5px; margin-bottom: 2px; }
.slist span { font-size: 13.5px; color: var(--muted); }

/* program badge: the program colour, white text (colours are checked for 4.5:1 on save) */
.pb { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; background: var(--c, var(--accent)); color: #fff; font-size: 12.5px; font-weight: 600; line-height: 1.5; white-space: nowrap; }
.pb.pending { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--c, var(--muted)); }
.pbs { display: flex; flex-wrap: wrap; gap: 4px; }
.vip { color: var(--hospitalidad); font-weight: 600; font-size: 12.5px; }
.chip.conf { background: var(--warn-soft); color: var(--warn); border-color: transparent; }

/* rows */
.list { background: var(--paper); border: var(--bw) solid var(--rule); border-radius: var(--radius); overflow: hidden; }
.r { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 9px 12px; border-bottom: var(--bw) solid var(--rule); text-decoration: none; color: inherit; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; font: inherit; text-align: left; }
.r:last-child { border-bottom: 0; }
a.r:hover, button.r:hover { background: var(--paper-2); cursor: pointer; }
.r .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.r .t { font-weight: 600; overflow-wrap: anywhere; }
.r .s { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.r .end { flex: none; display: flex; gap: 6px; align-items: center; }
.r .chev { color: var(--muted); font-size: 20px; flex: none; }
.r.stack { flex-direction: column; align-items: stretch; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.acts .btn { flex: 1 1 auto; }
.empty.sm { padding: 16px; text-align: left; }
.empty.sm b { font-size: 17px; }

/* person */
.who { position: relative; border-radius: var(--radius); padding: 16px; background: var(--c, var(--accent)); color: #fff; }
.who h1 { font-family: var(--f-display); font-weight: var(--w-display); font-size: clamp(30px, 9vw, 40px); line-height: 1; margin: 0 0 8px; overflow-wrap: anywhere; }
.who .pb { background: rgba(255,255,255,.18); box-shadow: inset 0 0 0 1px rgba(255,255,255,.55); }
.who .pb.pending { box-shadow: inset 0 0 0 1px rgba(255,255,255,.8); }
.who .meta { margin-top: 8px; font-size: 13.5px; opacity: .92; }
.who .vipflag { position: absolute; top: 14px; right: 14px; font: 600 12px var(--f-body); letter-spacing: .08em; padding: 3px 8px; border-radius: 4px; background: #fff; color: var(--c, var(--accent)); }
.snote { margin: 10px 0 0; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--now); border: var(--bw) solid var(--now-rule); color: var(--ink); font-size: 14px; }
.snote b { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
.ben { padding: 10px 12px; border-bottom: var(--bw) solid var(--rule); }
.ben:last-child { border-bottom: 0; }
.ben .h { font-weight: 600; font-size: 16px; }
.ben .rule { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
.ben .src { font-size: 12.5px; color: var(--muted); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ben.off { opacity: .75; }
.ben.off .h { text-decoration: line-through; font-weight: 500; }

/* forms */
.f { display: flex; flex-direction: column; gap: 12px; }
.f .field input, .f .field select, .f .field textarea { font-size: 16px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.two > * { min-width: 0; }
.stepper { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; align-items: center; border: var(--bw) solid var(--field-rule, var(--rule)); border-radius: var(--radius-sm); background: var(--paper); overflow: hidden; }
.stepper button { min-height: 44px; border: 0; background: var(--paper-2); color: var(--ink); font: 600 22px var(--f-body); cursor: pointer; }
.stepper output { text-align: center; font: 500 18px var(--f-mono); }
.tick { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 12px; border-bottom: var(--bw) solid var(--rule); cursor: pointer; }
.tick:last-child { border-bottom: 0; }
.tick input[type=checkbox] { width: 22px; height: 22px; min-height: 0; flex: none; accent-color: var(--accent); margin: 0; }
.tick .main { flex: 1; min-width: 0; }
.tick .t { font-weight: 500; }
.tick .s { font-size: 12.5px; color: var(--muted); }
.tick .qty { margin-top: 6px; max-width: 200px; }
.rulebox { padding: 10px 12px; border-radius: var(--radius-sm); background: var(--accent-soft); font-size: 14px; }
.warnbox { padding: 10px 12px; border-radius: var(--radius-sm); background: var(--warn-soft); color: var(--warn); font-size: 14px; font-weight: 500; }
details.box { background: var(--paper); border: var(--bw) solid var(--rule); border-radius: var(--radius); }
details.box > summary { list-style: none; min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 14px; cursor: pointer; font: var(--w-display) 19px var(--f-display); }
details.box > summary::-webkit-details-marker { display: none; }
details.box > summary::after { content: "›"; color: var(--muted); font: 400 24px var(--f-body); transform: rotate(90deg); transition: transform .15s; }
details.box[open] > summary::after { transform: rotate(-90deg); }
details.box > summary small { font: 400 13px var(--f-body); color: var(--muted); margin-left: auto; }
details.box > .in { padding: 0 14px 14px; }
details.box + details.box { margin-top: 10px; }
.btn.block { width: 100%; }
.btn.big { min-height: 52px; font-size: 16px; font-weight: 600; }
.seg.two-up { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
.switch { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; font-size: 14.5px; }
.switch input { width: 22px; height: 22px; min-height: 0; margin: 0; accent-color: var(--accent); flex: none; }

/* tiles + bars (Resumen) */
.tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 720px) { .tiles { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.tile .value { font-size: clamp(20px, 6vw, 26px); overflow-wrap: anywhere; }
.tile.wide { grid-column: 1 / -1; }
@media (min-width: 720px) { .tile.wide { grid-column: auto; } }
.prog { background: var(--paper); border: var(--bw) solid var(--rule); border-radius: var(--radius); padding: 12px; border-left: 5px solid var(--c); }
.prog + .prog { margin-top: 10px; }
.prog .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.prog .top b { font: var(--w-display) 20px var(--f-display); }
.metric { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; margin-top: 8px; font-size: 13.5px; }
.metric .bar { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--paper-2); overflow: hidden; }
.metric .bar i { display: block; height: 100%; background: var(--c, var(--accent)); border-radius: 4px; }
.metric .num { font-family: var(--f-mono); }
.milestone { background: var(--ok-soft); color: var(--ok); border-color: transparent; }

/* programs × benefits */
.picker { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.picker button { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border-radius: 999px; border: var(--bw) solid var(--rule); background: var(--paper); color: var(--ink); font: 500 14px var(--f-body); cursor: pointer; }
.picker button i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.picker button[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: #fff; }
.picker button[aria-pressed="true"] i { background: #fff; }
.cellrow { padding: 10px 12px; border-bottom: var(--bw) solid var(--rule); }
.cellrow:last-child { border-bottom: 0; }
.cellrow .line { display: flex; align-items: center; gap: 10px; }
.cellrow .line .switch { flex: 1; min-width: 0; font-weight: 500; }
.cellrow .val { width: 92px; flex: none; }
.cellrow .val.text { width: 100%; margin-top: 8px; }
.cellrow .more { margin-top: 6px; }
.cellrow .more summary { min-height: 44px; display: inline-flex; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }
.gridwrap { overflow-x: auto; border: var(--bw) solid var(--rule); border-radius: var(--radius); background: var(--paper); }
table.grid { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
table.grid th, table.grid td { border-bottom: var(--bw) solid var(--rule); border-right: var(--bw) solid var(--rule); padding: 6px; vertical-align: top; }
table.grid thead th { position: sticky; top: 0; background: var(--paper-2); z-index: 1; font-weight: 600; text-align: left; }
table.grid thead th button { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-height: 44px; justify-content: center; }
table.grid thead th button:focus-visible { outline: 2px solid var(--accent); }
table.grid thead th .bar { height: 4px; border-radius: 2px; background: var(--c); }
table.grid thead th small { font-weight: 400; color: var(--muted); }
table.grid tbody th { text-align: left; font-weight: 500; position: sticky; left: 0; background: var(--paper); z-index: 1; min-width: 160px; max-width: 220px; }
table.grid tbody th small { display: block; color: var(--muted); font-weight: 400; }
table.grid td.on { background: color-mix(in srgb, var(--c) 9%, var(--paper)); }
table.grid td .c { display: flex; align-items: center; gap: 4px; }
table.grid td input[type=checkbox] { width: 20px; height: 20px; min-height: 0; margin: 0; accent-color: var(--accent); flex: none; }
table.grid td input.v { width: 54px; min-height: 36px; padding: 4px 6px; font: 13px var(--f-mono); }
table.grid td input.v.t { width: 100%; min-width: 54px; font-family: var(--f-body); }
table.grid td .x { display: block; width: 100%; min-height: 32px; margin-top: 2px; padding: 0 2px; border: 0; background: none; color: var(--muted); cursor: pointer; font: 11.5px var(--f-body); text-align: left; border-radius: 4px; }
table.grid td .x:hover { background: var(--paper-2); }
table.grid td .meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
table.grid td .pc { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }

dialog { border: var(--bw) solid var(--rule); border-radius: var(--radius); padding: 0; width: min(480px, calc(100vw - 24px)); max-height: calc(100vh - 40px); background: var(--paper); color: var(--ink); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(20, 15, 15, .45); }
dialog .dh { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-bottom: var(--bw) solid var(--rule); }
dialog .dh b { font: var(--w-display) 21px var(--f-display); }
dialog .db { padding: 14px; }
dialog img { display: block; max-width: 100%; border-radius: var(--radius-sm); margin: 0 auto 12px; }
.toast { display: flex; align-items: center; gap: 12px; bottom: calc(80px + var(--safe-b)); }
@media (min-width: 960px) { .toast { bottom: calc(18px + var(--safe-b)); } }
.toast button { min-height: 36px; border: 0; background: none; color: inherit; font: 600 14px var(--f-body); text-decoration: underline; cursor: pointer; }
.share { padding: 14px; border-radius: var(--radius); border: var(--bw) solid var(--rule); background: var(--paper); }
.share pre { white-space: pre-wrap; font: 14px/1.45 var(--f-body); margin: 0 0 12px; padding: 10px 12px; background: var(--paper-2); border-radius: var(--radius-sm); overflow-wrap: anywhere; }
.scan { position: fixed; inset: 0; z-index: 60; background: #000; display: flex; flex-direction: column; }
.scan video { flex: 1; width: 100%; object-fit: cover; }
.scan .bar { display: flex; justify-content: center; padding: 14px 14px calc(14px + var(--safe-b)); background: #000; }
.skel { height: 56px; border-radius: var(--radius); background: var(--paper-2); margin: 0 0 8px; }
.fchips { display: flex; flex-wrap: wrap; gap: 6px; }
.fchips button { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border-radius: 999px; border: var(--bw) solid var(--rule); background: var(--paper); color: var(--ink); font: 500 14px var(--f-body); cursor: pointer; }
.fchips button b { font: 500 12.5px var(--f-mono); color: var(--muted); }
.fchips button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.fchips button[aria-pressed="true"] b { color: inherit; opacity: .8; }
.r .end .chip { white-space: nowrap; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.hide { display: none !important; }
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <button class="menu-btn" type="button" data-act="menu" aria-controls="side" aria-expanded="false">Menú</button>
  <a class="wordmark" href="/" aria-label="Dos Búhos, inicio del Hub"><img class="wordmark-img" src="/logo-word.png" alt="dos búhos" width="730" height="160"></a>
  <span class="crumb"><b>Club</b></span>
  <form class="tsearch" id="tsearch" role="search"><input name="q" type="search" placeholder="Buscar socios por nombre, teléfono o correo" aria-label="Buscar socios" autocomplete="off"><button type="submit">BUSCAR SOCIOS</button></form>
  <span class="spacer"></span>
  <nav><a href="/">Hub</a></nav>
</div></header>
<aside class="side" id="side" aria-label="Secciones del club"></aside>
<nav class="qbar" id="qbar" aria-label="Accesos rápidos"></nav>
<main class="wrap" id="app"><div class="skel"></div><div class="skel"></div><div class="skel"></div></main>
<dialog id="dlg"><div class="dh"><b id="dlgT"></b><button class="btn sm" type="button" data-act="close">Cerrar</button></div><div class="db" id="dlgB"></div></dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = new Intl.NumberFormat('es-MX', { maximumFractionDigits: 0 });
const money = n => '$' + nf.format(Math.round(n || 0));
const num = v => { const n = Number(String(v ?? '').replace(/[^0-9.]/g, '')); return Number.isFinite(n) ? n : 0; };
const dayWords = d => new Date(d + 'T12:00:00Z').toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
const dayShort = d => new Date(d + 'T12:00:00Z').toLocaleDateString('es-MX', { day: 'numeric', month: 'short', timeZone: 'UTC' }).replace('.', '');
const when = ms => new Date(ms).toLocaleString('es-MX', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'America/Mexico_City' }).replace('.', '');
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const S = { boot: null, hoy: null, person: null, back: '#hoy', progSel: null, lastInvite: null };
const app = $('#app');

async function api(method, path, body) {
  const r = await fetch('/club/api/' + path, { method, headers: body ? { 'content-type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { location.href = '/?next=' + encodeURIComponent(location.pathname + location.hash); throw new Error('Vuelve a entrar.'); }
  const b = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(b.message || 'Algo salió mal. Intenta de nuevo.');
  return b;
}
let toastT;
function toast(msg, bad = false, action = null) {
  $$('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.setAttribute('role', 'status');
  t.innerHTML = `<span>${esc(msg)}</span>`;
  if (action) { const b = document.createElement('button'); b.type = 'button'; b.textContent = action.label; b.onclick = () => { t.remove(); action.run(); }; t.append(b); }
  document.body.append(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), action ? 9000 : 3500);
}
async function copy(text, what = 'Copiado') {
  try { await navigator.clipboard.writeText(text); toast(what); }
  catch { const ta = document.createElement('textarea'); ta.value = text; document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast(what); }
}
const badge = (p, pending) => `<span class="pb${pending ? ' pending' : ''}" style="--c:${esc(p.color || '')}">${esc(p.name)}${pending ? ' · por aprobar' : ''}</span>`;
const badges = (ps = []) => ps.length ? `<span class="pbs">${ps.map(p => badge(p)).join('')}</span>` : '';
const isAdmin = () => S.boot?.role === 'admin';
const P = id => S.boot.programs.find(p => p.id === id);
const stepper = (name, v, min, max) => `<div class="stepper" data-min="${min}" data-max="${max}"><button type="button" data-step="-1" aria-label="Menos">−</button><output>${v}</output><button type="button" data-step="1" aria-label="Más">+</button><input type="hidden" name="${name}" value="${v}"></div>`;
document.addEventListener('click', ev => {
  const b = ev.target.closest('.stepper button'); if (!b) return;
  const s = b.closest('.stepper'), i = $('input', s), o = $('output', s);
  const v = Math.min(+s.dataset.max, Math.max(+s.dataset.min, +i.value + +b.dataset.step)); i.value = v; o.textContent = v;
  i.dispatchEvent(new Event('change', { bubbles: true }));
});
const ICON = {
  hoy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  socios: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.2c3 .2 5 2.3 5 5.3"/></svg>',
  invitar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M19 8v6M16 11h6"/></svg>',
  resumen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  programas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>',
  portal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10 18.5h4"/></svg>',
  finanzas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="6" width="19" height="13" rx="2"/><path d="M2.5 10h19M6.5 15h4"/></svg>',
  ajustes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>',
  scan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/></svg>',
  menu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  owl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4l3 3h8l3-3v9a7 7 0 0 1-14 0z"/><circle cx="9.5" cy="11" r="1.6"/><circle cx="14.5" cy="11" r="1.6"/><path d="M11 14.5l1 1 1-1"/></svg>',
};
// The sidebar, grouped the way Join It groups its admin. Staff (non-admin) see Hoy, Ver socios and Resumen.
// [key, label, admin only]; a group opens by itself when one of its pages is open.
const NAV = [
  ['hoy', 'Hoy'],
  ['g', 'Socios', 'socios', [['socios', 'Ver socios'], ['nuevo', 'Agregar socio', 1], ['programas', 'Tipos de membresía', 1], ['ajustes', 'Ajustes de socios', 1]]],
  ['g', 'Portal del socio', 'portal', [['tarjetas', 'Tarjetas digitales', 1], ['invitar', 'Invitaciones', 1], ['novios', 'Novios', 1]]],
  ['g', 'Finanzas', 'finanzas', [['pagos', 'Pagos', 1]]],
  ['g', 'Reportes', 'resumen', [['resumen', 'Resumen'], ['actividad', 'Actividad', 1]]],
];
const pendCount = () => S.hoy ? S.hoy.receipts.length + S.hoy.resend.length + S.hoy.approvals.length : 0;
function renderNav(active) {
  S.active = active;
  const ok = it => !it[2] || isAdmin();
  const cur = k => k === active ? ' aria-current="page"' : '';
  const pend = pendCount();
  $('#side').innerHTML = `<div class="org"><span class="ico">${ICON.owl}</span><div><small>Organización</small><b>Dos Búhos · Club</b></div></div>
    ${NAV.map(n => {
      if (n[0] !== 'g') return `<a class="si" href="#${n[0]}"${cur(n[0])}>${ICON[n[0]]}<span>${n[1]}</span>${n[0] === 'hoy' && pend ? `<span class="dot" aria-label="${pend} pendientes">${pend}</span>` : ''}</a>`;
      const kids = n[3].filter(ok); if (!kids.length) return '';
      const open = kids.some(k => k[0] === active) || S.openGroups?.has(n[1]);
      return `<details data-g="${esc(n[1])}"${open ? ' open' : ''}><summary>${ICON[n[2]]}<span>${n[1]}</span></summary><div class="sub">${kids.map(k => `<a href="#${k[0]}"${cur(k[0])}>${k[1]}</a>`).join('')}</div></details>`;
    }).join('')}
    <div class="portal"><a href="/c/" target="_blank" rel="noopener">Ver portal del socio ↗</a></div>`;
  const canScan = 'BarcodeDetector' in window && navigator.mediaDevices?.getUserMedia;
  $('#qbar').innerHTML = `<a href="#hoy"${cur('hoy')}>${ICON.hoy}<span>Hoy</span>${pend ? `<span class="dot">${pend}</span>` : ''}</a>
    <a href="#socios"${['socios', 'nuevo'].includes(active) ? ' aria-current="page"' : ''}>${ICON.socios}<span>Socios</span></a>
    ${canScan ? `<button type="button" data-act="scan">${ICON.scan}<span>Escanear</span></button>` : ''}
    <button type="button" data-act="menu">${ICON.menu}<span>Menú</span></button>`;
}
function menu(open) {
  const side = $('#side'); open = open ?? !side.classList.contains('open');
  side.classList.toggle('open', open);
  $$('[data-act="menu"]').forEach(b => b.setAttribute('aria-expanded', String(open)));
  $('.scrim')?.remove();
  if (open) { const sc = document.createElement('div'); sc.className = 'scrim'; sc.onclick = () => menu(false); document.body.append(sc); }
}
document.addEventListener('toggle', ev => { const d = ev.target.closest?.('#side details'); if (!d) return; S.openGroups ||= new Set(); S.openGroups[d.open ? 'add' : 'delete'](d.dataset.g); }, true);
$('#tsearch').addEventListener('submit', ev => { ev.preventDefault(); const q = ev.target.q.value.trim(); S.soc = { ...(S.soc || { estado: 'todos', programa: '', orden: 'actividad' }), estado: 'todos', q }; ev.target.q.value = ''; if (location.hash === '#socios') viewSocios(); else location.hash = '#socios'; });

// ---------- router ----------
async function route() {
  menu(false);
  const h = location.hash.replace(/^#/, '') || 'hoy';
  const [view, arg] = h.split('/');
  app.classList.toggle('wide', ['programas', 'socios', 'pagos'].includes(view));
  const A = isAdmin();
  const views = { hoy: viewHoy, socios: viewSocios, buscar: viewSocios, resumen: viewResumen,
    ...(A ? { nuevo: viewNuevo, invitar: viewInvitar, novios: viewNovios, programas: viewProgramas, ajustes: viewAjustes, tarjetas: viewTarjetas, pagos: viewPagos, actividad: viewActividad } : {}) };
  try {
    if (view === 'p') { renderNav(S.back.replace('#', '').split('/')[0]); await viewPerson(Number(arg)); }
    else if (view === 'c') { renderNav('socios'); const r = await api('GET', 'card/' + arg); location.replace('#p/' + r.id); }
    else if (views[view]) { renderNav(view === 'buscar' ? 'socios' : view); await views[view](); }
    else location.replace('#hoy');
  } catch (e) { app.innerHTML = `<div class="empty"><b>No se pudo abrir</b>${esc(e.message)}<p><a class="btn" href="#hoy">Volver a Hoy</a></p></div>`; }
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route);

// ---------- Hoy ----------
async function viewHoy() {
  S.back = '#hoy';
  S.hoy = await api('GET', 'hoy'); renderNav('hoy');
  const h = S.hoy;
  const pend = [];
  if (h.approvals.length) pend.push(`<div class="blk"><h2>Solicitudes por aprobar <small>${h.approvals.length}</small></h2><div class="list">${h.approvals.map(a => `
    <div class="r stack"><div class="main"><span class="t">${esc(a.name)}</span><span class="s">${esc(a.program)}${a.pro_type ? ' · ' + esc(a.pro_type) : ''} · ${esc(a.phone)} · ${when(a.created_at)}</span></div>
      <div class="acts"><select aria-label="Aprobar como" data-appr-prog="${a.id}">${S.boot.programs.filter(p => !p.archived && p.kind !== 'compras').map(p => `<option value="${p.id}"${p.id === a.program_id ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}</select>
      <button class="btn primary" data-act="approve" data-id="${a.id}">Aprobar</button><button class="btn" data-act="reject" data-id="${a.id}">Rechazar</button></div></div>`).join('')}</div></div>`);
  if (h.receipts.length) pend.push(`<div class="blk"><h2>Compras por revisar <small>${h.receipts.length}</small></h2><div class="list">${h.receipts.map(r => `
    <button class="r" data-act="receipt" data-id="${r.id}"><div class="main"><span class="t">${esc(r.name)} · ${money(r.amount)}</span><span class="s">${esc(r.channel_name)} · ${dayShort(r.day)} · subida ${when(r.created_at)}</span></div><span class="chev">›</span></button>`).join('')}</div></div>`);
  if (h.resend.length) pend.push(`<div class="blk"><h2>Reenviar tarjeta <small>${h.resend.length}</small></h2><div class="list">${h.resend.map(r => `
    <div class="r stack"><div class="main"><span class="t">Reenviar tarjeta a ${esc(r.name)}</span><span class="s">${esc(r.phone)} · ${r.reason === 'ya_registrado' ? 'intentó registrarse otra vez' : 'perdió su tarjeta'} · ${when(r.created_at)}</span></div>
      <div class="acts"><a class="btn primary" href="${esc(r.wa)}" target="_blank" rel="noopener" data-act="sent" data-pid="${r.person_id}">WhatsApp</a><button class="btn" data-act="reqdone" data-id="${r.id}">Ya está</button></div></div>`).join('')}</div></div>`);
  const ann = h.announced, chk = h.checkins;
  app.innerHTML = `<h1 class="page">Hoy</h1><p class="sub">${cap(dayWords(h.day))}</p>
  ${(ann.length || h.vip_now.length) ? `<p><button class="btn block" data-act="shift">Copiar para el grupo del turno</button></p>` : ''}
  ${h.vip_now.length ? `<div class="blk"><h2>VIP aquí ahora</h2><div class="list">${h.vip_now.map(v => `<a class="r" href="#p/${v.person_id}"><div class="main"><span class="t">${esc(v.name)}</span><span class="s">${v.time} · ${v.party_size} pax${v.staff_note ? ' · ' + esc(v.staff_note) : ''}</span>${badges(v.programs)}</div><span class="chev">›</span></a>`).join('')}</div></div>` : ''}
  ${pend.join('')}
  <div class="blk"><h2>Avisaron que vienen <small>${ann.length || ''}</small></h2>
  ${ann.length ? `<div class="list">${ann.map(a => `<div class="r stack"><a class="main" href="#p/${a.person_id}" style="text-decoration:none;color:inherit">
      <span class="t">${a.time ? esc(a.time) + ' · ' : ''}${esc(a.name)} · ${a.party_size} pax${a.vip ? ' <span class="vip">VIP</span>' : ''}${a.here ? ' <span class="chip ok">Ya llegó</span>' : ''}</span>
      <span class="s">${a.reservation_name ? 'OpenTable a nombre de ' + esc(a.reservation_name) : 'Sin nombre de reservación'}${a.staff_note ? ' · ' + esc(a.staff_note) : ''}</span>${badges(a.programs)}</a>
      <div class="acts"><button class="btn sm" data-act="otnote" data-text="${esc(a.opentable)}">Nota para OpenTable</button><a class="btn sm" href="#p/${a.person_id}">Abrir</a></div></div>`).join('')}</div>`
    : `<div class="empty sm"><b>Nadie ha avisado hoy</b>Los socios avisan desde su tarjeta con “Voy a ir”, o desde aquí al abrir a la persona.</div>`}</div>
  <div class="blk"><h2>Llegaron hoy <small>${chk.length || ''}</small></h2>
  ${chk.length ? `<div class="list">${chk.map(v => `<div class="r stack"><a class="main" href="#p/${v.person_id}" style="text-decoration:none;color:inherit">
      <span class="t">${esc(v.time)} · ${esc(v.name)} · ${v.party_size} pax${v.vip ? ' <span class="vip">VIP</span>' : ''}</span>
      <span class="s">${v.parrot_check ? 'Cuenta ' + esc(v.parrot_check) + ' · ' : ''}${v.check_total ? money(v.check_total) + ' · ' : ''}${v.discount_total ? 'desc. ' + money(v.discount_total) + ' · ' : ''}${v.brought_by_name ? 'lo trajo ' + esc(v.brought_by_name) + ' · ' : ''}${esc(v.created_by.split('@')[0])}</span>${badges(v.programs)}</a>
      ${v.can_undo ? `<div class="acts"><button class="btn sm danger" data-act="undo" data-id="${v.id}">Deshacer</button></div>` : ''}</div>`).join('')}</div>`
    : `<div class="empty sm"><b>Todavía no llega nadie del club</b>Escanea la tarjeta con la cámara o búscala por nombre o teléfono.</div>`}
  <p><a class="btn block big" href="#socios">Buscar o escanear una tarjeta</a></p></div>`;
}
function shiftText() {

async function scan() {
  const wrap = document.createElement('div'); wrap.className = 'scan';
  wrap.innerHTML = '<video playsinline muted></video><div class="bar"><button class="btn" type="button">Cancelar</button></div>';
  document.body.append(wrap);
  let stream, stop = false;
  const end = () => { stop = true; stream?.getTracks().forEach(t => t.stop()); wrap.remove(); };
  $('button', wrap).onclick = end;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const v = $('video', wrap); v.srcObject = stream; await v.play();
    const det = new BarcodeDetector({ formats: ['qr_code'] });
    while (!stop) {
      const codes = await det.detect(v).catch(() => []);
      const m = codes.map(c => c.rawValue).join(' ').match(/\/c\/([A-Za-z0-9_-]{20,64})/);
      if (m) { end(); location.hash = '#c/' + m[1]; return; }
      await new Promise(r => setTimeout(r, 250));
    }
  } catch { end(); toast('No se pudo abrir la cámara. Usa la cámara del teléfono o busca por nombre.', true); }
}

const parseBulk = text => text.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const parts = l.split(/[,;\t]/).map(x => x.trim()); const email = parts.find(x => /@/.test(x)) || ''; const phone = parts.find(x => /^\+?[\d\s().-]{8,}$/.test(x)) || ''; const name = parts.find(x => x && x !== email && x !== phone) || ''; return { line: l, name, email, phone }; });
async function bulkInvite(f) {
  const rows = parseBulk(f.bulk.value);

  S.invProg = f.program_id.value; S.bulkDone = done; S.lastInvite = null;

}

      <p class="hint" style="margin:-4px 0 8px">${p.kind === 'compras' ? `Automático desde ${money(p.threshold_mxn)} en 12 meses` : p.kind === 'fundadores' ? 'Socios fundadores del Círculo (del club de vinos)' : 'Por invitación'}${p.requires_approval ? ' · requiere aprobación' : ''}${p.vip ? ' · VIP' : ''}</p>

  <details class="box" id="progList" style="margin-top:20px"${S.openNewProg ? ' open' : ''}><summary>Tipos de membresía <small>${S.boot.programs.length}</small></summary><div class="in"><div class="list">${S.boot.programs.map(p => `<button class="r" data-act="editprog" data-id="${p.id}"><div class="main"><span class="t">${badge(p)}${p.archived ? ' <span class="chip">archivado</span>' : ''}</span><span class="s">${p.kind === 'compras' ? 'Por compras · desde ' + money(p.threshold_mxn) : p.kind === 'fundadores' ? 'Fundadores' : 'Por invitación'}${p.is_pro ? ' · profesionales' : ''}${p.vip ? ' · VIP' : ''}${p.requires_approval ? ' · con aprobación' : ''}</span></div><span class="chev">›</span></button>`).join('')}</div>
    <details class="box" id="npBox" style="margin-top:10px"${S.openNewProg ? ' open' : ''}><summary>Nuevo tipo de membresía</summary><div class="in"><form class="f" id="np">

  <details class="box"><summary>Catálogo de beneficios <small>${S.boot.benefits.length}</small></summary><div class="in"><div class="list">${S.boot.benefits.map(b => `<button class="r" data-act="editben" data-id="${b.id}"><div class="main"><span class="t">${esc(b.name)}${b.archived ? ' <span class="chip">archivado</span>' : ''}</span><span class="s">${kindWords[b.kind]} · ${whereWords[b.applies_to]}${b.rules ? ' · ' + esc(b.rules.replace('{g}', 'N')) : ''}</span></div><span class="chev">›</span></button>`).join('')}</div>

      <button class="btn primary block" type="submit">Crear beneficio</button></form></div></details></div></details>

function valInput(b, c, cls = '') {
  if (b.kind === 'yes_no') return '';
  if (b.kind === 'text') return `<input class="v t ${cls}" data-f="text_value" value="${esc(c.text_value)}" title="${esc(c.text_value)}" placeholder="Ej. Cata vertical" aria-label="${esc(b.name)}">`;
  return `<input class="v ${cls}" data-f="value" inputmode="decimal" value="${c.value ?? ''}" placeholder="${b.kind === 'percent' ? '%' : b.kind === 'amount' ? '$' : '—'}" aria-label="${esc(b.name)} (${kindWords[b.kind]})">`;
}
function gridCell(p, b) {
  const c = cellOf(p.id, b.id);
  const meta = c.enabled ? `${!c.confirmed ? '<span class="pc"></span> por confirmar' : '✓ confirmado'}${c.max_guests != null ? ' · +' + c.max_guests : ''}${c.note ? ' · nota' : ''}` : 'opciones';
  return `<td style="--c:${esc(p.color)}" class="${c.enabled ? 'on' : ''}" data-p="${p.id}" data-b="${b.id}"><div class="c"><input type="checkbox" data-f="enabled"${c.enabled ? ' checked' : ''} aria-label="${esc(p.name)}: ${esc(b.name)}">${valInput(b, c)}</div>
    <button class="x" data-act="celldlg" title="Acompañantes, nota, confirmar">${meta}</button></td>`;
}
function listCell(p, b) {
  const c = cellOf(p.id, b.id);
  return `<div class="cellrow" data-p="${p.id}" data-b="${b.id}"><div class="line"><label class="switch"><input type="checkbox" data-f="enabled"${c.enabled ? ' checked' : ''}> ${esc(b.name)}</label>${b.kind !== 'text' ? valInput(b, c, 'val') : ''}</div>
    ${b.kind === 'text' ? valInput(b, c, 'val text') : ''}
    ${c.enabled ? `<div class="pbs" style="margin-top:4px">${c.confirmed ? '<span class="chip ok">confirmado</span>' : '<span class="chip conf">por confirmar</span>'}${c.max_guests != null ? `<span class="chip">hasta ${c.max_guests} acompañantes</span>` : ''}${c.note ? `<span class="chip">${esc(c.note)}</span>` : ''}</div>` : ''}
    ${c.enabled ? '<button class="btn sm" style="margin-top:6px" data-act="celldlg">Detalles y confirmar</button>' : ''}</div>`;
}
async function saveCell(pid, bid, patch) {
  try {
    const r = await api('PUT', 'cell', { program_id: pid, benefit_id: bid, ...patch });
    const i = S.boot.cells.findIndex(c => c.program_id === pid && c.benefit_id === bid);
    if (i >= 0) S.boot.cells[i] = { ...S.boot.cells[i], ...r.cell }; else S.boot.cells.push(r.cell);
    toast('Guardado'); return true;
  } catch (e) { toast(e.message, true); return false; }
}
function bindProgramas() {
  app.addEventListener('change', onCellChange);
  const np = $('#np');
  np.onsubmit = async ev => { ev.preventDefault(); try { const r = await api('POST', 'programs', { name: np.name.value, kind: np.kind.value, color: np.color.value, threshold_mxn: np.threshold_mxn.value, is_pro: np.is_pro.checked, requires_approval: np.requires_approval.checked, duration_months: +np.duration_months.value, fee_mxn: num(np.fee_mxn.value) }); S.progSel = r.id; toast('Programa creado'); viewProgramas(); } catch (e) { toast(e.message, true); } };
  const nb = $('#nb');
  nb.onsubmit = async ev => { ev.preventDefault(); try { await api('POST', 'benefits', { name: nb.name.value, kind: nb.kind.value, applies_to: nb.applies_to.value, rules: nb.rules.value }); toast('Beneficio creado'); viewProgramas(); } catch (e) { toast(e.message, true); } };
  S.openNewProg = false;
}
async function onCellChange(ev) {
  const el = ev.target, holder = el.closest('[data-p][data-b]');
  if (!holder || !el.dataset.f || location.hash !== '#programas') return;
  const f = el.dataset.f, v = f === 'enabled' ? el.checked : el.value;
  const patch = { [f]: f === 'value' ? (v === '' ? null : num(v)) : v };
  if (f !== 'enabled' && !cellOf(holder.dataset.p, holder.dataset.b).enabled && v !== '') patch.enabled = true;
  if (await saveCell(holder.dataset.p, holder.dataset.b, patch)) {
    const p = P(holder.dataset.p), b = S.boot.benefits.find(x => x.id === holder.dataset.b);
    const tmp = document.createElement('tbody'); tmp.innerHTML = desk.matches ? `<tr>${gridCell(p, b)}</tr>` : listCell(p, b);
    holder.replaceWith(desk.matches ? tmp.querySelector('td') : tmp.firstElementChild);
  }
}
function cellDialog(pid, bid) {
  const p = P(pid), b = S.boot.benefits.find(x => x.id === bid), c = cellOf(pid, bid);
  openDlg(`${p.name} · ${b.name}`, `<form class="f" id="cd">
    <label class="switch"><input type="checkbox" name="enabled"${c.enabled ? ' checked' : ''}> Encendido para ${esc(p.name)}</label>
    ${b.kind === 'yes_no' ? '' : b.kind === 'text' ? `<div class="field"><span>Texto</span><input name="text_value" value="${esc(c.text_value)}"></div>` : `<div class="field"><span>Valor (${kindWords[b.kind]})</span><input name="value" inputmode="decimal" value="${c.value ?? ''}"></div>`}
    <div class="field"><span>Acompañantes cubiertos (vacío = no aplica)</span><input name="max_guests" inputmode="numeric" value="${c.max_guests ?? ''}"></div>
    <div class="field"><span>Nota para este programa</span><input name="note" value="${esc(c.note)}" maxlength="200"></div>
    <label class="switch"><input type="checkbox" name="confirmed"${c.confirmed ? ' checked' : ''}> Confirmado (quita “por confirmar”)</label>
    <p class="hint">Regla general: ${esc((b.rules || '—').replace('{g}', c.max_guests ?? 'N'))}</p>
    <button class="btn primary block" type="submit">Guardar</button></form>`);
  const f = $('#cd');
  f.onsubmit = async ev => {
    ev.preventDefault();
    const patch = { enabled: f.enabled.checked, max_guests: f.max_guests.value === '' ? null : num(f.max_guests.value), note: f.note.value, confirmed: f.confirmed.checked };
    if (f.value) patch.value = f.value.value === '' ? null : num(f.value.value);
    if (f.text_value) patch.text_value = f.text_value.value;
    if (await saveCell(pid, bid, patch)) { closeDlg(); viewProgramas(); }
  };
}
function progDialog(id) {
  const p = P(id), n = S.boot.cells.filter(c => c.program_id === id && c.enabled && !c.confirmed).length;
  openDlg(p.name, `<form class="f" id="pd">
    <div class="field"><span>Nombre</span><input name="name" value="${esc(p.name)}" required maxlength="60"></div>
    <div class="two"><div class="field"><span>Nombre corto (OpenTable)</span><input name="short_label" value="${esc(p.short_label)}" maxlength="30"></div><div class="field"><span>Color</span><input type="color" name="color" value="${esc(p.color)}"></div></div>
    ${p.kind === 'compras' ? `<div class="field"><span>Desde (MXN en 12 meses)</span><input name="threshold_mxn" inputmode="numeric" value="${p.threshold_mxn ?? 0}"></div>` : `
    <div class="two"><label class="field"><span>Duración</span><select name="duration_months">${[0, 1, 3, 6, 12, 24].map(n => `<option value="${n}"${n === (p.duration_months || 0) ? ' selected' : ''}>${durWords(n)}</option>`).join('')}${[0, 1, 3, 6, 12, 24].includes(p.duration_months || 0) ? '' : `<option value="${p.duration_months}" selected>${durWords(p.duration_months)}</option>`}</select></label>
      <label class="field"><span>Cuota (MXN, opcional)</span><input name="fee_mxn" inputmode="decimal" value="${p.fee_mxn || ''}" placeholder="Sin cuota"></label></div>
    <label class="field"><span>Enlace de pago <span class="muted">(opcional, p. ej. Stripe)</span></span><input name="pay_url" type="url" value="${esc(p.pay_url || '')}" placeholder="https://buy.stripe.com/…"></label>
    <p class="hint" style="margin-top:-6px">La duración aplica a quien entre de hoy en adelante; cambia la de cada socio en su ficha. Si vence, la tarjeta muestra el enlace para renovar.</p>`}
    <label class="switch"><input type="checkbox" name="vip"${p.vip ? ' checked' : ''}> VIP: sale en “VIP aquí ahora”</label>
    ${p.kind !== 'compras' ? `<label class="switch"><input type="checkbox" name="requires_approval"${p.requires_approval ? ' checked' : ''}> Las invitaciones nuevas requieren aprobación</label>
    <label class="switch"><input type="checkbox" name="is_pro"${p.is_pro ? ' checked' : ''}> Profesionales (pueden traer gente)</label>
    <label class="switch"><input type="checkbox" name="personal_only"${p.personal_only ? ' checked' : ''}> Solo invitación personal con correo (sin enlaces para grupos)</label>` : ''}
    <button class="btn primary block" type="submit">Guardar</button>
    ${n ? `<button class="btn block" type="button" data-act="confirmall" data-id="${p.id}">Confirmar los ${n} valores de ${esc(p.name)}</button>` : ''}
    <button class="btn block danger" type="button" data-act="archive" data-id="${p.id}">${p.archived ? 'Volver a activar' : 'Archivar programa'}</button>
    <p class="hint">Archivar lo quita de las tarjetas y de las invitaciones nuevas; no borra a nadie.</p></form>`);
  const f = $('#pd');
  f.onsubmit = async ev => {
    ev.preventDefault();
    const body = { name: f.name.value, short_label: f.short_label.value, color: f.color.value, vip: f.vip.checked };
    if (f.threshold_mxn) body.threshold_mxn = num(f.threshold_mxn.value);
    if (f.duration_months) { body.duration_months = +f.duration_months.value; body.fee_mxn = num(f.fee_mxn.value); body.pay_url = f.pay_url.value.trim(); }
    if (f.requires_approval) { body.requires_approval = f.requires_approval.checked; body.is_pro = f.is_pro.checked; body.personal_only = f.personal_only.checked; }
    try { await api('PATCH', 'programs/' + id, body); closeDlg(); toast('Programa guardado'); viewProgramas(); } catch (e) { toast(e.message, true); }
  };
}
function benDialog(id) {
  const b = S.boot.benefits.find(x => x.id === id);
  openDlg(b.name, `<form class="f" id="bd">
    <div class="field"><span>Nombre</span><input name="name" value="${esc(b.name)}" required></div>
    <div class="field"><span>Dónde aplica</span><select name="applies_to">${Object.entries(whereWords).map(([k, t]) => `<option value="${k}"${k === b.applies_to ? ' selected' : ''}>${t}</option>`).join('')}</select></div>
    <div class="field"><span>Regla para el equipo ({g} = acompañantes)</span><textarea name="rules" rows="3">${esc(b.rules)}</textarea></div>
    <div class="field"><span>Lo que lee el socio ({v} = valor${b.kind === 'text' ? ', {t} = texto' : ''})</span><input name="phrase" value="${esc(b.phrase)}"></div>
    <p class="hint">Tipo: ${kindWords[b.kind]} (no se cambia).</p>
    <button class="btn primary block" type="submit">Guardar</button>
    <button class="btn block danger" type="button" data-act="archiveben" data-id="${b.id}">${b.archived ? 'Volver a activar' : 'Archivar beneficio'}</button></form>`);
  const f = $('#bd');
  f.onsubmit = async ev => { ev.preventDefault(); try { await api('PATCH', 'benefits/' + id, { name: f.name.value, applies_to: f.applies_to.value, rules: f.rules.value, phrase: f.phrase.value }); closeDlg(); toast('Beneficio guardado'); viewProgramas(); } catch (e) { toast(e.message, true); } };
}
function fieldDialog(id) {
  const f = id ? S.boot.fields.find(x => x.id === id) : { label: '', help: '', kind: 'text', options: '', program_id: '', required: 0, staff_only: 0 };
  const progs = S.boot.programs.filter(p => !p.archived && p.kind !== 'compras');
  openDlg(id ? 'Editar pregunta' : 'Nueva pregunta', `<form class="f" id="fd">
    <label class="field"><span>Pregunta</span><input name="label" value="${esc(f.label)}" required maxlength="80" placeholder="Ej. ¿Cómo nos conociste?"></label>
    <label class="field"><span>Ayuda <span class="muted">(opcional, debajo de la pregunta)</span></span><input name="help" value="${esc(f.help)}" maxlength="160"></label>
    <div class="two"><label class="field"><span>Tipo de respuesta</span><select name="kind"${id ? ' disabled' : ''}>${Object.entries(S.boot.field_kinds).map(([k, tt]) => `<option value="${k}"${k === f.kind ? ' selected' : ''}>${tt}</option>`).join('')}</select></label>
      <label class="field"><span>Se pregunta en</span><select name="program_id"><option value="">Todos los programas</option>${progs.map(p => `<option value="${p.id}"${p.id === f.program_id ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label></div>
    <label class="field${f.kind === 'choice' ? '' : ' hide'}" id="fopts"><span>Opciones, una por renglón</span><textarea name="options" rows="4">${esc(f.options)}</textarea></label>
    <label class="switch"><input type="checkbox" name="required"${f.required ? ' checked' : ''}> Obligatoria al registrarse</label>
    <label class="switch"><input type="checkbox" name="staff_only"${f.staff_only ? ' checked' : ''}> Solo equipo (el socio no la ve)</label>
    ${id ? '<p class="hint" style="margin-top:-6px">El tipo no se cambia, para no romper respuestas que ya existen.</p>' : ''}
    <button class="btn primary block" type="submit">Guardar</button>
    ${id ? `<button class="btn block${f.archived ? '' : ' danger'}" type="button" data-act="archivefield" data-id="${id}">${f.archived ? 'Volver a activar' : 'Archivar pregunta'}</button>` : ''}</form>`);
  const fm = $('#fd');
  fm.kind.onchange = () => $('#fopts').classList.toggle('hide', fm.kind.value !== 'choice');
  fm.staff_only.onchange = () => { if (fm.staff_only.checked) fm.required.checked = false; };
  fm.required.onchange = () => { if (fm.required.checked) fm.staff_only.checked = false; };
  fm.onsubmit = async ev => {
    ev.preventDefault();
    const body = { label: fm.label.value, help: fm.help.value, kind: fm.kind.value, options: fm.options.value, program_id: fm.program_id.value, required: fm.required.checked, staff_only: fm.staff_only.checked };
    try { await api(id ? 'PATCH' : 'POST', id ? 'fields/' + id : 'fields', body); closeDlg(); toast('Pregunta guardada'); route(); } catch (e) { toast(e.message, true); }
  };
}
function openDlg(title, html) { $('#dlgT').textContent = title; $('#dlgB').innerHTML = html; $('#dlg').showModal(); }
function closeDlg() { $('#dlg').close(); }

// ---------- receipts ----------
function receiptDialog(id) {
  const r = S.hoy.receipts.find(x => x.id === id);
  openDlg('Compra por revisar', `<img src="/club/api/photo/${r.id}" alt="Ticket de ${esc(r.name)}">
    <p style="margin:0 0 10px"><b>${esc(r.name)}</b> · ${esc(r.channel_name)} · ${dayShort(r.day)}</p>
    <form class="f" id="rd"><div class="field"><span>Monto que se suma (corrígelo si el ticket dice otro)</span><input name="amount" inputmode="decimal" value="${r.amount}"></div>
    <button class="btn primary block big" type="submit">Aprobar y sumar</button>
    <div class="field"><span>Si lo rechazas, ¿por qué? (lo ve el socio como “pregunta al equipo”)</span><input name="reason" maxlength="200" placeholder="Ej. ticket ilegible"></div>
    <button class="btn block danger" type="button" data-act="rejreceipt" data-id="${r.id}">Rechazar</button></form>`);
  const f = $('#rd');
  f.onsubmit = async ev => { ev.preventDefault(); try { await api('POST', `purchase/${id}/decide`, { approve: true, amount: num(f.amount.value) }); closeDlg(); toast('Compra sumada'); viewHoy(); } catch (e) { toast(e.message, true); } };
}

// ---------- actions ----------
document.addEventListener('click', async ev => {
  const a = ev.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, id = Number(a.dataset.id) || a.dataset.id;
  try {
    if (act === 'close') return closeDlg();
    if (act === 'menu') return menu();
    if (act === 'ptab') { S.ptab = a.dataset.tab; $$('#ptabs [data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === S.ptab))); $$('[data-panel]').forEach(x => x.classList.toggle('hide', x.dataset.panel !== S.ptab)); if (!a.closest('#ptabs')) $('#ptabs').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    if (act === 'govisit') { const v = $('#visitBox'); v?.scrollIntoView({ behavior: 'smooth', block: 'start' }); setTimeout(() => $('#visit .stepper button')?.focus({ preventScroll: true }), 350); return; }
    if (act === 'goann') { S.ptab = 'visitas'; $$('#ptabs [data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === 'visitas'))); $$('[data-panel]').forEach(x => x.classList.toggle('hide', x.dataset.panel !== 'visitas')); const d = $('#annBox'); d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    if (act === 'shift') return copy(shiftText(), 'Copiado: pégalo en el grupo del turno');
    if (act === 'otnote') return copy(a.dataset.text, 'Nota para OpenTable copiada');
    if (act === 'copy') return copy(a.dataset.text, 'Enlace copiado');
    if (act === 'copycard') return copy(a.dataset.text, 'Mensaje copiado');
    if (act === 'scan') return scan();
    if (act === 'clearf') { S.soc = null; return viewSocios(); }
    if (act === 'renew') return renewDialog(Number(a.dataset.ms));
    if (act === 'newfield') return fieldDialog(null);
    if (act === 'editfield') return fieldDialog(Number(a.dataset.id));
    if (act === 'archivefield') { const f = S.boot.fields.find(x => x.id === Number(a.dataset.id)); await api('PATCH', 'fields/' + f.id, { archived: !f.archived }); closeDlg(); return route(); }
    if (act === 'gofilter') { S.soc = { estado: a.dataset.estado, programa: '', orden: 'vence', q: '' }; return; }
    if (act === 'expiry') return expiryDialog(Number(a.dataset.ms));
    if (act === 'payment') return paymentDialog();
    if (act === 'voidpay') { if (!confirm('¿Anular este pago? Queda registrado como anulado.')) return; const r = await api('POST', `payment/${id}/void`); toast(r.note || 'Pago anulado', !!r.note); return viewPerson(S.person.person.id); }
    if (act === 'sent') { api('POST', `person/${a.dataset.pid}/sent`).then(() => { if (a.dataset.reload || location.hash === '#hoy' || location.hash === '') setTimeout(route, 600); }).catch(() => {}); return; }
    if (act === 'undo') return undo(id);
    if (act === 'approve' || act === 'reject') { const prog = $(`[data-appr-prog="${id}"]`)?.value; await api('POST', `membership/${id}/decide`, { approve: act === 'approve', program_id: prog }); toast(act === 'approve' ? 'Aprobado: ya tiene sus beneficios' : 'Rechazada'); return viewHoy(); }
    if (act === 'receipt') return receiptDialog(id);
    if (act === 'rejreceipt') { await api('POST', `purchase/${id}/decide`, { approve: false, reason: $('#rd')?.reason.value }); closeDlg(); toast('Compra rechazada'); return viewHoy(); }
    if (act === 'reqdone') { await api('POST', `request/${id}/done`); return viewHoy(); }
    if (act === 'note') {
      const p = S.person.person;
      $('#noteBox').innerHTML = `<b>Nota del equipo</b><form class="f" id="nf" style="gap:8px"><textarea name="n" rows="3" maxlength="1000">${esc(p.staff_note)}</textarea><div class="acts"><button class="btn primary" type="submit">Guardar nota</button><button class="btn" type="button" data-act="cancelnote">Cancelar</button></div></form>`;
      const f = $('#nf'); f.n.focus();
      f.onsubmit = async e => { e.preventDefault(); try { await api('PATCH', 'person/' + p.id, { staff_note: f.n.value }); toast('Nota guardada'); viewPerson(p.id); } catch (x) { toast(x.message, true); } };
      return;
    }
    if (act === 'cancelnote') return viewPerson(S.person.person.id);
    if (act === 'newcode') { if (!confirm('¿Cambiar el código? El enlace anterior deja de funcionar y hay que mandarle la tarjeta nueva.')) return; await api('POST', `person/${S.person.person.id}/newcode`); toast('Código cambiado: manda la tarjeta nueva'); return viewPerson(S.person.person.id); }
    if (act === 'revoke') { if (!confirm('¿Cancelar esta invitación? El enlace deja de funcionar; quienes ya se registraron se quedan.')) return; await api('POST', `invites/${id}/revoke`); S.lastInvite = null; return viewInvitar(); }
    if (act === 'nextinv') { S.lastInvite = null; S.bulkDone = null; await viewInvitar(); (S.invKind === 'bulk' ? $('#inv').bulk : $('#inv').name).focus(); return; }
    if (act === 'nvprev') { const r = await api('POST', 'novios', { text: $('#nv').text.value, preview: true }); $('#nvprev').innerHTML = `<p class="hint">${r.rows.length} parejas listas${r.errors.length ? ':' : '.'}</p>${r.errors.map(e => `<p class="hint" style="color:var(--bad)">${esc(e)}</p>`).join('')}${r.rows.slice(0, 30).map(x => `<div class="r"><div class="main"><span class="t">${esc(x.name)}</span><span class="s">${esc(x.phone ? '+' + x.phone : '')} ${esc(x.email)} ${x.wedding ? '· boda ' + dayShort(x.wedding) : ''}</span></div></div>`).join('')}`; return; }
    if (act === 'pick') { S.progSel = a.dataset.id; return viewProgramas(); }
    if (act === 'celldlg') { const h = a.closest('[data-p][data-b]'); return cellDialog(h.dataset.p, h.dataset.b); }
    if (act === 'editprog') return progDialog(a.dataset.id);
    if (act === 'editben') return benDialog(a.dataset.id);
    if (act === 'archive') { const p = P(a.dataset.id); if (!p.archived && !confirm(`¿Archivar ${p.name}?`)) return; await api('PATCH', 'programs/' + p.id, { archived: !p.archived }); closeDlg(); return viewProgramas(); }
    if (act === 'archiveben') { const b = S.boot.benefits.find(x => x.id === a.dataset.id); await api('PATCH', 'benefits/' + b.id, { archived: !b.archived }); closeDlg(); return viewProgramas(); }
    if (act === 'confirmall') { const cs = S.boot.cells.filter(c => c.program_id === a.dataset.id && c.enabled && !c.confirmed); for (const c of cs) await api('PUT', 'cell', { program_id: c.program_id, benefit_id: c.benefit_id, confirmed: true }); closeDlg(); toast(`${cs.length} confirmados`); return viewProgramas(); }
    if (act === 'sync') { a.disabled = true; const r = await api('POST', 'sync'); toast(r.skipped ? r.message : `Listo: ${r.members} socios, ${r.created} nuevos`); return route(); }
    if (act === 'goto') { ev.preventDefault(); $('#' + a.dataset.id)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    if (act === 'newprog') { S.openNewProg = true; if (location.hash !== '#programas') { location.hash = '#programas'; return; } await viewProgramas(); $('#npBox').scrollIntoView({ behavior: 'smooth' }); $('#np').name.focus({ preventScroll: true }); return; }
    if (act === 'audit') { const r = await api('GET', 'audit'); $('#audit').innerHTML = r.audit.map(x => `<div class="r"><div class="main"><span class="t">${esc(x.action)} · ${esc(x.entity_id)}</span><span class="s">${when(x.at)} · ${esc(x.actor)}</span></div></div>`).join('') || '<p class="hint">Sin cambios.</p>'; return; }
  } catch (e) { toast(e.message, true); }
});

(async () => {
  try { S.boot = await api('GET', 'boot'); }
  catch (e) { app.innerHTML = `<div class="empty"><b>No se pudo cargar el club</b>${esc(e.message)}</div>`; return; }
  route();
})();
</script>
</body>
</html>
