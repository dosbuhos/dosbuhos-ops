<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
<title>Club de beneficios · Dos Búhos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css?app=club"><link rel="stylesheet" href="/kit/kit.css">
<link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#141719" media="(prefers-color-scheme: dark)">
<style>
/* Club de beneficios — staff + admin. Phone first: one column, nothing scrolls sideways, rows ≥ 44 px, steppers instead of
   button grids, secondary things collapsed. Bottom tab bar on phones, tabs under the top bar from 720 px. The programs ×
   benefits grid appears only from 900 px; below that it is a program picker and a list. */
:root { --hoy-gap: 22px; }
body { padding-bottom: calc(72px + var(--safe-b)); }
@media (min-width: 720px) { body { padding-bottom: 0; } }
.wrap { max-width: 860px; }
.wrap.wide { max-width: 1280px; }
h1.page { font-family: var(--f-display); font-weight: var(--w-display); font-size: 32px; line-height: 1; margin: 2px 0 4px; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
.blk { margin: 0 0 var(--hoy-gap); }
.blk > h2 { font-family: var(--f-display); font-size: 22px; font-weight: var(--w-display); margin: 0 0 8px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.blk > h2 small { font: 400 13px var(--f-body); color: var(--muted); }
.muted { color: var(--muted); }
.hint { font-size: 13px; color: var(--muted); margin: 6px 0 0; }

/* bottom tab bar (phone) → tabs (desktop) */
.cnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; background: var(--paper); border-top: var(--bw) solid var(--rule); padding: 0 4px var(--safe-b); }
.cnav a { flex: 1; min-width: 0; min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--muted); font-size: 11.5px; font-weight: 500; position: relative; }
.cnav a svg { width: 22px; height: 22px; }
.cnav a[aria-current="page"] { color: var(--accent); }
.cnav a[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.cnav .dot { position: absolute; top: 8px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }
@media (min-width: 720px) {
  .cnav { position: static; max-width: 1280px; margin: 0 auto; background: none; border: 0; border-bottom: var(--bw) solid var(--rule); padding: 0 16px; gap: 4px; }
  .cnav a { flex: none; flex-direction: row; min-height: 46px; padding: 0 12px; font: var(--w-display) 18px var(--f-display); gap: 8px; }
  .cnav a svg { width: 18px; height: 18px; }
  .cnav a[aria-current="page"]::before { top: auto; bottom: -1px; left: 8px; right: 8px; border-radius: 3px 3px 0 0; }
  .cnav .dot { position: static; }
}

/* program badge: the program colour, white text (colours are checked for 4.5:1 on save) */
.pb { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; background: var(--c, var(--accent)); color: #fff; font-size: 12.5px; font-weight: 600; line-height: 1.5; white-space: nowrap; }
.pb.pending { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--c, var(--muted)); }
.pbs { display: flex; flex-wrap: wrap; gap: 4px; }
.vip { color: var(--hospitalidad); font-weight: 600; font-size: 12.5px; }
.chip.conf { background: var(--warn-soft); color: var(--warn); border-color: transparent; }

/* rows */
.list { background: var(--paper); border: var(--bw) solid var(--rule); border-radius: var(--radius); overflow: hidden; }
.r { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 9px 12px; border-bottom: var(--bw) solid var(--rule); text-decoration: none; color: inherit; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; font: inherit; text-align: left; }
.r:last-child { border-bottom: 0; }
a.r:hover, button.r:hover { background: var(--paper-2); cursor: pointer; }
.r .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.r .t { font-weight: 600; overflow-wrap: anywhere; }
.r .s { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.r .end { flex: none; display: flex; gap: 6px; align-items: center; }
.r .chev { color: var(--muted); font-size: 20px; flex: none; }
.r.stack { flex-direction: column; align-items: stretch; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.acts .btn { flex: 1 1 auto; }
.empty.sm { padding: 16px; text-align: left; }
.empty.sm b { font-size: 17px; }

/* person */
.who { position: relative; border-radius: var(--radius); padding: 16px; background: var(--c, var(--accent)); color: #fff; }
.who h1 { font-family: var(--f-display); font-weight: var(--w-display); font-size: clamp(30px, 9vw, 40px); line-height: 1; margin: 0 0 8px; overflow-wrap: anywhere; }
.who .pb { background: rgba(255,255,255,.18); box-shadow: inset 0 0 0 1px rgba(255,255,255,.55); }
.who .pb.pending { box-shadow: inset 0 0 0 1px rgba(255,255,255,.8); }
.who .meta { margin-top: 8px; font-size: 13.5px; opacity: .92; }
.who .vipflag { position: absolute; top: 14px; right: 14px; font: 600 12px var(--f-body); letter-spacing: .08em; padding: 3px 8px; border-radius: 4px; background: #fff; color: var(--c, var(--accent)); }
.snote { margin: 10px 0 0; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--now); border: var(--bw) solid var(--now-rule); color: var(--ink); font-size: 14px; }
.snote b { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
.ben { padding: 10px 12px; border-bottom: var(--bw) solid var(--rule); }
.ben:last-child { border-bottom: 0; }
.ben .h { font-weight: 600; font-size: 16px; }
.ben .rule { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
.ben .src { font-size: 12.5px; color: var(--muted); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ben.off { opacity: .75; }
.ben.off .h { text-decoration: line-through; font-weight: 500; }

/* forms */
.f { display: flex; flex-direction: column; gap: 12px; }
.f .field input, .f .field select, .f .field textarea { font-size: 16px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.two > * { min-width: 0; }
.stepper { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; align-items: center; border: var(--bw) solid var(--field-rule, var(--rule)); border-radius: var(--radius-sm); background: var(--paper); overflow: hidden; }
.stepper button { min-height: 44px; border: 0; background: var(--paper-2); color: var(--ink); font: 600 22px var(--f-body); cursor: pointer; }
.stepper output { text-align: center; font: 500 18px var(--f-mono); }
.tick { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 12px; border-bottom: var(--bw) solid var(--rule); cursor: pointer; }
.tick:last-child { border-bottom: 0; }
.tick input[type=checkbox] { width: 22px; height: 22px; min-height: 0; flex: none; accent-color: var(--accent); margin: 0; }
.tick .main { flex: 1; min-width: 0; }
.tick .t { font-weight: 500; }
.tick .s { font-size: 12.5px; color: var(--muted); }
.tick .qty { margin-top: 6px; max-width: 200px; }
.rulebox { padding: 10px 12px; border-radius: var(--radius-sm); background: var(--accent-soft); font-size: 14px; }
.warnbox { padding: 10px 12px; border-radius: var(--radius-sm); background: var(--warn-soft); color: var(--warn); font-size: 14px; font-weight: 500; }
details.box { background: var(--paper); border: var(--bw) solid var(--rule); border-radius: var(--radius); }
details.box > summary { list-style: none; min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 14px; cursor: pointer; font: var(--w-display) 19px var(--f-display); }
details.box > summary::-webkit-details-marker { display: none; }
details.box > summary::after { content: "›"; color: var(--muted); font: 400 24px var(--f-body); transform: rotate(90deg); transition: transform .15s; }
details.box[open] > summary::after { transform: rotate(-90deg); }
details.box > summary small { font: 400 13px var(--f-body); color: var(--muted); margin-left: auto; }
details.box > .in { padding: 0 14px 14px; }
details.box + details.box { margin-top: 10px; }
.btn.block { width: 100%; }
.btn.big { min-height: 52px; font-size: 16px; font-weight: 600; }
.seg.two-up { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
.switch { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; font-size: 14.5px; }
.switch input { width: 22px; height: 22px; min-height: 0; margin: 0; accent-color: var(--accent); flex: none; }

/* tiles + bars (Resumen) */
.tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 720px) { .tiles { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.tile .value { font-size: clamp(20px, 6vw, 26px); overflow-wrap: anywhere; }
.tile.wide { grid-column: 1 / -1; }
@media (min-width: 720px) { .tile.wide { grid-column: auto; } }
.prog { background: var(--paper); border: var(--bw) solid var(--rule); border-radius: var(--radius); padding: 12px; border-left: 5px solid var(--c); }
.prog + .prog { margin-top: 10px; }
.prog .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.prog .top b { font: var(--w-display) 20px var(--f-display); }
.metric { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; margin-top: 8px; font-size: 13.5px; }
.metric .bar { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--paper-2); overflow: hidden; }
.metric .bar i { display: block; height: 100%; background: var(--c, var(--accent)); border-radius: 4px; }
.metric .num { font-family: var(--f-mono); }
.milestone { background: var(--ok-soft); color: var(--ok); border-color: transparent; }

/* programs × benefits */
.picker { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.picker button { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border-radius: 999px; border: var(--bw) solid var(--rule); background: var(--paper); color: var(--ink); font: 500 14px var(--f-body); cursor: pointer; }
.picker button i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.picker button[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: #fff; }
.picker button[aria-pressed="true"] i { background: #fff; }
.cellrow { padding: 10px 12px; border-bottom: var(--bw) solid var(--rule); }
.cellrow:last-child { border-bottom: 0; }
.cellrow .line { display: flex; align-items: center; gap: 10px; }
.cellrow .line .switch { flex: 1; min-width: 0; font-weight: 500; }
.cellrow .val { width: 92px; flex: none; }
.cellrow .val.text { width: 100%; margin-top: 8px; }
.cellrow .more { margin-top: 6px; }
.cellrow .more summary { min-height: 44px; display: inline-flex; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }
.gridwrap { overflow-x: auto; border: var(--bw) solid var(--rule); border-radius: var(--radius); background: var(--paper); }
table.grid { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
table.grid th, table.grid td { border-bottom: var(--bw) solid var(--rule); border-right: var(--bw) solid var(--rule); padding: 6px; vertical-align: top; }
table.grid thead th { position: sticky; top: 0; background: var(--paper-2); z-index: 1; font-weight: 600; text-align: left; }
table.grid thead th button { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-height: 44px; justify-content: center; }
table.grid thead th button:focus-visible { outline: 2px solid var(--accent); }
table.grid thead th .bar { height: 4px; border-radius: 2px; background: var(--c); }
table.grid thead th small { font-weight: 400; color: var(--muted); }
table.grid tbody th { text-align: left; font-weight: 500; position: sticky; left: 0; background: var(--paper); z-index: 1; min-width: 160px; max-width: 220px; }
table.grid tbody th small { display: block; color: var(--muted); font-weight: 400; }
table.grid td.on { background: color-mix(in srgb, var(--c) 9%, var(--paper)); }
table.grid td .c { display: flex; align-items: center; gap: 4px; }
table.grid td input[type=checkbox] { width: 20px; height: 20px; min-height: 0; margin: 0; accent-color: var(--accent); flex: none; }
table.grid td input.v { width: 54px; min-height: 36px; padding: 4px 6px; font: 13px var(--f-mono); }
table.grid td input.v.t { width: 100%; min-width: 54px; font-family: var(--f-body); }
table.grid td .x { display: block; width: 100%; min-height: 32px; margin-top: 2px; padding: 0 2px; border: 0; background: none; color: var(--muted); cursor: pointer; font: 11.5px var(--f-body); text-align: left; border-radius: 4px; }
table.grid td .x:hover { background: var(--paper-2); }
table.grid td .meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
table.grid td .pc { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }

dialog { border: var(--bw) solid var(--rule); border-radius: var(--radius); padding: 0; width: min(480px, calc(100vw - 24px)); max-height: calc(100vh - 40px); background: var(--paper); color: var(--ink); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(20, 15, 15, .45); }
dialog .dh { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-bottom: var(--bw) solid var(--rule); }
dialog .dh b { font: var(--w-display) 21px var(--f-display); }
dialog .db { padding: 14px; }
dialog img { display: block; max-width: 100%; border-radius: var(--radius-sm); margin: 0 auto 12px; }
.toast { display: flex; align-items: center; gap: 12px; bottom: calc(80px + var(--safe-b)); }
@media (min-width: 720px) { .toast { bottom: calc(18px + var(--safe-b)); } }
.toast button { min-height: 36px; border: 0; background: none; color: inherit; font: 600 14px var(--f-body); text-decoration: underline; cursor: pointer; }
.share { padding: 14px; border-radius: var(--radius); border: var(--bw) solid var(--rule); background: var(--paper); }
.share pre { white-space: pre-wrap; font: 14px/1.45 var(--f-body); margin: 0 0 12px; padding: 10px 12px; background: var(--paper-2); border-radius: var(--radius-sm); overflow-wrap: anywhere; }
.scan { position: fixed; inset: 0; z-index: 60; background: #000; display: flex; flex-direction: column; }
.scan video { flex: 1; width: 100%; object-fit: cover; }
.scan .bar { display: flex; justify-content: center; padding: 14px 14px calc(14px + var(--safe-b)); background: #000; }
.skel { height: 56px; border-radius: var(--radius); background: var(--paper-2); margin: 0 0 8px; }
.fchips { display: flex; flex-wrap: wrap; gap: 6px; }
.fchips button { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border-radius: 999px; border: var(--bw) solid var(--rule); background: var(--paper); color: var(--ink); font: 500 14px var(--f-body); cursor: pointer; }
.fchips button b { font: 500 12.5px var(--f-mono); color: var(--muted); }
.fchips button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.fchips button[aria-pressed="true"] b { color: inherit; opacity: .8; }
.r .end .chip { white-space: nowrap; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.hide { display: none !important; }
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <a class="wordmark" href="/" aria-label="Dos Búhos, inicio del Hub"><img class="wordmark-img" src="/logo-word.png" alt="dos búhos" width="730" height="160"></a>
  <span class="crumb"><b>Club</b></span>
  <span class="spacer"></span>
  <nav><a href="/">Hub</a></nav>
</div></header>
<nav class="cnav" id="nav" aria-label="Secciones del club"></nav>
<main class="wrap" id="app"><div class="skel"></div><div class="skel"></div><div class="skel"></div></main>
<dialog id="dlg"><div class="dh"><b id="dlgT"></b><button class="btn sm" type="button" data-act="close">Cerrar</button></div><div class="db" id="dlgB"></div></dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = new Intl.NumberFormat('es-MX', { maximumFractionDigits: 0 });
const money = n => '$' + nf.format(Math.round(n || 0));
const num = v => { const n = Number(String(v ?? '').replace(/[^0-9.]/g, '')); return Number.isFinite(n) ? n : 0; };
const dayWords = d => new Date(d + 'T12:00:00Z').toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
const dayShort = d => new Date(d + 'T12:00:00Z').toLocaleDateString('es-MX', { day: 'numeric', month: 'short', timeZone: 'UTC' }).replace('.', '');
const when = ms => new Date(ms).toLocaleString('es-MX', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'America/Mexico_City' }).replace('.', '');
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const S = { boot: null, hoy: null, person: null, back: '#hoy', progSel: null, lastInvite: null };
const app = $('#app');

async function api(method, path, body) {
  const r = await fetch('/club/api/' + path, { method, headers: body ? { 'content-type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { location.href = '/?next=' + encodeURIComponent(location.pathname + location.hash); throw new Error('Vuelve a entrar.'); }
  const b = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(b.message || 'Algo salió mal. Intenta de nuevo.');
  return b;
}
let toastT;
function toast(msg, bad = false, action = null) {
  $$('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.setAttribute('role', 'status');
  t.innerHTML = `<span>${esc(msg)}</span>`;
  if (action) { const b = document.createElement('button'); b.type = 'button'; b.textContent = action.label; b.onclick = () => { t.remove(); action.run(); }; t.append(b); }
  document.body.append(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), action ? 9000 : 3500);
}
async function copy(text, what = 'Copiado') {
  try { await navigator.clipboard.writeText(text); toast(what); }
  catch { const ta = document.createElement('textarea'); ta.value = text; document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast(what); }
}
const badge = (p, pending) => `<span class="pb${pending ? ' pending' : ''}" style="--c:${esc(p.color || '')}">${esc(p.name)}${pending ? ' · por aprobar' : ''}</span>`;
const badges = (ps = []) => ps.length ? `<span class="pbs">${ps.map(p => badge(p)).join('')}</span>` : '';
const isAdmin = () => S.boot?.role === 'admin';
const P = id => S.boot.programs.find(p => p.id === id);
const stepper = (name, v, min, max) => `<div class="stepper" data-min="${min}" data-max="${max}"><button type="button" data-step="-1" aria-label="Menos">−</button><output>${v}</output><button type="button" data-step="1" aria-label="Más">+</button><input type="hidden" name="${name}" value="${v}"></div>`;
document.addEventListener('click', ev => {
  const b = ev.target.closest('.stepper button'); if (!b) return;
  const s = b.closest('.stepper'), i = $('input', s), o = $('output', s);
  const v = Math.min(+s.dataset.max, Math.max(+s.dataset.min, +i.value + +b.dataset.step)); i.value = v; o.textContent = v;
  i.dispatchEvent(new Event('change', { bubbles: true }));
});
const ICON = {
  hoy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  socios: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.2c3 .2 5 2.3 5 5.3"/></svg>',
  invitar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M19 8v6M16 11h6"/></svg>',
  resumen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  programas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>',
};
function renderNav(active) {
  const items = [['hoy', 'Hoy'], ['socios', 'Socios'], ...(isAdmin() ? [['invitar', 'Invitar']] : []), ['resumen', 'Resumen'], ...(isAdmin() ? [['programas', 'Programas']] : [])];
  const pend = S.hoy ? S.hoy.receipts.length + S.hoy.resend.length + S.hoy.approvals.length : 0;

// ---------- router ----------
async function route() {
  const h = location.hash.replace(/^#/, '') || 'hoy';
  const [view, arg] = h.split('/');
  app.classList.toggle('wide', view === 'programas');
  try {
    if (view === 'hoy') { renderNav('hoy'); await viewHoy(); }
    else if (view === 'socios' || view === 'buscar') { renderNav('socios'); await viewSocios(); }
    else if (view === 'nuevo' && isAdmin()) { renderNav('socios'); await viewNuevo(); }
    else if (view === 'p') { renderNav(S.back.replace('#', '').split('/')[0]); await viewPerson(Number(arg)); }
    else if (view === 'c') { renderNav('socios'); const r = await api('GET', 'card/' + arg); location.replace('#p/' + r.id); }
    else if (view === 'invitar' && isAdmin()) { renderNav('invitar'); await viewInvitar(); }
    else if (view === 'novios' && isAdmin()) { renderNav('invitar'); await viewNovios(); }
    else if (view === 'resumen') { renderNav('resumen'); await viewResumen(); }
    else if (view === 'programas' && isAdmin()) { renderNav('programas'); await viewProgramas(); }
    else location.replace('#hoy');
  } catch (e) { app.innerHTML = `<div class="empty"><b>No se pudo abrir</b>${esc(e.message)}<p><a class="btn" href="#hoy">Volver a Hoy</a></p></div>`; }

}

async function scan() {
  const wrap = document.createElement('div'); wrap.className = 'scan';
  wrap.innerHTML = '<video playsinline muted></video><div class="bar"><button class="btn" type="button">Cancelar</button></div>';
  document.body.append(wrap);
  let stream, stop = false;
  const end = () => { stop = true; stream?.getTracks().forEach(t => t.stop()); wrap.remove(); };
  $('button', wrap).onclick = end;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const v = $('video', wrap); v.srcObject = stream; await v.play();
    const det = new BarcodeDetector({ formats: ['qr_code'] });
    while (!stop) {
      const codes = await det.detect(v).catch(() => []);
      const m = codes.map(c => c.rawValue).join(' ').match(/\/c\/([A-Za-z0-9_-]{20,64})/);
      if (m) { end(); location.hash = '#c/' + m[1]; return; }
      await new Promise(r => setTimeout(r, 250));
    }
  } catch { end(); toast('No se pudo abrir la cámara. Usa la cámara del teléfono o busca por nombre.', true); }
}

function moveWords(x) {
  const n = id => P(id)?.name || id, dt = x.detail || {};

  if (x.action === 'membership.approve') return `${x.actor.split('@')[0]} aprobó ${n(dt.program)}`;
  if (x.action === 'membership.reject') return `${x.actor.split('@')[0]} rechazó ${n(dt.asked)}`;
  if (x.action === 'signup') return `Se registró en ${n(dt.program)}${dt.status === 'pending' ? ' (por aprobar)' : ''}`;
  if (x.action === 'signup.existing') return `Intentó registrarse otra vez (${n(dt.program)})`;
  if (x.action === 'card.newcode') return `${x.actor.split('@')[0]} cambió el código de la tarjeta`;
  if (x.action === 'person.create') return `${x.actor.split('@')[0]} lo agregó a ${n(dt.program)}`;
  if (x.action === 'membership.renew') return `${x.actor.split('@')[0]} renovó ${n(dt.program)} hasta ${dt.to ? dayShort(dt.to) : '—'}`;
  if (x.action === 'membership.expiry') return `${x.actor.split('@')[0]}: vigencia de ${n(dt.program)} ${dt.to ? 'al ' + dayShort(dt.to) : 'sin vencimiento'}`;
  if (x.action === 'payment.void') return `${x.actor.split('@')[0]} anuló un pago de ${money(dt.amount)}`;
  if (x.action === 'guest.update') return 'El socio actualizó sus datos';
  return x.action;
}

function bindPerson(d) {
  const p = d.person;
  const vf = $('#visit');
  if (vf) {
    const restau = d.benefits.find(b => b.applies_to === 'restaurante' && b.kind === 'percent');
    let touched = false;
    const upd = () => {
      for (const c of $$('input[name=b]', vf)) { const q = $(`[data-qty="${c.value}"]`, vf); if (q) q.classList.toggle('hide', !c.checked); }
      const party = +vf.party_size.value, rOn = restau && $(`input[name=b][value="${restau.benefit_id}"]`, vf)?.checked;
      const gw = $('#guestwarn');
      if (gw) { const over = rOn && restau.max_guests != null && party > restau.max_guests + 1; gw.classList.toggle('hide', !over); gw.textContent = over ? `El descuento cubre al socio y hasta ${restau.max_guests} acompañantes (${restau.max_guests + 1} personas). Mesa de ${party}: pide cuenta aparte o aplica solo a su parte.` : ''; }
      const total = num(vf.check_total.value);
      const sug = rOn && total ? Math.round(restau.value * total) / 100 : 0;
      $('#sugg').textContent = sug ? `Sugerido: ${money(sug)} (${restau.value}% de ${money(total)})` : '';
      if (!touched) vf.discount_total.value = sug ? String(sug) : '';
    };
    vf.addEventListener('change', upd); vf.check_total.addEventListener('input', upd);
    vf.discount_total.addEventListener('input', () => { touched = true; });
    upd();
    vf.addEventListener('submit', async ev => {
      ev.preventDefault();
      const benefits = $$('input[name=b]:checked', vf).map(c => ({ benefit_id: c.value, qty: vf['q_' + c.value] ? +vf['q_' + c.value].value : undefined }));
      const btn = $('button[type=submit]', vf); btn.disabled = true;
      try {
        const r = await api('POST', `person/${p.id}/visit`, { party_size: +vf.party_size.value, benefits, parrot_check: vf.parrot_check.value, check_total: num(vf.check_total.value), discount_total: num(vf.discount_total.value), brought_by: vf.brought_by?.value || null, note: vf.note.value });
        await viewPerson(p.id);
        toast('Visita registrada', false, { label: 'Deshacer', run: () => undo(r.id) });
      } catch (e) { toast(e.message, true); btn.disabled = false; }
    });
  }
  const af = $('#ann');
  af?.addEventListener('submit', async ev => { ev.preventDefault(); try { await api('POST', `person/${p.id}/announce`, { day: af.day.value, time: af.time.value, party_size: +af.party_size.value, reservation_name: af.reservation_name.value }); toast('Aviso guardado: sale en Hoy'); viewPerson(p.id); } catch (e) { toast(e.message, true); } });
  const bf = $('#buy');
  bf?.addEventListener('submit', async ev => { ev.preventDefault(); try { await api('POST', `person/${p.id}/purchase`, { amount: num(bf.amount.value), day: bf.day.value, channel: bf.channel.value, note: bf.note.value }); toast('Compra sumada'); viewPerson(p.id); } catch (e) { toast(e.message, true); } });
  const mf = $('#move');
  mf?.addEventListener('submit', async ev => { ev.preventDefault(); try { await api('POST', `person/${p.id}/move`, { from_program: mf.from_program.value, to_program: mf.to_program.value, reason: mf.reason.value }); toast('Cambio guardado'); S.boot = await api('GET', 'boot'); viewPerson(p.id); } catch (e) { toast(e.message, true); } });
  const df = $('#pdata');
  df?.addEventListener('submit', async ev => { ev.preventDefault(); try {
    await api('PATCH', `person/${p.id}`, { name: df.name.value, phone: df.phone.value, email: df.email.value, pro_type: df.pro_type.value, wedding_date: df.wedding_date.value, birthday: bdayOf(df), vip: df.vip.checked, status: df.blocked.checked ? 'blocked' : 'active' });
    const fs = personFields(d); if (fs.length) await api('PUT', `person/${p.id}/fields`, { values: readFieldInputs(df, fs) });
    toast('Datos guardados'); viewPerson(p.id); } catch (e) { toast(e.message, true); } });
}
async function undo(id) {
  try { await api('POST', `visit/${id}/undo`); toast('Visita deshecha'); route(); } catch (e) { toast(e.message, true); }
}

function valInput(b, c, cls = '') {
  if (b.kind === 'yes_no') return '';
  if (b.kind === 'text') return `<input class="v t ${cls}" data-f="text_value" value="${esc(c.text_value)}" title="${esc(c.text_value)}" placeholder="Ej. Cata vertical" aria-label="${esc(b.name)}">`;
  return `<input class="v ${cls}" data-f="value" inputmode="decimal" value="${c.value ?? ''}" placeholder="${b.kind === 'percent' ? '%' : b.kind === 'amount' ? '$' : '—'}" aria-label="${esc(b.name)} (${kindWords[b.kind]})">`;
}
function gridCell(p, b) {
  const c = cellOf(p.id, b.id);
  const meta = c.enabled ? `${!c.confirmed ? '<span class="pc"></span> por confirmar' : '✓ confirmado'}${c.max_guests != null ? ' · +' + c.max_guests : ''}${c.note ? ' · nota' : ''}` : 'opciones';
  return `<td style="--c:${esc(p.color)}" class="${c.enabled ? 'on' : ''}" data-p="${p.id}" data-b="${b.id}"><div class="c"><input type="checkbox" data-f="enabled"${c.enabled ? ' checked' : ''} aria-label="${esc(p.name)}: ${esc(b.name)}">${valInput(b, c)}</div>
    <button class="x" data-act="celldlg" title="Acompañantes, nota, confirmar">${meta}</button></td>`;
}
function listCell(p, b) {
  const c = cellOf(p.id, b.id);
  return `<div class="cellrow" data-p="${p.id}" data-b="${b.id}"><div class="line"><label class="switch"><input type="checkbox" data-f="enabled"${c.enabled ? ' checked' : ''}> ${esc(b.name)}</label>${b.kind !== 'text' ? valInput(b, c, 'val') : ''}</div>
    ${b.kind === 'text' ? valInput(b, c, 'val text') : ''}
    ${c.enabled ? `<div class="pbs" style="margin-top:4px">${c.confirmed ? '<span class="chip ok">confirmado</span>' : '<span class="chip conf">por confirmar</span>'}${c.max_guests != null ? `<span class="chip">hasta ${c.max_guests} acompañantes</span>` : ''}${c.note ? `<span class="chip">${esc(c.note)}</span>` : ''}</div>` : ''}
    ${c.enabled ? '<button class="btn sm" style="margin-top:6px" data-act="celldlg">Detalles y confirmar</button>' : ''}</div>`;
}
async function saveCell(pid, bid, patch) {
  try {
    const r = await api('PUT', 'cell', { program_id: pid, benefit_id: bid, ...patch });
    const i = S.boot.cells.findIndex(c => c.program_id === pid && c.benefit_id === bid);
    if (i >= 0) S.boot.cells[i] = { ...S.boot.cells[i], ...r.cell }; else S.boot.cells.push(r.cell);
    toast('Guardado'); return true;
  } catch (e) { toast(e.message, true); return false; }
}
function bindProgramas() {
  app.addEventListener('change', onCellChange);
  const np = $('#np');
  np.onsubmit = async ev => { ev.preventDefault(); try { const r = await api('POST', 'programs', { name: np.name.value, kind: np.kind.value, color: np.color.value, threshold_mxn: np.threshold_mxn.value, is_pro: np.is_pro.checked, requires_approval: np.requires_approval.checked, duration_months: +np.duration_months.value, fee_mxn: num(np.fee_mxn.value) }); S.progSel = r.id; toast('Programa creado'); viewProgramas(); } catch (e) { toast(e.message, true); } };
  const nb = $('#nb');
  nb.onsubmit = async ev => { ev.preventDefault(); try { await api('POST', 'benefits', { name: nb.name.value, kind: nb.kind.value, applies_to: nb.applies_to.value, rules: nb.rules.value }); toast('Beneficio creado'); viewProgramas(); } catch (e) { toast(e.message, true); } };
  const cf = $('#cfg');
  cf.onsubmit = async ev => { ev.preventDefault(); try { await api('PUT', 'config', { milestone_every: cf.milestone_every.value }); toast('Guardado'); } catch (e) { toast(e.message, true); } };
}
async function onCellChange(ev) {
  const el = ev.target, holder = el.closest('[data-p][data-b]');
  if (!holder || !el.dataset.f || location.hash !== '#programas') return;
  const f = el.dataset.f, v = f === 'enabled' ? el.checked : el.value;
  const patch = { [f]: f === 'value' ? (v === '' ? null : num(v)) : v };
  if (f !== 'enabled' && !cellOf(holder.dataset.p, holder.dataset.b).enabled && v !== '') patch.enabled = true;
  if (await saveCell(holder.dataset.p, holder.dataset.b, patch)) {
    const p = P(holder.dataset.p), b = S.boot.benefits.find(x => x.id === holder.dataset.b);
    const tmp = document.createElement('tbody'); tmp.innerHTML = desk.matches ? `<tr>${gridCell(p, b)}</tr>` : listCell(p, b);
    holder.replaceWith(desk.matches ? tmp.querySelector('td') : tmp.firstElementChild);
  }
}

document.addEventListener('click', async ev => {
  const a = ev.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, id = Number(a.dataset.id) || a.dataset.id;
  try {
    if (act === 'close') return closeDlg();
    if (act === 'shift') return copy(shiftText(), 'Copiado: pégalo en el grupo del turno');
    if (act === 'otnote') return copy(a.dataset.text, 'Nota para OpenTable copiada');
    if (act === 'copy') return copy(a.dataset.text, 'Enlace copiado');
    if (act === 'copycard') return copy(a.dataset.text, 'Mensaje copiado');
    if (act === 'scan') return scan();
    if (act === 'clearf') { S.soc = null; return viewSocios(); }
    if (act === 'renew') return renewDialog(Number(a.dataset.ms));
    if (act === 'newfield') return fieldDialog(null);
    if (act === 'editfield') return fieldDialog(Number(a.dataset.id));
    if (act === 'archivefield') { const f = S.boot.fields.find(x => x.id === Number(a.dataset.id)); await api('PATCH', 'fields/' + f.id, { archived: !f.archived }); closeDlg(); S.openFields = true; return viewProgramas(); }
    if (act === 'gofilter') { S.soc = { estado: a.dataset.estado, programa: '', orden: 'vence', q: '' }; return; }
    if (act === 'expiry') return expiryDialog(Number(a.dataset.ms));
    if (act === 'payment') return paymentDialog();
    if (act === 'voidpay') { if (!confirm('¿Anular este pago? Queda registrado como anulado.')) return; const r = await api('POST', `payment/${id}/void`); toast(r.note || 'Pago anulado', !!r.note); return viewPerson(S.person.person.id); }
    if (act === 'sent') { api('POST', `person/${a.dataset.pid}/sent`).then(() => { if (a.dataset.reload || location.hash === '#hoy' || location.hash === '') setTimeout(route, 600); }).catch(() => {}); return; }
    if (act === 'undo') return undo(id);
    if (act === 'approve' || act === 'reject') { const prog = $(`[data-appr-prog="${id}"]`)?.value; await api('POST', `membership/${id}/decide`, { approve: act === 'approve', program_id: prog }); toast(act === 'approve' ? 'Aprobado: ya tiene sus beneficios' : 'Rechazada'); return viewHoy(); }
    if (act === 'receipt') return receiptDialog(id);
    if (act === 'rejreceipt') { await api('POST', `purchase/${id}/decide`, { approve: false, reason: $('#rd')?.reason.value }); closeDlg(); toast('Compra rechazada'); return viewHoy(); }
    if (act === 'reqdone') { await api('POST', `request/${id}/done`); return viewHoy(); }
    if (act === 'note') {
      const p = S.person.person;
      $('#noteBox').innerHTML = `<b>Nota del equipo</b><form class="f" id="nf" style="gap:8px"><textarea name="n" rows="3" maxlength="1000">${esc(p.staff_note)}</textarea><div class="acts"><button class="btn primary" type="submit">Guardar nota</button><button class="btn" type="button" data-act="cancelnote">Cancelar</button></div></form>`;
      const f = $('#nf'); f.n.focus();
      f.onsubmit = async e => { e.preventDefault(); try { await api('PATCH', 'person/' + p.id, { staff_note: f.n.value }); toast('Nota guardada'); viewPerson(p.id); } catch (x) { toast(x.message, true); } };
      return;
    }
    if (act === 'cancelnote') return viewPerson(S.person.person.id);
    if (act === 'newcode') { if (!confirm('¿Cambiar el código? El enlace anterior deja de funcionar y hay que mandarle la tarjeta nueva.')) return; await api('POST', `person/${S.person.person.id}/newcode`); toast('Código cambiado: manda la tarjeta nueva'); return viewPerson(S.person.person.id); }
    if (act === 'revoke') { if (!confirm('¿Cancelar esta invitación? El enlace deja de funcionar; quienes ya se registraron se quedan.')) return; await api('POST', `invites/${id}/revoke`); S.lastInvite = null; return viewInvitar(); }
    if (act === 'nextinv') { S.lastInvite = null; await viewInvitar(); $('#inv').name.focus(); return; }
    if (act === 'nvprev') { const r = await api('POST', 'novios', { text: $('#nv').text.value, preview: true }); $('#nvprev').innerHTML = `<p class="hint">${r.rows.length} parejas listas${r.errors.length ? ':' : '.'}</p>${r.errors.map(e => `<p class="hint" style="color:var(--bad)">${esc(e)}</p>`).join('')}${r.rows.slice(0, 30).map(x => `<div class="r"><div class="main"><span class="t">${esc(x.name)}</span><span class="s">${esc(x.phone ? '+' + x.phone : '')} ${esc(x.email)} ${x.wedding ? '· boda ' + dayShort(x.wedding) : ''}</span></div></div>`).join('')}`; return; }
    if (act === 'pick') { S.progSel = a.dataset.id; return viewProgramas(); }
    if (act === 'celldlg') { const h = a.closest('[data-p][data-b]'); return cellDialog(h.dataset.p, h.dataset.b); }
    if (act === 'editprog') return progDialog(a.dataset.id);
    if (act === 'editben') return benDialog(a.dataset.id);
    if (act === 'archive') { const p = P(a.dataset.id); if (!p.archived && !confirm(`¿Archivar ${p.name}?`)) return; await api('PATCH', 'programs/' + p.id, { archived: !p.archived }); closeDlg(); return viewProgramas(); }
    if (act === 'archiveben') { const b = S.boot.benefits.find(x => x.id === a.dataset.id); await api('PATCH', 'benefits/' + b.id, { archived: !b.archived }); closeDlg(); return viewProgramas(); }
    if (act === 'confirmall') { const cs = S.boot.cells.filter(c => c.program_id === a.dataset.id && c.enabled && !c.confirmed); for (const c of cs) await api('PUT', 'cell', { program_id: c.program_id, benefit_id: c.benefit_id, confirmed: true }); closeDlg(); toast(`${cs.length} confirmados`); return viewProgramas(); }
    if (act === 'sync') { a.disabled = true; const r = await api('POST', 'sync'); toast(r.skipped ? r.message : `Listo: ${r.members} socios, ${r.created} nuevos`); return viewProgramas(); }
    if (act === 'audit') { const r = await api('GET', 'audit'); $('#audit').innerHTML = r.audit.map(x => `<div class="r"><div class="main"><span class="t">${esc(x.action)} · ${esc(x.entity_id)}</span><span class="s">${when(x.at)} · ${esc(x.actor)}</span></div></div>`).join('') || '<p class="hint">Sin cambios.</p>'; return; }
  } catch (e) { toast(e.message, true); }
});

(async () => {
  try { S.boot = await api('GET', 'boot'); }
  catch (e) { app.innerHTML = `<div class="empty"><b>No se pudo cargar el club</b>${esc(e.message)}</div>`; return; }
  route();
})();
</script>
</body>
</html>
