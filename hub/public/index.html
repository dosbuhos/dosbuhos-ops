<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dos Búhos · Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Lato:wght@300;400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css?app=hub"><link rel="stylesheet" href="/kit/kit.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#0a0a0a">
<style>
/* Home in the look of the Dos Búhos card: black page, the script logo, app names in Cormorant, one quiet line under each.
   A row is a door: tapping it opens the app. The page is dark on purpose and does not follow the theme. */
:root,:root[data-theme="dark"]{--bg:#0a0a0a;--paper:#0a0a0a;--paper-2:#151412;--ink:#f5f0e8;--muted:#8f8778;--rule:#2b2620;--accent:#c8b090;--gold:#c8b090;color-scheme:dark}
html,body{background:#0a0a0a;color:var(--ink)}
.topbar{background:rgba(10,10,10,.88);border-bottom-color:var(--rule)}
.topbar .wordmark{display:none}
.topbar .who,.topbar nav a{color:var(--muted);font:300 12px Lato,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase}
.topbar nav a:hover{color:var(--ink);background:none}
.wrap{max-width:1040px;padding-top:0}
.hero{text-align:center;padding:38px 0 26px}
.hero img.script{width:min(250px,62vw);height:auto;filter:invert(1) brightness(1.6)}
.hero .hola{font:italic 400 22px/1.3 "Cormorant Garamond",Georgia,serif;color:var(--gold);margin:16px 0 6px}
.hero .date{font:400 11px Lato,system-ui,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.find{display:block;position:relative;max-width:520px;margin:0 auto 40px}
.find input{width:100%;background:none;border:0;border-bottom:1px solid var(--rule);border-radius:0;color:var(--ink);font:300 16px Lato,system-ui,sans-serif;letter-spacing:.04em;padding:12px 34px 12px 2px;min-height:48px;text-align:center}
.find input::placeholder{color:var(--muted);letter-spacing:.24em;text-transform:uppercase;font-size:12px}
.find input:focus{outline:0;border-bottom-color:var(--gold)}
.find input::-webkit-search-cancel-button{display:none}
.find .clear{position:absolute;right:0;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer}
.area{margin:0 0 30px;break-inside:avoid}
.area-h{font:400 11px Lato,system-ui,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin:0;padding:0 0 12px;border-bottom:1px solid var(--rule)}
.row{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 14px;padding:19px 0;border-bottom:1px solid var(--rule);color:var(--ink);text-decoration:none;-webkit-tap-highlight-color:transparent}
.row .nm{font:500 26px/1.12 "Cormorant Garamond",Georgia,serif;letter-spacing:.01em}
.row .ds{grid-column:1;font:300 14.5px/1.4 Lato,system-ui,sans-serif;color:var(--muted)}
.row .go{grid-row:1 / span 2;grid-column:2;display:flex;align-items:center;gap:4px;color:var(--muted)}
.row .go svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;transition:transform .16s ease}
.row:hover .nm,.row:focus-visible .nm{color:#fff}.row:hover .go svg{transform:translateX(5px);color:var(--gold)}
.row:focus-visible{outline:1px solid var(--gold);outline-offset:4px}
.row .pin{position:relative;z-index:2;width:40px;height:40px;display:grid;place-items:center;border:0;background:none;color:var(--rule);cursor:pointer}
.row .pin svg{width:15px;height:15px}.row .pin:hover{color:var(--muted)}.row .pin[aria-pressed="true"]{color:var(--gold)}
.row.first .nm{color:#fff}.row.first::after{content:"Enter";position:absolute;right:76px;top:50%;transform:translateY(-50%);font:400 10px Lato,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
@media (max-width:719px){.row.first::after{display:none}.hero{padding:26px 0 20px}}
@media (min-width:860px){.areas{columns:2;column-gap:64px}.mine .rows{display:grid;grid-template-columns:1fr 1fr;column-gap:64px}}
.soon{margin:8px 0 0;color:var(--muted);font:300 13.5px Lato,system-ui,sans-serif}
.soon summary{cursor:pointer;min-height:44px;display:flex;align-items:center;letter-spacing:.2em;text-transform:uppercase;font-size:11px}
.soon ul{margin:0 0 8px;padding:0;list-style:none;display:grid;gap:8px}.soon li b{color:var(--ink);font:500 18px "Cormorant Garamond",Georgia,serif}
.foot{text-align:center;padding:46px 0 30px;color:var(--muted)}
.foot img{width:44px;height:auto;opacity:.8}
.foot .l1{font:400 11px Lato,sans-serif;letter-spacing:.34em;text-transform:uppercase;margin:18px 0 8px}
.foot .l2{font:italic 400 18px "Cormorant Garamond",Georgia,serif;color:var(--gold)}
.empty{border-color:var(--rule);color:var(--muted)}.empty b{color:var(--ink)}.noresults{text-align:center}
.offline{background:#2a2113;color:#e8c066}
.skelrow{display:grid;gap:18px}.skelrow i{display:block;height:54px;border-bottom:1px solid var(--rule);opacity:.5}
@media (prefers-reduced-motion:reduce){.row .go svg{transition:none}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <a class="wordmark" href="/" aria-label="Dos Búhos, inicio"><img class="wordmark-img" src="/logo-word.png" alt="dos búhos" width="730" height="160"></a>
  <span class="spacer"></span>
  <span class="who" id="who"></span>
  <nav id="nav"></nav>
</div></header>

<main class="wrap">
  <div class="hero"><img class="script" src="/logo-word.png" alt="dos búhos" width="730" height="160"><p class="hola" id="hello">Hola</p><div class="date" id="date"></div></div>
  <label class="find"><input id="q" type="search" placeholder="Buscar una app" autocomplete="off" enterkeyhint="go" aria-label="Buscar una app"><button class="clear" id="clear" type="button" aria-label="Borrar búsqueda" hidden>×</button></label>
  <div id="offline" class="offline" hidden>Sin señal. Lo que ya abriste sigue funcionando; las demás apps abren cuando regrese la señal.</div>
  <div id="home"><div class="skelrow"><i></i><i></i><i></i><i></i></div></div>
  <div class="foot"><img src="/logo-monogram.png" alt="" width="120" height="153"><div class="l1">Dos Búhos · San Miguel de Allende</div><div class="l2">Mejores vinos para un mejor mundo</div></div>
</main>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fold = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const ROLE = { admin: 'Administra', editor: 'Puede editar', viewer: 'Solo ver' };
const LATER = { soon: 'Próximamente', import: 'Próximamente' };
const DEMO = new URLSearchParams(location.search).has('demo');
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z" fill="FILL" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>';
// Per-person, per-browser conveniences. Nothing depends on them.
let me, data, store = { recents: [], favs: [] };
const KEY = () => 'hub:' + me.email;
function load() { try { store = Object.assign(store, JSON.parse(localStorage.getItem(KEY()) || '{}')); } catch {} }
function save() { try { localStorage.setItem(KEY(), JSON.stringify(store)); } catch {} }

addEventListener('offline', () => $('#offline').hidden = false);
addEventListener('online', () => $('#offline').hidden = true);
if (!navigator.onLine) $('#offline').hidden = false;

(async () => {
  try {
    const [m, h] = await Promise.all([fetch('/api/me'), fetch('/api/home')]);
    if (m.status === 401) { location.href = '/?next=/'; return; }
    me = await m.json(); data = await h.json();
  } catch {
    $('#home').innerHTML = '<div class="empty"><b>No se pudo cargar</b>Revisa la señal y vuelve a abrir la página.</div>'; return;
  }
  load();
  $('#who').textContent = me.name || me.email;
  $('#nav').innerHTML = (me.admin ? '<a href="/admin/">Administrar</a>' : '') + '<a href="/auth/salir">Salir</a>';
  const first = (me.name || '').trim().split(/\s+/)[0] || me.email.split('@')[0];
  const hr = new Date().getHours();
  $('#hello').textContent = `${hr < 12 ? 'Buenos días' : hr < 19 ? 'Buenas tardes' : 'Buenas noches'}, ${first}`;
  $('#date').textContent = new Date().toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });
  if (DEMO) addDemoStats(data.apps);
  render();
})();

const q = $('#q');
q.addEventListener('input', () => { $('#clear').hidden = !q.value; render(); });
$('#clear').onclick = () => { q.value = ''; $('#clear').hidden = true; render(); q.focus(); };
q.addEventListener('keydown', e => { if (e.key === 'Enter') { const a = $('#home a[data-slug]'); if (a) a.click(); } if (e.key === 'Escape') { $('#clear').onclick(); q.blur(); } });
// Typing anywhere starts a search, like a launcher.
addEventListener('keydown', e => { if (e.target.closest('input,textarea,select') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/' || (e.key.length === 1 && /[\p{L}\p{N}]/u.test(e.key))) { q.focus(); if (e.key === '/') e.preventDefault(); } });

const sectionName = slug => (data.sections.find(s => s.slug === slug) || {}).name || '';
const ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>';
// One row per app: its name, one line on what it is for, and an arrow. The star pins it under "Mis apps".
function row(a, first) {
  const fav = store.favs.includes(a.slug), rol = !me.admin && a.role ? ' · ' + ROLE[a.role] : '';
  return `<a class="row${first ? ' first' : ''}" href="${esc(a.href)}" target="_blank" rel="noopener" data-slug="${esc(a.slug)}"><span class="nm">${esc(a.name)}</span><span class="ds">${esc(a.description)}${esc(rol)}</span>
    <span class="go"><button class="pin" type="button" data-fav="${esc(a.slug)}" aria-pressed="${fav}" aria-label="${fav ? 'Quitar de mis apps' : 'Poner en mis apps'}" title="${fav ? 'Quitar de mis apps' : 'Poner en mis apps'}">${STAR.replace('FILL', fav ? 'currentColor' : 'none')}</button>${ARROW}</span></a>`;
}

function render() {
  const usable = data.apps.filter(a => a.href);
  const term = fold(q.value.trim());
  if (term) return renderSearch(usable, term);
  const bySlug = Object.fromEntries(data.apps.map(a => [a.slug, a]));
  const favs = store.favs.map(s => bySlug[s]).filter(a => a && a.href);
  const recents = store.recents.map(s => bySlug[s]).filter(a => a && a.href).slice(0, 4);
  const sections = data.sections.filter(s => usable.some(a => a.section === s.slug));
  const later = data.apps.filter(a => !a.href);
  let html = '';
  if (!usable.length) {
    html = '<div class="empty"><b>Todavía no tienes apps</b>Pide a Eric que te dé acceso; aparecerán aquí.</div>';
  } else {
    const mine = favs.length ? favs : usable.length > 6 ? recents : [];
    if (mine.length) html += `<section class="area mine"><h2 class="area-h">${favs.length ? 'Mis apps' : 'Abiertas hace poco'}</h2><div class="rows">${mine.map(a => row(a)).join('')}</div></section>`;
    html += `<div class="areas">${sections.map(s => `<section class="area" id="s-${esc(s.slug)}"><h2 class="area-h">${esc(s.name)}</h2>${usable.filter(a => a.section === s.slug).map(a => row(a)).join('')}</section>`).join('')}</div>`;
    if (later.length) html += `<details class="soon"><summary>${later.length} ${later.length === 1 ? 'app en camino' : 'apps en camino'}</summary><ul>${later.map(a => `<li><b>${esc(a.name)}</b><br>${esc(a.description)}</li>`).join('')}</ul></details>`;
  }
  $('#home').innerHTML = html;
  wire();
}

function renderSearch(usable, term) {
  const hits = usable.map(a => ({ a, score: match(a, term) })).filter(x => x.score > 0).sort((x, y) => y.score - x.score).map(x => x.a);
  $('#home').innerHTML = hits.length
    ? `<section class="area">${hits.map((a, i) => row(a, i === 0)).join('')}</section>`
    : `<p class="noresults">No hay una app que se llame <b>${esc(q.value)}</b>. Prueba con otra palabra, como “bodega”, “huerto” o “ventas”.</p>`;
  wire();
}

// Forgiving match: accents ignored, words in any order, one typo allowed in words of 4+ letters.
function match(a, term) {
  const name = fold(a.name), hay = fold(`${a.name} ${a.description} ${a.section} ${a.slug}`);
  if (name.startsWith(term)) return 4;
  if (name.includes(term)) return 3;
  const words = term.split(/\s+/), pool = hay.split(/[^a-z0-9ñ]+/).filter(Boolean);
  if (words.every(w => hay.includes(w))) return 2;
  if (words.every(w => w.length >= 4 && pool.some(p => near(p, w) || near(p.slice(0, w.length), w)))) return 1;
  return 0;
}
// Optimal string alignment distance ≤ 1: one wrong, missing, extra or swapped letter.
function near(a, b) {
  if (Math.abs(a.length - b.length) > 1) return false;
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) {
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
  }
  return d[a.length][b.length] <= 1;
}

function wire() {
  for (const a of document.querySelectorAll('a[data-slug]')) a.addEventListener('click', (ev) => {
    const pin = ev.target.closest('[data-fav]');
    if (pin) { ev.preventDefault(); const s = pin.dataset.fav; store.favs = store.favs.includes(s) ? store.favs.filter(x => x !== s) : [...store.favs, s]; save(); render(); return; }
    const s = a.dataset.slug; store.recents = [s, ...store.recents.filter(x => x !== s)].slice(0, 8); save();
  });
}

function addDemoStats(apps) {
  const S = { cellar: { value: '7 abiertas' }, huerto: { value: '14 kg' }, mantenimiento: { value: '5 pendientes' }, wineclub: { value: '3 hoy' } };
  for (const a of apps) if (S[a.slug]) a.stat = S[a.slug];
}
</script>
</body>
</html>
