<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dos Búhos · Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/kit/kit.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#141719" media="(prefers-color-scheme: dark)">
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <a class="wordmark" href="/" aria-label="Dos Búhos"><img class="wordmark-img" src="/logo-word.png" alt="dos búhos" width="730" height="160"></a>
  <span class="spacer"></span>
  <span class="who" id="who"></span>
  <nav id="nav"></nav>
</div></header>

<main class="wrap">
  <div class="hello"><h1 id="hello">Hola</h1><span class="date" id="date"></span></div>
  <div id="home" class="stack"></div>
</main>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const STATUS = { soon: 'Próximamente', import: 'Por importar' };
const first = n => (n || '').trim().split(/\s+/)[0] || '';

(async () => {
  const [me, home] = await Promise.all([fetch('/api/me').then(r => r.ok ? r.json() : null), fetch('/api/home').then(r => r.ok ? r.json() : null)]);
  if (!me) { location.href = '/?next=' + encodeURIComponent(location.pathname); return; }
  $('#who').textContent = me.name || me.email;
  $('#nav').innerHTML = (me.admin ? '<a href="/admin/">Administrar</a>' : '') + '<a href="/auth/salir">Salir</a>';
  $('#hello').textContent = `Hola, ${esc(first(me.name) || me.email.split('@')[0])}`;
  $('#date').textContent = new Date().toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });

  const bySection = new Map();
  for (const a of home.apps) { if (!bySection.has(a.section)) bySection.set(a.section, []); bySection.get(a.section).push(a); }
  const sections = home.sections.filter(s => bySection.has(s.slug));
  if (!sections.length) { $('#home').innerHTML = '<div class="empty"><b>Todavía no tienes aplicaciones</b>Pide a Eric que te dé acceso.</div>'; return; }
  $('#home').innerHTML = sections.map(s => {
    const apps = bySection.get(s.slug);
    const live = apps.filter(a => a.href).length;
    return `<section class="section k-${esc(s.slug)}">
      <div class="section-head"><h2>${esc(s.name)}</h2><span class="count">${live}/${apps.length}</span></div>
      <div class="grid">${apps.map(card).join('')}</div>
    </section>`;
  }).join('');
})();

function card(a) {
  const cls = `card k-${esc(a.section)}` + (a.status === 'soon' ? ' is-soon' : a.status === 'import' ? ' is-import' : '');
  const foot = STATUS[a.status] ? `<span class="chip">${STATUS[a.status]}</span>` : (a.mode === 'link' && a.href ? `<span class="ext" title="Abre en su propia dirección">↗</span>` : '');
  const inner = `<div class="card-name">${esc(a.name)}</div><div class="card-desc">${esc(a.description)}</div><div class="card-foot">${foot}</div>`;
  return a.href ? `<a class="${cls}" href="${esc(a.href)}">${inner}</a>` : `<div class="${cls}" aria-disabled="true">${inner}</div>`;
}
</script>
</body>
</html>
