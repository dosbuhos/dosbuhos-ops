<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dos Búhos · Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Cormorant+Garamond:wght@500;600&family=Lato:wght@300;400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css?app=hub"><link rel="stylesheet" href="/kit/kit.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#141719" media="(prefers-color-scheme: dark)">
<style>
/* Home = an app launcher, the way business suites do it (Odoo, Okta, Google Workspace): one icon and one label per app in a
   dense grid, the person's own picks on top, search that opens on Enter. The icons carry the Dos Búhos business-card
   look: black stock, warm-gold line art. Their colours are fixed and do not follow the theme. */
.wrap{max-width:800px}
.home-top{display:flex;flex-direction:column;gap:14px;margin:6px 0 22px}
.home-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0}
.home-head h1{font-size:30px;margin:0}
.home-top .search{margin:0;max-width:none}
.home-top .search input{min-height:52px;border-radius:14px;font-size:16px}
.home-top .search input::-webkit-search-cancel-button{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ap .ico,:root:not([data-theme="light"]) .res .ico{border-color:#4a4135;background:linear-gradient(160deg,#26221d 0,#0d0c0b 60%)}}
:root[data-theme="dark"] .ap .ico,:root[data-theme="dark"] .res .ico{border-color:#4a4135;background:linear-gradient(160deg,#26221d 0,#0d0c0b 60%)}
.home-top .search kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);font:500 11px var(--f-mono,monospace);color:var(--muted);border:1px solid var(--rule);border-radius:5px;padding:2px 6px;pointer-events:none}
@media (max-width:719px){.home-top .search kbd{display:none}.home-head h1{font-size:26px}}
@media (min-width:720px){.home-top{margin:26px 0 28px}}

.grp{margin:0 0 26px;scroll-margin-top:90px}
.grp-h{display:flex;align-items:center;gap:10px;margin:0 0 12px;font:600 11px/1 var(--f-body,system-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.grp-h::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--k,var(--muted));flex:none}
.grp-h::after{content:"";flex:1;height:1px;background:var(--rule)}
.grp-h button{order:3;border:0;background:none;color:var(--accent);font:600 12px var(--f-body,system-ui);letter-spacing:.02em;text-transform:none;min-height:36px;padding:0 4px;cursor:pointer}
.aps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 4px}
@media (min-width:360px){.aps{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:720px){.aps{display:flex;flex-wrap:wrap;gap:20px 6px}.ap{width:108px}}
.ap{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 2px;text-decoration:none;color:var(--ink);border-radius:14px;-webkit-tap-highlight-color:transparent}
.ap .ico{position:relative;width:60px;height:60px;border-radius:16px;background:linear-gradient(160deg,#1c1a17 0,#0a0a0a 55%);color:#c8b090;display:grid;place-items:center;border:1px solid #2b2620;
  box-shadow:0 8px 16px -10px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.07);transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease}
.ap .ico svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.ap .ico .ini{font:500 22px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.06em;color:#f5f0e8}
.ap .lbl{font-size:11.5px;line-height:1.25;font-weight:500;text-align:center;max-width:100%;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance;overflow-wrap:break-word;letter-spacing:-.005em}
.ap .num{font:500 11px/1 var(--f-mono,monospace);color:var(--muted);margin-top:-3px}
.ap:hover .ico{transform:translateY(-3px);border-color:#c8b090;box-shadow:0 14px 22px -12px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.1)}
.ap:active .ico{transform:scale(.94)}
.ap:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.ap .star{position:absolute;top:-2px;right:calc(50% - 38px);width:24px;height:24px;border-radius:50%;display:none;place-items:center;background:var(--paper);border:1px solid var(--rule);color:var(--muted);box-shadow:0 2px 6px rgba(0,0,0,.18)}
.ap .star svg{width:13px;height:13px}
.ap.on .star{color:#a8842f}
@media (min-width:720px){.ap .ico{width:72px;height:72px;border-radius:19px}.ap .ico svg{width:33px;height:33px}.ap .lbl{font-size:13px}.ap .star{right:calc(50% - 45px)}}
/* Arrange mode: a tap pins or unpins instead of opening. */
.editing .ap .star{display:grid}
.editing .ap .ico{animation:jig .9s ease-in-out infinite alternate}
.editing .ap:nth-child(even) .ico{animation-delay:-.45s}
@keyframes jig{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
.editbar{display:none;align-items:center;justify-content:space-between;gap:10px;margin:0 0 18px;padding:10px 14px;border-radius:12px;background:var(--accent-soft,var(--paper-2));font-size:14px}
.editing .editbar{display:flex}
.editbar button{flex:none}

/* The person's own row: favourites, or the apps they opened last. */
.dock{margin:0 0 30px;padding:16px 12px 14px;border-radius:20px;background:var(--paper);border:var(--bw,1px) solid var(--rule);box-shadow:var(--shadow,none)}
.dock .grp-h{margin-bottom:14px}.dock .grp-h::before{display:none}
@media (min-width:720px){.dock{padding:18px 20px 18px}}

/* Desktop: each area is a labelled cluster as wide as its apps, and the clusters flow side by side, so the whole launcher fits one screen. */
@media (min-width:720px){
  .areas{display:flex;flex-wrap:wrap;gap:30px 40px;align-items:flex-start}
  .areas .grp{margin:0;flex:0 1 auto;max-width:100%}
  .areas .grp-h{margin-bottom:14px}.areas .grp-h::after{display:none}
}
.results{display:flex;flex-direction:column;gap:2px}
.res{display:flex;align-items:center;gap:14px;padding:8px 10px;border-radius:14px;text-decoration:none;color:var(--ink)}
.res:hover,.res.first{background:var(--paper)}
.res .ico{width:46px;height:46px;border-radius:12px;flex:none;background:#0a0a0a;color:#c8b090;display:grid;place-items:center;border:1px solid #2b2620}
.res .ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.res .ico .ini{font:500 16px "Cormorant Garamond",Georgia,serif;color:#f5f0e8}
.res b{display:block;font-weight:600;font-size:15px}.res small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.res .go{margin-left:auto;flex:none;font:500 11px var(--f-mono,monospace);color:var(--muted);border:1px solid var(--rule);border-radius:5px;padding:2px 6px;display:none}
.res.first .go{display:block}
@media (max-width:719px){.res .go{display:none!important}}
.soon{margin-top:8px;color:var(--muted);font-size:13.5px}
.soon summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px}
.soon ul{margin:0 0 8px;padding:0 0 0 18px;display:grid;gap:6px}
.soon li b{color:var(--ink);font-weight:500}
.skelrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,112px));gap:22px 14px}
.skelrow i{display:block;width:64px;height:64px;border-radius:17px;margin:0 auto;background:var(--paper-2);animation:skel 1.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.ap .ico{transition:none;animation:none!important}.ap:hover .ico,.ap:active .ico{transform:none}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <a class="wordmark" href="/" aria-label="Dos Búhos, inicio"><img class="wordmark-img" src="/logo-word.png" alt="dos búhos" width="730" height="160"></a>
  <span class="spacer"></span>
  <span class="who" id="who"></span>
  <nav id="nav"></nav>
</div></header>

<main class="wrap">
  <div class="home-top">
    <div class="home-head"><h1 id="hello">Hola</h1><span class="date" id="date"></span></div>
    <label class="search">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13 13l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Buscar una app" autocomplete="off" enterkeyhint="go" aria-label="Buscar una app">
      <kbd id="kbd">/</kbd>
      <button class="clear" id="clear" type="button" aria-label="Borrar búsqueda" hidden>×</button>
    </label>
  </div>
  <div id="offline" class="offline" hidden>Sin señal. Lo que ya abriste sigue funcionando; las demás apps abren cuando regrese la señal.</div>
  <div id="home"><div class="skelrow"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
</main>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fold = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const ROLE = { admin: 'Administra', editor: 'Puede editar', viewer: 'Solo ver' };
const LATER = { soon: 'Próximamente', import: 'Próximamente' };
const DEMO = new URLSearchParams(location.search).has('demo');
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z" fill="FILL" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>';
// One line drawing per app, by slug. An app without one shows its initials.
const ICON = {
  cellar: '<ellipse cx="12" cy="5" rx="6" ry="2"/><ellipse cx="12" cy="19" rx="6" ry="2"/><path d="M6 5c-1.6 4.5-1.6 9.500 0 14M18 5c1.600 4.500 1.600 9.500 0 14M4.900 9.500h14.200M4.900 14.500h14.200"/>',
  barricas: '<ellipse cx="12" cy="5" rx="6" ry="2"/><ellipse cx="12" cy="19" rx="6" ry="2"/><path d="M6 5c-1.600 4.500-1.600 9.500 0 14M18 5c1.600 4.500 1.600 9.500 0 14"/>',
  huerto: '<path d="M12 21v-9M12 12c0-4-3-6-7-6 0 4 3 6 7 6zM12 15.500c0-3 2.500-5 6-5 0 3-2.500 5-6 5z"/>',
  mantenimiento: '<path d="M14.700 6.300a1 1 0 0 0 0 1.400l1.600 1.600a1 1 0 0 0 1.400 0l3.770-3.770a6 6 0 0 1-7.940 7.940l-6.910 6.910a2.120 2.120 0 0 1-3-3l6.910-6.910a6 6 0 0 1 7.940-7.940l-3.760 3.760z"/>',
  ads: '<path d="M3 11l18-5v12L3 14v-3zM11.600 16.800a3 3 0 1 1-5.800-1.600"/>',
  growth: '<path d="M22 7l-8.500 8.500-5-5L2 17M16 7h6v6"/>',
  tarjeta: '<rect x="3" y="3" width="6.500" height="6.500" rx="1"/><rect x="14.500" y="3" width="6.500" height="6.500" rx="1"/><rect x="3" y="14.500" width="6.500" height="6.500" rx="1"/><path d="M14.500 14.500h2.500v2.500M21 14.500v2M14.500 21h2M19.500 19.500H21V21"/>',
  marca: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 15.500l-4.500-4.500L7 20"/>',
  spark: '<path d="M11 4l1.900 5.600 5.600 1.900-5.600 1.900L11 19l-1.900-5.600-5.600-1.900 5.600-1.900zM19 3v4M17 5h4"/>',
  'spark-beta': '<path d="M11 4l1.900 5.600 5.600 1.900-5.600 1.900L11 19l-1.900-5.600-5.600-1.900 5.600-1.900zM19 16v4M17 18h4"/>',
  muestras: '<path d="M10 2h4v4c0 1.500 2 2.500 2 5v9a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-9c0-2.500 2-3.500 2-5zM8 13h8M8 17h8"/>',
  wineclub: '<path d="M8 22h8M12 15v7M7 10h10M12 15a5 5 0 0 0 5-5c0-2-.500-4-2-8H9c-1.500 4-2 6-2 8a5 5 0 0 0 5 5z"/>',
  cotizador: '<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 6.500h6M9 11h.010M12 11h.010M15 11h.010M9 14.500h.010M12 14.500h.010M15 14.500h.010M9 18h6"/>',
  personal: '<circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2M16 3.130a4 4 0 0 1 0 7.750M22 21v-2a4 4 0 0 0-3-3.870"/>',
  biblioteca: '<path d="M4 19.500v-15A2.500 2.500 0 0 1 6.500 2H20v20H6.500a2.500 2.500 0 0 1 0-5H20M9 7h6"/>',
  club: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>',
  personas: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>',
  bitacora: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.010M3 12h.010M3 18h.010"/>',
};
const ico = a => { const p = ICON[a.slug]; if (p) return `<svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
  const w = a.name.replace(/[^\p{L}\p{N} ]/gu, ' ').trim().split(/\s+/).filter(x => x.length > 2 || /^\p{Lu}/u.test(x)); return `<span class="ini">${esc(((w[0] || a.name)[0] + (w[1] ? w[1][0] : '')).toUpperCase())}</span>`; };

// Per-person, per-browser conveniences. Nothing depends on them.
let me, data, editing = false, store = { recents: [], favs: [] };
const KEY = () => 'hub:' + me.email;
function load() { try { store = Object.assign(store, JSON.parse(localStorage.getItem(KEY()) || '{}')); } catch {} }
function save() { try { localStorage.setItem(KEY(), JSON.stringify(store)); } catch {} }

addEventListener('offline', () => $('#offline').hidden = false);
addEventListener('online', () => $('#offline').hidden = true);
if (!navigator.onLine) $('#offline').hidden = false;

(async () => {
  try {
    const [m, h] = await Promise.all([fetch('/api/me'), fetch('/api/home')]);
    if (m.status === 401) { location.href = '/?next=/'; return; }
    me = await m.json(); data = await h.json();
  } catch {
    $('#home').innerHTML = '<div class="empty"><b>No se pudo cargar</b>Revisa la señal y vuelve a abrir la página.</div>'; return;
  }
  load();
  $('#who').textContent = me.name || me.email;
  $('#nav').innerHTML = (me.admin ? '<a href="/admin/">Administrar</a>' : '') + '<a href="/auth/salir">Salir</a>';
  const first = (me.name || '').trim().split(/\s+/)[0] || me.email.split('@')[0];
  const hr = new Date().getHours();
  $('#hello').textContent = `${hr < 12 ? 'Buenos días' : hr < 19 ? 'Buenas tardes' : 'Buenas noches'}, ${first}`;
  $('#date').textContent = new Date().toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });
  if (DEMO) addDemoStats(data.apps);
  render();
})();

const q = $('#q');
q.addEventListener('input', () => { $('#clear').hidden = !q.value; $('#kbd').hidden = !!q.value; render(); });
$('#clear').onclick = () => { q.value = ''; $('#clear').hidden = true; $('#kbd').hidden = false; render(); q.focus(); };
q.addEventListener('keydown', e => { if (e.key === 'Enter') { const a = $('#home a[data-slug]'); if (a) a.click(); } if (e.key === 'Escape') { $('#clear').onclick(); q.blur(); } });
// Typing anywhere starts a search, like a launcher.
addEventListener('keydown', e => { if (e.target.closest('input,textarea,select') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/' || (e.key.length === 1 && /[\p{L}\p{N}]/u.test(e.key))) { q.focus(); if (e.key === '/') e.preventDefault(); } });

const sectionName = slug => (data.sections.find(s => s.slug === slug) || {}).name || '';
function tile(a) {
  const fav = store.favs.includes(a.slug), tip = [a.description, !me.admin && a.role ? ROLE[a.role] : ''].filter(Boolean).join(' · ');
  return `<a class="ap k-${esc(a.section)}${fav ? ' on' : ''}" href="${esc(a.href)}" data-slug="${esc(a.slug)}" title="${esc(tip)}">
    <span class="ico">${ico(a)}</span><span class="star">${STAR.replace('FILL', fav ? 'currentColor' : 'none')}</span>
    <span class="lbl">${esc(a.name)}</span>${a.stat ? `<span class="num">${esc(a.stat.value)}</span>` : ''}</a>`;
}

function render() {
  const usable = data.apps.filter(a => a.href);
  const term = fold(q.value.trim());
  if (term) return renderSearch(usable, term);
  const bySlug = Object.fromEntries(data.apps.map(a => [a.slug, a]));
  const favs = store.favs.map(s => bySlug[s]).filter(a => a && a.href);
  const recents = store.recents.map(s => bySlug[s]).filter(a => a && a.href).slice(0, 6);
  const sections = data.sections.filter(s => usable.some(a => a.section === s.slug));
  const later = data.apps.filter(a => !a.href);
  let html = '';
  if (!usable.length) {
    html = '<div class="empty"><b>Todavía no tienes apps</b>Pide a Eric que te dé acceso; aparecerán aquí.</div>';
  } else {
    const many = usable.length > 6, mine = favs.length ? favs : recents;
    html += `<div class="editbar"><span>Toca una app para ponerla o quitarla de <b>Mis apps</b>.</span><button class="btn sm" type="button" id="done">Listo</button></div>`;
    if (many && (mine.length || editing)) html += `<section class="dock"><h2 class="grp-h">${favs.length || editing ? 'Mis apps' : 'Abiertas hace poco'}${editing ? '' : '<button type="button" id="edit">Organizar</button>'}</h2>
      ${mine.length ? `<div class="aps">${mine.map(tile).join('')}</div>` : '<p class="hint" style="margin:0">Todavía no eliges ninguna.</p>'}</section>`;
    else if (many) html += `<p class="hint" style="margin:-8px 0 18px">¿Usas unas más que otras? <button type="button" id="edit" class="linklike" style="border:0;background:none;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:0">Elige tus apps</button> y quedan arriba.</p>`;
    html += `<div class="areas">${sections.map(s => `<section class="grp k-${esc(s.slug)}" id="s-${esc(s.slug)}"><h2 class="grp-h">${esc(s.name)}</h2>
      <div class="aps">${usable.filter(a => a.section === s.slug).map(tile).join('')}</div></section>`).join('')}</div>`;
    if (later.length) html += `<details class="soon"><summary>${later.length} ${later.length === 1 ? 'app en camino' : 'apps en camino'}</summary><ul>${later.map(a => `<li><b>${esc(a.name)}</b> · ${esc(a.description)}</li>`).join('')}</ul></details>`;
  }
  $('#home').innerHTML = html; $('#home').classList.toggle('editing', editing);
  wire();
}

function renderSearch(usable, term) {
  const hits = usable.map(a => ({ a, score: match(a, term) })).filter(x => x.score > 0).sort((x, y) => y.score - x.score).map(x => x.a);
  $('#home').classList.remove('editing');
  $('#home').innerHTML = hits.length
    ? `<div class="results">${hits.map((a, i) => `<a class="res${i ? '' : ' first'}" href="${esc(a.href)}" data-slug="${esc(a.slug)}"><span class="ico">${ico(a)}</span><span><b>${esc(a.name)}</b><small>${esc(sectionName(a.section))} · ${esc(a.description)}</small></span><span class="go">Enter</span></a>`).join('')}</div>`
    : `<p class="noresults">No hay una app que se llame <b>${esc(q.value)}</b>. Prueba con otra palabra, como “bodega”, “huerto” o “ventas”.</p>`;
  wire();
}

// Forgiving match: accents ignored, words in any order, one typo allowed in words of 4+ letters.
function match(a, term) {
  const name = fold(a.name), hay = fold(`${a.name} ${a.description} ${a.section} ${a.slug}`);
  if (name.startsWith(term)) return 4;
  if (name.includes(term)) return 3;
  const words = term.split(/\s+/), pool = hay.split(/[^a-z0-9ñ]+/).filter(Boolean);
  if (words.every(w => hay.includes(w))) return 2;
  if (words.every(w => w.length >= 4 && pool.some(p => near(p, w) || near(p.slice(0, w.length), w)))) return 1;
  return 0;
}
// Optimal string alignment distance ≤ 1: one wrong, missing, extra or swapped letter.
function near(a, b) {
  if (Math.abs(a.length - b.length) > 1) return false;
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) {
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
  }
  return d[a.length][b.length] <= 1;
}

function wire() {
  for (const a of document.querySelectorAll('a[data-slug]')) a.addEventListener('click', (ev) => {
    const s = a.dataset.slug;
    if (editing) { ev.preventDefault(); store.favs = store.favs.includes(s) ? store.favs.filter(x => x !== s) : [...store.favs, s]; save(); render(); return; }
    store.recents = [s, ...store.recents.filter(x => x !== s)].slice(0, 8); save();
  });
  const e = $('#edit'), d = $('#done');
  if (e) e.onclick = () => { editing = true; render(); };
  if (d) d.onclick = () => { editing = false; render(); };
}

function addDemoStats(apps) {
  const S = { cellar: { value: '7 abiertas' }, huerto: { value: '14 kg' }, mantenimiento: { value: '5 pendientes' }, wineclub: { value: '3 hoy' } };
  for (const a of apps) if (S[a.slug]) a.stat = S[a.slug];
}
