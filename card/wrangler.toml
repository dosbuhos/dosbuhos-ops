name = "card"
main = "src/worker.js"
compatibility_date = "2026-11-01"
workers_dev = true
routes = [{ pattern = "hola.dosbuhos.com", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/media/*"]

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "dosbuhos-media"
