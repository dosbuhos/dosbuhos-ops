name: Growth Terminal checks
on:
  push:
    paths: ['growth/**', '.github/workflows/growth-check.yml']
  pull_request:
    paths: ['growth/**', '.github/workflows/growth-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: growth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
