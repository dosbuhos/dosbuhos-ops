name: Deploy cellar-staging
# Staging only: deploys the `staging` branch as the cellar-staging worker (own D1 + R2, no crons, no Google writes).
# Never touches the production worker or the production database.
on:
  push:
    branches: [staging]
    paths: ['cellar/**', '.github/workflows/deploy-cellar-staging.yml']
  workflow_dispatch:
concurrency: cellar-staging
jobs:
  deploy:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cellar
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 07778dc684a6a792e04de4483539c01e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the Cloudflare token
        run: '[ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Add the repository secret CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions)"; exit 1; }'
      - run: npm ci
      - run: python3 app/build.py
      - run: python3 staging/build_review.py
      - run: npx wrangler d1 migrations apply cellar-staging --env staging --remote
      - run: npx wrangler deploy --env staging
