name: Contemplo TV APK
# Builds the Android TV player. On main it publishes the APK as a GitHub release; the Worker's /tv link points at the
# latest one, so the Google TV can download it with the Downloader app.
on:
  push:
    paths: ['contemplo/android/**', 'contemplo/public/show.*', 'contemplo/public/common.js', 'contemplo/public/style.css', '.github/workflows/contemplo-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contemplo/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - run: ./prepare.sh
      - run: gradle --no-daemon assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk contemplo-tv.apk && ls -la contemplo-tv.apk
      - uses: actions/upload-artifact@v4
        with: { name: contemplo-tv, path: contemplo/android/contemplo-tv.apk }
      - if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: contemplo-tv-${{ github.run_number }}
          name: Contemplo TV 1.0.${{ github.run_number }}
          body: "Reproductor de Contemplo Studio para Google TV. Instalar: ver contemplo/docs/INSTALL.md"
          files: contemplo/android/contemplo-tv.apk
          make_latest: true

  # The real APK on an Android TV emulator against a local Worker: pairing, sync + SHA-256 verify, cloud PLAY, and the
  # LAN show path (PIN, CUE, GO, NEGRO, PAUSA). Screenshots and logcat are attached to the run.
  emulator-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Test clips
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg imagemagick >/dev/null
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=30 -t 8 -c:v libx264 -b:v 3M -pix_fmt yuv420p /tmp/a.mp4
          ffmpeg -loglevel error -f lavfi -i smptehdbars=size=1280x720:rate=30 -f lavfi -i sine=frequency=440 -t 8 -c:v libx264 -b:v 3M -pix_fmt yuv420p -c:a aac -shortest /tmp/b.mp4
      - name: Local Worker
        working-directory: contemplo
        env: { WRANGLER_SEND_METRICS: 'false' }
        run: |
          npm ci
          npx wrangler d1 migrations apply contemplo --local
          nohup npx wrangler dev --var ENVIRONMENT:dev --port 8787 > /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8787/healthz && break; sleep 2; done
      - name: Build APK pointed at the local Worker
        working-directory: contemplo/android
        env: { CONTEMPLO_CLOUD_URL: 'http://10.0.2.2:8787' }
        run: ./prepare.sh && gradle --no-daemon assembleRelease
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096 -skin 1280x720
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: false
          script: bash contemplo/test/android-e2e.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: emulator-e2e, path: contemplo/shots/ }
      - if: always()
        run: tail -40 /tmp/wrangler.log
