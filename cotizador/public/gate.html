<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cotizador · Dos Búhos</title><meta name="theme-color" content="#5c1e33">
<style>body{margin:0;background:#5c1e33;color:#f6f2e7;font-family:Lato,system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}form{width:100%;max-width:320px;text-align:center}img{height:34px;margin-bottom:26px}input{width:100%;box-sizing:border-box;font:inherit;font-size:22px;letter-spacing:.4em;text-align:center;padding:12px;border:1px solid rgba(246,242,231,.5);background:rgba(0,0,0,.15);color:#fff;border-radius:0}button{margin-top:12px;width:100%;background:#f6f2e7;color:#5c1e33;border:0;font:inherit;font-size:11px;letter-spacing:.2em;text-transform:uppercase;padding:12px}.e{font-size:12.5px;margin-top:10px;opacity:.85;min-height:18px}.t{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;opacity:.8;margin-bottom:18px}</style></head>
<body><form onsubmit="return go(event)"><img src="/icons/logo-light.png" alt="Dos Búhos"><div class="t">Cotizador de eventos</div><input id="pin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="current-password"><button>Entrar</button><div class="e" id="e"></div></form>
<script>async function go(e){e.preventDefault();const r=await fetch('/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pin:document.getElementById('pin').value})});if(r.ok)location.replace(location.pathname);else document.getElementById('e').textContent='PIN incorrecto';return false}</script></body></html>
