# Club Dos Búhos — wine club shipment & benefits tracking (staff app).
# Production deploys from `main` via Workers Builds (root: wineclub, command: npx wrangler deploy).
# Staging deploys the same code with: npx wrangler deploy --env staging
name = "wineclub"
main = "src/index.js"
compatibility_date = "2025-02-24"
workers_dev = true
preview_urls = false

# Hourly Stripe sync (safety net; the shipment schedule never depends on it).
[triggers]
crons = ["7 * * * *"]

[vars]
APP_ENV = "production"
# Google sign-in (replaces Cloudflare Access once GOOGLE_CLIENT_ID is set; secret GOOGLE_CLIENT_SECRET in the dashboard).
ALLOWED_EMAILS = "emaycotte@gmail.com,cabosari@dosbuhos.com,michael@dosbuhos.com,sommelier.aguilar@gmail.com"
TIMEZONE = "America/Mexico_City"
ADMIN_EMAILS = "emaycotte@gmail.com,cabosari@dosbuhos.com"
ACCESS_TEAM_DOMAIN = "dosbuhos.cloudflareaccess.com"
# AUD tag of the Cloudflare Access application for wineclub.dos-buhos.workers.dev. Empty = app stays locked.
ACCESS_AUD = "fbaa7a778daf04aeaf22a398a0cbcfc4ee0dca44dddfde844494f8884e717b3c"
# Secrets (set in the dashboard, never here): STRIPE_SECRET_KEY, optional STRIPE_WEBHOOK_SECRET

# Optional assistant (/preguntar). Workers AI by default; set AI_API_URL/AI_MODEL (+ secret AI_API_KEY) for an external OpenAI-compatible model.
[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "wineclub-production"
database_id = "4c77e154-a12c-47c2-992e-43977abffc78"
migrations_dir = "migrations"

# ---------- staging ----------
[env.staging]
name = "wineclub-staging"
workers_dev = true
preview_urls = false

[env.staging.triggers]
crons = ["7 */6 * * *"]

[env.staging.vars]
APP_ENV = "staging"
TIMEZONE = "America/Mexico_City"
ADMIN_EMAILS = "emaycotte@gmail.com,cabosari@dosbuhos.com"
ACCESS_TEAM_DOMAIN = "dosbuhos.cloudflareaccess.com"
ACCESS_AUD = ""

[env.staging.ai]
binding = "AI"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "wineclub-staging"
database_id = "0f458af4-efc3-4a24-b0db-cfbf70530304"
migrations_dir = "migrations"
