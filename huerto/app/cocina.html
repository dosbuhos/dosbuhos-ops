<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Cosecha · Cocina Dos Búhos</title>
<style>
:root{--bg:#f3f1ea;--surface:#fff;--sunk:#ebe8df;--fg:#1f241d;--muted:#5b6157;--faint:#8a8f84;--line:#dcd8cc;--leaf:#2f5d3a;--accent:#2f5d3a;--accent-ink:#fff;--warn:#a8641b;--danger:#a0302a;--r:14px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#151814;--surface:#1e221d;--sunk:#262b25;--fg:#e9ece4;--muted:#aab1a3;--faint:#7d8477;--line:#343a32;--leaf:#7dbb8a;--accent:#7dbb8a;--accent-ink:#11160f}}
:root[data-theme="dark"]{--bg:#151814;--surface:#1e221d;--sunk:#262b25;--fg:#e9ece4;--muted:#aab1a3;--faint:#7d8477;--line:#343a32;--leaf:#7dbb8a;--accent:#7dbb8a;--accent-ink:#11160f}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:16px}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:28px;margin:0}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
label{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted)}
input,select{font:inherit;font-size:17px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:48px;width:100%}
.grid{display:grid;gap:12px}
.two{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:10px}
button{font:inherit;font-weight:700;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);min-height:50px;padding:0 16px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:17px}
.units{display:flex;gap:6px;flex-wrap:wrap}
.units button{min-height:44px;font-weight:600;padding:0 14px}
.units button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row .q{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.row .x{min-height:40px;width:40px;padding:0;color:var(--muted);font-weight:400}
.small{font-size:13px}.muted{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--sunk)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:9}
.err{color:var(--danger);font-weight:600}
</style>
</head>
<body>
<main>
  <div><div class="eyebrow">Huerto Dos Búhos · Cocina</div><h1>¿Qué cosecharon hoy?</h1></div>

  <section class="panel grid" id="pinbox" hidden>
    <p style="margin:0">Escribe el PIN de la cocina para anotar la cosecha.</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN">
    <button class="primary" id="pinok">Entrar</button>
    <p class="err" id="pinerr" hidden>PIN incorrecto.</p>
  </section>

  <section class="panel grid" id="form" hidden>
    <label>Fecha<input id="fecha" type="date"></label>
    <label>¿Qué cosecharon?<input id="cultivo" list="cultivos" placeholder="Ej. lechuga, kale, zanahoria" autocomplete="off"></label>
    <datalist id="cultivos"></datalist>
    <label>Cantidad<input id="cantidad" type="number" inputmode="decimal" step="0.1" min="0" placeholder="0.0"></label>
    <div class="units" id="units" role="group" aria-label="Unidad"></div>
    <label>Cama <span class="small">(si la saben)</span><input id="cama" placeholder="Ej. A3" maxlength="6" autocapitalize="characters"></label>
    <label>Nota <span class="small">(opcional)</span><input id="nota" placeholder="Ej. para el menú del fin de semana" maxlength="200"></label>
    <button class="primary" id="guardar">Anotar</button>
  </section>

  <section class="panel" id="semana" hidden><h2>Esta semana</h2><div class="chips" id="totales"></div></section>
  <section class="panel" id="lista" hidden><h2>Últimos registros</h2><div id="rows"></div></section>
  <p class="small muted" style="margin:0">Pueden borrar un registro de la cocina en los primeros 3 días si se equivocaron.</p>
</main>
<script>
const $ = id => document.getElementById(id);
const KEY = "cocina-pin";
const getPin = () => { try { return localStorage.getItem(KEY) || ""; } catch (e) { return ""; } };
const setPin = p => { try { p ? localStorage.setItem(KEY, p) : localStorage.removeItem(KEY); } catch (e) {} };
let PIN = getPin(), UNIT = "kg", CROPS = [];
const UNITS = [["kg", "kg"], ["manojos", "manojos"], ["piezas", "piezas"]];
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const fmt = iso => { const [y, m, d] = iso.split("-").map(Number); return d + " " + MES[m - 1]; };
const nf = n => (Math.round(n * 10) / 10).toLocaleString("es-MX");
function toast(m){ const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
const name = k => { const c = CROPS.find(x => x.clave === k); return c ? c.nombre : k; };

function drawUnits(){ $("units").innerHTML = UNITS.map(([k, n]) => `<button type="button" data-u="${k}" aria-pressed="${UNIT === k}">${n}</button>`).join(""); $("units").querySelectorAll("button").forEach(b => b.onclick = () => { UNIT = b.dataset.u; drawUnits(); }); }
async function checkPin(p){ const r = await fetch("/api/cocina/pin", {method: "POST", headers: {"x-pin": p}}); const j = await r.json().catch(() => ({})); return j.ok; }
function show(ok){ $("pinbox").hidden = ok; $("form").hidden = !ok; $("lista").hidden = !ok; $("semana").hidden = !ok; }

async function load(){
  try { const r = await fetch("/api/cultivos"); CROPS = (await r.json()).rows || []; $("cultivos").innerHTML = CROPS.map(c => `<option value="${esc(c.nombre)}">`).join(""); } catch (e) {}
  try {
    const r = await fetch("/api/cocina/registros", {cache: "no-store"}); const rows = (await r.json()).rows || [];
    $("rows").innerHTML = rows.slice(0, 30).map(x => `<div class="row"><div><b>${esc(name(x.cultivo))}</b><div class="small muted">${fmt(x.fecha)}${x.cama && x.cama !== "—" ? " · " + esc(x.cama) : ""}${x.quien === "cocina" ? " · cocina" : x.quien ? " · huerto" : ""}${x.nota ? " · " + esc(x.nota) : ""}</div></div><span class="q">${nf(x.cantidad)} ${esc(x.u)}</span>${x.quien === "cocina" ? `<button class="x" data-del="${x.id}" aria-label="Borrar">✕</button>` : "<span></span>"}</div>`).join("") || `<p class="muted small" style="margin:0">Todavía no hay registros.</p>`;
    $("rows").querySelectorAll("[data-del]").forEach(b => b.onclick = () => borrar(b.dataset.del));
    const d = new Date(); const mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay() + 6) % 7)); const start = mon.getFullYear() + "-" + String(mon.getMonth() + 1).padStart(2, "0") + "-" + String(mon.getDate()).padStart(2, "0");
    const tot = {}; rows.filter(x => x.fecha >= start).forEach(x => { const k = name(x.cultivo) + "|" + x.u; tot[k] = (tot[k] || 0) + x.cantidad; });
    $("totales").innerHTML = Object.entries(tot).map(([k, v]) => { const [n, u] = k.split("|"); return `<span class="chip">${esc(n)}: ${nf(v)} ${esc(u)}</span>`; }).join("") || `<span class="muted small">Nada esta semana.</span>`;
  } catch (e) {}
}
async function guardar(){
  const txt = $("cultivo").value.trim(), cant = +$("cantidad").value;
  if (!txt) { $("cultivo").focus(); toast("¿Qué cosecharon?"); return; }
  if (!(cant > 0)) { $("cantidad").focus(); toast("Escribe la cantidad"); return; }
  const hit = CROPS.find(c => c.nombre.toLowerCase() === txt.toLowerCase() || c.clave === txt.toLowerCase());
  const body = {fecha: $("fecha").value || today(), cultivo: hit ? hit.clave : txt, cantidad: cant, u: UNIT, cama: $("cama").value.trim().toUpperCase(), nota: $("nota").value.trim()};
  const b = $("guardar"); b.disabled = true;
  try {
    const r = await fetch("/api/cosechas", {method: "POST", headers: {"content-type": "application/json", "x-pin": PIN}, body: JSON.stringify(body)});
    if (r.status === 401) { setPin(""); PIN = ""; show(false); toast("PIN incorrecto"); return; }
    const j = await r.json(); if (!r.ok) { toast(j.error || "No se pudo guardar"); return; }
    toast("Anotado"); $("cultivo").value = ""; $("cantidad").value = ""; $("nota").value = ""; $("cultivo").focus(); load();
  } catch (e) { toast("Sin conexión. Intenta otra vez."); }
  finally { b.disabled = false; }
}
async function borrar(id){
  const r = await fetch("/api/cocina/borrar", {method: "POST", headers: {"content-type": "application/json", "x-pin": PIN}, body: JSON.stringify({id})});
  const j = await r.json().catch(() => ({})); toast(r.ok ? "Borrado" : (j.error || "No se pudo borrar")); load();
}
$("pinok").onclick = async () => { const p = $("pin").value.trim(); if (p && await checkPin(p)) { PIN = p; setPin(p); $("pinerr").hidden = true; show(true); } else $("pinerr").hidden = false; };
$("pin").onkeydown = e => { if (e.key === "Enter") $("pinok").click(); };
$("guardar").onclick = guardar;
$("fecha").value = today(); drawUnits();
(async () => { show(!!PIN && await checkPin(PIN).catch(() => false)); load(); })();
</script>
</body>
</html>
