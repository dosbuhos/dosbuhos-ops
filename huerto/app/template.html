<title>Huerto Dos Búhos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: cuaderno de campo — barra de vistas arriba, contenido en una columna; el mapa del huerto es la pieza central */
:root{color-scheme:light;
  --bg:#f2f3ec; --surface:#fbfbf7; --sunk:#e8eadf; --fg:#1d261c; --muted:#5d6656; --faint:#646b5c;
  --line:#d3d7c6; --accent:#9e2a3f; --accent-ink:#ffffff; --soil:#8a6a4c; --soil-2:#c9b49a; --leaf:#3e6b35;
  --ok:#2f7a3a; --warn:#8a5200; --danger:#b3261e; --ink-dark:#1d261c; --ink-light:#ffffff; --water:#bcd3e0; --water-ink:#3c6176; --tree:#a9bb8d;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}
/* Siempre en modo claro (también si el teléfono está en modo oscuro). */
:root[data-theme="dark"]{
  --bg:#131813; --surface:#1b211a; --sunk:#232a21; --fg:#e4e9dc; --muted:#a6ae9b; --faint:#9aa290;
  --line:#343d31; --accent:#e06a80; --accent-ink:#1a0d10; --soil:#b8946f; --soil-2:#5c4a38; --leaf:#8cc27c;
  --ok:#6fc07a; --warn:#e3a33c; --danger:#ff8a80; --water:#2c4654; --water-ink:#a9cde0; --tree:#3d4d34;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:18px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px;padding-block:6px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,34px);line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;text-wrap:balance}
h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
.facts{font-size:13px;color:var(--muted);font-family:var(--mono)}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;padding-block:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;scrollbar-width:none}
nav.tabs button{font:inherit;font-size:14px;font-weight:600;border:1px solid transparent;background:none;color:var(--muted);padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="page"]{background:var(--fg);color:var(--bg)}
nav.tabs button:hover:not([aria-current="page"]){border-color:var(--line);color:var(--fg)}
button:focus-visible,select:focus-visible,input:focus-visible,.bed:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.view{display:flex;flex-direction:column;gap:18px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.stepper{display:flex;align-items:center;gap:6px}
.btn{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.icon{padding:7px 11px;min-width:38px}
select,input{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 10px;border-radius:8px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* carga */
.load{display:flex;flex-direction:column;gap:6px;min-width:220px;flex:1}
.meter{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--leaf);border-radius:5px}
.meter.over i{background:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--fg);white-space:nowrap}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
/* tareas */
.days{display:flex;flex-direction:column;gap:14px}
.day h3{display:flex;justify-content:space-between;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.task{display:flex;gap:10px;align-items:flex-start;padding:7px 2px;border-bottom:1px dashed var(--line);cursor:pointer;min-height:44px}
.task:last-child{border-bottom:0}
.task input{margin-top:3px;width:18px;height:18px;accent-color:var(--leaf);flex:none;padding:0}
.task .tx{flex:1;min-width:0}
.task .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.k.semillero{color:color-mix(in srgb,var(--s1) 80%,var(--fg))} .k.prep{color:var(--soil)} .k.siembra{color:var(--leaf)} .k.cuidado{color:var(--warn)} .k.base{color:var(--faint)}
.task.done .tx{color:var(--faint);text-decoration:line-through}
.task .t{font-family:var(--mono);font-size:12px;color:var(--faint);white-space:nowrap}
.task b.crop{font-weight:700;color:var(--fg)}
.task.done b.crop{color:inherit}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
/* mapa */
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
svg.map{width:100%;height:auto;display:block}
svg.map .wall{stroke:var(--soil);stroke-width:.12;fill:none}
svg.map .tree{fill:var(--tree)}
svg.map .bed{cursor:pointer}
svg.map .bedbox{stroke:var(--fg);stroke-opacity:.55;stroke-width:.08}
svg.map .bed:hover .bedbox,svg.map .bed.sel .bedbox{stroke:var(--accent);stroke-opacity:1;stroke-width:.22}
svg.map text{font-family:var(--body);fill:var(--fg)}
svg.map .lab{font-size:.62px;font-weight:700}
svg.map .crop{font-size:.5px;font-weight:600}
svg.map .seclab{font-family:var(--display);font-size:1.5px;fill:var(--muted)}
svg.map .feat{font-size:.55px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.monthpick{display:flex;flex-wrap:wrap;gap:4px}
.monthpick button{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:5px 9px;border-radius:7px;cursor:pointer}
.monthpick button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bedinfo .row{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.timeline{display:flex;flex-direction:column;gap:8px}

/* mensajes */
.thread{display:flex;flex-direction:column;gap:8px;max-height:62vh;overflow-y:auto;padding:4px 0}
.msg{max-width:85%;padding:9px 12px;border-radius:14px;background:var(--sunk);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.msg.me{align-self:flex-end;background:color-mix(in srgb,var(--leaf) 20%,var(--surface))}
.msg small{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.send{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;margin-top:10px}
.send textarea{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:48px;resize:vertical;background:var(--surface);color:var(--fg)}
/* compras y semillas */
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.li input[type=checkbox]{width:24px;height:24px;accent-color:var(--leaf)}
.li.done .what{color:var(--faint);text-decoration:line-through}
.li .x,.sb .x{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:9px;width:40px;min-height:40px;cursor:pointer}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:6px;margin-top:10px}
.addrow input{font-size:16px;min-height:44px;width:100%;box-sizing:border-box}
.addrow .btn{min-height:44px}
.sb{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px dashed var(--line)}
.sb .top{display:flex;gap:8px;align-items:center;justify-content:space-between}
.lvl{display:flex;gap:4px;flex-wrap:wrap}
.lvl button{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 10px;border-radius:8px;min-height:40px;cursor:pointer}
.lvl button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.lvl button.low[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.sb input{font-size:16px;min-height:44px;width:100%;box-sizing:border-box}

/* censo de camas */
.cc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 10px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:70px}
.cc.saved{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.cch{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cch b{font-size:22px;font-family:var(--serif, Georgia, serif);font-weight:400}
.cch .chip{margin-left:auto}
.cbar{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:repeating-linear-gradient(135deg,var(--sunk) 0 6px,var(--surface) 6px 12px)}
.cbar i{display:flex;align-items:center;justify-content:center;height:100%;border-right:2px solid var(--surface);font-style:normal;font-size:12px;font-weight:700;overflow:hidden;white-space:nowrap;padding:0 4px;min-width:0;line-height:1.05;text-align:center}
.cbar i:last-child{border-right:0}
.cbar .vac{flex:1;color:var(--muted);text-shadow:none;font-weight:600;background:none}
.cends{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:-6px;letter-spacing:.04em;text-transform:uppercase}
.cl{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.cl .sw{grid-row:1 / span 3;align-self:stretch;border-radius:3px}
.cl .mrow-old{grid-column:2 / -1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cl .mrow .lab{font-size:13px;color:var(--muted)}
.cl .mrow .lnk{margin-left:auto}
.cl select,.cl input{font-size:16px;min-height:44px;width:100%;box-sizing:border-box;padding:6px 8px}
.cl select.crop{font-weight:700;font-size:17px;min-height:44px}
.cl select.crop.empty{font-weight:400;color:var(--muted)}
.cl .mstep{grid-column:2 / -1}.mstep{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.mstep button{border:0;background:var(--sunk);font-size:18px;width:32px;min-height:40px;cursor:pointer;color:var(--fg);padding:0}
.mstep select{border:0;border-radius:0;width:auto !important;min-width:62px;text-align:center;font-weight:700;padding:0 2px;background:var(--surface);-webkit-appearance:none;appearance:none;text-align-last:center}
.cl .x{border:0;background:none;color:var(--faint);width:28px;min-height:40px;font-size:18px;cursor:pointer;padding:0}
.cl .more{grid-column:2 / -1;display:flex;gap:6px;align-items:center}
.cl .more select{flex:1}
.cl .more input,.cl .more select{min-height:44px;font-size:15px}
.cl .more .fe{max-width:128px;font-size:14px;padding:4px 6px}
.lnk{border:0;background:none;color:var(--muted);font-size:13px;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;grid-column:2 / -1;justify-self:start}
.cfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:6px;border-top:1px dashed var(--line)}
.cfoot .btn{min-height:40px;font-size:14px}
.cends .rest{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:600;color:var(--muted)}
.cends .rest.full{color:var(--ok)}
.cends .over{color:var(--danger);font-weight:700}
.cfoot{flex-wrap:nowrap}
.kseg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--sunk);padding:4px;border-radius:12px}
.kseg button{min-height:44px;border:0;border-radius:9px;background:none;font:inherit;font-weight:700;font-size:14.5px;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.kseg button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.kb{min-width:20px;height:20px;border-radius:10px;background:var(--danger);color:var(--surface);font-size:12px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.kalerts{display:flex;flex-direction:column;gap:8px}
.kal{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);border-left:4px solid var(--muted);background:var(--surface);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer;color:var(--fg)}
.kal span{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}.kal.warn{border-left-color:var(--warn)}.kal.bad{border-left-color:var(--danger)}
.kper{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.kper button{min-height:44px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font:inherit;font-size:13.5px;font-weight:600;color:var(--fg);cursor:pointer}
.kper button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.ktiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:860px){.ktiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kt>span{font-size:12.5px;color:var(--muted);font-weight:600}.kt b{font-size:22px;font-variant-numeric:tabular-nums}.kt b small{font-size:13px;font-weight:600;color:var(--muted)}
.kt>small{font-size:12px;color:var(--muted)}.kt i{display:block;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}.kt i em{display:block;height:100%;background:var(--ok)}
.kr{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.kr1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.kr1 .dot{width:10px;height:10px;border-radius:3px;flex:none}.kr1 b{flex:1 1 auto;min-width:0}
.kr1 .km{font-weight:700;font-variant-numeric:tabular-nums}.kr1 .kv{font-size:13px}
.kbars{display:flex;flex-direction:column;gap:3px}.kbars i{display:block;height:7px;border-radius:4px;min-width:2px}
.kbars .e,.klg .e{background:color-mix(in srgb,var(--muted) 35%,transparent)}.kbars .g,.klg .g{background:var(--ok)}
.klg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 3px 0 8px;vertical-align:-1px}
.kn b{color:var(--fg)}
.krest{border-top:1px solid var(--line);padding-top:8px}.krest>summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}.kq{padding:6px 0;border-top:1px dashed var(--line)}
.kf{font-size:13px;font-weight:600;padding:4px 8px;border-radius:6px;background:var(--sunk);align-self:flex-start}.kf.bad{color:var(--danger)}.kf.warn{color:var(--warn)}.kf.ok{color:var(--ok)}
.bar>div:has(>.mnav){flex:1 1 100%;min-width:0}
.mnav{width:100%;max-width:440px;display:flex;align-items:center;gap:6px;margin-top:2px}
.mnav h2{flex:1;min-width:0;text-align:center;margin:0}
.mnav button{flex:none;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font-size:24px;line-height:1;cursor:pointer}
.mnav button:disabled{opacity:.35;cursor:default}
.zsel{display:flex;align-items:center;gap:8px;margin:0}.zsel span{font-size:13px;font-weight:600;color:var(--muted)}.zsel select{flex:1;min-height:44px;font-weight:600}
.mstep .trash{color:var(--danger);display:inline-flex;align-items:center;justify-content:center}
.cfoot .addsq{flex:0 0 auto;width:48px;min-width:48px;height:48px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.cfoot [data-save]{flex:1}
.taskw{display:grid;grid-template-columns:minmax(0,1fr) 44px;align-items:start;border-bottom:1px solid var(--line)}
.taskw>.task{border-bottom:0}
.taskw .tmore{width:44px;min-height:48px;border:0;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;border-radius:10px}
.taskw.open .tmore{background:var(--sunk);color:var(--fg)}
.taskw .why{display:block;font-size:13px;font-weight:600;margin-top:2px;color:var(--muted)}.taskw .why.bad{color:var(--danger)}.taskw .why.warn{color:var(--warn)}
.taskw.nope .tx{opacity:.85}
.tpanel{grid-column:1 / -1;display:flex;flex-direction:column;gap:8px;padding:4px 0 12px}
.tst{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tst button,.treasons button{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font:inherit;font-size:14px;font-weight:600;color:var(--fg);cursor:pointer;padding:4px 8px}
.tst button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.treasons{display:flex;flex-wrap:wrap;gap:6px}.treasons button{min-height:40px;font-size:13px;border-radius:999px}
.tpanel .tnote{min-height:44px;font-size:16px}
.chead{display:flex;flex-direction:column;gap:8px}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
@media (min-width:1000px){.cgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cbar i{flex-direction:column;line-height:1.15;min-width:0}.cbar i .bn{max-width:100%;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.cfoot .lnk{min-height:40px;display:inline-flex;align-items:center}
.cl .ldet{grid-column:2 / -1;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.cl .ldet>summary{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 10px;cursor:pointer;list-style:none;font-size:13.5px}
.cl .ldet>summary::-webkit-details-marker{display:none}
.cl .ldet .ds{flex:1;min-width:0;color:var(--fg);overflow-wrap:anywhere}.cl .ldet .ds.empty{color:var(--muted)}
.cl .ldet .de{flex:none;font-weight:700;color:var(--accent, var(--fg));font-size:13px}.cl .ldet .de::after{content:" ▾"}.cl .ldet[open] .de::after{content:" ▴"}
.cl .ldet[open]>summary{border-bottom:1px solid var(--line)}
.cl .ldb{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:10px}
.cl .ldb>*{grid-column:1 / -1 !important}
.cl .sown{grid-column:2 / -1;display:flex;flex-direction:column;gap:6px;margin-top:2px}
.cl .sown .q{font-size:13px;font-weight:600;color:var(--fg)}.cl .sown .q small{font-weight:400;color:var(--muted)}
.dq{display:flex;flex-wrap:wrap;gap:6px}
.dq button{min-height:38px;padding:4px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font:inherit;font-size:13.5px;font-weight:600;color:var(--fg);cursor:pointer}
.dq button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}

const monthLabel = k => { const [y, m] = k.split("-").map(Number); return MESL[m - 1] + " " + y; };
// Un solo patrón de navegación por días, semanas y meses: ‹ etiqueta ›, barra completa, flechas en los extremos.
function navStepper(key, main, sub, o = {}){
  const note = o.prevOff && o.startNote ? o.startNote : o.nextOff && o.endNote ? o.endNote : "";

// Aviso breve abajo. opt.action + opt.on = botón (p. ej. "Deshacer"); opt.done corre al cerrarse sin deshacer (para borrar de verdad después).
function toast(msg, opt = {}){
  const cur = toast.cur; if (cur) { clearTimeout(cur.tm); cur.el.remove(); if (cur.done) cur.done(); }
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status");
  const sp = document.createElement("span"); sp.textContent = msg; t.appendChild(sp);
  const me = {el: t, done: opt.done || null};
  if (opt.action) { const b = document.createElement("button"); b.type = "button"; b.textContent = opt.action; b.onclick = () => { clearTimeout(me.tm); t.remove(); toast.cur = null; if (opt.on) opt.on(); }; t.appendChild(b); }
  me.tm = setTimeout(() => { t.remove(); if (toast.cur === me) toast.cur = null; if (me.done) me.done(); }, opt.ms || (opt.action ? 5000 : 2200));
  toast.cur = me; document.body.appendChild(t);
}
// Un solo mensaje claro por error. Sin PIN (canceló) no es un error de conexión.
function saveErr(e, fallback){
  const c = e && e.code;
  if (c === "no_pin") return toast("No se guardó: hace falta el PIN.");
  if (c === "bad_pin") return toast("PIN incorrecto");
  if (c === "quota_exceeded") return toast("El registro está lleno; hay que depurar entradas viejas.");
  if (c === "invalid" && e.message) return toast(e.message);
  toast(fallback || "No se pudo guardar. Revisa la conexión e intenta de nuevo.");
}

const Y0 = 93.5, X0 = 11.5;
const ZONES = [["todo", "Todo"], ["A-NO", "A1–A6"], ["A-NE", "A7–A12"], ["A-SO", "A13–A18"], ["A-SE", "A19–A24"], ["B", "Sección B"], ["I", "Invernaderos"]];
function zoneBox(z){
  if (!z || z === "todo") return [0, 0, 39, 91];

  const bs = GEO.beds.filter(b => ids.includes(b.id));
  const x0 = Math.min(...bs.map(b => b.x)) - X0, x1 = Math.max(...bs.map(b => b.x + b.w)) - X0;
  const y0 = Y0 - Math.max(...bs.map(b => b.y + b.h)), y1 = Y0 - Math.min(...bs.map(b => b.y));

  return [x0 - pad - (z === "B" ? .8 : 0), y0 - pad - .6, x1 - x0 + 2 * pad + (z === "B" ? .8 : 0), y1 - y0 + 2 * pad + .6];
}
function zonePicker(id){ return `<label class="zsel"><select data-zones="${id}" aria-label="Zona del huerto">${ZONES.map(([k, l]) => `<option value="${k}"${(state.zone || "todo") === k ? " selected" : ""}>${k === "todo" ? "Todo el huerto" : l}</option>`).join("")}</select></label>`; }

  if (false) for (const [x, lab] of []) s += `<circle cx="${x-X0}" cy="${Y0-31.6}" r=".85" fill="var(--sunk)" stroke="var(--fg)" stroke-width=".08"/><text class="feat" x="${x-X0}" y="${Y0-31.6+1.75}" text-anchor="middle">${lab}</text>`;

  s += `<text class="seclab" x="${31.03-X0}" y="${Y0-4.4}" text-anchor="middle">Sección B · limones eureka</text>`;

    else inner += `<text class="lab" x="${x - .25}" y="${cy + .22}" text-anchor="end">${b.id}</text>`;
    s += `<g class="bed${state.bed === b.id ? " sel" : ""}" data-bed="${b.id}" tabindex="0" role="button" aria-label="Cama ${b.id}${labs.length ? ": " + esc(labs.join(", ")) : ""}">${inner}</g>`;

function shortName(n){ return n.replace(/ \(.*\)/, "").replace(" de corte", "").replace(" toscano", "").replace(" arcoíris","").replace(" baby"," baby").replace(" y flor","").replace(" jalapeño y serrano"," jalapeño").replace("Pensamiento y viola","Viola").replace("Epazote, pápalo y pipicha","Epazote y pápalo").replace(" (repollo)","").replace("Chícharo chino","Chícharo").replace("Ajo y chalote","Ajo y chalote"); }
// Texto sobre el color de un cultivo: oscuro o blanco, el que tenga más contraste (WCAG). wash = [color, opacidad] de una capa encima (p. ej. el tramo "creciendo").
const hexRGB = h => { h = String(h || "").trim().replace("#", ""); if (h.length === 3) h = h.split("").map(x => x + x).join(""); return /^[0-9a-f]{6}$/i.test(h) ? [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16)) : null; };
const relLum = c => { const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }; return .2126 * f(c[0]) + .7152 * f(c[1]) + .0722 * f(c[2]); };
const contrastOf = (a, b) => { const x = relLum(a), y = relLum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
function inkOn(hex, wash){
  let c = hexRGB(hex); if (!c) return "var(--fg)";
  const w = wash && hexRGB(wash[0]); if (w) c = c.map((v, i) => v * (1 - wash[1]) + w[i] * wash[1]);
  const dk = hexRGB(cssv("--ink-dark")) || [29, 38, 28], lt = hexRGB(cssv("--ink-light")) || [255, 255, 255];
  return contrastOf(c, dk) >= contrastOf(c, lt) ? "var(--ink-dark)" : "var(--ink-light)";
}
const textOn = hex => inkOn(hex);
// true si el mejor color de texto (oscuro o blanco) llega a 4.5:1 sobre ese color
const inkOk = hex => { const c = hexRGB(hex); if (!c) return false; const dk = hexRGB(cssv("--ink-dark")) || [29, 38, 28], lt = hexRGB(cssv("--ink-light")) || [255, 255, 255]; return Math.max(contrastOf(c, dk), contrastOf(c, lt)) >= 4.5; };
function monthFill(bedId, w){
  return bedSegs(plan, bedId, w).map(sg => {
    if (sg.st === "prepara") return {pos: sg.pos, m: sg.m, hatch: true, crop: "preparar"};
    const c = sg.p.c;
    return sg.st === "cosecha" ? {pos: sg.pos, m: sg.m, fill: c.c, ink: textOn(c.c), crop: shortName(c.n)} : {pos: sg.pos, m: sg.m, fill: c.c, op: .38, crop: shortName(c.n)};

}

const EST = {limpia: "Limpia", lista: "Lista para sembrar", sembrada: "Sembrada"};
const todayISO = () => { const n = new Date(); return n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, "0") + "-" + String(n.getDate()).padStart(2, "0"); };
const fmtISO = iso => { if (!iso) return ""; const [y, m, d] = iso.split("-").map(Number); return d + " " + MES[m - 1]; };
function cropOptions(){
  const skip = {semilla: 1, vegetales: 1, floresmix: 1};
  const keys = new Set([...PLANTINGS.map(x => x[1]), ...Object.keys(typeof STOCK !== "undefined" ? STOCK : {})].filter(k => CROPS[k] && !skip[k]));
  const known = [...keys].map(k => ({v: k, n: CROPS[k].n}));
  const extra = [...new Set(state.reports.filter(r => r.cultivo && !CROPS[r.cultivo]).map(r => r.cultivo))].map(n => ({v: n, n}));
  return [...known, ...extra].sort((a, b) => a.n.localeCompare(b.n, "es"));

function estHarvest(crop, fecha){
  const c = CROPS[crop]; if (!c || !fecha || !c.sem) return "";
  const d = D(fecha); d.setDate(d.getDate() + Math.round(c.sem * factor(fecha, c) * 7));
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function sideNames(bed){ return BED[bed].sec === "A" ? ["Mitad norte", "Mitad sur"] : ["Mitad oeste", "Mitad este"]; }
function repWhere(r){
  const B = BED[r.cama]; if (!B) return "";

  const [a, b] = sideNames(r.cama);
  if (r.pos === 0 && Math.abs(r.m - B.len / 2) < .01) return a.toLowerCase();
  if (r.pos != null && Math.abs(r.pos - B.len / 2) < .01 && Math.abs(r.m - B.len / 2) < .01) return b.toLowerCase();
  return nf(r.m, 1) + " m";
}

/* ---------- COCINA: pedidos, mensajes y lo que la cocina usa vs. lo que se siembra ---------- */
const hW = iso => Math.floor((D(iso) - wkDate(0)) / (7 * DAY));
const recentDays = (at, n) => { const d = new Date(String(at).replace(" ", "T") + "Z"); return Date.now() - d < n * DAY; };
function kitchenStats(weeks){
  const w1 = nowW(), w0 = Math.max(0, w1 - weeks + 1), rows = {};
  const row = k => rows[k] = rows[k] || {k, c: CROPS[k], m: 0, exp: 0, got: 0, gotCocina: 0, up: 0, down: 0, notes: []};
  plan.P.forEach(p => {
    if (/^Decorativa/.test(p.c.menu || "")) return;
    if ((p.ex || p.s <= w1) && p.end >= w1) row(p.crop).m += p.m;                       // metros en tierra hoy
    if (!p.c.nokg) for (let w = Math.max(w0, p.h0); w <= Math.min(w1, p.end); w++) row(p.crop).exp += p.c.kg * p.scale; // esperado en el periodo
  });
  const keyOf = c => CROPS[c] ? c : (Object.entries(CROPS).find(([k, x]) => x.n.toLowerCase() === String(c).toLowerCase()) || [])[0];
  (state.harvests || []).forEach(h => { const w = hW(h.fecha || ""); const k = keyOf(h.cultivo); if (!k || !(w >= w0 && w <= w1)) return; const r = row(k); r.got += +h.cantidad || 0; if (h.quien === "cocina") r.gotCocina += +h.cantidad || 0; });
  (state.pvotos || []).forEach(x => { const k = keyOf(x.cultivo); if (!k || !x.voto) return; const r = row(k); if (x.voto.voto === 1) r.up++; else { r.down++; if (x.voto.nota) r.notes.push(x.voto.nota); } });
  const list = Object.values(rows).filter(r => r.m > 0 || r.got > 0 || r.exp > 0 || r.down);
  const anyGot = list.some(r => r.got > 0);
  list.forEach(r => { r.pct = r.exp > 0 ? r.got / r.exp : null; r.kgm = r.m > 0 ? r.got / r.m : null;
    r.flag = r.down ? ["La cocina dijo que no lo necesita", "bad"] : anyGot && !r.c.nokg && r.exp >= 2 && r.got < r.exp * 0.4 ? ["Se cosecha mucho menos de lo esperado", "warn"] : r.exp > 0 && r.got > r.exp * 1.3 ? ["La cocina usa más de lo que se siembra", "ok"] : null; });
  const total = BEDS.reduce((a, b) => a + BED[b.id].len, 0);
  return {anyGot, list: list.sort((a, b) => (b.exp + b.got > 0) - (a.exp + a.got > 0) || (a.c.nokg ? 1 : 0) - (b.c.nokg ? 1 : 0) || (b.got + b.exp) - (a.got + a.exp) || b.m - a.m), w0, w1, total, used: list.reduce((a, r) => a + r.m, 0),
    exp: list.reduce((a, r) => a + (r.c.u === "kg" ? r.exp : 0), 0), got: list.reduce((a, r) => a + (r.c.u === "kg" ? r.got : 0), 0)};
}
const nfk = v => v >= 10 ? Math.round(v).toString() : (Math.round(v * 10) / 10).toString();

/* ---------- HOY (vista principal en el celular) ---------- */
function todayRef(){
  const n = new Date(); n.setHours(12, 0, 0, 0);
  let wd = n.getDay(), w = todayW;
  if (wd === 0 || wd === 6) { w += 1; wd = 1; }
  if (w < 0) { w = 0; wd = typeof FIRST_DAY !== "undefined" ? FIRST_DAY : 1; }
  if (w === 0 && typeof FIRST_DAY !== "undefined" && wd < FIRST_DAY) wd = FIRST_DAY;
  return {w: Math.min(w, PLAN_WEEKS - 1), d: wd};
}
const isoDay = (w, d) => { const x = new Date(wkDate(w).getTime() + (d - 1) * DAY); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); };
views.hoy = () => {
  if (!state.hd) state.hd = todayRef();
  const {w, d} = state.hd;
  if (state.w !== w) { state.w = w; subscribeDone(); }
  const all = dayList(w, d), list = counted(all);
  const first = w === 0 && typeof FIRST_DAY !== "undefined" ? FIRST_DAY : 1;
  const date = new Date(wkDate(w).getTime() + (d - 1) * DAY);
  const isToday = isoDay(w, d) === todayISO();
  const done = list.filter(isDone).length;
  const mins = list.reduce((a, t) => a + t.min, 0);
  const auto = (() => { const r = todayRef(); return r.w === w && r.d === d; })();
  const sub = isToday ? "" : auto ? "Próximo día de trabajo" : `Semana ${w + 1}`;
  return `
  ${navStepper("dia", `${DIAS[d]} ${fmt(date)}`, sub, {group: "Día", prev: "Día anterior", next: "Día siguiente", prevOff: w === 0 && d <= first, nextOff: w === PLAN_WEEKS - 1 && d === 5})}
  ${state.db === null && state.dbTried ? `<div class="notice">Las marcas no se guardan en esta vista.</div>` : ""}
  <section class="panel hoyp" aria-label="Tareas del día">
    <div class="phead"><h3>Tareas</h3><span class="small muted"><b class="fgc">${done} de ${list.length}</b> hechas · <span class="num">${nf(mins / 60, 1)} h</span></span></div>
    <div class="meter thin"><i style="width:${list.length ? done / list.length * 100 : 0}%"></i></div>
    ${all.length ? all.map(t => taskRow(t, "h")).join("") : `<p class="muted" style="margin:6px 0 0">Sin tareas este día.</p>`}
  </section>`;
};
views.hoy.bind = root => {
  const step = k => { let {w, d} = state.hd; d += k; if (d > 5) { w++; d = 1; } if (d < 1) { w--; d = 5; } const first = w === 0 && typeof FIRST_DAY !== "undefined" ? FIRST_DAY : 1; if (w < 0 || (w === 0 && d < first) || w >= PLAN_WEEKS) return; state.hd = {w, d}; state.topen = null; render(); };
  bindStepper(root, "dia", step);
  bindTasks(root);
};

/* ---------- cosecha programada (vista Cosecha): lun/mié/vie, una fila por cultivo ---------- */
function harvestDay(){
  // Hoy si es lunes, miércoles o viernes; si no, el siguiente día de cosecha.
  const n = new Date(); n.setHours(12, 0, 0, 0);
  for (let i = 0; i < 7; i++) { const x = new Date(n.getTime() + i * DAY), wd = x.getDay(); if ([1, 3, 5].includes(wd)) { const iso = x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); const w = isoWD(iso).w; return {iso, w: Math.max(0, Math.min(PLAN_WEEKS - 1, w)), d: wd, today: i === 0}; } }
}
function harvestSection(){
  const hd = harvestDay(), T = weekTasks(plan, hd.w).filter(t => t.k === "cosecha");
  const gm = {}; T.forEach(t => { const g = gm[t.crop] = gm[t.crop] || {crop: t.crop, beds: [], qty: 0}; g.beds.push(t.bed); g.qty += t.qty; });
  const harvG = Object.values(gm).sort((a, b) => (CROPS[a.crop].u === "kg" ? 0 : 1) - (CROPS[b.crop].u === "kg" ? 0 : 1) || b.qty - a.qty);
  const saveIso = hd.iso > todayISO() ? todayISO() : hd.iso;
  const logged = {};
  state.harvests.filter(h => h.fecha === saveIso).forEach(h => { logged[h.cama + "|" + h.cultivo] = (logged[h.cama + "|" + h.cultivo] || 0) + (+h.cantidad || 0); });
  const open = state.hpOpen ?? hd.today;
  const rows = harvG.map(g => { const key = g.beds.join(", ") + "|" + g.crop; const exp = g.qty / 3; const c = CROPS[g.crop]; const got = logged[key]; const u = c.u === "kg" ? "kg" : "pzas";
      const sv = (state.hsaved || {})[key], err = (state.herr || {})[key];
      return `<div class="harv"><div style="min-width:0"><div class="hn"><span class="dot" style="background:${c.c}"></span> <b>${esc(c.n)}</b></div><div class="small muted">${esc(g.beds.join(", "))} · ${c.u === "kg" && exp < 0.25 ? "según pida cocina" : "≈ " + (c.u === "kg" ? nf(exp, 1) + " kg" : nf(exp) + " flores")}${got != null && !sv ? ` · <b style="color:var(--ok)">anotado ${nf(got, 1)} ${c.u}</b>` : ""}</div></div>
      ${sv ? `<div class="hdone" role="status"><span>✓ ${nf(sv.v, 1)} ${u} anotado</span>${sv.id && window.huertoApi ? `<button type="button" class="lnk" data-hundo="${esc(key)}">Deshacer</button>` : ""}<button type="button" class="lnk" data-hmore="${esc(key)}">Anotar otra cantidad</button></div>`
      : `<div class="hrow"><label class="fl"><span class="inu"><input type="number" aria-label="Cantidad cosechada de ${esc(c.n)} (${u})" placeholder="0" inputmode="decimal" step="0.1" min="0" data-keep="hv|${esc(key)}" data-key="${esc(key)}" data-bed="${esc(g.beds.join(", "))}" data-crop="${g.crop}"${err ? ` class="invalid" aria-invalid="true"` : ""}><span class="u">${u}</span></span></label><button class="btn hsave" data-save="1" aria-label="Anotar cosecha de ${esc(c.n)}" title="Anotar cosecha">✓</button></div>${err ? `<span class="ferr">Escribe los ${u === "kg" ? "kg" : "piezas"} antes de anotar.</span>` : ""}`}</div>`; }).join("");
  return `<details class="panel fold-p hprog" id="hprog"${open ? " open" : ""}><summary><span class="hps"><h3>Cosecha programada</h3><span class="small muted">${hd.today ? "hoy" : esc(dShort(hd.iso))} · antes de las 10:00 · ${harvG.length} cultivo${harvG.length === 1 ? "" : "s"}</span></span></summary>
    <p class="small muted" style="margin:0 0 2px">La cocina o el huerto anotan lo que se llevan. Si no se cosechó, marca la tarea de cosecha como «No se pudo».</p>
    ${rows || `<p class="muted" style="margin:6px 0 0">Nada para cosechar ${hd.today ? "hoy" : "ese día"}.</p>`}</details>`;
}
function bindHarvest(root){
  const dt = root.querySelector("#hprog"); if (dt) dt.ontoggle = () => { state.hpOpen = dt.open; };
  const H = state.hsaved = state.hsaved || {}, E = state.herr = state.herr || {};
  root.querySelectorAll("[data-hmore]").forEach(b => b.onclick = () => { delete H[b.dataset.hmore]; render(); });
  root.querySelectorAll("[data-hundo]").forEach(b => b.onclick = async () => {
    const key = b.dataset.hundo, sv = H[key]; if (!sv) return;
    try { await window.huertoApi.post("/api/cocina/borrar", {id: sv.id}); delete H[key]; toast("Cosecha borrada"); window.dispatchEvent(new Event("huerto-refresh")); render(); }
    catch (e) { saveErr(e, "No se pudo deshacer. Revisa la conexión."); }
  });
  root.querySelectorAll(".harv [data-save]").forEach(b => b.onclick = async () => {
    const inp = b.closest(".hrow").querySelector("input"), key = inp.dataset.key; const v = +inp.value;
    if (!inp.value || !(v > 0)) { E[key] = true; render(); const n = [...document.querySelectorAll(".harv input[data-key]")].find(x => x.dataset.key === key); if (n) n.focus(); return; }
    delete E[key];
    if (!state.db) { toast("No se puede guardar en esta vista."); return; }
    const c = CROPS[inp.dataset.crop], hd = harvestDay();
    b.disabled = true;
    try { const ref = await state.db.collection("cosechas").add({fecha: hd.iso > todayISO() ? todayISO() : hd.iso, cama: inp.dataset.bed, cultivo: inp.dataset.crop, cantidad: v, u: c.u, nota: "", at: Date.now()}); inp.value = ""; H[key] = {v, id: ref && ref.id}; render(); }
    catch (e) { saveErr(e); b.disabled = false; }
  });
}

views.semana = () => {
  const w = state.w;
  const T = weekTasks(plan, w);
  const hrs = T.reduce((a, t) => a + t.min, 0) / 60;
  const over = hrs > CAP_H;
  const harv = T.filter(t => t.k === "cosecha");
  const byCrop = {};
  harv.forEach(t => { const o = byCrop[t.crop] = byCrop[t.crop] || {beds: [], qty: 0, u: t.u}; o.beds.push(t.bed); o.qty += t.qty; });
  const actBeds = {};
  T.forEach(t => { if (!t.bed || t.k === "semillero") return; const pri = {prep: 3, siembra: 4, cuidado: 2, cosecha: 1, semillero: 0}[t.k]; if (!actBeds[t.bed] || actBeds[t.bed].pri < pri) actBeds[t.bed] = {k: t.k, pri}; });
  const KC = {prep: ["url(#hatch)", "Preparar"], siembra: [cssv("--leaf"), "Sembrar o trasplantar"], cuidado: [cssv("--warn"), "Ralear o tutorar"], cosecha: [cssv("--accent"), "Cosechar"]};
  const fill = id => { const a = actBeds[id]; if (!a) return {}; if (a.k === "prep") return {hatch: true, crop: "preparar"}; return {fill: KC[a.k][0], ink: "var(--bg)", crop: KC[a.k][1].split(" ")[0].toLowerCase()}; };
  // Hoy y lo que viene, abiertos; los días que ya pasaron van al final, doblados en una línea de resumen.
  const tr = todayRef(), tIso = todayISO(), DO = state.dayOpen = state.dayOpen || {};
  let up = "", past = "", nAll = 0, nDone = 0, nUn = 0, firstUp = null;
  for (let d = 1; d <= 5; d++) {
    const all = dayList(w, d); if (!all.length) continue;
    const list = counted(all), nd = list.filter(isDone).length, un = unmarked(all), h = nf(list.reduce((a, t) => a + t.min, 0) / 60, 1);
    nAll += list.length; nDone += nd;
    const iso = isoDay(w, d), date = new Date(wkDate(w).getTime() + (d - 1) * DAY), isPast = iso < tIso;
    const rows = all.map(t => taskRow(t, "c")).join("");
    if (isPast) {
      nUn += un;
      const open = DO[w + "-" + d] ?? false;
      past += `<details class="day past" data-day="${w}-${d}"${open ? " open" : ""}><summary><span class="ps"><b>${DIAS[d].slice(0, 3)} ${fmt(date)}</b> · ${nd} de ${list.length}<span class="hh"> hechas</span>${un ? ` · <b class="unm nw">${un} sin marcar</b>` : ` · <span class="num">${h} h</span>`}</span></summary>${rows}</details>`;
    } else {
      if (firstUp == null) firstUp = d;
      const open = DO[w + "-" + d] ?? true;
      const tag = tr.w === w && tr.d === d ? ` <span class="chip">${iso === tIso ? "hoy" : "próximo"}</span>` : "";
      up += `<details class="day" data-day="${w}-${d}"${open ? " open" : ""}><summary><span><b>${DIAS[d]} ${fmt(date)}</b>${tag}</span><span class="small muted">${nd} de ${list.length} hechas · <span class="num">${h} h</span></span></summary>${rows}</details>`;
    }
  }
  const days = up + (past ? `<div class="psep"><h4>Días anteriores</h4>${nUn ? `<span class="small unm">${nUn} sin marcar: ciérralas aquí</span>` : `<span class="small muted">todo marcado</span>`}</div>${past}` : "");
  const harvRows = Object.entries(byCrop).sort((a, b) => CROPS[a[0]].u.localeCompare(CROPS[b[0]].u) || b[1].qty - a[1].qty)
    .map(([c, o]) => `<li class="hw"><span class="dot" style="background:${CROPS[c].c}"></span><b>${esc(shortName(CROPS[c].n))}</b><span class="hb">${esc(o.beds.join(", "))}</span><span class="num">${o.u === "kg" ? nf(o.qty, 1) + " kg" : nf(o.qty) + " fl."}</span></li>`).join("");
  const kgTot = Object.entries(byCrop).filter(([c]) => CROPS[c].u === "kg").reduce((a, [, o]) => a + o.qty, 0);
  return `
  <div class="vtop">${weekStepper("sem", w, `Semana ${w + 1} de ${PLAN_WEEKS}`)}</div>
  ${state.db === null && state.dbTried ? `<div class="notice">Las marcas de tareas no se guardan en esta vista. Ábrelo desde tu cuenta de Claude para que se compartan con Melanie.</div>` : ""}
  <div class="cols">
    <section class="panel days" aria-label="Tareas por día">
      <div class="phead"><h3>Lista de Adrián</h3><span class="small muted"><b class="fgc">${nDone} de ${nAll}</b> hechas</span></div>
      <div class="wload"><span class="small"><b class="num">${nf(hrs, 1)} h</b> de ${CAP_H} h</span>${over ? `<span class="chip warn">⚠ Pedir apoyo: ${nf(hrs - CAP_H, 0)} h extra</span>` : `<span class="chip ok">✓ Cabe en la semana</span>`}</div>
      <div class="meter thin${over ? " over" : ""}"><i style="width:${Math.min(100, hrs / CAP_H * 100)}%"></i></div>

      <section class="panel" aria-label="Cosecha de la semana">
        <div class="phead"><h3>Cosecha esperada</h3><span class="num small">${nf(kgTot, 1)} kg</span></div>
        ${harvRows ? `<ul class="hwl">${harvRows}</ul><p class="small muted" style="margin:6px 0 0">En 3 entregas: lun, mié y vie (fl. = flores). Se anota en la pestaña Cosecha.</p>` : `<p class="muted small" style="margin:0">Sin cosecha esta semana: las camas se están limpiando y sembrando.</p>`}
      </section>

};

const ST_WORD = {cosecha: "en cosecha", crece: "creciendo", prepara: "preparar la cama"};
function zoneBeds(z){ return BEDS.filter(b => !z || z === "todo" || (z === "B" ? b.sec === "B" : z === "I" ? b.sec === "I" : b.q === z)).map(b => b.id); }
// Lista de camas debajo del mapa: en el celular las camas del mapa son muy chicas para tocarlas y leerlas.
function bedList(w){

}

  root.querySelectorAll("[data-censo]").forEach(b => b.onclick = () => { state.cfocus = state.copen = b.dataset.censo; state.cfrom = "mapa"; go("censo"); });
  const open = id => { state.bed = id; state.upd = null; render(); const p = document.getElementById("bedpanel"); if (p && window.innerWidth < 860) p.scrollIntoView({behavior: "smooth", block: "start"}); };
  bindBeds(root.querySelector("#mmap"), () => open(state.bed));
  root.querySelectorAll("[data-bedrow]").forEach(b => b.onclick = () => open(b.dataset.bedrow));
  bindZones(root, render);
};

views.cosecha = () => {
  const F = forecast(plan);
  const months = MONTHS.slice(0, 12);
  const cats = Object.keys(CAT);
  const data = months.map(m => { const o = {m}; cats.forEach(k => o[k] = 0); o.fl = 0; Object.entries(F[m] || {}).forEach(([c, v]) => { if (CROPS[c].u === "kg") o[CROPCAT[c]] += v; else o.fl += v; }); o.tot = cats.reduce((a, k) => a + o[k], 0); return o; });
  const actual = {};
  state.harvests.forEach(h => { if (h.u !== "kg") return; const k = (h.fecha || "").slice(0, 7); actual[k] = (actual[k] || 0) + (+h.cantidad || 0); });
  const max = Math.ceil(Math.max(...data.map(d => d.tot), ...Object.values(actual), 1) / 50) * 50;
  const W = 720, H = 300, L = 40, R = 8, Tp = 10, B = 26, bw = (W - L - R) / months.length;
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cosecha estimada por mes en kilos">`;
  for (let v = 0; v <= max; v += max / 4) { const y = Tp + (H - Tp - B) * (1 - v / max); svg += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="axis" x="${L - 6}" y="${y + 4}" text-anchor="end">${nf(v)}</text>`; }
  data.forEach((d, i) => {
    let y = H - B; const x = L + i * bw + bw * .18, w = bw * .64;
    const segs = cats.filter(k => d[k] > 0);
    segs.forEach((k, j) => {
      const h = (H - Tp - B) * d[k] / max; y -= h;
      const top = j === segs.length - 1;
      const gap = j > 0 ? 2 : 0;
      svg += `<path data-tip="${esc(monthLabel(d.m))}|${CAT[k][0]}|${nf(d[k])} kg" d="${top ? `M${x},${y + h - gap} V${y + 4} Q${x},${y} ${x + 4},${y} H${x + w - 4} Q${x + w},${y} ${x + w},${y + 4} V${y + h - gap} Z` : `M${x},${y + h - gap} V${y} H${x + w} V${y + h - gap} Z`}" fill="var(${CAT[k][1]})" style="cursor:default"/>`;
    });
    if (actual[d.m]) { const ay = Tp + (H - Tp - B) * (1 - actual[d.m] / max); svg += `<line x1="${x - 3}" x2="${x + w + 3}" y1="${ay}" y2="${ay}" stroke="var(--fg)" stroke-width="2.5"/><title>Registrado ${nf(actual[d.m])} kg</title>`; }
    svg += `<rect x="${L + i * bw}" y="${Tp}" width="${bw}" height="${H - Tp - B}" fill="transparent" data-tip="${esc(monthLabel(d.m))}|Total estimado|${nf(d.tot)} kg${actual[d.m] ? " · registrado " + nf(actual[d.m]) + " kg" : ""}" class="hit"/>`;
    svg += `<text class="axis" x="${L + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle">${monthShort(d.m)}</text>`;
  });
  svg += `</svg>`;
  const year = data.reduce((a, d) => a + d.tot, 0);
  const crops = Object.keys(CROPS).filter(c => months.some(m => (F[m] || {})[c]));
  const table = `<table><thead><tr><th>Cultivo</th>${months.map(m => `<th class="r">${monthShort(m)}</th>`).join("")}<th class="r">Año</th></tr></thead><tbody>${crops.map(c => { let t = 0; const cells = months.map(m => { const v = (F[m] || {})[c] || 0; t += v; return `<td class="r num">${v ? nf(v) : "<span class='muted'>·</span>"}</td>`; }).join(""); return `<tr><td style="white-space:nowrap"><span class="dot" style="background:${CROPS[c].c}"></span> ${esc(CROPS[c].n)}${CROPS[c].u !== "kg" ? " <span class='muted small'>(flores)</span>" : ""}</td>${cells}<td class="r num"><b>${nf(t)}</b></td></tr>`; }).join("")}</tbody></table>`;
  return `${harvestSection()}
  <div class="bar" style="justify-content:space-between"><div><div class="eyebrow">Pronóstico para cocina · kilos por mes</div><h2>≈ ${nf(year)} kg en 12 meses</h2></div>
  <div class="legend">${cats.map(k => `<span><span class="dot" style="background:var(${CAT[k][1]})"></span>${CAT[k][0]}</span>`).join("")}<span><span style="width:14px;height:0;border-top:2.5px solid var(--fg);display:inline-block"></span>Registrado</span></div></div>
  <section class="panel chart" id="chart">${svg}</section>
  <details class="howto"><summary>¿Por qué noviembre sale casi vacío?</summary><p>Todas las camas se limpian en octubre; la producción arranca en diciembre. Los rendimientos son estimaciones de partida: el registro semanal de Adrián los corrige.</p></details>
  <section class="panel"><h3 style="margin-bottom:8px">Detalle por cultivo</h3><div class="scroll only-wide">${table}</div>
    <ul class="clist only-narrow">${crops.map(c => { let t = 0; const ms = months.map(m => { const v = (F[m] || {})[c] || 0; t += v; return v ? `<span>${monthShort(m)} <b class="num">${nf(v)}</b></span>` : ""; }).join(""); return `<li><div class="crh"><span class="dot" style="background:${CROPS[c].c}"></span><b>${esc(CROPS[c].n)}</b><span class="num">${nf(t)} ${CROPS[c].u === "kg" ? "kg" : "flores"}/año</span></div><div class="cmon">${ms}</div></li>`; }).join("")}</ul></section>`;
};

views.calendario = () => {
  const N = PLAN_WEEKS, pct = w => (w / N * 100);
  const months = MONTHS.map(k => ({k, w: Math.round((new Date(+k.slice(0, 4), +k.slice(5) - 1, 1, 12) - D(PLAN_START)) / (7 * DAY))})).filter(m => m.w >= 0 && m.w < N);
  const ZB = new Set(zoneBeds(state.zone)), CB = BEDS.filter(b => ZB.has(b.id));
  const rows = CB.map(b => `<div class="grow"><span class="b">${b.id}</span><div class="track">${(plan.byBed[b.id] || []).map(p => {
      const g = Math.max(0, (p.h0 - p.s) / (p.end - p.s + 1) * 100);
      return `<div class="seg" style="left:${pct(p.s)}%;width:${pct(p.end - p.s + 1)}%;top:${p.pos / BED[b.id].len * 100}%;bottom:auto;height:${p.m / BED[b.id].len * 100}%;background:${p.c.c}" title="${esc(p.c.n)}${p.frac < .999 ? " (" + nf(p.m, 1) + " m)" : ""}: ${p.ex ? "ya sembrado" : "siembra " + fmt(wkDate(p.s))}, cosecha ${fmt(wkDate(p.h0))} – ${fmt(wkDate(p.end))}"><i class="g" style="width:${g}%"></i><span>${esc(shortName(p.c.n))}</span></div>`;
    }).join("")}${todayW >= 0 && todayW < N ? `<i class="nowline" style="left:${pct(todayW + .5)}%"></i>` : ""}</div></div>`).join("");
  // En el celular: lista por cama, de hoy en adelante ("A2 · Apio: creciendo hasta 11 ene → Arúgula desde 25 ene").
  const w = nowW();
  const phrase = p => { const where = p.frac < .999 ? ` <span class="muted">(${nf(p.m, 1)} m)</span>` : "";
    const name = `<b>${esc(shortName(p.c.n))}</b>${where}`;
    if (!p.ex && p.s > w) return `${name}: ${p.tray ? `semillero ${fmt(wkDate(p.ts))}, ` : ""}siembra ${fmt(wkDate(p.s))}${p.c.nokg ? "" : ` · cosecha ${fmt(wkDate(Math.max(0, p.h0)))} – ${fmt(wkDate(p.end))}`}`;
    if (p.c.nokg || w >= p.h0) return `${name}: ${p.c.nokg ? "en la cama" : "en cosecha"} hasta ${fmt(wkDate(p.end))}`;
    return `${name}: creciendo, cosecha ${fmt(wkDate(Math.max(0, p.h0)))} – ${fmt(wkDate(p.end))}`; };
  const list = CB.map(b => { const ps = (plan.byBed[b.id] || []).filter(p => p.end >= w).sort((x, y) => x.s - y.s || x.pos - y.pos);
    return `<li><b class="cb">${b.id}</b><ol>${ps.map(p => `<li><span class="sw" style="background:${p.c.c}"></span><span>${phrase(p)}</span></li>`).join("") || `<li class="muted">Sin siembras de aquí en adelante.</li>`}</ol></li>`; }).join("");
  return `
  ${zonePicker("cal")}
  <ul class="callist only-narrow">${list}</ul>
  <div class="only-wide" style="display:contents">
  <div class="legend small"><span><span class="dot" style="background:var(--leaf);opacity:.45"></span>Tramo claro: creciendo</span><span><span class="dot" style="background:var(--leaf)"></span>Tramo fuerte: en cosecha</span><span><span class="dot" style="background:var(--accent)"></span>Línea: semana actual</span></div>
  <section class="panel scroll"><div class="gantt" style="min-width:980px">
    <div class="gmonths"><span></span><div>${months.map(m => `<b style="left:${pct(m.w)}%">${monthShort(m.k)}</b>`).join("")}</div></div>
    ${rows}
  </div></section></div>`;
};

views.compras = () => {
  const from = state.w, to = Math.min(PLAN_WEEKS - 1, state.w + 5);
  const items = [];
  plan.P.forEach(p => {
    const c = p.c, len = p.m;
    const when = p.tray ? p.ts : p.s;
    if (p.ex || when < from || when > to || c.met === "división" || c.met === "propia") return;
    let q;
    if (p.tray) q = `semilla para ${nf(p.cells)} cavidades (${p.trays} charola${p.trays > 1 ? "s" : ""})`;
    else if (c.met === "bulbo") q = `${nf(Math.ceil(c.rows * Math.floor(len / c.esp) * 1.1))} dientes / bulbos`;
    else if (c.rows) q = `${nf(c.rows * len, 1)} m de hilera`;
    else q = `${nf(p.area, 1)} m² al voleo`;
    items.push({when, c, q, bed: p.bed + (p.frac < .999 ? ` (${nf(p.m, 1)} m)` : ""), uso: p.tray ? "semillero" : "cama"});
  });
  items.sort((a, b) => a.when - b.when);
  // lista del año: semilla total por cultivo
  const yr = {};
  plan.P.forEach(p => {
    const c = p.c, len = p.m;
    if (p.ex || c.met === "división" || c.met === "propia") return;
    const r = yr[p.crop] = yr[p.crop] || {first: p.tray ? p.ts : p.s, cells: 0, meters: 0, bulbs: 0, area: 0, n: 0};
    r.first = Math.min(r.first, p.tray ? p.ts : p.s); r.n++;
    if (p.tray) r.cells += p.cells;
    else if (c.met === "bulbo") r.bulbs += Math.ceil(c.rows * Math.floor(len / c.esp) * 1.1);
    else if (c.rows) r.meters += c.rows * len; else r.area += p.area;
  });
  const yrList = Object.entries(yr).sort((a, b) => (STOCK[a[0]] ? 1 : 0) - (STOCK[b[0]] ? 1 : 0) || a[1].first - b[1].first);
  const yq = (k, r) => [r.cells && `${nf(r.cells)} cavidades`, r.meters && `${nf(r.meters)} m de hilera`, r.bulbs && `${nf(r.bulbs)} ${k === "ajo" ? "dientes y bulbos" : "piezas"}`, r.area && `${nf(r.area)} m² al voleo`].filter(Boolean).join(" + ");
  let maxTrays = 0; for (let w = 0; w < PLAN_WEEKS; w++) maxTrays = Math.max(maxTrays, traysActive(plan, w).reduce((a, p) => a + p.trays, 0));
  return `
  <div class="vtop">${navStepper("cmp", `${weekRange(from).split(" – ")[0]} – ${weekRange(to).split(" – ")[1]}`, "Semillas para 6 semanas", {group: "Semanas", prev: "6 semanas antes", next: "6 semanas después", prevOff: from <= 0, nextOff: from + 6 > PLAN_WEEKS - 1, startNote: "Son las primeras semanas del plan."})}</div>
  <section class="panel"><ul class="rows only-narrow">${items.map(r => { const k = Object.keys(CROPS).find(x => CROPS[x] === r.c); return `<li><div class="rh"><span class="dot" style="background:${r.c.c}"></span><b>${esc(r.c.n)}</b>${STOCK[k] ? `<span class="chip">en bodega</span>` : ""}</div><div class="rm small">${fmt(wkDate(r.when))} · ${r.uso === "semillero" ? "semillero → " : "cama "}<b>${esc(r.bed)}</b> · ${esc(r.q)}</div></li>`; }).join("") || `<li class="muted">No hay siembras en estas semanas.</li>`}</ul>
  <div class="scroll only-wide"><table class="stack"><thead><tr><th>Cultivo</th><th>Se usa</th><th>Dónde</th><th class="r">Cantidad</th><th>Cama</th></tr></thead><tbody>
  ${items.map(r => `<tr><td><span class="dot" style="background:${r.c.c}"></span> ${esc(r.c.n)}</td>${td("Se usa", fmt(wkDate(r.when)), "num")}${td("Dónde", r.uso + (STOCK[Object.keys(CROPS).find(k => CROPS[k] === r.c)] ? ` <span class="chip">en bodega</span>` : ""), "small")}${td("Cantidad", r.q, "r num")}${td("Cama", r.bed, "num small")}</tr>`).join("") || `<tr><td colspan="5" class="muted">No hay siembras en estas semanas.</td></tr>`}
  </tbody></table></div></section>
  <details class="fold yr"><summary><span class="fs"><b>Lista de compra del año</b><span class="small muted">${yrList.filter(([k]) => !STOCK[k]).length} por comprar · ${yrList.filter(([k]) => STOCK[k]).length} en bodega · toca para ver</span></span></summary><div class="yrb">
  <ul class="rows only-narrow">${yrList.map(([k, r]) => `<li><div class="rh"><span class="dot" style="background:${CROPS[k].c}"></span><b>${esc(CROPS[k].n)}</b>${STOCK[k] ? `<span class="chip">✓ En bodega</span>` : `<span class="chip warn">Comprar</span>`}</div><div class="rm small">desde ${fmt(wkDate(r.first))} · ${esc(yq(k, r))}${STOCK[k] && STOCK[k] !== CROPS[k].n ? ` · ${esc(STOCK[k])}` : ""}</div></li>`).join("")}</ul>
  <div class="scroll only-wide"><table class="stack"><thead><tr><th>Cultivo</th><th>Estado</th><th>Primera siembra</th><th class="r">Semilla para el año</th></tr></thead><tbody>
  ${yrList.map(([k, r]) => `<tr><td><span class="dot" style="background:${CROPS[k].c}"></span> ${esc(CROPS[k].n)}${STOCK[k] && STOCK[k] !== CROPS[k].n ? ` <span class="muted small">· ${esc(STOCK[k])}</span>` : ""}</td>${td("Estado", STOCK[k] ? `<span class="chip">✓ En bodega</span>` : `<span class="chip warn">Comprar</span>`)}${td("Primera siembra", fmt(wkDate(r.first)), "num small")}${td("Semilla", yq(k, r), "r num small")}</tr>`).join("")}
  </tbody></table></div>
  <p class="small muted" style="margin:8px 0 0">"En bodega": revisar que alcance para la cantidad indicada y que la semilla tenga menos de 2 años. Las hierbas perennes no se compran: se dividen las que ya existen.</p></div></details>
  <section class="panel"><h3 style="margin-bottom:8px">En bodega, fuera del plan de camas</h3><div class="scroll"><table class="stack"><tbody>${EXTRA_SEEDS.map(x => `<tr><td class="nw"><b>${esc(x.n)}</b></td><td class="small"><span class="v">${esc(x.uso)}</span></td></tr>`).join("")}</tbody></table></div></section>
  <details class="panel fold-p"><summary><h3>Material del semillero (una sola vez)</h3></summary>
  <ul class="small" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px">
    <li><b>Charolas: 30 de 200 cavidades (ya compradas)</b>. Máximo ${maxTrays} en uso a la vez; sobran para la experiencia "Planta y llévatela"</li>
    <li>Mesa de semillero (ya existe), con malla sombra 50% y cerca de una toma de agua</li>
    <li>Sustrato: 2 partes de fibra de coco o peat moss + 1 parte de composta cernida + 1 de perlita</li>
    <li>Manta térmica o plástico para tapar las charolas en noches de helada (dic–feb)</li>
    <li>Regadera de flor fina y etiquetas con cultivo, cama y fecha</li>
  </ul></details>
  <p class="small muted" style="margin:0;max-width:70ch">Para semilla directa, la bolsa indica cuántos metros de hilera rinde; comprar con margen y guardar en lugar fresco y seco. No se compran plántulas: todo lo que va trasplantado sale del semillero.</p>`;
};

views.semillero = () => {

  const used = new Set(act.map(p => p.crop + p.bed)).size;
  const N = PLAN_WEEKS, pct = x => x / N * 100;
  const rowStatus = p => w < p.ts ? ["Por sembrar", ""] : w < p.s - 1 ? ["En charola", "ok"] : w === p.s - 1 ? ["Endurecer", "warn"] : ["Trasplantado", ""];
  return `
  <div class="vtop">${weekStepper("sdl", w, `Semillero · semana ${w + 1}`)}
    ${sowNow.length ? `<div class="bar small"><span class="chip warn">Sembrar esta semana: ${[...new Set(sowNow.map(p => shortName(p.c.n)))].map(esc).join(", ")}</span></div>` : ""}
  </div>

  <div class="cols">
    <section class="panel">

/* ---------- tareas ---------- */
const KLAB = {semillero:"Semillero",prep:"Preparar",siembra:"Siembra",cuidado:"Cuidado",base:"Rutina",cosecha:"Cosecha"};
const DSH = ["dom","lun","mar","mié","jue","vie","sáb"];
const dShort = iso => { const x = D(iso); return DSH[x.getDay()] + " " + fmt(x); };

// Estado de cada tarea (tabla hechas, por semana): hecho | no_aplica | no | ayuda | movida (nota = fecha destino) | llega (tarea movida a esta semana, txt = JSON).
const NOPE = [["plaga", "plaga o animales"], ["clima", "clima"], ["material", "falta material"], ["tiempo", "no hubo tiempo"]];
const tst = id => { const r = (state.tst || {})[id]; return !r || r.e === "llega" ? null : r; };

const isDone = t => (tst(t.id) || {}).e === "hecho";

// Tareas que llegaron movidas a esta semana (filas mv-…), ya convertidas en tareas normales.
function movedIn(w){
  if (state.tstW !== w) return [];
  const out = [];
  Object.entries(state.tst || {}).forEach(([id, r]) => { if (!id.startsWith("mv-") || !r.txt) return; try { const j = JSON.parse(r.txt); if (j && j.t && j.d) out.push({id, w, d: +j.d, t: j.t, k: KLAB[j.k] ? j.k : "base", b: j.b || "", min: +j.min || 0, from: j.from || "", hv: !!j.hv, mv: true, txt: r.txt}); } catch (e) {} });
  return out;
}
// Lista de un día: tareas del plan (sin las de cosecha por cama), la tarea de cosecha lun/mié/vie y las que llegaron movidas.
function dayList(w, d){
  const T = weekTasks(plan, w), first = w === 0 && typeof FIRST_DAY !== "undefined" ? FIRST_DAY : 1;
  if (d < first) return movedIn(w).filter(t => t.d === d);
  const out = T.filter(t => t.k !== "cosecha" && t.d === d);
  if ([1, 3, 5].includes(d) && T.some(t => t.k === "cosecha")) out.unshift({id: "hv" + d, d, k: "cosecha", t: "Cosecha para cocina antes de las 10:00: pesar y anotar lo que se lleva", min: 0, hv: true});
  out.forEach(t => t.w = w);
  return out.concat(movedIn(w).filter(t => t.d === d));
}
function moveTarget(t, n){
  let w = t.w, d = t.d;
  if (n === 1) { d++; if (d > 5) { w++; d = 1; } } else w++;
  return w >= PLAN_WEEKS ? null : mkTarget(t, w, d);
}
function mkTarget(t, w, d){
  const iso = isoDay(w, d), o = {t: t.t, k: t.k, b: t.b || undefined, min: Math.round(t.min || 0), d, from: isoDay(t.w, t.d), hv: t.hv ? 1 : undefined};
  let txt = JSON.stringify(o);
  while (txt.length > 300 && o.t.length > 1) { o.t = o.t.slice(0, Math.max(1, o.t.length - (txt.length - 300) - 2)) + "…"; txt = JSON.stringify(o); }
  return {w, d, iso, id: `mv-${t.w}-${t.id}`, txt};
}
function statusWords(t){
  const s = tst(t.id), n = s && s.n ? esc(s.n) : "";
  const pre = t.mv ? `⏭ de ${esc(dShort(t.from))}` : "";
  let w = "", c = "";
  if (s) {
    if (s.e === "no_aplica") { w = "✗ No aplica" + (n ? ": " + n : ""); }
    else if (s.e === "no") { w = "✗ No se pudo" + (n ? ": " + n : ""); c = "bad"; }
    else if (s.e === "ayuda") { w = "Pidió ayuda" + (n ? ": " + n : ""); c = "warn"; }
    else if (s.e === "movida") { w = "⏭ Movida al " + esc(dShort(s.n)); }
    else if (s.e === "hecho" && n) w = n;
  }
  const all = [pre, w].filter(Boolean).join(" · ");
  return all ? `<span class="why ${c}">${all}</span>` : "";
}
function taskRow(t, pre){
  (state.tmap = state.tmap || {})[t.id] = t;
  const s = tst(t.id), done = s && s.e === "hecho", closed = s && ["no", "no_aplica", "movida"].includes(s.e), open = state.topen === t.id;
  const lbl = s && !done ? ({no: "No se pudo", no_aplica: "No aplica", movida: "Movida", ayuda: "Pidió ayuda"})[s.e] : "";
  return `<div class="taskw${done ? " done" : ""}${closed ? " nope" : ""}${open ? " open" : ""}"><label class="task${done ? " done" : ""}"><input type="checkbox" data-id="${esc(t.id)}" ${done ? "checked" : ""}${lbl ? ` aria-label="${lbl}"` : ""}><span class="th"><span class="k ${t.k}">${KLAB[t.k]}</span>${t.b ? `<b class="crop">${esc(t.b)}</b>` : ""}${t.min ? `<span class="t">(${tmin(t.min)})</span>` : ""}</span><span class="tx">${esc(t.t)}${statusWords(t)}</span></label><button type="button" class="tmore" data-more="${esc(t.id)}" aria-expanded="${open}" aria-label="Marcar la tarea como…">⋯</button>
  ${t.hv && !s ? `<a class="tgo" href="#cosecha" data-go="cosecha">Abrir cosecha ›</a>` : ""}

}
function taskPanel(t, s){

    <select class="tsel" aria-label="Marcar como">

      ${opt("mv7", m7 ? `⏭ Mover a la próxima semana (${dShort(m7.iso)})` : "⏭ Mover a la próxima semana (fin del plan)", !m7)}
      ${opt("ayuda", "✋ Pedir ayuda")}${opt("otro", "Otro motivo…")}${s ? opt("clear", "↺ Quitar la marca") : ""}

}
function bindTasks(root){
  root.querySelectorAll(".task input").forEach(cb => cb.addEventListener("change", () => { const t = state.tmap[cb.dataset.id]; if (t) applyStatus(t, cb.checked ? "hecho" : "clear", "", {quiet: true}); }));

  root.querySelectorAll("[data-go]").forEach(a => a.onclick = e => { e.preventDefault(); go(a.dataset.go); });
  root.querySelectorAll(".taskw.open").forEach(w => {
    const t = state.tmap[w.querySelector("[data-more]").dataset.more], inp = w.querySelector(".tnote"), sel = w.querySelector(".tsel"), ob = w.querySelector("[data-tother]"), er = w.querySelector("[data-terr]");
    const saveOther = () => { const n = inp.value.trim(); if (!n) { er.hidden = false; inp.classList.add("invalid"); inp.focus(); return; } state.topen = null; applyStatus(t, "no", n); };

// Aplica un estado (y lo deshace): escribe la fila de la tarea y, al mover, la fila destino mv-<semana>-<id> en la semana destino.
async function applyStatus(t, choice, note, o = {}){
  state.tst = state.tst || {};
  const id = t.id, w = t.w, prev = state.tst[id] ? {...state.tst[id]} : null;
  const keep = t.mv ? {txt: t.txt} : {};
  const ops = [], undo = [];
  let row = null, msg = "";
  if (prev && prev.e === "movida" && prev.n) {
    const old = isoWD(prev.n), tg = mkTarget(t, old.w, old.d);
    { ops.push(["del", old.w, tg.id]); undo.push(["set", old.w, tg.id, {estado: "llega", nota: "", txt: tg.txt}]); }
  }
  const n = String(note || "").slice(0, 160);
  if (choice === "clear") { row = t.mv ? {estado: "llega", nota: "", txt: t.txt} : null; msg = "Marca quitada"; }
  else if (choice === "hecho") { row = {estado: "hecho", nota: n}; msg = "Tarea hecha"; }
  else if (choice === "no_aplica") { row = {estado: "no_aplica", nota: n}; msg = "Cerrada: no aplica"; }
  else if (choice === "ayuda") { row = {estado: "ayuda", nota: n, txt: t.mv ? t.txt : ((t.b ? t.b + ": " : "") + t.t).slice(0, 300)}; msg = "Ayuda pedida"; }
  else if (choice === "no" || choice.startsWith("no:")) { const r = (NOPE.find(x => "no:" + x[0] === choice) || [])[1]; row = {estado: "no", nota: [r, n].filter(Boolean).join(" · ").slice(0, 200)}; msg = "Anotado: no se pudo" + (r ? " (" + r + ")" : ""); }
  else if (choice === "mv1" || choice === "mv7") {
    const tg = moveTarget(t, choice === "mv1" ? 1 : 7); if (!tg) return;
    row = {estado: "movida", nota: tg.iso};
    ops.push(["set", tg.w, tg.id, {estado: "llega", nota: "", txt: tg.txt}]); undo.push(["del", tg.w, tg.id]);
    msg = "Movida al " + dShort(tg.iso);
  } else return;

  const before = {...state.tst};
  const local = list => list.forEach(([op, ww, k, d]) => { if (ww !== state.tstW) return; if (op === "del") delete state.tst[k]; else state.tst[k] = {e: d.estado, n: d.nota || "", txt: d.txt || ""}; });
  const remote = async list => { for (const [op, ww, k, d] of list) { const ref = state.db.doc(`hechas/w${ww}-${k}`); if (op === "del") await ref.delete(); else await ref.set({w: ww, id: k, ...d, at: Date.now()}); } };
  local(ops); syncDone(); rerenderTasks();
  if (!state.db) return;
  try { await remote(ops); }
  catch (e) { state.tst = before; syncDone(); rerenderTasks(); saveErr(e, "No se pudo guardar la tarea."); return; }
  if (o.quiet) return;
  toast(msg, {action: "Deshacer", ms: 5000, on: async () => {
    const b2 = {...state.tst}; local(undo); syncDone(); rerenderTasks();
    try { await remote(undo); toast("Deshecho"); } catch (e) { state.tst = b2; syncDone(); rerenderTasks(); saveErr(e, "No se pudo deshacer. Revisa la conexión."); }
  }});
}
const syncDone = () => { const d = {}; Object.entries(state.tst || {}).forEach(([k, r]) => { if (r.e === "hecho") d[k] = true; }); state.done = d; };

const typing = () => { if (document.querySelector(".pinsheet:not([hidden])")) return true; const a = document.activeElement; return !!a && a.matches("input:not([type=checkbox]):not([type=radio]), textarea, select"); };
let unsubDone = null;
function subscribeDone(){
  if (!state.db) return;

  state.tst = {}; state.tstW = w; syncDone();

}

const TITLES = {cocina: "Cocina", mensajes: "Mensajes con cocina", pedidos: "Pedidos de cocina", insumos: "Compras y banco de semillas", censo: "Censo de camas", hoy: "Hoy", semillero: "Semillero", experiencias: "Experiencias", semana: "Semana", mapa: "Mapa del mes", cosecha: "Cosecha", calendario: "Calendario", cultivos: "Cultivos", compras: "Semillas que pide el plan", registro: "Registro de cosecha"};

function render(){
  const main = document.getElementById("main");

  const kept = {}; main.querySelectorAll("[data-keep]").forEach(e => { kept[e.dataset.keep] = e.value; });
  main.innerHTML = `<div class="view">${views[state.view]()}</div>`;
  const restored = {}; main.querySelectorAll("[data-keep]").forEach(e => { const k = e.dataset.keep; if (k in kept && e.value !== kept[k]) { e.value = kept[k]; restored[k] = 1; } });

  document.querySelectorAll("#sheet [data-v]").forEach(b => b.setAttribute("aria-current", b.dataset.v === state.view ? "page" : "false"));
  const kn = (state.pedidos || []).filter(x => x.estado === "nueva").length + (state.msgs || []).filter(m => m.de !== "huerto" && Date.now() - new Date(String(m.at).replace(" ", "T") + "Z") < 2 * DAY).length;
  document.querySelectorAll('nav button[data-v="cocina"]').forEach(b => { let x = b.querySelector(".nb"); if (!kn) { if (x) x.remove(); return; } if (!x) { x = document.createElement("span"); x.className = "nb"; b.appendChild(x); } x.textContent = kn; });
  if (views[state.view].bind) views[state.view].bind(main);
  if (render.keep) window.scrollTo(0, y); else window.scrollTo(0, 0);

}
const sheet = document.getElementById("sheet");
let sheetFrom = null;
function openSheet(from){ sheetFrom = from || null; sheet.hidden = false; const c = sheet.querySelector("[data-close]"); if (c) c.focus(); }
function closeSheet(){ if (sheet.hidden) return; sheet.hidden = true; if (sheetFrom) sheetFrom.focus(); }
function go(v){ sheet.hidden = true; if (v === "hoy") state.hd = null; if (v !== "censo") state.cfrom = null; state.view = v; try { localStorage.setItem("huerto-vista", v); } catch (e) {} if (location.hash.slice(1) !== v) history.pushState(null, "", "#" + v); render.keep = false; render(); }

document.querySelectorAll("nav.tabs button, nav.bottom button").forEach(b => b.onclick = () => { if (b.dataset.v === "mas") { openSheet(b); return; } state.cfrom = null; go(b.dataset.v); });

state.view = window.matchMedia("(max-width: 859px)").matches ? "hoy" : "semana";

}
(async () => {
