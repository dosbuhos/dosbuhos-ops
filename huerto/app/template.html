<title>Huerto Dos Búhos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: cuaderno de campo — barra de vistas arriba, contenido en una columna; el mapa del huerto es la pieza central */
:root{
  --bg:#f2f3ec; --surface:#fbfbf7; --sunk:#e8eadf; --fg:#1d261c; --muted:#5d6656; --faint:#8b927f;
  --line:#d3d7c6; --accent:#9e2a3f; --accent-ink:#ffffff; --soil:#8a6a4c; --soil-2:#c9b49a; --leaf:#3e6b35;
  --ok:#2f7a3a; --warn:#b26a00; --water:#bcd3e0; --water-ink:#3c6176; --tree:#a9bb8d;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131813; --surface:#1b211a; --sunk:#232a21; --fg:#e4e9dc; --muted:#a6ae9b; --faint:#7c8471;
  --line:#343d31; --accent:#e06a80; --accent-ink:#1a0d10; --soil:#b8946f; --soil-2:#5c4a38; --leaf:#8cc27c;
  --ok:#6fc07a; --warn:#e3a33c; --water:#2c4654; --water-ink:#a9cde0; --tree:#3d4d34;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131813; --surface:#1b211a; --sunk:#232a21; --fg:#e4e9dc; --muted:#a6ae9b; --faint:#7c8471;
  --line:#343d31; --accent:#e06a80; --accent-ink:#1a0d10; --soil:#b8946f; --soil-2:#5c4a38; --leaf:#8cc27c;
  --ok:#6fc07a; --warn:#e3a33c; --water:#2c4654; --water-ink:#a9cde0; --tree:#3d4d34;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:18px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px;padding-block:6px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,34px);line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;text-wrap:balance}
h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
.facts{font-size:13px;color:var(--muted);font-family:var(--mono)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;scrollbar-width:none}
nav.tabs button{font:inherit;font-size:14px;font-weight:600;border:1px solid transparent;background:none;color:var(--muted);padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
nav.tabs button:hover:not([aria-selected="true"]){border-color:var(--line);color:var(--fg)}
button:focus-visible,select:focus-visible,input:focus-visible,.bed:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.view{display:flex;flex-direction:column;gap:18px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.stepper{display:flex;align-items:center;gap:6px}
.btn{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.icon{padding:7px 11px;min-width:38px}
select,input{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 10px;border-radius:8px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* carga */
.load{display:flex;flex-direction:column;gap:6px;min-width:220px;flex:1}
.meter{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--leaf);border-radius:5px}
.meter.over i{background:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--fg);white-space:nowrap}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
/* tareas */
.days{display:flex;flex-direction:column;gap:14px}
.day h3{display:flex;justify-content:space-between;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.task{display:flex;gap:10px;align-items:flex-start;padding:7px 2px;border-bottom:1px dashed var(--line)}
.task:last-child{border-bottom:0}
.task input{margin-top:3px;width:18px;height:18px;accent-color:var(--leaf);flex:none;padding:0}
.task label{flex:1;min-width:0;cursor:pointer}
.task .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.k.semillero{color:var(--s1)} .k.prep{color:var(--soil)} .k.siembra{color:var(--leaf)} .k.cuidado{color:var(--warn)} .k.base{color:var(--faint)}
.task.done label{color:var(--faint);text-decoration:line-through}
.task .t{font-family:var(--mono);font-size:12px;color:var(--faint);white-space:nowrap}
.task b.crop{font-weight:700;color:var(--fg)}
.task.done b.crop{color:inherit}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
/* mapa */
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
svg.map{width:100%;height:auto;display:block}
svg.map .wall{stroke:var(--soil);stroke-width:.12;fill:none}
svg.map .tree{fill:var(--tree)}
svg.map .bed{cursor:pointer}
svg.map .bedbox{stroke:var(--fg);stroke-opacity:.55;stroke-width:.08}
svg.map .bed:hover .bedbox,svg.map .bed.sel .bedbox{stroke:var(--accent);stroke-opacity:1;stroke-width:.22}
svg.map text{font-family:var(--body);fill:var(--fg)}
svg.map .lab{font-size:.62px;font-weight:700}
svg.map .crop{font-size:.5px;font-weight:600}
svg.map .seclab{font-family:var(--display);font-size:1.5px;fill:var(--muted)}
svg.map .feat{font-size:.55px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.monthpick{display:flex;flex-wrap:wrap;gap:4px}
.monthpick button{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:5px 9px;border-radius:7px;cursor:pointer}
.monthpick button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bedinfo .row{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.timeline{display:flex;flex-direction:column;gap:8px}

/* mensajes */
.thread{display:flex;flex-direction:column;gap:8px;max-height:62vh;overflow-y:auto;padding:4px 0}
.msg{max-width:85%;padding:9px 12px;border-radius:14px;background:var(--sunk);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.msg.me{align-self:flex-end;background:color-mix(in srgb,var(--leaf) 20%,var(--surface))}
.msg small{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.send{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;margin-top:10px}
.send textarea{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:48px;resize:vertical;background:var(--surface);color:var(--fg)}
/* compras y semillas */
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.li input[type=checkbox]{width:24px;height:24px;accent-color:var(--leaf)}
.li.done .what{color:var(--faint);text-decoration:line-through}
.li .x,.sb .x{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:9px;width:40px;min-height:40px;cursor:pointer}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:6px;margin-top:10px}
.addrow input{font-size:16px;min-height:44px;width:100%;box-sizing:border-box}
.addrow .btn{min-height:44px}
.sb{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px dashed var(--line)}
.sb .top{display:flex;gap:8px;align-items:center;justify-content:space-between}
.lvl{display:flex;gap:4px;flex-wrap:wrap}
.lvl button{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 10px;border-radius:8px;min-height:40px;cursor:pointer}
.lvl button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.lvl button.low[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.sb input{font-size:16px;min-height:42px;width:100%;box-sizing:border-box}

/* censo de camas */
.cc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 10px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:70px}
.cc.saved{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.cch{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cch b{font-size:22px;font-family:var(--serif, Georgia, serif);font-weight:400}
.cch .chip{margin-left:auto}
.cbar{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:repeating-linear-gradient(135deg,var(--sunk) 0 6px,var(--surface) 6px 12px)}
.cbar i{display:flex;align-items:center;justify-content:center;height:100%;border-right:2px solid var(--surface);font-style:normal;font-size:11.5px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);overflow:hidden;white-space:nowrap;padding:0 4px;min-width:0;line-height:1.05;text-align:center}
.cbar i:last-child{border-right:0}
.cbar .vac{flex:1;color:var(--muted);text-shadow:none;font-weight:600;background:none}
.cends{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:-6px;letter-spacing:.04em;text-transform:uppercase}
.cl{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.cl .sw{grid-row:1 / span 3;align-self:stretch;border-radius:3px}
.cl .mrow-old{grid-column:2 / -1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cl .mrow .lab{font-size:13px;color:var(--muted)}
.cl .mrow .lnk{margin-left:auto}
.cl select,.cl input{font-size:16px;min-height:40px;width:100%;box-sizing:border-box;padding:6px 8px}
.cl select.crop{font-weight:700;font-size:17px;min-height:44px}
.cl select.crop.empty{font-weight:400;color:var(--muted)}
.cl .mstep{grid-column:2 / -1}.mstep{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.mstep button{border:0;background:var(--sunk);font-size:18px;width:32px;min-height:40px;cursor:pointer;color:var(--fg);padding:0}
.mstep select{border:0;border-radius:0;width:auto !important;min-width:62px;text-align:center;font-weight:700;padding:0 2px;background:var(--surface);-webkit-appearance:none;appearance:none;text-align-last:center}
.cl .x{border:0;background:none;color:var(--faint);width:28px;min-height:40px;font-size:18px;cursor:pointer;padding:0}
.cl .more{grid-column:2 / -1;display:flex;gap:6px;align-items:center}
.cl .more select{flex:1}
.cl .more input,.cl .more select{min-height:38px;font-size:15px}
.cl .more .fe{max-width:128px;font-size:14px;padding:4px 6px}
.lnk{border:0;background:none;color:var(--muted);font-size:13px;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;grid-column:2 / -1;justify-self:start}
.cfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:6px;border-top:1px dashed var(--line)}
.cfoot .btn{min-height:40px;font-size:14px}
.cends .rest{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:600;color:var(--muted)}
.cends .rest.full{color:var(--ok)}
.cends .over{color:var(--danger, #b3261e);font-weight:700}
.cfoot{flex-wrap:nowrap}
.kseg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--sunk);padding:4px;border-radius:12px}
.kseg button{min-height:42px;border:0;border-radius:9px;background:none;font:inherit;font-weight:700;font-size:14.5px;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.kseg button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.kb{min-width:20px;height:20px;border-radius:10px;background:var(--danger, #b3261e);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.kalerts{display:flex;flex-direction:column;gap:8px}
.kal{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);border-left:4px solid var(--muted);background:var(--surface);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer;color:var(--fg)}
.kal span{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}.kal.warn{border-left-color:#c98a00}.kal.bad{border-left-color:var(--danger, #b3261e)}
.kper{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.kper button{min-height:38px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font:inherit;font-size:13.5px;font-weight:600;color:var(--fg);cursor:pointer}
.kper button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.ktiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:860px){.ktiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kt>span{font-size:12.5px;color:var(--muted);font-weight:600}.kt b{font-size:22px;font-variant-numeric:tabular-nums}.kt b small{font-size:13px;font-weight:600;color:var(--muted)}
.kt>small{font-size:12px;color:var(--muted)}.kt i{display:block;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}.kt i em{display:block;height:100%;background:var(--ok)}
.kr{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.kr1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.kr1 .dot{width:10px;height:10px;border-radius:3px;flex:none}.kr1 b{flex:1 1 auto;min-width:0}
.kr1 .km{font-weight:700;font-variant-numeric:tabular-nums}.kr1 .kv{font-size:13px}
.kbars{display:flex;flex-direction:column;gap:3px}.kbars i{display:block;height:7px;border-radius:4px;min-width:2px}
.kbars .e,.klg .e{background:color-mix(in srgb,var(--muted) 35%,transparent)}.kbars .g,.klg .g{background:var(--ok)}
.klg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 3px 0 8px;vertical-align:-1px}
.kn b{color:var(--fg)}
.krest{border-top:1px solid var(--line);padding-top:8px}.krest>summary{min-height:40px;display:flex;align-items:center;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}.kq{padding:6px 0;border-top:1px dashed var(--line)}
.kf{font-size:13px;font-weight:600;padding:4px 8px;border-radius:6px;background:var(--sunk);align-self:flex-start}.kf.bad{color:var(--danger, #b3261e)}.kf.warn{color:#8a5c00}.kf.ok{color:var(--ok)}
.bar>div:has(>.mnav){flex:1 1 100%;min-width:0}
.mnav{width:100%;max-width:440px;display:flex;align-items:center;gap:6px;margin-top:2px}
.mnav h2{flex:1;min-width:0;text-align:center;margin:0}
.mnav button{flex:none;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font-size:24px;line-height:1;cursor:pointer}
.mnav button:disabled{opacity:.35;cursor:default}
.zsel{display:flex;align-items:center;gap:8px;margin:0}.zsel span{font-size:13px;font-weight:600;color:var(--muted)}.zsel select{flex:1;min-height:44px;font-weight:600}
.chead{display:flex;flex-direction:column;gap:8px}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
@media (min-width:1000px){.cgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cbar i{flex-direction:column;line-height:1.15;min-width:0}.cbar i .bn{max-width:100%;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.cfoot .lnk{min-height:40px;display:inline-flex;align-items:center}
.cl .ldet{grid-column:2 / -1;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.cl .ldet>summary{display:flex;align-items:center;gap:8px;min-height:42px;padding:6px 10px;cursor:pointer;list-style:none;font-size:13.5px}
.cl .ldet>summary::-webkit-details-marker{display:none}
.cl .ldet .ds{flex:1;min-width:0;color:var(--fg);overflow-wrap:anywhere}.cl .ldet .ds.empty{color:var(--muted)}
.cl .ldet .de{flex:none;font-weight:700;color:var(--accent, var(--fg));font-size:13px}.cl .ldet .de::after{content:" ▾"}.cl .ldet[open] .de::after{content:" ▴"}
.cl .ldet[open]>summary{border-bottom:1px solid var(--line)}
.cl .ldb{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:10px}
.cl .ldb>*{grid-column:1 / -1 !important}
.cl .sown{grid-column:2 / -1;display:flex;flex-direction:column;gap:6px;margin-top:2px}
.cl .sown .q{font-size:13px;font-weight:600;color:var(--fg)}.cl .sown .q small{font-weight:400;color:var(--muted)}
.dq{display:flex;flex-wrap:wrap;gap:6px}
.dq button{min-height:38px;padding:4px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font:inherit;font-size:13.5px;font-weight:600;color:var(--fg);cursor:pointer}
.dq button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.cl .sown .hint{font-size:12.5px;color:var(--muted)}.cl .sown .hint b{color:var(--fg)}
.cl .cos{grid-column:2 / -1;display:flex;flex-direction:column;gap:6px;margin:0}
.cl .cos .q{font-size:13px;font-weight:600;color:var(--fg)}.cl .cos .q small{font-weight:400;color:var(--muted)}
.cl .cos .hint{font-size:12.5px;color:var(--muted)}.cl .cos .hint:empty{display:none}.cl .cos .hint b{color:var(--fg)}
.cl .nota{grid-column:2 / -1;font-size:15px;min-height:42px}
.cl .nota::placeholder{color:var(--faint)}
.cprog{display:block;font-size:14px;color:var(--muted)}.cprog b{color:var(--fg)}
.cprog .pbar{display:block;margin-top:6px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}.cprog .pbar i{display:block;height:100%;background:var(--ok)}
.cl{grid-template-columns:6px minmax(0,1fr);row-gap:8px}

<script>
/*DATA*/
/*ENGINE*/
const GEO = /*GEO*/;
const CAT = {hojas:["Hojas","--s1"],raices:["Raíces","--s2"],legum:["Leguminosas","--s3"],frutos:["Frutos","--s4"],hierbas:["Hierbas","--s5"],quelites:["Quelites","--s6"]};
const CROPCAT = {kale:"hojas",acelga:"hojas",mostaza:"hojas",col:"hojas",lechuga:"hojas",arugula:"hojas",poro:"raices",zanahoria:"raices",betabel:"raices",rabano:"raices",ajo:"raices",papa:"raices",haba:"legum",chicharo:"legum",ejote:"legum",calabacita:"frutos",jitomate:"frutos",pepino:"frutos",chile:"frutos",cilantro:"hierbas",eneldo:"hierbas",albahaca:"hierbas",perennes:"hierbas",perejil:"hierbas",mexicanas:"hierbas",quelites:"quelites",verdolaga:"quelites",huauzontle:"quelites",milpa:"quelites"};
const DIAS = ["Cosecha","Lunes","Martes","Miércoles","Jueves","Viernes"];
const CAP_H = 40;
const plan = buildPlan();
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nf = (v, d = 0) => v.toLocaleString("es-MX", {maximumFractionDigits: d, minimumFractionDigits: d});
const todayW = (() => { const t = new Date(); t.setHours(12); return Math.floor((t - D(PLAN_START)) / (7 * DAY)); })();
const state = {view: "semana", w: Math.min(Math.max(todayW, 0), PLAN_WEEKS - 1), month: null, bed: null, done: {}, flags: {}, harvests: [], reports: [], upd: null, msgs: [], pedidos: [], pvotos: [], lista: [], bank: null, censo: {}, cdraft: {}, czone: null, cfocus: null, db: null, dbTried: false};
(function initMonth(){ const d = wkDate(state.w); d.setDate(d.getDate() + 2); state.month = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); })();
const MONTHS = (() => { const m = []; for (let i = 0; i < 13; i++) { const d = new Date(2026, 9 + i, 15); m.push(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")); } return m; })();
const monthLabel = k => { const [y, m] = k.split("-").map(Number); return MESL[m - 1] + " " + y; };
const monthStepper = () => { const i = MONTHS.indexOf(state.month); return `<div class="mnav" role="group" aria-label="Mes"><button type="button" data-ms="-1" aria-label="Mes anterior"${i <= 0 ? " disabled" : ""}>‹</button><h2 aria-live="polite">${monthLabel(state.month)}</h2><button type="button" data-ms="1" aria-label="Mes siguiente"${i >= MONTHS.length - 1 ? " disabled" : ""}>›</button></div>`; };
const bindMonthStepper = root => root.querySelectorAll("[data-ms]").forEach(b => b.onclick = () => { const i = MONTHS.indexOf(state.month) + +b.dataset.ms; if (MONTHS[i]) { state.month = MONTHS[i]; render(); } });
const monthShort = k => { const [y, m] = k.split("-").map(Number); return MES[m - 1] + (m === 1 || k === MONTHS[0] ? " " + String(y).slice(2) : ""); };
const weekRange = w => { const a = wkDate(w), b = wkDate(w); if (w === 0 && typeof FIRST_DAY !== "undefined") a.setDate(a.getDate() + FIRST_DAY - 1); b.setDate(b.getDate() + 4); return fmt(a) + " – " + fmt(b) + " " + b.getFullYear(); };
const weekOfMonth = k => { const [y, m] = k.split("-").map(Number); const mid = new Date(y, m - 1, 15, 12); return Math.max(0, Math.min(PLAN_WEEKS - 1, Math.floor((mid - D(PLAN_START)) / (7 * DAY)))); };

function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }

/* ---------- mapa ---------- */
const Y0 = 93.5, X0 = 11.5;
const ZONES = [["todo", "Todo"], ["A-NO", "A1–A6"], ["A-NE", "A7–A12"], ["A-SO", "A13–A18"], ["A-SE", "A19–A24"], ["B", "Sección B"], ["I", "Invernaderos"]];
function zoneBox(z){
  if (!z || z === "todo") return [0, 0, 39, 91];
  const ids = BEDS.filter(b => z === "B" ? b.sec === "B" : b.q === z).map(b => b.id);
  const bs = GEO.beds.filter(b => ids.includes(b.id));
  const x0 = Math.min(...bs.map(b => b.x)) - X0, x1 = Math.max(...bs.map(b => b.x + b.w)) - X0;
  const y0 = Y0 - Math.max(...bs.map(b => b.y + b.h)), y1 = Y0 - Math.min(...bs.map(b => b.y));
  const pad = z === "B" ? 1.6 : 1.2;
  return [x0 - pad - (z === "B" ? .8 : 0), y0 - pad - .6, x1 - x0 + 2 * pad + (z === "B" ? .8 : 0), y1 - y0 + 2 * pad + .6];
}
function zonePicker(id){ return `<label class="zsel"><span>Zona</span><select data-zones="${id}" aria-label="Zona del mapa">${ZONES.map(([k, l]) => `<option value="${k}"${(state.zone || "todo") === k ? " selected" : ""}>${k === "todo" ? "Todo el huerto" : l}</option>`).join("")}</select></label>`; }
function bindZones(root, after){ root.querySelectorAll("select[data-zones]").forEach(s => s.onchange = () => { state.zone = s.value; try { localStorage.setItem("huerto-zona", state.zone); } catch (e) {} after(); }); }
function mapSVG(opts){
  // opts.fill(bedId) -> {fill, op, hatch, crop}
  const W = 39, H = 91;
  const vb = zoneBox(state.zone);
  let s = `<svg class="map" viewBox="${vb.join(" ")}" role="img" aria-label="Mapa de camas del huerto">
  <defs><pattern id="hatch" width=".6" height=".6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width=".6" height=".6" fill="var(--soil-2)"/><line x1="0" y1="0" x2="0" y2=".6" stroke="var(--soil)" stroke-width=".22"/></pattern></defs>`;
  for (const l of GEO.lines) s += `<line class="wall" x1="${l[0]-X0}" y1="${Y0-l[1]}" x2="${l[2]-X0}" y2="${Y0-l[3]}"/>`;
  for (const t of GEO.trees) s += `<circle class="tree" cx="${t[0]-X0}" cy="${Y0-t[1]}" r="1.3"/>`;
  const [fx, fy, fr] = GEO.fuente;
  s += `<circle cx="${fx-X0}" cy="${Y0-fy}" r="${fr}" fill="var(--water)" stroke="var(--water-ink)" stroke-width=".1"/><text class="feat" x="${fx-X0}" y="${Y0-fy+.2}" text-anchor="middle" fill="var(--water-ink)">fuente</text>`;
  // invernaderos VEVOR (donde estaban las tinas)
  for (const [x, y, w, h, lab] of (GEO.tuneles || [])) {
    const gx = x - X0, gy = Y0 - y - h;
    s += `<rect x="${gx}" y="${gy}" width="${w}" height="${h}" rx="1" fill="#7cc4a0" fill-opacity=".35" stroke="#3f8f6a" stroke-width=".14"/>`;
    for (let k = 1; k < 7; k++) s += `<line x1="${gx + k * w / 7}" y1="${gy + .08}" x2="${gx + k * w / 7}" y2="${gy + h - .08}" stroke="#3f8f6a" stroke-opacity=".55" stroke-width=".07"/>`;
    s += `<text class="feat" x="${gx + w / 2}" y="${Y0 - y + 1.1}" text-anchor="middle">${lab}</text>`;
  }
  for (const [x, y, w, h, lab] of (GEO.mesas || [])) s += `<rect x="${x-X0}" y="${Y0-y-h}" width="${w}" height="${h}" rx=".12" fill="var(--soil-2)" stroke="var(--soil)" stroke-width=".1"/><text class="feat" x="${x-X0+w/2}" y="${Y0-y-h/2+.25}" text-anchor="middle">${lab}</text>`;
  if (false) for (const [x, lab] of []) s += `<circle cx="${x-X0}" cy="${Y0-31.6}" r=".85" fill="var(--sunk)" stroke="var(--fg)" stroke-width=".08"/><text class="feat" x="${x-X0}" y="${Y0-31.6+1.75}" text-anchor="middle">${lab}</text>`;
  s += `<text class="seclab" x="${31.03-X0}" y="${Y0-91.4}" text-anchor="middle">Sección A · granados</text>`;
  s += `<text class="seclab" x="${31.03-X0}" y="${Y0-4.4}" text-anchor="middle">Sección B · limones eureka</text>`;
  s += `<text class="feat" x="1.4" y="1.8">↑ N</text>`;
  for (const b of GEO.beds) {
    let f = opts.fill(b.id);
    const B = BED[b.id];
    const segs = Array.isArray(f) ? f : [Object.assign({pos: 0, m: B.len}, f)];
    const x = b.x - X0, y = Y0 - b.y - b.h, vert = b.h > b.w;
    const cx = x + b.w / 2, cy = y + b.h / 2;
    let inner = `<rect class="bedbox" x="${x}" y="${y}" width="${b.w}" height="${b.h}" rx=".12" fill="var(--surface)"/>`;
    const labs = [];
    segs.forEach(sg => {
      if (!sg.fill && !sg.hatch) return;
      const a = sg.pos / B.len, l = sg.m / B.len;
      const rx = vert ? x : x + a * b.w, ry = vert ? y + a * b.h : y, rw = vert ? b.w : l * b.w, rh = vert ? l * b.h : b.h;
      inner += `<rect x="${rx + .04}" y="${ry + .04}" width="${Math.max(0, rw - .08)}" height="${Math.max(0, rh - .08)}" fill="${sg.hatch ? "url(#hatch)" : sg.fill}" fill-opacity="${sg.op ?? 1}"/>`;
      if (sg.crop && sg.m >= (vert ? .9 : 1.8)) {
        const tc = sg.ink || "var(--fg)";

const EST = {limpia: "Limpia", lista: "Lista para sembrar", sembrada: "Sembrada"};

const fmtISO = iso => { if (!iso) return ""; const [y, m, d] = iso.split("-").map(Number); return d + " " + MES[m - 1]; };
function cropOptions(){
  const skip = {semilla: 1, vegetales: 1, floresmix: 1};
  const keys = new Set([...PLANTINGS.map(x => x[1]), ...Object.keys(typeof STOCK !== "undefined" ? STOCK : {})].filter(k => CROPS[k] && !skip[k]));
  const known = [...keys].map(k => ({v: k, n: CROPS[k].n}));
  const extra = [...new Set(state.reports.filter(r => r.cultivo && !CROPS[r.cultivo]).map(r => r.cultivo))].map(n => ({v: n, n}));
  return [...known, ...extra].sort((a, b) => a.n.localeCompare(b.n, "es"));
}
function estHarvest(crop, fecha){
  const c = CROPS[crop]; if (!c || !fecha || !c.sem) return "";
  const d = D(fecha); d.setDate(d.getDate() + Math.round(c.sem * factor(fecha, c) * 7));
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function sideNames(bed){ return BED[bed].sec === "A" ? ["Mitad norte", "Mitad sur"] : ["Mitad oeste", "Mitad este"]; }
function repWhere(r){
  const B = BED[r.cama]; if (!B) return "";
  if (r.m >= B.len - 1e-9) return "toda la cama";

  if (r.pos != null && Math.abs(r.pos - B.len / 2) < .01 && Math.abs(r.m - B.len / 2) < .01) return b.toLowerCase();
  return nf(r.m, 1) + " m";
}

/* ---------- COCINA: pedidos, mensajes y lo que la cocina usa vs. lo que se siembra ---------- */
const hW = iso => Math.floor((D(iso) - wkDate(0)) / (7 * DAY));
const recentDays = (at, n) => { const d = new Date(String(at).replace(" ", "T") + "Z"); return Date.now() - d < n * DAY; };
function kitchenStats(weeks){
  const w1 = nowW(), w0 = Math.max(0, w1 - weeks + 1), rows = {};
  const row = k => rows[k] = rows[k] || {k, c: CROPS[k], m: 0, exp: 0, got: 0, gotCocina: 0, up: 0, down: 0, notes: []};
  plan.P.forEach(p => {
    if (/^Decorativa/.test(p.c.menu || "")) return;
    if ((p.ex || p.s <= w1) && p.end >= w1) row(p.crop).m += p.m;                       // metros en tierra hoy
    if (!p.c.nokg) for (let w = Math.max(w0, p.h0); w <= Math.min(w1, p.end); w++) row(p.crop).exp += p.c.kg * p.scale; // esperado en el periodo
  });
  const keyOf = c => CROPS[c] ? c : (Object.entries(CROPS).find(([k, x]) => x.n.toLowerCase() === String(c).toLowerCase()) || [])[0];
  (state.harvests || []).forEach(h => { const w = hW(h.fecha || ""); const k = keyOf(h.cultivo); if (!k || !(w >= w0 && w <= w1)) return; const r = row(k); r.got += +h.cantidad || 0; if (h.quien === "cocina") r.gotCocina += +h.cantidad || 0; });
  (state.pvotos || []).forEach(x => { const k = keyOf(x.cultivo); if (!k || !x.voto) return; const r = row(k); if (x.voto.voto === 1) r.up++; else { r.down++; if (x.voto.nota) r.notes.push(x.voto.nota); } });
  const list = Object.values(rows).filter(r => r.m > 0 || r.got > 0 || r.exp > 0 || r.down);
  const anyGot = list.some(r => r.got > 0);
  list.forEach(r => { r.pct = r.exp > 0 ? r.got / r.exp : null; r.kgm = r.m > 0 ? r.got / r.m : null;
    r.flag = r.down ? ["La cocina dijo que no lo necesita", "bad"] : anyGot && !r.c.nokg && r.exp >= 2 && r.got < r.exp * 0.4 ? ["Se cosecha mucho menos de lo esperado", "warn"] : r.exp > 0 && r.got > r.exp * 1.3 ? ["La cocina usa más de lo que se siembra", "ok"] : null; });
  const total = BEDS.reduce((a, b) => a + BED[b.id].len, 0);
  return {anyGot, list: list.sort((a, b) => (b.exp + b.got > 0) - (a.exp + a.got > 0) || (a.c.nokg ? 1 : 0) - (b.c.nokg ? 1 : 0) || (b.got + b.exp) - (a.got + a.exp) || b.m - a.m), w0, w1, total, used: list.reduce((a, r) => a + r.m, 0),
    exp: list.reduce((a, r) => a + (r.c.u === "kg" ? r.exp : 0), 0), got: list.reduce((a, r) => a + (r.c.u === "kg" ? r.got : 0), 0)};
}

/* ---------- censo de camas ---------- */
const NOTAS = ["Listo para cosechar", "Recién sembrado", "Creciendo", "Viejo / sacar", "Plaga o enfermedad", "Floreando"];
const nowW = () => Math.max(0, Math.min(PLAN_WEEKS - 1, todayW));
function cropByText(t){ const low = String(t || "").trim().toLowerCase(); if (!low) return null; for (const [k, c] of Object.entries(CROPS)) if (k === low || c.n.toLowerCase() === low) return k; for (const [k, c] of Object.entries(CROPS)) if (c.n.toLowerCase().split(/[ (]/)[0] === low) return k; return null; }
function cropColor(t){ const k = cropByText(t); return k ? CROPS[k].c : "#8f9c7a"; }
function censoFromPlan(bed){
  const w = nowW();
  return (plan.byBed[bed] || []).filter(p => (p.ex || p.s <= w) && p.end >= w).sort((a, b) => a.pos - b.pos)
    .map(p => ({m: p.m, cultivo: p.c.n, nota: "", fecha: ""}));
}
function censoDraft(bed){
  if (!state.cdraft[bed]) { const c = state.censo[bed]; state.cdraft[bed] = c ? c.lineas.map(l => Object.assign({}, l, {cultivo: CROPS[l.cultivo] ? CROPS[l.cultivo].n : l.cultivo})) : censoFromPlan(bed); }
  return state.cdraft[bed];
}
const censoThisWeek = bed => { const c = state.censo[bed]; if (!c) return false; const d = new Date(c.at.replace(" ", "T") + "Z"); return (Date.now() - d) < 7 * DAY; };
const M_OPTS = len => { const o = []; for (let v = 0.5; v <= len + 1e-9; v += 0.5) o.push(Math.round(v * 10) / 10); return o; };
const fm = v => { const r = Math.round(+v * 100) / 100; return (Number.isInteger(r) ? r : r.toString()) + " m"; };
function shortCrop(n){ return String(n || "").replace(/ \(.*\)$/, ""); }
function censoBar(bed, L){
  const len = BED[bed].len; let used = 0;
  const segs = L.filter(l => +l.m > 0).map(l => { used += +l.m; const w = Math.min(100, +l.m / len * 100), name = l.cultivo ? shortCrop(l.cultivo) : "¿?"; return `<i style="flex:0 0 ${w}%;background:${l.cultivo ? cropColor(l.cultivo) : "#9aa092"}" title="${esc(fm(l.m) + " " + (l.cultivo || "sin cultivo"))}">${w >= 36 ? `<span class="bn">${esc(name)}</span><span>${fm(l.m)}</span>` : w >= 12 ? fm(l.m) : ""}</i>`; }).join("");
  const rest = len - used;
  return {html: segs + (rest > 0.01 ? `<i class="vac">${rest / len >= 0.12 ? "vacío " + fm(rest) : ""}</i>` : ""), used};
}
function cropOptionsHtml(cur){
  const names = [...new Set(Object.values(CROPS).filter(c => !/^Decorativa/.test(c.menu || "") || true).map(c => c.n))].sort((a, b) => a.localeCompare(b, "es"));

const DQ = [["7", "1 sem"], ["14", "2 sem"], ["30", "1 mes"], ["60", "2 meses"], ["90", "3+ meses"], ["otra", "Fecha…"]];
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };

    <div class="cfoot"><button type="button" class="btn" data-add>＋ Agregar cultivo</button>${L.length ? `<button type="button" class="lnk" data-empty style="grid-column:auto">Vaciar cama</button>` : ""}<button type="button" class="btn primary" data-save style="margin-left:auto">Guardar</button></div>
  </section>`;

    <div class="bar small"><span class="chip">≈ ${nf(kg)} kg de cosecha</span>${fl ? `<span class="chip">≈ ${nf(fl)} flores</span>` : ""}</div></div>
  <div class="cols">
    <div class="mapbox">${zonePicker("m")}<button class="btn primary" id="tocenso" style="margin-top:8px;width:100%;min-height:46px">Actualizar camas (censo)</button><div id="mmap" style="margin-top:8px">${mapSVG({fill: id => monthFill(id, w)})}</div></div>
    <div style="display:flex;flex-direction:column;gap:18px;min-width:0">
      <section class="panel">
        <h3 style="margin-bottom:8px">Cómo leer el mapa</h3>
        <div class="legend"><span><span class="dot" style="background:var(--leaf)"></span>Color fuerte: en cosecha</span><span><span class="dot" style="background:var(--leaf);opacity:.38"></span>Color claro: creciendo</span><span><span class="dot" style="background:url(#)" ></span><span class="dot" style="background:repeating-linear-gradient(45deg,var(--soil) 0 2px,var(--soil-2) 2px 4px)"></span>Preparar cama</span><span><span class="dot" style="border:1px solid var(--line)"></span>Libre</span></div>
        <h3 style="margin:14px 0 8px">Cultivos este mes</h3>

};

views.cosecha = () => {
  const F = forecast(plan);
  const months = MONTHS.slice(0, 12);
  const cats = Object.keys(CAT);
  const data = months.map(m => { const o = {m}; cats.forEach(k => o[k] = 0); o.fl = 0; Object.entries(F[m] || {}).forEach(([c, v]) => { if (CROPS[c].u === "kg") o[CROPCAT[c]] += v; else o.fl += v; }); o.tot = cats.reduce((a, k) => a + o[k], 0); return o; });
  const actual = {};
  state.harvests.forEach(h => { if (h.u !== "kg") return; const k = (h.fecha || "").slice(0, 7); actual[k] = (actual[k] || 0) + (+h.cantidad || 0); });
  const max = Math.ceil(Math.max(...data.map(d => d.tot), ...Object.values(actual), 1) / 50) * 50;
  const W = 720, H = 300, L = 40, R = 8, Tp = 10, B = 26, bw = (W - L - R) / months.length;
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cosecha estimada por mes en kilos">`;
  for (let v = 0; v <= max; v += max / 4) { const y = Tp + (H - Tp - B) * (1 - v / max); svg += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="axis" x="${L - 6}" y="${y + 4}" text-anchor="end">${nf(v)}</text>`; }
  data.forEach((d, i) => {
    let y = H - B; const x = L + i * bw + bw * .18, w = bw * .64;
    const segs = cats.filter(k => d[k] > 0);
    segs.forEach((k, j) => {
      const h = (H - Tp - B) * d[k] / max; y -= h;
      const top = j === segs.length - 1;
      const gap = j > 0 ? 2 : 0;
      svg += `<path data-tip="${esc(monthLabel(d.m))}|${CAT[k][0]}|${nf(d[k])} kg" d="${top ? `M${x},${y + h - gap} V${y + 4} Q${x},${y} ${x + 4},${y} H${x + w - 4} Q${x + w},${y} ${x + w},${y + 4} V${y + h - gap} Z` : `M${x},${y + h - gap} V${y} H${x + w} V${y + h - gap} Z`}" fill="var(${CAT[k][1]})" style="cursor:default"/>`;
    });
    if (actual[d.m]) { const ay = Tp + (H - Tp - B) * (1 - actual[d.m] / max); svg += `<line x1="${x - 3}" x2="${x + w + 3}" y1="${ay}" y2="${ay}" stroke="var(--fg)" stroke-width="2.5"/><title>Registrado ${nf(actual[d.m])} kg</title>`; }
    svg += `<rect x="${L + i * bw}" y="${Tp}" width="${bw}" height="${H - Tp - B}" fill="transparent" data-tip="${esc(monthLabel(d.m))}|Total estimado|${nf(d.tot)} kg${actual[d.m] ? " · registrado " + nf(actual[d.m]) + " kg" : ""}" class="hit"/>`;
    svg += `<text class="axis" x="${L + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle">${monthShort(d.m)}</text>`;
  });
  svg += `</svg>`;
  const year = data.reduce((a, d) => a + d.tot, 0);
  const crops = Object.keys(CROPS).filter(c => months.some(m => (F[m] || {})[c]));
  const table = `<table><thead><tr><th>Cultivo</th>${months.map(m => `<th class="r">${monthShort(m)}</th>`).join("")}<th class="r">Año</th></tr></thead><tbody>${crops.map(c => { let t = 0; const cells = months.map(m => { const v = (F[m] || {})[c] || 0; t += v; return `<td class="r num">${v ? nf(v) : "<span class='muted'>·</span>"}</td>`; }).join(""); return `<tr><td style="white-space:nowrap"><span class="dot" style="background:${CROPS[c].c}"></span> ${esc(CROPS[c].n)}${CROPS[c].u !== "kg" ? " <span class='muted small'>(flores)</span>" : ""}</td>${cells}<td class="r num"><b>${nf(t)}</b></td></tr>`; }).join("")}</tbody></table>`;
  return `
  <div class="bar" style="justify-content:space-between"><div><div class="eyebrow">Pronóstico para cocina · kilos por mes</div><h2>≈ ${nf(year)} kg en 12 meses</h2></div>
  <div class="legend">${cats.map(k => `<span><span class="dot" style="background:var(${CAT[k][1]})"></span>${CAT[k][0]}</span>`).join("")}<span><span style="width:14px;height:0;border-top:2.5px solid var(--fg);display:inline-block"></span>Registrado</span></div></div>
  <section class="panel chart" id="chart">${svg}</section>
  <p class="small muted" style="margin:0">Noviembre sale casi vacío porque todas las camas se limpian en octubre; la producción arranca en diciembre. Los rendimientos son estimaciones de partida: el registro semanal de Adrián los corrige.</p>
  <section class="panel"><h3 style="margin-bottom:8px">Detalle por cultivo</h3><div class="scroll">${table}</div></section>`;
};
views.cosecha.bind = root => {
  const tip = document.getElementById("tip"), box = root.querySelector("#chart");
  box.querySelectorAll("[data-tip]").forEach(el => {
    el.addEventListener("mousemove", e => { const [a, b, c] = el.dataset.tip.split("|"); tip.innerHTML = `<b>${a}</b><br>${b}: ${c}`; tip.hidden = false; tip.style.left = e.pageX + "px"; tip.style.top = e.pageY - 8 + "px"; });
    el.addEventListener("mouseleave", () => tip.hidden = true);
  });
  // los segmentos quedan arriba del área de toque
  box.querySelectorAll("rect.hit").forEach(r => r.parentNode.insertBefore(r, r.parentNode.firstChild.nextSibling));
};

views.calendario = () => {
  const N = PLAN_WEEKS, pct = w => (w / N * 100);
  const months = MONTHS.map(k => ({k, w: Math.round((new Date(+k.slice(0, 4), +k.slice(5) - 1, 1, 12) - D(PLAN_START)) / (7 * DAY))})).filter(m => m.w >= 0 && m.w < N);
  const rows = BEDS.map(b => `<div class="grow"><span class="b">${b.id}</span><div class="track">${(plan.byBed[b.id] || []).map(p => {
      const g = Math.max(0, (p.h0 - p.s) / (p.end - p.s + 1) * 100);
      return `<div class="seg" style="left:${pct(p.s)}%;width:${pct(p.end - p.s + 1)}%;top:${p.pos / BED[b.id].len * 100}%;bottom:auto;height:${p.m / BED[b.id].len * 100}%;background:${p.c.c}" title="${esc(p.c.n)}${p.frac < .999 ? " (" + nf(p.m, 1) + " m)" : ""}: ${p.ex ? "ya sembrado" : "siembra " + fmt(wkDate(p.s))}, cosecha ${fmt(wkDate(p.h0))} – ${fmt(wkDate(p.end))}"><i class="g" style="width:${g}%"></i><span>${esc(shortName(p.c.n))}</span></div>`;
    }).join("")}${todayW >= 0 && todayW < N ? `<i class="nowline" style="left:${pct(todayW + .5)}%"></i>` : ""}</div></div>`).join("");
  return `
  <div><div class="eyebrow">Las 34 camas, semana por semana</div><h2>Calendario de siembra y cosecha</h2></div>
  <div class="legend small"><span><span class="dot" style="background:var(--leaf);opacity:.45"></span>Tramo claro: creciendo</span><span><span class="dot" style="background:var(--leaf)"></span>Tramo fuerte: en cosecha</span><span><span class="dot" style="background:var(--accent)"></span>Línea: semana actual</span></div>
  <section class="panel scroll"><div class="gantt" style="min-width:980px">
    <div class="gmonths"><span></span><div>${months.map(m => `<b style="left:${pct(m.w)}%">${monthShort(m.k)}</b>`).join("")}</div></div>
    ${rows}
  </div></section>`;
};

  <div class="cards">${cards}</div>
  <section class="panel"><h3 style="margin-bottom:8px">Mejor comprar que cultivar</h3><div class="scroll"><table><tbody>${BUY.map(b => `<tr><td style="white-space:nowrap"><b>${esc(b.n)}</b></td><td class="small">${esc(b.why)}</td></tr>`).join("")}</tbody></table></div></section>`;

views.compras = () => {
  const from = state.w, to = Math.min(PLAN_WEEKS - 1, state.w + 5);
  const items = [];
  plan.P.forEach(p => {
    const c = p.c, len = p.m;
    const when = p.tray ? p.ts : p.s;
    if (p.ex || when < from || when > to || c.met === "división" || c.met === "propia") return;
    let q;
    if (p.tray) q = `semilla para ${nf(p.cells)} cavidades (${p.trays} charola${p.trays > 1 ? "s" : ""})`;
    else if (c.met === "bulbo") q = `${nf(Math.ceil(c.rows * Math.floor(len / c.esp) * 1.1))} dientes / bulbos`;
    else if (c.rows) q = `${nf(c.rows * len, 1)} m de hilera`;
    else q = `${nf(p.area, 1)} m² al voleo`;
    items.push({when, c, q, bed: p.bed + (p.frac < .999 ? ` (${nf(p.m, 1)} m)` : ""), uso: p.tray ? "semillero" : "cama"});
  });
  items.sort((a, b) => a.when - b.when);
  // lista del año: semilla total por cultivo
  const yr = {};
  plan.P.forEach(p => {
    const c = p.c, len = p.m;
    if (p.ex || c.met === "división" || c.met === "propia") return;
    const r = yr[p.crop] = yr[p.crop] || {first: p.tray ? p.ts : p.s, cells: 0, meters: 0, bulbs: 0, area: 0, n: 0};
    r.first = Math.min(r.first, p.tray ? p.ts : p.s); r.n++;
    if (p.tray) r.cells += p.cells;
    else if (c.met === "bulbo") r.bulbs += Math.ceil(c.rows * Math.floor(len / c.esp) * 1.1);
    else if (c.rows) r.meters += c.rows * len; else r.area += p.area;
  });
  const yrList = Object.entries(yr).sort((a, b) => (STOCK[a[0]] ? 1 : 0) - (STOCK[b[0]] ? 1 : 0) || a[1].first - b[1].first);
  const yq = (k, r) => [r.cells && `${nf(r.cells)} cavidades`, r.meters && `${nf(r.meters)} m de hilera`, r.bulbs && `${nf(r.bulbs)} ${k === "ajo" ? "dientes y bulbos" : "piezas"}`, r.area && `${nf(r.area)} m² al voleo`].filter(Boolean).join(" + ");
  let maxTrays = 0; for (let w = 0; w < PLAN_WEEKS; w++) maxTrays = Math.max(maxTrays, traysActive(plan, w).reduce((a, p) => a + p.trays, 0));
  return `
  <div class="bar" style="justify-content:space-between">
    <div><div class="eyebrow">Semillas para las próximas 6 semanas</div><h2>${weekRange(from).split(" – ")[0]} – ${weekRange(to).split(" – ")[1]}</h2></div>
    <div class="stepper"><button class="btn icon" id="cprev" aria-label="Antes">←</button><button class="btn icon" id="cnext" aria-label="Después">→</button></div>
  </div>
  <section class="panel scroll"><table><thead><tr><th>Se usa</th><th>Cultivo</th><th>Dónde</th><th class="r">Cantidad</th><th>Cama</th></tr></thead><tbody>
  ${items.map(r => `<tr><td class="num">${fmt(wkDate(r.when))}</td><td><span class="dot" style="background:${r.c.c}"></span> ${esc(r.c.n)}</td><td class="small">${r.uso}${STOCK[Object.keys(CROPS).find(k => CROPS[k] === r.c)] ? ` <span class="chip">en bodega</span>` : ""}</td><td class="r num">${r.q}</td><td class="num small">${r.bed}</td></tr>`).join("") || `<tr><td colspan="5" class="muted">No hay siembras en estas semanas.</td></tr>`}
  </tbody></table></section>
  <section class="panel scroll"><div class="bar" style="justify-content:space-between;margin-bottom:8px"><h3>Lista de compra del año</h3><span class="chip warn">${yrList.filter(([k]) => !STOCK[k]).length} por comprar · ${yrList.filter(([k]) => STOCK[k]).length} en bodega</span></div>
  <table><thead><tr><th>Estado</th><th>Cultivo</th><th>Primera siembra</th><th class="r">Semilla para el año</th></tr></thead><tbody>
  ${yrList.map(([k, r]) => `<tr><td>${STOCK[k] ? `<span class="chip">✓ En bodega</span>` : `<span class="chip warn">Comprar</span>`}</td><td><span class="dot" style="background:${CROPS[k].c}"></span> ${esc(CROPS[k].n)}${STOCK[k] && STOCK[k] !== CROPS[k].n ? ` <span class="muted small">· ${esc(STOCK[k])}</span>` : ""}</td><td class="num small">${fmt(wkDate(r.first))}</td><td class="r num small">${yq(k, r)}</td></tr>`).join("")}
  </tbody></table>
  <p class="small muted" style="margin:8px 0 0">"En bodega": revisar que alcance para la cantidad indicada y que la semilla tenga menos de 2 años. Las hierbas perennes no se compran: se dividen las que ya existen.</p></section>
  <section class="panel"><h3 style="margin-bottom:8px">En bodega, fuera del plan de camas</h3><div class="scroll"><table><tbody>${EXTRA_SEEDS.map(x => `<tr><td style="white-space:nowrap"><b>${esc(x.n)}</b></td><td class="small">${esc(x.uso)}</td></tr>`).join("")}</tbody></table></div></section>
  <section class="panel"><h3 style="margin-bottom:8px">Material del semillero (una sola vez)</h3>
  <ul class="small" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px">
    <li><b>Charolas: 30 de 200 cavidades (ya compradas)</b>. Máximo ${maxTrays} en uso a la vez; sobran para la experiencia "Planta y llévatela"</li>
    <li>Mesa de semillero (ya existe), con malla sombra 50% y cerca de una toma de agua</li>
    <li>Sustrato: 2 partes de fibra de coco o peat moss + 1 parte de composta cernida + 1 de perlita</li>
    <li>Manta térmica o plástico para tapar las charolas en noches de helada (dic–feb)</li>
    <li>Regadera de flor fina y etiquetas con cultivo, cama y fecha</li>
  </ul></section>
  <p class="small muted" style="margin:0;max-width:70ch">Para semilla directa, la bolsa indica cuántos metros de hilera rinde; comprar con margen y guardar en lugar fresco y seco. No se compran plántulas: todo lo que va trasplantado sale del semillero.</p>`;
};
views.compras.bind = root => {

  root.querySelector("#cnext").onclick = () => { state.w = Math.min(PLAN_WEEKS - 1, state.w + 6); render(); };

views.semillero = () => {

  const act = traysActive(plan, w);
  const sowNow = plan.P.filter(p => p.tray && p.ts === w);
  const all = plan.P.filter(p => p.tray).sort((a, b) => a.ts - b.ts);
  const used = new Set(act.map(p => p.crop + p.bed)).size;
  const N = PLAN_WEEKS, pct = x => x / N * 100;
  const rowStatus = p => w < p.ts ? ["Por sembrar", ""] : w < p.s - 1 ? ["En charola", "ok"] : w === p.s - 1 ? ["Endurecer", "warn"] : ["Trasplantado", ""];
  return `
  <div class="bar" style="justify-content:space-between">
    <div class="stepper"><button class="btn icon" id="sprev" aria-label="Semana anterior">←</button>

      <button class="btn icon" id="snext" aria-label="Semana siguiente">→</button></div>
    <div class="bar small"><span class="chip">${used} cultivo${used === 1 ? "" : "s"} en la mesa</span>${sowNow.length ? `<span class="chip warn">Sembrar esta semana: ${[...new Set(sowNow.map(p => shortName(p.c.n)))].map(esc).join(", ")}</span>` : ""}</div>
  </div>
  <p class="small muted" style="margin:0;max-width:72ch">Las charolas están en la mesa de semillero (dentro del invernadero este, lado sur), fuera de las camas: no ocupan espacio del huerto. La cama que aparece es solo el destino final; sigue produciendo su cultivo anterior hasta el día del trasplante. Todo lo que se trasplanta nace aquí, entre 4 y 9 semanas antes. La última semana se endurece: al sol y al viento, con menos agua. Kale y acelga de octubre se siembran directo en la cama porque ya no da tiempo de semillero.</p>
  <div class="cols">
    <section class="panel">
      <h3 style="margin-bottom:8px">En la mesa esta semana</h3>
      ${act.length || sowNow.length ? `<div class="scroll"><table><thead><tr><th>Cultivo</th><th class="r">Semillas</th><th>Va a</th><th>Trasplante</th><th>1ª cosecha</th><th>Estado</th></tr></thead><tbody>
      ${[...new Set([...sowNow, ...act])].map(p => { const st = rowStatus(p); return `<tr><td><span class="dot" style="background:${p.c.c}"></span> <b>${esc(p.c.n)}</b></td><td class="r num">${p.cells * 2}</td><td class="num small">${p.bed}</td><td class="num small">${fmt(wkDate(p.s))}</td><td class="num small">${fmt(wkDate(p.h0))}</td><td><span class="chip ${st[1]}">${p.ts === w ? "Sembrar hoy" : st[0]}</span></td></tr>`; }).join("")}
      </tbody></table></div>` : `<p class="muted small" style="margin:0">La mesa está vacía esta semana.</p>`}
    </section>
    <section class="panel">
      <h3 style="margin-bottom:8px">Cómo sembrar una charola</h3>
      <ol class="small" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px">
        <li>Sustrato húmedo: 2 partes de fibra de coco o peat moss + 1 de composta cernida + 1 de perlita. Apretar ligeramente.</li>
        <li>2 semillas por cavidad, a una profundidad de 2 veces el tamaño de la semilla.</li>
        <li>Etiqueta: cultivo, cama y fecha de trasplante.</li>
        <li>Regar con regadera fina cada mañana; que no se seque ni se encharque.</li>
        <li>Cuando salgan 2 hojas, dejar la planta más fuerte por cavidad (cortar la otra con tijera).</li>
        <li>Una semana antes de trasplantar: endurecer al sol y regar menos.</li>
      </ol>
    </section>
  </div>
  <section class="panel scroll"><h3 style="margin-bottom:8px">Todo el año</h3>
    <div class="gantt" style="min-width:860px">
      ${all.map(p => `<div class="grow" style="grid-template-columns:150px 1fr"><span class="small" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(shortName(p.c.n))} · destino ${p.bed}</span><div class="track"><div class="seg" style="left:${pct(p.ts)}%;width:${pct(p.s - p.ts)}%;background:${p.c.c}" title="${esc(p.c.n)}: charola ${fmt(wkDate(p.ts))}, trasplante ${fmt(wkDate(p.s))}"><span>${p.bed}</span></div><i class="nowline" style="left:${pct(w + .5)}%"></i></div></div>`).join("")}
    </div>
  </section>`;
};
views.semillero.bind = root => {
  root.querySelector("#sprev").onclick = () => { if (state.w > 0) { state.w--; subscribeDone(); render(); } };
  root.querySelector("#snext").onclick = () => { if (state.w < PLAN_WEEKS - 1) { state.w++; subscribeDone(); render(); } };
};

views.experiencias = () => {
  const w = weekOfMonth(state.month);
  const inHarvest = [...new Set(BEDS.flatMap(b => bedSegs(plan, b.id, w)).filter(s => s.st === "cosecha").map(s => s.p.crop))];
  const sowing = plan.P.some(p => !p.tray && p.c.met === "directa" && Math.abs(p.s - w) <= 2);
  const ok = e => e.uses.some(u => u === "cosecha" ? inHarvest.length : u === "semillero" || u === "composta" || u === "perennes" ? true : u === "directa" ? sowing : inHarvest.includes(u));
  const cards = EXPERIENCES.map(e => {
    const on = ok(e);
    const crops = e.uses.filter(u => CROPS[u] && inHarvest.includes(u));
    return `<article class="card" style="${on ? "" : "opacity:.55"}">
      <div class="bar" style="justify-content:space-between;gap:6px"><span class="chip ${on ? "" : "warn"}">${on ? "Disponible este mes" : "No este mes"}</span><span class="small num muted">${e.min} min · máx ${e.max}</span></div>
      <h4>${esc(e.es)}</h4><div class="small muted" style="margin-top:-6px">${esc(e.en)} · ${esc(e.when)}</div>
      <p class="small" style="margin:0">${esc(e.what)}</p>
      ${crops.length ? `<p class="small" style="margin:0"><b>Este mes:</b> ${crops.map(c => esc(CROPS[c].n)).join(", ")}</p>` : ""}
      <dl class="kv"><dt>Adrián prepara</dt><dd>${esc(e.prep)}</dd><dt>Material</dt><dd>${esc(e.mat)}</dd><dt>For the guide</dt><dd lang="en">${esc(e.guide)}</dd></dl>
    </article>`;
  }).join("");
  return `
  <div class="bar" style="justify-content:space-between"><div><div class="eyebrow">Huerto para visitantes · 1 o 2 veces por semana</div>${monthStepper()}</div></div>
  <section class="panel"><h3 style="margin-bottom:8px">In the garden this month · para el guía</h3>
    <div class="legend">${inHarvest.map(c => `<span><span class="dot" style="background:${CROPS[c].c}"></span>${esc(CROPS[c].n)} <span class="muted" lang="en">· ${esc(CROPS[c].en || "")}</span></span>`).join("") || `<span class="muted">Beds are being prepared and sown this month: show the nursery trays and the compost pile.</span>`}</div>
  </section>
  <p class="small muted" style="margin:0;max-width:72ch">Los guías conducen en inglés; Adrián deja todo listo el viernes y puede acompañar en español. Ninguna requiere enseñar técnica: se aprende haciendo, con lo que el huerto ya está produciendo.</p>
  <div class="cards">${cards}</div>`;
};
views.experiencias.bind = root => bindMonthStepper(root);

views.registro = () => {
  const today = new Date(); const iso = today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, "0") + "-" + String(today.getDate()).padStart(2, "0");
  const rows = state.harvests.slice(0, 60).map(h => `<tr><td class="num">${esc(h.fecha)}</td><td class="num">${esc(h.cama)}</td><td>${esc(CROPS[h.cultivo]?.n || h.cultivo)}</td><td class="r num">${nf(+h.cantidad || 0, 1)} ${esc(h.u)}</td><td class="small muted">${esc(h.nota || "")}</td></tr>`).join("");
  const canWrite = !!state.db;
  return `
  <div><div class="eyebrow">Lo que realmente salió del huerto</div><h2>Registro de cosecha</h2></div>
  <p class="small muted" style="margin:0;max-width:70ch">Adrián manda por WhatsApp el peso de cada entrega; aquí se captura. Con 4–6 semanas de registro se ajustan los rendimientos del plan.</p>
  ${canWrite ? `<form class="reg panel" id="regf">
    <label>Fecha<input type="date" id="rf-fecha" value="${iso}" required></label>
    <label>Cama<select id="rf-cama">${BEDS.map(b => `<option>${b.id}</option>`).join("")}</select></label>
    <label>Cultivo<select id="rf-cultivo">${Object.entries(CROPS).map(([k, c]) => `<option value="${k}">${esc(c.n)}</option>`).join("")}</select></label>
    <label>Cantidad<input type="number" id="rf-cant" min="0" step="0.1" inputmode="decimal" required placeholder="kg o flores"></label>
    <label>Nota<input type="text" id="rf-nota" placeholder="opcional"></label>
    <button class="btn primary" type="submit">Guardar</button>
  </form>` : `<div class="notice">El registro se guarda solo al abrir esta página desde tu cuenta de Claude.</div>`}
  <section class="panel scroll"><table><thead><tr><th>Fecha</th><th>Cama</th><th>Cultivo</th><th class="r">Cantidad</th><th>Nota</th></tr></thead><tbody>${rows || `<tr><td colspan="5" class="muted">Aún no hay registros. La primera cosecha está prevista para noviembre (rábano y arúgula).</td></tr>`}</tbody></table></section>
  <section class="panel scroll"><h3 style="margin-bottom:8px">Reportes de camas</h3>${state.reports.length ? `<table><thead><tr><th>Fecha</th><th>Cama</th><th>Estado</th><th>Cuánto</th><th>Cosecha ≈</th></tr></thead><tbody>${state.reports.slice(0, 80).map(r => `<tr><td class="num">${esc(fmtISO(r.fecha))}</td><td class="num">${esc(r.cama)}</td><td>${r.estado === "sembrada" ? esc(CROPS[r.cultivo]?.n || r.cultivo) : EST[r.estado] || esc(r.estado)}</td><td class="small">${esc(repWhere(r))}</td><td class="num small">${esc(fmtISO(r.cosecha))}</td></tr>`).join("")}</tbody></table>` : `<p class="muted small" style="margin:0">Aún no hay reportes. Se hacen desde el Mapa: tocar la cama → “Actualizar cama”.</p>`}</section>`;
};
views.registro.bind = root => {
  const f = root.querySelector("#regf"); if (!f) return;
  const cama = f.querySelector("#rf-cama"), cult = f.querySelector("#rf-cultivo");
  const syncCrop = () => { const w = Math.max(0, Math.min(PLAN_WEEKS - 1, Math.floor((D(f.querySelector("#rf-fecha").value) - D(PLAN_START)) / (7 * DAY)))); const st = bedState(plan, cama.value, w); if (st.p) cult.value = st.p.crop; };
  cama.onchange = syncCrop; syncCrop();
  f.onsubmit = async e => {
    e.preventDefault();
    const c = CROPS[cult.value];
    const doc = {fecha: f.querySelector("#rf-fecha").value, cama: cama.value, cultivo: cult.value, cantidad: +f.querySelector("#rf-cant").value, u: c.u, nota: f.querySelector("#rf-nota").value.slice(0, 200), at: Date.now()};
    try { await state.db.collection("cosechas").add(doc); toast("Guardado"); f.querySelector("#rf-cant").value = ""; f.querySelector("#rf-nota").value = ""; }
    catch (err) { toast(err && err.code === "quota_exceeded" ? "El registro está lleno; hay que depurar entradas viejas." : "No se pudo guardar. Revisa la conexión e intenta de nuevo."); }
  };
};

/* ---------- tareas ---------- */
const KLAB = {semillero:"Semillero",prep:"Preparar",siembra:"Siembra",cuidado:"Cuidado",base:"Rutina",cosecha:"Cosecha"};
function taskRow(t, pre){
  const done = state.done[t.id];
  return `<div class="task${done ? " done" : ""}"><input type="checkbox" id="${pre}-${t.id}" data-id="${t.id}" ${done ? "checked" : ""}><label for="${pre}-${t.id}"><span class="k ${t.k}">${KLAB[t.k]}</span>${t.b ? `<b class="crop">${esc(t.b)}</b> · ` : ""}${esc(t.t)}</label>${t.min ? `<span class="t">${t.min >= 60 ? nf(t.min / 60, 1) + " h" : Math.round(t.min) + " min"}</span>` : ""}</div>`;
}
function bindTasks(root){
  root.querySelectorAll(".task input").forEach(cb => cb.addEventListener("change", () => toggleDone(cb.dataset.id, cb.checked)));
}
/* ---------- datos compartidos ---------- */
const typing = () => { const a = document.activeElement; return !!a && a.matches("input[type=number], input[type=text], input[type=date], textarea, select"); };
let unsubDone = null;
function subscribeDone(){
  if (!state.db) return;
  if (unsubDone) unsubDone();
  const w = state.w;
  unsubDone = state.db.collection("hechas").where("w", "==", w).onSnapshot(snap => {
    if (w !== state.w) return;
    const d = {}, f = {}; snap.docs.forEach(x => { const v = x.data(); if (!v || !v.id) return; if (v.estado === "ayuda") f[v.id] = v.nota || ""; else d[v.id] = true; });
    state.done = d; state.flags = f; if ((state.view === "semana" || state.view === "hoy") && !typing()) render();
  }, () => {});
}
async function toggleDone(id, on){
  state.done[id] = on;
  if (state.view === "semana" || state.view === "hoy") render();
  if (!state.db) return;
  const ref = state.db.doc(`hechas/w${state.w}-${id}`);
  try { on ? await ref.set({w: state.w, id, estado: "hecho", at: Date.now()}) : await ref.delete(); }
  catch (e) { toast("No se pudo guardar la marca."); }
}
/* ---------- render ---------- */
const TITLES = {cocina: "Cocina", mensajes: "Mensajes con cocina", pedidos: "Pedidos de cocina", insumos: "Compras y semillas", censo: "Censo de camas", hoy: "Hoy", semillero: "Semillero", experiencias: "Experiencias", semana: "Semana", mapa: "Mapa del mes", cosecha: "Cosecha", calendario: "Calendario", cultivos: "Cultivos", compras: "Semilla del plan", registro: "Registro"};
const MAIN4 = ["hoy", "semana", "mapa", "cosecha"];
function render(){
  const main = document.getElementById("main");
  const y = window.scrollY;
  main.innerHTML = `<div class="view">${views[state.view]()}</div>`;
  document.getElementById("vtitle").textContent = TITLES[state.view];
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.v === state.view));
  document.querySelectorAll("nav.bottom button").forEach(b => b.setAttribute("aria-selected", b.dataset.v === state.view || (b.dataset.v === "mas" && !MAIN4.includes(state.view) && state.view !== "cocina")));
  const kn = (state.pedidos || []).filter(x => x.estado === "nueva").length + (state.msgs || []).filter(m => m.de !== "huerto" && Date.now() - new Date(String(m.at).replace(" ", "T") + "Z") < 2 * DAY).length;
  document.querySelectorAll('nav button[data-v="cocina"]').forEach(b => { let x = b.querySelector(".nb"); if (!kn) { if (x) x.remove(); return; } if (!x) { x = document.createElement("span"); x.className = "nb"; b.appendChild(x); } x.textContent = kn; });
  if (views[state.view].bind) views[state.view].bind(main);
  if (render.keep) window.scrollTo(0, y); else window.scrollTo(0, 0);
  render.keep = true;
}
const sheet = document.getElementById("sheet");
function go(v){ sheet.hidden = true; if (v === "hoy") state.hd = null; state.view = v; try { localStorage.setItem("huerto-vista", v); } catch (e) {} render.keep = false; render(); }
document.querySelectorAll("nav.tabs button, .sheet button").forEach(b => b.onclick = () => go(b.dataset.v));
document.querySelectorAll("nav.bottom button").forEach(b => b.onclick = () => { if (b.dataset.v === "mas") { sheet.hidden = false; return; } go(b.dataset.v); });
sheet.addEventListener("click", e => { if (e.target === sheet) sheet.hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") sheet.hidden = true; });
state.view = window.matchMedia("(max-width: 859px)").matches ? "hoy" : "semana";
try { const v = localStorage.getItem("huerto-vista"); if (v && views[v]) state.view = v; } catch (e) {}
try { const z = localStorage.getItem("huerto-zona"); if (z) state.zone = z; } catch (e) {}
const hv = location.hash.replace("#", ""); if (views[hv]) state.view = hv;
render();
// Plan vivo: en la versión web se carga de /api/plan (lo editan Eric, Melanie y Claude); si no hay, queda el del código.
function reloadPlan(){ const np = buildPlan(); for (const k of Object.keys(plan)) delete plan[k]; Object.assign(plan, np); }
if (location.protocol.startsWith("http") && !/claude|anthropic/.test(location.hostname)) {
  window.loadLive = async () => { try { const r = await fetch("/api/plan", {cache: "no-store"}); if (!r.ok) return; const j = await r.json(); if (j && j.data && j.v !== loadLive.v) { loadLive.v = j.v; applyPlanData(j.data); applyBank(); reloadPlan(); if (!typing() && !state.upd) render(); } } catch (e) {} };
  loadLive(); setInterval(() => { if (document.visibilityState === "visible") loadLive(); }, 60000);
  window.loadCenso = async () => { try { const r = await fetch("/api/censo", {cache: "no-store"}); if (!r.ok) return; const j = await r.json(); const m = {}; (j.rows || []).forEach(c => { m[c.cama] = c; }); state.censo = m; Object.keys(state.cdraft || {}).forEach(b => { if (!(state.cdirty || {})[b]) delete state.cdraft[b]; }); if (state.view === "censo" ? !typing() : !typing() && !state.upd) render(); } catch (e) {} };
  loadCenso();
  window.loadInsumos = async () => { try { const [a, b] = await Promise.all([fetch("/api/lista", {cache: "no-store"}).then(r => r.json()), fetch("/api/banco", {cache: "no-store"}).then(r => r.json())]); state.lista = a.rows || []; state.bank = b.rows || []; applyBank(); if (!typing() && !state.upd && state.view !== "censo") render(); } catch (e) {} };
  loadInsumos();
  window.loadPedidosHuerto = async () => { try { const [a, b] = await Promise.all([fetch("/api/cocina/pedidos", {cache: "no-store"}).then(r => r.json()), fetch("/api/cocina/siembras", {cache: "no-store"}).then(r => r.json())]); state.pedidos = a.rows || []; state.pvotos = b.rows || []; if ((state.view === "pedidos" || state.view === "cocina") && !typing()) render(); } catch (e) {} };
  loadPedidosHuerto();
  window.loadMsgsHuerto = async () => { try { state.msgs = (await fetch("/api/mensajes", {cache: "no-store"}).then(r => r.json())).rows || []; if ((state.view === "mensajes" || state.view === "cocina") && !typing()) render(); } catch (e) {} };
  loadMsgsHuerto(); setInterval(() => { if (document.visibilityState === "visible" && (state.view === "mensajes" || state.view === "cocina")) loadMsgsHuerto(); }, 20000);
}
(async () => {
  try {
    const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
    state.dbTried = true;
    if (!db) { render(); return; }
    state.db = db;
    subscribeDone();
    db.collection("camas").orderBy("at", "desc").limit(500).onSnapshot(snap => {
      state.reports = snap.docs.map(d => ({...d.data(), _id: d.id}));
      if (["mapa", "registro"].includes(state.view) && !typing() && !state.upd) render();
    }, () => {});
    db.collection("cosechas").orderBy("fecha", "desc").limit(1000).onSnapshot(snap => {
      state.harvests = snap.docs.map(d => d.data());
      if (["registro", "cosecha", "hoy", "cocina"].includes(state.view) && !typing()) render();
    }, () => {});
    render();
  } catch (e) { state.dbTried = true; render(); }
})();
setTimeout(() => { if (!state.dbTried) { state.dbTried = true; render(); } }, 10500);

</script>
