<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Huerto Dos Búhos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body{margin:0}

/* Layout: cuaderno de campo — barra de vistas arriba, contenido en una columna; el mapa del huerto es la pieza central */
:root{
  --bg:#f2f3ec; --surface:#fbfbf7; --sunk:#e8eadf; --fg:#1d261c; --muted:#5d6656; --faint:#8b927f;
  --line:#d3d7c6; --accent:#9e2a3f; --accent-ink:#ffffff; --soil:#8a6a4c; --soil-2:#c9b49a; --leaf:#3e6b35;
  --ok:#2f7a3a; --warn:#b26a00; --water:#bcd3e0; --water-ink:#3c6176; --tree:#a9bb8d;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131813; --surface:#1b211a; --sunk:#232a21; --fg:#e4e9dc; --muted:#a6ae9b; --faint:#7c8471;
  --line:#343d31; --accent:#e06a80; --accent-ink:#1a0d10; --soil:#b8946f; --soil-2:#5c4a38; --leaf:#8cc27c;
  --ok:#6fc07a; --warn:#e3a33c; --water:#2c4654; --water-ink:#a9cde0; --tree:#3d4d34;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131813; --surface:#1b211a; --sunk:#232a21; --fg:#e4e9dc; --muted:#a6ae9b; --faint:#7c8471;
  --line:#343d31; --accent:#e06a80; --accent-ink:#1a0d10; --soil:#b8946f; --soil-2:#5c4a38; --leaf:#8cc27c;
  --ok:#6fc07a; --warn:#e3a33c; --water:#2c4654; --water-ink:#a9cde0; --tree:#3d4d34;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:18px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px;padding-block:6px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,34px);line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;text-wrap:balance}
h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
.facts{font-size:13px;color:var(--muted);font-family:var(--mono)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;scrollbar-width:none}
nav.tabs button{font:inherit;font-size:14px;font-weight:600;border:1px solid transparent;background:none;color:var(--muted);padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
nav.tabs button:hover:not([aria-selected="true"]){border-color:var(--line);color:var(--fg)}
button:focus-visible,select:focus-visible,input:focus-visible,.bed:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.view{display:flex;flex-direction:column;gap:18px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.stepper{display:flex;align-items:center;gap:6px}
.btn{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.icon{padding:7px 11px;min-width:38px}
select,input{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 10px;border-radius:8px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* carga */
.load{display:flex;flex-direction:column;gap:6px;min-width:220px;flex:1}
.meter{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--leaf);border-radius:5px}
.meter.over i{background:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--fg);white-space:nowrap}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
/* tareas */
.days{display:flex;flex-direction:column;gap:14px}
.day h3{display:flex;justify-content:space-between;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.task{display:flex;gap:10px;align-items:flex-start;padding:7px 2px;border-bottom:1px dashed var(--line)}
.task:last-child{border-bottom:0}
.task input{margin-top:3px;width:18px;height:18px;accent-color:var(--leaf);flex:none;padding:0}
.task label{flex:1;min-width:0;cursor:pointer}
.task .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.k.semillero{color:var(--s1)} .k.prep{color:var(--soil)} .k.siembra{color:var(--leaf)} .k.cuidado{color:var(--warn)} .k.base{color:var(--faint)}
.task.done label{color:var(--faint);text-decoration:line-through}
.task .t{font-family:var(--mono);font-size:12px;color:var(--faint);white-space:nowrap}
.task b.crop{font-weight:700;color:var(--fg)}
.task.done b.crop{color:inherit}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
/* mapa */
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
svg.map{width:100%;height:auto;display:block}
svg.map .wall{stroke:var(--soil);stroke-width:.12;fill:none}
svg.map .tree{fill:var(--tree)}
svg.map .bed{cursor:pointer}
svg.map .bedbox{stroke:var(--fg);stroke-opacity:.55;stroke-width:.08}
svg.map .bed:hover .bedbox,svg.map .bed.sel .bedbox{stroke:var(--accent);stroke-opacity:1;stroke-width:.22}
svg.map text{font-family:var(--body);fill:var(--fg)}
svg.map .lab{font-size:.62px;font-weight:700}
svg.map .crop{font-size:.5px;font-weight:600}
svg.map .seclab{font-family:var(--display);font-size:1.5px;fill:var(--muted)}
svg.map .feat{font-size:.55px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.monthpick{display:flex;flex-wrap:wrap;gap:4px}
.monthpick button{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:5px 9px;border-radius:7px;cursor:pointer}
.monthpick button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bedinfo .row{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.timeline{display:flex;flex-direction:column;gap:8px}
.real{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--sunk)}
.real .rep{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:start;font-size:14px}
.real .rep button{border:0;background:none;color:var(--faint);font-size:18px;line-height:1;padding:0 4px;cursor:pointer}
.upd{display:flex;flex-direction:column;gap:12px}
.upd .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 12px;border-radius:9px;cursor:pointer;min-height:44px}
.opts button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.upd select,.upd input{font-size:16px;min-height:44px;width:100%}
.upd .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.upd input[type=date]{box-sizing:border-box;max-width:100%;padding-left:6px;padding-right:4px}
.upd .two label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.tl{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:start}
.ed{border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:15px;line-height:1;padding:8px 10px;border-radius:8px;cursor:pointer;min-height:36px}
.tl .sw{width:12px;height:12px;border-radius:3px;margin-top:5px}
/* calendario */
.gantt{position:relative;font-size:12px}
.grow{display:grid;grid-template-columns:44px 1fr;align-items:center;height:22px}
.grow .b{font-family:var(--mono);font-weight:500;color:var(--muted)}
.track{position:relative;height:18px;background:var(--sunk);border-radius:3px}
.seg{position:absolute;top:0;bottom:0;border-radius:2px;overflow:hidden;white-space:nowrap;font-size:10px;font-weight:600;color:#fff;padding-left:3px;display:flex;align-items:center;box-shadow:0 0 0 1px var(--surface)}
.seg .g{position:absolute;inset:0;background:var(--surface);opacity:.55}
.seg span{position:relative;text-shadow:0 0 2px rgba(0,0,0,.45)}
.gmonths{display:grid;grid-template-columns:44px 1fr;height:20px}
.gmonths div{position:relative}
.gmonths b{position:absolute;font-size:11px;color:var(--muted);font-weight:600;transform:translateX(2px)}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--accent)}
/* cosecha chart */
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .axis{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12.5px;padding:7px 9px;border-radius:7px;white-space:nowrap;z-index:3;transform:translate(-50%,-110%)}
.tip[hidden]{display:none}
/* cultivos */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h4{margin:0;font-family:var(--display);font-weight:400;font-size:18px;display:flex;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.notice{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:9px 12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:14px;z-index:9}
form.reg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
form.reg label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
textarea.wa{width:100%;min-height:160px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);padding:10px}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .3s}}
/* móvil primero: barra inferior, objetivos táctiles grandes; en pantallas anchas vuelven las pestañas de arriba */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
nav.bottom button{font:inherit;font-size:11.5px;font-weight:600;color:var(--muted);background:none;border:0;border-radius:10px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
nav.bottom button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bottom button[aria-selected="true"]{color:var(--fg);background:var(--sunk)}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35);display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sheet .in{background:var(--surface);width:100%;border-radius:16px 16px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.sheet .in button{font:inherit;font-size:16px;font-weight:600;text-align:left;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer}
.zones{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.zones button{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 12px;border-radius:999px;white-space:nowrap;cursor:pointer;min-height:38px}
.zones button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.hoyhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.harv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.harv:last-child{border-bottom:0}
.harv .q{display:flex;gap:6px;align-items:center}
.harv input{width:80px;font-size:16px;min-height:42px}
.harv .btn{min-height:42px}
@media (max-width:859px){
  body{font-size:16px}
  .wrap{padding-inline:16px;padding-block:12px calc(90px + env(safe-area-inset-bottom,0px))}
  nav.tabs{display:none}
  .facts{display:none}
  header.top{padding-block:4px 10px}
  .task{padding:12px 2px;gap:12px}
  .task input{width:26px;height:26px;margin-top:0}
  .task label{font-size:15.5px;line-height:1.45}
  .btn{min-height:44px;font-size:15px}
  .btn.icon{min-width:44px}
  select,input{font-size:16px;min-height:44px}
  .panel{padding:14px}
  .monthpick{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .monthpick button{min-height:38px;white-space:nowrap}
  .day h3{position:sticky;top:0;background:var(--surface);padding-top:6px;z-index:1}
}
@media (min-width:860px){ nav.bottom,.only-mobile{display:none} }
</style>
<script>// Adaptador para la versión web pública: reemplaza la base de datos de Claude por la API del Worker (/api/*).
(function () {
  const KEY = 'huerto-pin';
  const getPin = () => { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } };
  const setPin = p => { try { p ? localStorage.setItem(KEY, p) : localStorage.removeItem(KEY); } catch (e) {} };
  async function ensurePin() {
    let p = getPin();
    if (p) return p;
    p = (prompt('PIN para guardar cambios (pídelo a Eric o Melanie):') || '').trim();
    if (!p) throw { code: 'no_pin' };
    const r = await fetch('/api/pin', { method: 'POST', headers: { 'x-pin': p } });
    const j = await r.json().catch(() => ({}));
    if (!j.ok) { alert('PIN incorrecto'); throw { code: 'bad_pin' }; }
    setPin(p);
    return p;
  }
  const refresh = () => window.dispatchEvent(new Event('huerto-refresh'));
  async function post(path, body) {
    let pin;
    try { pin = await ensurePin(); } catch (e) { refresh(); throw e; }
    const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json', 'x-pin': pin }, body: JSON.stringify(body) });
    if (r.status === 401) { setPin(''); refresh(); throw { code: 'bad_pin' }; }
    if (!r.ok) { refresh(); throw { code: 'unavailable' }; }
    return r.json().catch(() => ({}));
  }
  const snap = rows => ({ docs: rows.map(d => ({ id: d.id, data: () => d })), size: rows.length, empty: !rows.length });
  function poll(load, cb) {
    const run = async () => { try { cb(snap(await load())); } catch (e) {} };
    run();
    const t = setInterval(() => { if (document.visibilityState === 'visible') run(); }, 20000);
    window.addEventListener('huerto-refresh', run);
    return () => { clearInterval(t); window.removeEventListener('huerto-refresh', run); };
  }
  const db = {
    collection(name) {
      let w = null, ayuda = false;
      const q = {
        where(f, op, v) { if (f === 'estado') ayuda = true; else w = v; return q; },
        orderBy() { return q; },
        limit() { return q; },
        onSnapshot(cb) {
          if (name === 'hechas' && ayuda) return poll(async () => (await (await fetch('/api/avisos')).json()).rows, cb);
          if (name === 'camas') return poll(async () => (await (await fetch('/api/camas')).json()).rows, cb);
          if (name === 'hechas') return poll(async () => (await (await fetch('/api/hechas?w=' + w)).json()).rows, cb);
          return poll(async () => (await (await fetch('/api/cosechas')).json()).rows, cb);
        },
        async add(doc) {
          if (name === 'camas') { const j = await post('/api/camas', doc); refresh(); return { id: j.id }; }
          await post('/api/cosechas', doc); refresh();
        },
      };
      return q;
    },
    doc(path) {
      const c = path.match(/^camas\/(.+)$/);
      if (c) return { async delete() { await post('/api/camas', { del: c[1] }); refresh(); } };
      const m = path.match(/^hechas\/w(\d+)-(.+)$/);
      return {
        async set(d) { await post('/api/hechas', { w: Number(m[1]), id: m[2], done: true, estado: d && d.estado, nota: d && d.nota, txt: d && d.txt }); refresh(); },
        async delete() { await post('/api/hechas', { w: Number(m[1]), id: m[2], done: false }); refresh(); },
      };
    },
  };
  window.claude = { use: async n => (n === 'db' ? db : null) };
})();
</script>

<body>


<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="eyebrow">Huerto Orgánico · Bodega Dos Búhos</span>
      <h1 id="vtitle">Semana</h1>
    </div>
    <div class="facts">38 camas · 285 m² · Adrián Bárcenas, L–V 7:00–16:00 · versión 30/10 12:22</div>
  </header>
  <nav class="tabs" role="tablist" aria-label="Vistas">
    <button role="tab" data-v="hoy">Hoy</button>
    <button role="tab" data-v="semana">Semana</button>
    <button role="tab" data-v="mapa">Mapa del mes</button>
    <button role="tab" data-v="cosecha">Cosecha</button>
    <button role="tab" data-v="calendario">Calendario</button>
    <button role="tab" data-v="semillero">Semillero</button>
    <button role="tab" data-v="experiencias">Experiencias</button>
    <button role="tab" data-v="cultivos">Cultivos</button>
    <button role="tab" data-v="compras">Compras</button>
    <button role="tab" data-v="registro">Registro</button>
  </nav>
  <main id="main"></main>
</div>
<nav class="bottom" aria-label="Vistas">

// Motor del plan: calcula ventanas de cosecha, tareas semanales, horas y pronósticos.
// Cada siembra ocupa un tramo de la cama: pos (m desde el norte en A / desde el oeste en B) y m (metros).
const BEDS = (() => {
  const b = [];
  for (let i = 1; i <= 24; i++) b.push({id: "A" + i, area: 5, len: 5, sec: "A", q: ["A-NO","A-NE","A-SO","A-SE"][Math.floor((i - 1) / 6)]});
  for (let i = 1; i <= 10; i++) b.push({id: "B" + i, area: 13.3, len: 9.5, sec: "B", q: i <= 5 ? "B-O" : "B-E"});
  // Invernaderos VEVOR (8.3 × 2.9 m) entre las secciones, a cada lado del pasillo central: 2 camas de 1 × 8 m cada uno.
  for (let i = 1; i <= 4; i++) b.push({id: "I" + i, area: 8, len: 8, sec: "I", q: "I"});
  return b;
})();
const BED = Object.fromEntries(BEDS.map(b => [b.id, b]));
const DAY = 86400000;
const D = s => new Date(s + "T12:00:00");
const wk = s => Math.round((D(s) - D(PLAN_START)) / (7 * DAY));
const wkDate = w => new Date(D(PLAN_START).getTime() + w * 7 * DAY);
const MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESL = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const fmt = d => d.getDate() + " " + MES[d.getMonth()];
const mtxt = m => (Number.isInteger(m) ? m : m.toFixed(1)) + " m";

function factor(sow, crop) {
  if (crop.nofactor) return 1;
  const m = D(sow).getMonth();
  if (m === 10 || m === 11 || m === 0) return 1.3;
  if (m === 9 || m === 1) return 1.15;
  return 1;
}
const overlaps = (a, b) => a.pos < b.pos + b.m - 1e-9 && b.pos < a.pos + a.m - 1e-9;

function buildPlan() {
  const byBed = {};
  const P = PLANTINGS.map(([bed, crop, sow, opt], i) => {
    opt = opt || {};
    const c = CROPS[crop];
    const B = BED[bed];
    const m = opt.m ?? B.len, pos = opt.pos ?? 0;
    const frac = m / B.len;
    const ex = opt.ex || null;
    const s = ex ? 0 : wk(sow);
    const direct = !!opt.d;
    const tray = !ex && ((c.met === "plántula" && !direct) || !!opt.t);
    const char = opt.char ?? c.char;
    const esp = opt.esp ?? c.esp;
    const h0 = ex ? wk(ex[0]) : opt.t ? s + Math.ceil((opt.tsem ?? 3) * (B.sec === "I" ? 1 : factor(sow, c))) : s + Math.ceil((c.sem + (direct && c.char ? c.char : 0)) * (B.sec === "I" ? 1 : factor(sow, c)));
    const h1 = ex ? wk(ex[1]) : h0 + c.dur - 1;
    const plants = esp ? c.rows * Math.floor(m / esp) : 0;
    const cells = tray ? Math.ceil(plants * 1.3) : 0;
    const p = {i, bed, crop, c, sow, s, h0, h1, m, pos, frac, ex: !!ex, area: B.area * frac, scale: B.area * frac / 5,
      direct, tray, ts: tray ? s - char : null, plants, cells, trays: Math.ceil(cells / (typeof TRAY_CELLS !== "undefined" ? TRAY_CELLS : 72)), note: opt.note || ""};
    (byBed[bed] = byBed[bed] || []).push(p);
    return p;
  });
  const issues = [];
  P.forEach(p => { if (p.tray && p.ts < 0) issues.push(`${p.bed}: ${p.crop} necesita semillero desde antes del inicio (sem ${p.ts})`); });
  for (const bed of Object.keys(byBed)) {
    const list = byBed[bed].sort((a, b) => a.s - b.s || a.pos - b.pos);
    list.forEach(p => {
      if (p.pos + p.m > BED[bed].len + 1e-9) issues.push(`${bed}: ${p.crop} se sale de la cama`);
      const prev = list.filter(q => q !== p && q.s < p.s && overlaps(p, q));
      const next = list.filter(q => q !== p && q.s > p.s && overlaps(p, q)).sort((a, b) => a.s - b.s)[0];
      const same = list.filter(q => q !== p && q.s === p.s && overlaps(p, q));
      if (same.length) issues.push(`${bed}: ${p.crop} y ${same[0].crop} ocupan el mismo tramo`);
      p.prev = prev.sort((a, b) => b.s - a.s)[0] || null;
      p.first = !p.prev;
      p.end = next ? Math.min(p.h1, next.s - 1) : p.h1;
      if (next && next.s <= p.h0 && !p.c.nokg) issues.push(`${bed}: ${p.crop} (cosecha desde sem ${p.h0}) choca con ${next.crop} sem ${next.s}`);
      if (next && next.s - 1 < p.h1 - 1 && !p.ex) issues.push(`${bed}: ${p.crop} pierde ${p.h1 - (next.s - 1)} sem por ${next.crop}`);
      p.prepW = p.ex ? null : p.first ? Math.max(0, p.s - 1) : p.s;
    });
    // ocupación: una siembra nueva no puede entrar donde hay un cultivo existente activo
    list.forEach(p => list.forEach(q => { if (q !== p && overlaps(p, q) && q.s < p.s && q.end >= p.s) issues.push(`${bed}: ${p.crop} entra (sem ${p.s}) antes de que termine ${q.crop} (sem ${q.end})`); }));
  }
  return {P, byBed, issues};
}

// tramos de una cama en una semana: [{p, st, pos, m}]
function bedSegs(plan, bed, w) {
  const list = plan.byBed[bed] || [];
  const out = [];
  for (const p of list) {
    if (w >= p.s && w <= p.end) out.push({p, st: w >= p.h0 && !p.c.nokg ? "cosecha" : "crece", pos: p.pos, m: p.m});
  }
  for (const p of list) if (w === p.prepW && !out.some(o => overlaps(o, p))) out.push({p, st: "prepara", pos: p.pos, m: p.m});
  return out.sort((a, b) => a.pos - b.pos);
}
// compatibilidad: el tramo más grande
function bedState(plan, bed, w) {
  const s = bedSegs(plan, bed, w).sort((a, b) => b.m - a.m)[0];
  return s ? {p: s.p, st: s.st} : {p: null, st: "libre"};
}

function whatsappText(w){
  const T = weekTasks(plan, w);
  const work = T.filter(t => t.k !== "cosecha");
  const harv = T.filter(t => t.k === "cosecha");
  let s = `*Huerto Dos Búhos · semana del ${weekRange(w)}*\n`;
  for (let d = 1; d <= 5; d++) {
    const list = work.filter(t => t.d === d);
    if (w === 0 && typeof FIRST_DAY !== "undefined" && d < FIRST_DAY) continue;
    const date = fmt(new Date(wkDate(w).getTime() + (d - 1) * DAY));
    s += `\n*${DIAS[d].toUpperCase()} ${date}*\n`;
    if (d % 2 === 1 && harv.length) s += `▢ Cosecha para cocina antes de las 10:00, pesar y anotar\n`;
    list.forEach(t => s += `▢ ${t.b ? `*${t.b}* · ` : ""}${t.t}\n`);
  }
  if (harv.length) {
    const byCrop = {};
    harv.forEach(t => { const o = byCrop[t.crop] = byCrop[t.crop] || {beds: [], qty: 0, u: t.u}; o.beds.push(t.bed); o.qty += t.qty; });
    s += `\n*COSECHA DE LA SEMANA* (aprox., repartir lun/mié/vie)\n`;
    Object.entries(byCrop).forEach(([c, o]) => s += `• ${CROPS[c].n}: ${o.u === "kg" ? nf(o.qty, 1) + " kg" : nf(o.qty) + " flores"} (${o.beds.join(", ")})\n`);
  }
  s += `\nAl terminar cada cama, mandar foto. Viernes: foto de cada cuadrante.`;
  return s;
}
function copyText(txt){

views.cosecha = () => {
  const F = forecast(plan);
  const months = MONTHS.slice(0, 12);
  const cats = Object.keys(CAT);
  const data = months.map(m => { const o = {m}; cats.forEach(k => o[k] = 0); o.fl = 0; Object.entries(F[m] || {}).forEach(([c, v]) => { if (CROPS[c].u === "kg") o[CROPCAT[c]] += v; else o.fl += v; }); o.tot = cats.reduce((a, k) => a + o[k], 0); return o; });
  const actual = {};
  state.harvests.forEach(h => { if (h.u !== "kg") return; const k = (h.fecha || "").slice(0, 7); actual[k] = (actual[k] || 0) + (+h.cantidad || 0); });
  const max = Math.ceil(Math.max(...data.map(d => d.tot), ...Object.values(actual), 1) / 50) * 50;
  const W = 720, H = 300, L = 40, R = 8, Tp = 10, B = 26, bw = (W - L - R) / months.length;
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cosecha estimada por mes en kilos">`;
  for (let v = 0; v <= max; v += max / 4) { const y = Tp + (H - Tp - B) * (1 - v / max); svg += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="axis" x="${L - 6}" y="${y + 4}" text-anchor="end">${nf(v)}</text>`; }
  data.forEach((d, i) => {
    let y = H - B; const x = L + i * bw + bw * .18, w = bw * .64;
    const segs = cats.filter(k => d[k] > 0);
    segs.forEach((k, j) => {
      const h = (H - Tp - B) * d[k] / max; y -= h;
      const top = j === segs.length - 1;
      const gap = j > 0 ? 2 : 0;
      svg += `<path data-tip="${esc(monthLabel(d.m))}|${CAT[k][0]}|${nf(d[k])} kg" d="${top ? `M${x},${y + h - gap} V${y + 4} Q${x},${y} ${x + 4},${y} H${x + w - 4} Q${x + w},${y} ${x + w},${y + 4} V${y + h - gap} Z` : `M${x},${y + h - gap} V${y} H${x + w} V${y + h - gap} Z`}" fill="var(${CAT[k][1]})" style="cursor:default"/>`;
    });
    if (actual[d.m]) { const ay = Tp + (H - Tp - B) * (1 - actual[d.m] / max); svg += `<line x1="${x - 3}" x2="${x + w + 3}" y1="${ay}" y2="${ay}" stroke="var(--fg)" stroke-width="2.5"/><title>Registrado ${nf(actual[d.m])} kg</title>`; }
    svg += `<rect x="${L + i * bw}" y="${Tp}" width="${bw}" height="${H - Tp - B}" fill="transparent" data-tip="${esc(monthLabel(d.m))}|Total estimado|${nf(d.tot)} kg${actual[d.m] ? " · registrado " + nf(actual[d.m]) + " kg" : ""}" class="hit"/>`;
    svg += `<text class="axis" x="${L + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle">${monthShort(d.m)}</text>`;
  });
  svg += `</svg>`;
  const year = data.reduce((a, d) => a + d.tot, 0);
  const crops = Object.keys(CROPS).filter(c => months.some(m => (F[m] || {})[c]));
  const table = `<table><thead><tr><th>Cultivo</th>${months.map(m => `<th class="r">${monthShort(m)}</th>`).join("")}<th class="r">Año</th></tr></thead><tbody>${crops.map(c => { let t = 0; const cells = months.map(m => { const v = (F[m] || {})[c] || 0; t += v; return `<td class="r num">${v ? nf(v) : "<span class='muted'>·</span>"}</td>`; }).join(""); return `<tr><td style="white-space:nowrap"><span class="dot" style="background:${CROPS[c].c}"></span> ${esc(CROPS[c].n)}${CROPS[c].u !== "kg" ? " <span class='muted small'>(flores)</span>" : ""}</td>${cells}<td class="r num"><b>${nf(t)}</b></td></tr>`; }).join("")}</tbody></table>`;
  return `
  <div class="bar" style="justify-content:space-between"><div><div class="eyebrow">Pronóstico para cocina · kilos por mes</div><h2>≈ ${nf(year)} kg en 12 meses</h2></div>

  <section class="panel chart" id="chart">${svg}</section>
  <p class="small muted" style="margin:0">Noviembre sale casi vacío porque todas las camas se limpian en octubre; la producción arranca en diciembre. Los rendimientos son estimaciones de partida: el registro semanal de Adrián los corrige.</p>
  <section class="panel"><h3 style="margin-bottom:8px">Detalle por cultivo</h3><div class="scroll">${table}</div></section>`;

views.compras = () => {
  const from = state.w, to = Math.min(PLAN_WEEKS - 1, state.w + 5);
  const items = [];
  plan.P.forEach(p => {
    const c = p.c, len = p.m;
    const when = p.tray ? p.ts : p.s;
    if (p.ex || when < from || when > to || c.met === "división" || c.met === "propia") return;
    let q;
    if (p.tray) q = `semilla para ${nf(p.cells)} cavidades (${p.trays} charola${p.trays > 1 ? "s" : ""})`;
    else if (c.met === "bulbo") q = `${nf(Math.ceil(c.rows * Math.floor(len / c.esp) * 1.1))} dientes / bulbos`;
    else if (c.rows) q = `${nf(c.rows * len, 1)} m de hilera`;
    else q = `${nf(p.area, 1)} m² al voleo`;
    items.push({when, c, q, bed: p.bed + (p.frac < .999 ? ` (${nf(p.m, 1)} m)` : ""), uso: p.tray ? "semillero" : "cama"});
  });
  items.sort((a, b) => a.when - b.when);
  // lista del año: semilla total por cultivo
  const yr = {};
  plan.P.forEach(p => {
    const c = p.c, len = p.m;
    if (p.ex || c.met === "división" || c.met === "propia") return;
    const r = yr[p.crop] = yr[p.crop] || {first: p.tray ? p.ts : p.s, cells: 0, meters: 0, bulbs: 0, area: 0, n: 0};
    r.first = Math.min(r.first, p.tray ? p.ts : p.s); r.n++;
    if (p.tray) r.cells += p.cells;
    else if (c.met === "bulbo") r.bulbs += Math.ceil(c.rows * Math.floor(len / c.esp) * 1.1);
    else if (c.rows) r.meters += c.rows * len; else r.area += p.area;
  });
  const yrList = Object.entries(yr).sort((a, b) => (STOCK[a[0]] ? 1 : 0) - (STOCK[b[0]] ? 1 : 0) || a[1].first - b[1].first);
  const yq = (k, r) => [r.cells && `${nf(r.cells)} cavidades`, r.meters && `${nf(r.meters)} m de hilera`, r.bulbs && `${nf(r.bulbs)} ${k === "ajo" ? "dientes y bulbos" : "piezas"}`, r.area && `${nf(r.area)} m² al voleo`].filter(Boolean).join(" + ");
  let maxTrays = 0; for (let w = 0; w < PLAN_WEEKS; w++) maxTrays = Math.max(maxTrays, traysActive(plan, w).reduce((a, p) => a + p.trays, 0));
  return `
  <div class="bar" style="justify-content:space-between">
    <div><div class="eyebrow">Semillas para las próximas 6 semanas</div><h2>${weekRange(from).split(" – ")[0]} – ${weekRange(to).split(" – ")[1]}</h2></div>
    <div class="stepper"><button class="btn icon" id="cprev" aria-label="Antes">←</button><button class="btn icon" id="cnext" aria-label="Después">→</button></div>
  </div>
  <section class="panel scroll"><table><thead><tr><th>Se usa</th><th>Cultivo</th><th>Dónde</th><th class="r">Cantidad</th><th>Cama</th></tr></thead><tbody>
  ${items.map(r => `<tr><td class="num">${fmt(wkDate(r.when))}</td><td><span class="dot" style="background:${r.c.c}"></span> ${esc(r.c.n)}</td><td class="small">${r.uso}${STOCK[Object.keys(CROPS).find(k => CROPS[k] === r.c)] ? ` <span class="chip">en bodega</span>` : ""}</td><td class="r num">${r.q}</td><td class="num small">${r.bed}</td></tr>`).join("") || `<tr><td colspan="5" class="muted">No hay siembras en estas semanas.</td></tr>`}
  </tbody></table></section>
  <section class="panel scroll"><div class="bar" style="justify-content:space-between;margin-bottom:8px"><h3>Lista de compra del año</h3><span class="chip warn">${yrList.filter(([k]) => !STOCK[k]).length} por comprar · ${yrList.filter(([k]) => STOCK[k]).length} en bodega</span></div>
  <table><thead><tr><th>Estado</th><th>Cultivo</th><th>Primera siembra</th><th class="r">Semilla para el año</th></tr></thead><tbody>
  ${yrList.map(([k, r]) => `<tr><td>${STOCK[k] ? `<span class="chip">✓ En bodega</span>` : `<span class="chip warn">Comprar</span>`}</td><td><span class="dot" style="background:${CROPS[k].c}"></span> ${esc(CROPS[k].n)}${STOCK[k] && STOCK[k] !== CROPS[k].n ? ` <span class="muted small">· ${esc(STOCK[k])}</span>` : ""}</td><td class="num small">${fmt(wkDate(r.first))}</td><td class="r num small">${yq(k, r)}</td></tr>`).join("")}
  </tbody></table>
  <p class="small muted" style="margin:8px 0 0">"En bodega": revisar que alcance para la cantidad indicada y que la semilla tenga menos de 2 años. Las hierbas perennes no se compran: se dividen las que ya existen.</p></section>
  <section class="panel"><h3 style="margin-bottom:8px">En bodega, fuera del plan de camas</h3><div class="scroll"><table><tbody>${EXTRA_SEEDS.map(x => `<tr><td style="white-space:nowrap"><b>${esc(x.n)}</b></td><td class="small">${esc(x.uso)}</td></tr>`).join("")}</tbody></table></div></section>
  <section class="panel"><h3 style="margin-bottom:8px">Material del semillero (una sola vez)</h3>
  <ul class="small" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px">
    <li><b>Charolas: 30 de 200 cavidades (ya compradas)</b>. Máximo ${maxTrays} en uso a la vez; sobran para la experiencia "Planta y llévatela"</li>
    <li>Mesa de semillero (ya existe), con malla sombra 50% y cerca de una toma de agua</li>
    <li>Sustrato: 2 partes de fibra de coco o peat moss + 1 parte de composta cernida + 1 de perlita</li>
    <li>Manta térmica o plástico para tapar las charolas en noches de helada (dic–feb)</li>

  <p class="small muted" style="margin:0;max-width:70ch">Para semilla directa, la bolsa indica cuántos metros de hilera rinde; comprar con margen y guardar en lugar fresco y seco. No se compran plántulas: todo lo que va trasplantado sale del semillero.</p>`;
};

views.registro.bind = root => {

/* ---------- tareas ---------- */
const KLAB = {semillero:"Semillero",prep:"Preparar",siembra:"Siembra",cuidado:"Cuidado",base:"Rutina",cosecha:"Cosecha"};
function taskRow(t, pre){
  const done = state.done[t.id];
  return `<div class="task${done ? " done" : ""}"><input type="checkbox" id="${pre}-${t.id}" data-id="${t.id}" ${done ? "checked" : ""}><label for="${pre}-${t.id}"><span class="k ${t.k}">${KLAB[t.k]}</span>${t.b ? `<b class="crop">${esc(t.b)}</b> · ` : ""}${esc(t.t)}</label>${t.min ? `<span class="t">${t.min >= 60 ? nf(t.min / 60, 1) + " h" : Math.round(t.min) + " min"}</span>` : ""}</div>`;
}
function bindTasks(root){
  root.querySelectorAll(".task input").forEach(cb => cb.addEventListener("change", () => toggleDone(cb.dataset.id, cb.checked)));
}
/* ---------- datos compartidos ---------- */
const typing = () => { const a = document.activeElement; return !!a && a.matches("input[type=number], input[type=text], input[type=date], textarea, select"); };
let unsubDone = null;
function subscribeDone(){
  if (!state.db) return;
  if (unsubDone) unsubDone();
  const w = state.w;
  unsubDone = state.db.collection("hechas").where("w", "==", w).onSnapshot(snap => {
    if (w !== state.w) return;
    const d = {}, f = {}; snap.docs.forEach(x => { const v = x.data(); if (!v || !v.id) return; if (v.estado === "ayuda") f[v.id] = v.nota || ""; else d[v.id] = true; });
    state.done = d; state.flags = f; if ((state.view === "semana" || state.view === "hoy") && !typing()) render();
  }, () => {});
}
async function toggleDone(id, on){
  state.done[id] = on;
  if (state.view === "semana" || state.view === "hoy") render();
  if (!state.db) return;
  const ref = state.db.doc(`hechas/w${state.w}-${id}`);
  try { on ? await ref.set({w: state.w, id, estado: "hecho", at: Date.now()}) : await ref.delete(); }
  catch (e) { toast("No se pudo guardar la marca."); }
}
/* ---------- render ---------- */
const TITLES = {hoy: "Hoy", semillero: "Semillero", experiencias: "Experiencias", semana: "Semana", mapa: "Mapa del mes", cosecha: "Cosecha", calendario: "Calendario", cultivos: "Cultivos", compras: "Compras", registro: "Registro"};
const MAIN4 = ["hoy", "semana", "mapa", "cosecha"];
function render(){
  const main = document.getElementById("main");
  const y = window.scrollY;
  main.innerHTML = `<div class="view">${views[state.view]()}</div>`;
  document.getElementById("vtitle").textContent = TITLES[state.view];
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.v === state.view));
  document.querySelectorAll("nav.bottom button").forEach(b => b.setAttribute("aria-selected", b.dataset.v === state.view || (b.dataset.v === "mas" && !MAIN4.includes(state.view))));
  if (views[state.view].bind) views[state.view].bind(main);
  if (render.keep) window.scrollTo(0, y); else window.scrollTo(0, 0);
  render.keep = true;
}

document.querySelectorAll("nav.tabs button, .sheet button").forEach(b => b.onclick = () => go(b.dataset.v));
document.querySelectorAll("nav.bottom button").forEach(b => b.onclick = () => { if (b.dataset.v === "mas") { sheet.hidden = false; return; } go(b.dataset.v); });
sheet.addEventListener("click", e => { if (e.target === sheet) sheet.hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") sheet.hidden = true; });
