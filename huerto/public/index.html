<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Huerto Dos Búhos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body{margin:0}

/* Layout: cuaderno de campo — barra de vistas arriba, contenido en una columna; el mapa del huerto es la pieza central */
:root{
  --bg:#f2f3ec; --surface:#fbfbf7; --sunk:#e8eadf; --fg:#1d261c; --muted:#5d6656; --faint:#646b5c;
  --line:#d3d7c6; --accent:#9e2a3f; --accent-ink:#ffffff; --soil:#8a6a4c; --soil-2:#c9b49a; --leaf:#3e6b35;
  --ok:#2f7a3a; --warn:#8a5200; --danger:#b3261e; --ink-dark:#1d261c; --ink-light:#ffffff; --water:#bcd3e0; --water-ink:#3c6176; --tree:#a9bb8d;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131813; --surface:#1b211a; --sunk:#232a21; --fg:#e4e9dc; --muted:#a6ae9b; --faint:#9aa290;
  --line:#343d31; --accent:#e06a80; --accent-ink:#1a0d10; --soil:#b8946f; --soil-2:#5c4a38; --leaf:#8cc27c;
  --ok:#6fc07a; --warn:#e3a33c; --danger:#ff8a80; --water:#2c4654; --water-ink:#a9cde0; --tree:#3d4d34;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131813; --surface:#1b211a; --sunk:#232a21; --fg:#e4e9dc; --muted:#a6ae9b; --faint:#9aa290;
  --line:#343d31; --accent:#e06a80; --accent-ink:#1a0d10; --soil:#b8946f; --soil-2:#5c4a38; --leaf:#8cc27c;
  --ok:#6fc07a; --warn:#e3a33c; --danger:#ff8a80; --water:#2c4654; --water-ink:#a9cde0; --tree:#3d4d34;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:18px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px;padding-block:6px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,34px);line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;text-wrap:balance}
h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
.facts{font-size:13px;color:var(--muted);font-family:var(--mono)}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;padding-block:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;scrollbar-width:none}
nav.tabs button{font:inherit;font-size:14px;font-weight:600;border:1px solid transparent;background:none;color:var(--muted);padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="page"]{background:var(--fg);color:var(--bg)}
nav.tabs button:hover:not([aria-current="page"]){border-color:var(--line);color:var(--fg)}
button:focus-visible,select:focus-visible,input:focus-visible,.bed:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.view{display:flex;flex-direction:column;gap:18px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.stepper{display:flex;align-items:center;gap:6px}
.btn{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.icon{padding:7px 11px;min-width:38px}
select,input{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 10px;border-radius:8px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* carga */
.load{display:flex;flex-direction:column;gap:6px;min-width:220px;flex:1}
.meter{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--leaf);border-radius:5px}
.meter.over i{background:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--fg);white-space:nowrap}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
/* tareas */
.days{display:flex;flex-direction:column;gap:14px}
.day h3{display:flex;justify-content:space-between;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.task{display:flex;gap:10px;align-items:flex-start;padding:7px 2px;border-bottom:1px dashed var(--line);cursor:pointer;min-height:44px}
.task:last-child{border-bottom:0}
.task input{margin-top:3px;width:18px;height:18px;accent-color:var(--leaf);flex:none;padding:0}
.task .tx{flex:1;min-width:0}
.task .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.k.semillero{color:color-mix(in srgb,var(--s1) 80%,var(--fg))} .k.prep{color:var(--soil)} .k.siembra{color:var(--leaf)} .k.cuidado{color:var(--warn)} .k.base{color:var(--faint)}
.task.done .tx{color:var(--faint);text-decoration:line-through}
.task .t{font-family:var(--mono);font-size:12px;color:var(--faint);white-space:nowrap}
.task b.crop{font-weight:700;color:var(--fg)}
.task.done b.crop{color:inherit}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
/* mapa */
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
svg.map{width:100%;height:auto;display:block}
svg.map .wall{stroke:var(--soil);stroke-width:.12;fill:none}
svg.map .tree{fill:var(--tree)}
svg.map .bed{cursor:pointer}
svg.map .bedbox{stroke:var(--fg);stroke-opacity:.55;stroke-width:.08}
svg.map .bed:hover .bedbox,svg.map .bed.sel .bedbox{stroke:var(--accent);stroke-opacity:1;stroke-width:.22}
svg.map text{font-family:var(--body);fill:var(--fg)}
svg.map .lab{font-size:.62px;font-weight:700}
svg.map .crop{font-size:.5px;font-weight:600}
svg.map .seclab{font-family:var(--display);font-size:1.5px;fill:var(--muted)}
svg.map .feat{font-size:.55px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.monthpick{display:flex;flex-wrap:wrap;gap:4px}
.monthpick button{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:5px 9px;border-radius:7px;cursor:pointer}
.monthpick button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bedinfo .row{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.timeline{display:flex;flex-direction:column;gap:8px}

/* mensajes */
.thread{display:flex;flex-direction:column;gap:8px;max-height:62vh;overflow-y:auto;padding:4px 0}
.msg{max-width:85%;padding:9px 12px;border-radius:14px;background:var(--sunk);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.msg.me{align-self:flex-end;background:color-mix(in srgb,var(--leaf) 20%,var(--surface))}
.msg small{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.send{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;margin-top:10px}
.send textarea{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:48px;resize:vertical;background:var(--surface);color:var(--fg)}
/* compras y semillas */
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.li input[type=checkbox]{width:24px;height:24px;accent-color:var(--leaf)}
.li.done .what{color:var(--faint);text-decoration:line-through}
.li .x,.sb .x{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:9px;width:40px;min-height:40px;cursor:pointer}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:6px;margin-top:10px}
.addrow input{font-size:16px;min-height:44px;width:100%;box-sizing:border-box}
.addrow .btn{min-height:44px}
.sb{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px dashed var(--line)}
.sb .top{display:flex;gap:8px;align-items:center;justify-content:space-between}
.lvl{display:flex;gap:4px;flex-wrap:wrap}
.lvl button{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 10px;border-radius:8px;min-height:40px;cursor:pointer}
.lvl button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.lvl button.low[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.sb input{font-size:16px;min-height:44px;width:100%;box-sizing:border-box}

/* censo de camas */
.cc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 10px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:70px}
.cc.saved{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.cch{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cch b{font-size:22px;font-family:var(--serif, Georgia, serif);font-weight:400}
.cch .chip{margin-left:auto}
.cbar{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:repeating-linear-gradient(135deg,var(--sunk) 0 6px,var(--surface) 6px 12px)}
.cbar i{display:flex;align-items:center;justify-content:center;height:100%;border-right:2px solid var(--surface);font-style:normal;font-size:12px;font-weight:700;overflow:hidden;white-space:nowrap;padding:0 4px;min-width:0;line-height:1.05;text-align:center}
.cbar i:last-child{border-right:0}
.cbar .vac{flex:1;color:var(--muted);text-shadow:none;font-weight:600;background:none}
.cends{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:-6px;letter-spacing:.04em;text-transform:uppercase}
.cl{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.cl .sw{grid-row:1 / span 3;align-self:stretch;border-radius:3px}
.cl .mrow-old{grid-column:2 / -1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cl .mrow .lab{font-size:13px;color:var(--muted)}
.cl .mrow .lnk{margin-left:auto}
.cl select,.cl input{font-size:16px;min-height:44px;width:100%;box-sizing:border-box;padding:6px 8px}
.cl select.crop{font-weight:700;font-size:17px;min-height:44px}
.cl select.crop.empty{font-weight:400;color:var(--muted)}
.cl .mstep{grid-column:2 / -1}.mstep{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.mstep button{border:0;background:var(--sunk);font-size:18px;width:32px;min-height:40px;cursor:pointer;color:var(--fg);padding:0}
.mstep select{border:0;border-radius:0;width:auto !important;min-width:62px;text-align:center;font-weight:700;padding:0 2px;background:var(--surface);-webkit-appearance:none;appearance:none;text-align-last:center}
.cl .x{border:0;background:none;color:var(--faint);width:28px;min-height:40px;font-size:18px;cursor:pointer;padding:0}
.cl .more{grid-column:2 / -1;display:flex;gap:6px;align-items:center}
.cl .more select{flex:1}
.cl .more input,.cl .more select{min-height:44px;font-size:15px}
.cl .more .fe{max-width:128px;font-size:14px;padding:4px 6px}
.lnk{border:0;background:none;color:var(--muted);font-size:13px;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;grid-column:2 / -1;justify-self:start}
.cfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:6px;border-top:1px dashed var(--line)}
.cfoot .btn{min-height:40px;font-size:14px}
.cends .rest{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:600;color:var(--muted)}
.cends .rest.full{color:var(--ok)}
.cends .over{color:var(--danger);font-weight:700}
.cfoot{flex-wrap:nowrap}
.kseg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--sunk);padding:4px;border-radius:12px}
.kseg button{min-height:44px;border:0;border-radius:9px;background:none;font:inherit;font-weight:700;font-size:14.5px;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.kseg button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.kb{min-width:20px;height:20px;border-radius:10px;background:var(--danger);color:var(--surface);font-size:12px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.kalerts{display:flex;flex-direction:column;gap:8px}
.kal{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);border-left:4px solid var(--muted);background:var(--surface);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer;color:var(--fg)}
.kal span{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}.kal.warn{border-left-color:var(--warn)}.kal.bad{border-left-color:var(--danger)}
.kper{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.kper button{min-height:44px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font:inherit;font-size:13.5px;font-weight:600;color:var(--fg);cursor:pointer}
.kper button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.ktiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:860px){.ktiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kt>span{font-size:12.5px;color:var(--muted);font-weight:600}.kt b{font-size:22px;font-variant-numeric:tabular-nums}.kt b small{font-size:13px;font-weight:600;color:var(--muted)}
.kt>small{font-size:12px;color:var(--muted)}.kt i{display:block;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}.kt i em{display:block;height:100%;background:var(--ok)}
.kr{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.kr1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.kr1 .dot{width:10px;height:10px;border-radius:3px;flex:none}.kr1 b{flex:1 1 auto;min-width:0}
.kr1 .km{font-weight:700;font-variant-numeric:tabular-nums}.kr1 .kv{font-size:13px}
.kbars{display:flex;flex-direction:column;gap:3px}.kbars i{display:block;height:7px;border-radius:4px;min-width:2px}
.kbars .e,.klg .e{background:color-mix(in srgb,var(--muted) 35%,transparent)}.kbars .g,.klg .g{background:var(--ok)}
.klg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 3px 0 8px;vertical-align:-1px}
.kn b{color:var(--fg)}
.krest{border-top:1px solid var(--line);padding-top:8px}.krest>summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}.kq{padding:6px 0;border-top:1px dashed var(--line)}
.kf{font-size:13px;font-weight:600;padding:4px 8px;border-radius:6px;background:var(--sunk);align-self:flex-start}.kf.bad{color:var(--danger)}.kf.warn{color:var(--warn)}.kf.ok{color:var(--ok)}
.bar>div:has(>.mnav){flex:1 1 100%;min-width:0}
.mnav{width:100%;max-width:440px;display:flex;align-items:center;gap:6px;margin-top:2px}
.mnav h2{flex:1;min-width:0;text-align:center;margin:0}
.mnav button{flex:none;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font-size:24px;line-height:1;cursor:pointer}
.mnav button:disabled{opacity:.35;cursor:default}
.zsel{display:flex;align-items:center;gap:8px;margin:0}.zsel span{font-size:13px;font-weight:600;color:var(--muted)}.zsel select{flex:1;min-height:44px;font-weight:600}
.mstep .trash{color:var(--danger);display:inline-flex;align-items:center;justify-content:center}
.cfoot .addsq{flex:0 0 auto;width:48px;min-width:48px;height:48px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.cfoot [data-save]{flex:1}
.taskw{display:grid;grid-template-columns:minmax(0,1fr) 44px;align-items:start;border-bottom:1px solid var(--line)}
.taskw>.task{border-bottom:0}
.taskw .tmore{width:44px;min-height:48px;border:0;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;border-radius:10px}
.taskw.open .tmore{background:var(--sunk);color:var(--fg)}
.taskw .why{display:block;font-size:13px;font-weight:600;margin-top:2px;color:var(--muted)}.taskw .why.bad{color:var(--danger)}.taskw .why.warn{color:var(--warn)}
.taskw.nope .tx{opacity:.85}
.tpanel{grid-column:1 / -1;display:flex;flex-direction:column;gap:8px;padding:4px 0 12px}
.tst{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tst button,.treasons button{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font:inherit;font-size:14px;font-weight:600;color:var(--fg);cursor:pointer;padding:4px 8px}
.tst button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.treasons{display:flex;flex-wrap:wrap;gap:6px}.treasons button{min-height:40px;font-size:13px;border-radius:999px}
.tpanel .tnote{min-height:44px;font-size:16px}
.chead{display:flex;flex-direction:column;gap:8px}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
@media (min-width:1000px){.cgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cbar i{flex-direction:column;line-height:1.15;min-width:0}.cbar i .bn{max-width:100%;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.cfoot .lnk{min-height:40px;display:inline-flex;align-items:center}
.cl .ldet{grid-column:2 / -1;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.cl .ldet>summary{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 10px;cursor:pointer;list-style:none;font-size:13.5px}
.cl .ldet>summary::-webkit-details-marker{display:none}
.cl .ldet .ds{flex:1;min-width:0;color:var(--fg);overflow-wrap:anywhere}.cl .ldet .ds.empty{color:var(--muted)}
.cl .ldet .de{flex:none;font-weight:700;color:var(--accent, var(--fg));font-size:13px}.cl .ldet .de::after{content:" ▾"}.cl .ldet[open] .de::after{content:" ▴"}

<script>// Adaptador para la versión web pública: reemplaza la base de datos de Claude por la API del Worker (/api/*).
(function () {
  const KEY = 'huerto-pin';
  const getPin = () => { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } };
  const setPin = p => { try { p ? localStorage.setItem(KEY, p) : localStorage.removeItem(KEY); } catch (e) {} };
  // Hoja dentro de la app para pedir el PIN (campo numérico oculto). Resuelve con el PIN ya verificado, o '' si se cancela.
  // Se superpone a la página: no borra lo que la persona estaba escribiendo.
  let asking = null;
  function askPin(why) {
    if (asking) return asking;
    asking = new Promise(resolve => {
      const back = document.activeElement;
      const el = document.createElement('div');
      el.className = 'sheet pinsheet';
      el.innerHTML = '<form class="in" role="dialog" aria-modal="true" aria-labelledby="pin-t" novalidate>'
        + '<div class="pinh"><b id="pin-t">PIN para guardar</b></div>'
        + (why ? '<p class="small muted" style="margin:0">' + why + '</p>' : '')
        + '<label class="fl" for="pin-i"><span class="fll">PIN (pídelo a Eric o Melanie)</span>'
        + '<input id="pin-i" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="12" enterkeyhint="done" aria-describedby="pin-e pin-h"></label>'
        + '<p class="ferr" id="pin-e" role="alert" hidden></p>'
        + '<p class="small muted" id="pin-h" style="margin:0">Se recuerda en este teléfono: no hay que escribirlo cada vez.</p>'
        + '<div class="pinb"><button type="submit" class="btn primary">Guardar con este PIN</button><button type="button" class="btn" data-x>Cancelar</button></div></form>';
      document.body.appendChild(el);
      const form = el.querySelector('form'), inp = el.querySelector('#pin-i'), err = el.querySelector('#pin-e'), ok = el.querySelector('button[type=submit]');
      const done = v => { el.remove(); document.removeEventListener('keydown', onKey, true); asking = null; if (back && back.focus) try { back.focus({ preventScroll: true }); } catch (e) {} resolve(v); };
      const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); done(''); } };
      document.addEventListener('keydown', onKey, true);
      el.addEventListener('click', e => { if (e.target === el) done(''); });
      el.querySelector('[data-x]').onclick = () => done('');
      const show = m => { err.textContent = m; err.hidden = false; inp.classList.add('invalid'); inp.setAttribute('aria-invalid', 'true'); inp.select(); };
      inp.oninput = () => { err.hidden = true; inp.classList.remove('invalid'); inp.removeAttribute('aria-invalid'); };
      form.onsubmit = async e => {
        e.preventDefault();
        const p = inp.value.trim();
        if (!p) { show('Escribe el PIN'); return; }
        ok.disabled = true; ok.textContent = 'Revisando…';
        let j = null;
        try { j = await (await fetch('/api/pin', { method: 'POST', headers: { 'x-pin': p } })).json(); } catch (e2) { j = { net: true }; }
        ok.disabled = false; ok.textContent = 'Guardar con este PIN';
        if (j && j.ok) { setPin(p); done(p); return; }
        show(j && j.net ? 'Sin conexión. Intenta de nuevo.' : 'PIN incorrecto');
      };
      setTimeout(() => inp.focus(), 30);
    });
    return asking;
  }
  async function ensurePin(why) {
    const p = getPin();
    if (p) return p;
    const n = await askPin(why);
    if (!n) throw { code: 'no_pin' };
    return n;
  }
  const refresh = () => window.dispatchEvent(new Event('huerto-refresh'));
  async function post(path, body) {
    let pin;
    try { pin = await ensurePin(); } catch (e) { refresh(); throw e; }
    const send = p => fetch(path, { method: 'POST', headers: { 'content-type': 'application/json', 'x-pin': p }, body: JSON.stringify(body) });
    let r;
    try { r = await send(pin); } catch (e) { refresh(); throw { code: 'unavailable' }; }
    if (r.status === 401) {
      // El PIN guardado ya no sirve (lo cambiaron): pedirlo otra vez y reintentar una sola vez.
      setPin('');
      try { pin = await ensurePin('El PIN guardado en este teléfono ya no sirve. Escríbelo de nuevo.'); } catch (e) { refresh(); throw e; }
      try { r = await send(pin); } catch (e) { refresh(); throw { code: 'unavailable' }; }
      if (r.status === 401) { setPin(''); refresh(); throw { code: 'bad_pin' }; }
    }
    if (r.status === 400) { const j = await r.json().catch(() => ({})); throw { code: 'invalid', message: j.error || 'Datos inválidos' }; }
    if (!r.ok) { refresh(); throw { code: 'unavailable' }; }
    return r.json().catch(() => ({}));
  }
  const snap = rows => ({ docs: rows.map(d => ({ id: d.id, data: () => d })), size: rows.length, empty: !rows.length });
  function poll(load, cb) {
    const run = async () => { try { cb(snap(await load())); } catch (e) {} };
    run();
    const t = setInterval(() => { if (document.visibilityState === 'visible') run(); }, 20000);
    window.addEventListener('huerto-refresh', run);
    return () => { clearInterval(t); window.removeEventListener('huerto-refresh', run); };
  }
  const db = {
    collection(name) {
      let w = null, ayuda = false;
      const q = {
        where(f, op, v) { if (f === 'estado') ayuda = true; else w = v; return q; },
        orderBy() { return q; },
        limit() { return q; },
        onSnapshot(cb) {
          if (name === 'hechas' && ayuda) return poll(async () => (await (await fetch('/api/avisos')).json()).rows, cb);
          if (name === 'camas') return poll(async () => (await (await fetch('/api/camas')).json()).rows, cb);
          if (name === 'hechas') return poll(async () => (await (await fetch('/api/hechas?w=' + w)).json()).rows, cb);
          return poll(async () => (await (await fetch('/api/cosechas')).json()).rows, cb);
        },
        async add(doc) {
          if (name === 'camas') { const j = await post('/api/camas', doc); refresh(); return { id: j.id }; }
          const j = await post('/api/cosechas', doc); refresh(); return { id: j && j.id };
        },
      };
      return q;
    },
    doc(path) {
      const c = path.match(/^camas\/(.+)$/);
      if (c) return { async delete() { await post('/api/camas', { del: c[1] }); refresh(); } };
      const m = path.match(/^hechas\/w(\d+)-(.+)$/);
      return {
        async set(d) { await post('/api/hechas', { w: Number(m[1]), id: m[2], done: true, estado: d && d.estado, nota: d && d.nota, txt: d && d.txt }); refresh(); },
        async delete() { await post('/api/hechas', { w: Number(m[1]), id: m[2], done: false }); refresh(); },
      };
    },
  };
  window.claude = { use: async n => (n === 'db' ? db : null) };
  window.huertoApi = { post };
})();
</script>

const PLAN_START = "2026-10-12"; // semana 1: arranque (miércoles 14 a viernes 16)
const FIRST_DAY = 3;
const TRAY_CELLS = 200; // charolas de 200 cavidades (30 compradas) // la semana 1 empieza en miércoles
const PLAN_WEEKS = 53;

// Semillas en bodega (oct 2026)
const STOCK = {
  quelites: "Amaranto rojo",
  calendula: "Caléndula",
  cempasuchil: "Cempasúchil",
  cilantro: "Cilantro",
  chicharo: "Chícharo",
  aciano: "Aciano (flor celeste)",
  amapola: "Amapola de California",
  decor: "Zinnia, cosmos y girasol",
  col: "Col Copenhagen, 800 semillas (llegó 11 oct)",
  viola: "Pensamiento suizo gigante, 600 semillas (llegó 11 oct)",
  rabano: "Rábano Champion, 10,000 semillas (llegó 11 oct)",
  perejil: "Perejil italiano, 6 g (llegó 11 oct)",
  haba: "Haba (llegó 11 oct)",

  kale: "Kale lacinato, 270 g (llega 13–15 oct)",
};
// Semillas en bodega que no están en el plan de camas: dónde usarlas
const EXTRA_SEEDS = [
  {n:"Conchita azul (Clitoria)", uso:"Flor azul comestible para cócteles y aguas (cambia de color con limón). Necesita calor: sembrar en charola en abril y poner en malla junto al pepino."},
  {n:"Pepino sandía (cucamelon)", uso:"Sembrar en charola en abril y compartir la malla del pepino en A5. Botana para la tabla de vegetales."},
  {n:"Menta limón", uso:"Tina oeste junto a la menta, o macetas para \"Planta y llévatela\". Hoja para aguas frescas y cócteles."},
  {n:"Dalias", uso:"Tina este y orillas de los muros; pétalos comestibles. Sembrar en marzo."},
  {n:"Maravilla", uso:"Solo decorativa: tina este, orillas y bajo los granados. No servir en plato."},
  {n:"Frijol", uso:"Ya no hay milpa en el plan (la sección B es solo flores). Usar en \"Siembra una hilera\" con niños o en A8 en verano."},

// Motor del plan: calcula ventanas de cosecha, tareas semanales, horas y pronósticos.
// Cada siembra ocupa un tramo de la cama: pos (m desde el norte en A / desde el oeste en B) y m (metros).
const BEDS = (() => {
  const b = [];
  for (let i = 1; i <= 24; i++) b.push({id: "A" + i, area: 5, len: 5, sec: "A", q: ["A-NO","A-NE","A-SO","A-SE"][Math.floor((i - 1) / 6)]});
  for (let i = 1; i <= 10; i++) b.push({id: "B" + i, area: 13.3, len: 9.5, sec: "B", q: i <= 5 ? "B-O" : "B-E"});
  // Invernaderos VEVOR (8.3 × 2.9 m) entre las secciones, a cada lado del pasillo central: camas de 1 × 8 m.
  // El lado sur del invernadero este es la mesa de semillero (no es cama).
  for (let i = 1; i <= 3; i++) b.push({id: "I" + i, area: 8, len: 8, sec: "I", q: "I"});
  return b;
})();
const BED = Object.fromEntries(BEDS.map(b => [b.id, b]));
const DAY = 86400000;
const D = s => new Date(s + "T12:00:00");
const wk = s => Math.round((D(s) - D(PLAN_START)) / (7 * DAY));
const wkDate = w => new Date(D(PLAN_START).getTime() + w * 7 * DAY);
const MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESL = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const fmt = d => d.getDate() + " " + MES[d.getMonth()];
const mtxt = m => (Number.isInteger(m) ? m : m.toFixed(1)) + " m";

function factor(sow, crop) {
  if (crop.nofactor) return 1;
  const m = D(sow).getMonth();
  if (m === 10 || m === 11 || m === 0) return 1.3;
  if (m === 9 || m === 1) return 1.15;
  return 1;
}
const overlaps = (a, b) => a.pos < b.pos + b.m - 1e-9 && b.pos < a.pos + a.m - 1e-9;

function buildPlan() {
  const byBed = {};
  const P = PLANTINGS.map(([bed, crop, sow, opt], i) => {
    opt = opt || {};
    const c = CROPS[crop];
    const B = BED[bed];
    const m = opt.m ?? B.len, pos = opt.pos ?? 0;
    const frac = m / B.len;
    const ex = opt.ex || null;
    const s = ex ? 0 : wk(sow);
    const direct = !!opt.d;
    const tray = !ex && ((c.met === "plántula" && !direct) || !!opt.t);
    const char = opt.char ?? c.char;
    const esp = opt.esp ?? c.esp;
    const h0 = ex ? wk(ex[0]) : opt.t ? s + Math.ceil((opt.tsem ?? 3) * (B.sec === "I" ? 1 : factor(sow, c))) : s + Math.ceil((c.sem + (direct && c.char ? c.char : 0)) * (B.sec === "I" ? 1 : factor(sow, c)));
    const h1 = ex ? wk(ex[1]) : h0 + c.dur - 1;
    const plants = esp ? c.rows * Math.floor(m / esp) : 0;
    const cells = tray ? Math.ceil(plants * 1.3) : 0;
    const p = {i, bed, crop, c, sow, s, h0, h1, m, pos, frac, ex: !!ex, area: B.area * frac, scale: B.area * frac / 5,
      direct, tray, ts: tray ? s - char : null, plants, cells, trays: Math.ceil(cells / (typeof TRAY_CELLS !== "undefined" ? TRAY_CELLS : 72)), note: opt.note || ""};
    (byBed[bed] = byBed[bed] || []).push(p);
    return p;
  });
  const issues = [];
  P.forEach(p => { if (p.tray && p.ts < 0) issues.push(`${p.bed}: ${p.crop} necesita semillero desde antes del inicio (sem ${p.ts})`); });
  for (const bed of Object.keys(byBed)) {
    const list = byBed[bed].sort((a, b) => a.s - b.s || a.pos - b.pos);
    list.forEach(p => {
      if (p.pos + p.m > BED[bed].len + 1e-9) issues.push(`${bed}: ${p.crop} se sale de la cama`);
      const prev = list.filter(q => q !== p && q.s < p.s && overlaps(p, q));
      const next = list.filter(q => q !== p && q.s > p.s && overlaps(p, q)).sort((a, b) => a.s - b.s)[0];
      const same = list.filter(q => q !== p && q.s === p.s && overlaps(p, q));
      if (same.length) issues.push(`${bed}: ${p.crop} y ${same[0].crop} ocupan el mismo tramo`);
      p.prev = prev.sort((a, b) => b.s - a.s)[0] || null;
      p.first = !p.prev;
      p.end = next ? Math.min(p.h1, next.s - 1) : p.h1;
      if (next && next.s <= p.h0 && !p.c.nokg) issues.push(`${bed}: ${p.crop} (cosecha desde sem ${p.h0}) choca con ${next.crop} sem ${next.s}`);
      if (next && next.s - 1 < p.h1 - 1 && !p.ex) issues.push(`${bed}: ${p.crop} pierde ${p.h1 - (next.s - 1)} sem por ${next.crop}`);
      p.prepW = p.ex ? null : p.first ? Math.max(0, p.s - 1) : p.s;
    });
    // ocupación: una siembra nueva no puede entrar donde hay un cultivo existente activo
    list.forEach(p => list.forEach(q => { if (q !== p && overlaps(p, q) && q.s < p.s && q.end >= p.s) issues.push(`${bed}: ${p.crop} entra (sem ${p.s}) antes de que termine ${q.crop} (sem ${q.end})`); }));
  }
  return {P, byBed, issues};
}

// tramos de una cama en una semana: [{p, st, pos, m}]
function bedSegs(plan, bed, w) {
  const list = plan.byBed[bed] || [];
  const out = [];
  for (const p of list) {
    if (w >= p.s && w <= p.end) out.push({p, st: w >= p.h0 && !p.c.nokg ? "cosecha" : "crece", pos: p.pos, m: p.m});
  }
  for (const p of list) if (w === p.prepW && !out.some(o => overlaps(o, p))) out.push({p, st: "prepara", pos: p.pos, m: p.m});
  return out.sort((a, b) => a.pos - b.pos);
}
// compatibilidad: el tramo más grande
function bedState(plan, bed, w) {
  const s = bedSegs(plan, bed, w).sort((a, b) => b.m - a.m)[0];
  return s ? {p: s.p, st: s.st} : {p: null, st: "libre"};
}

function traysActive(plan, w){ return plan.P.filter(p => p.tray && w >= p.ts && w < p.s); }
const BASE_TASKS = [
  {d:1, t:"Revisar riego: abrir el goteo, caminar cada cama y destapar goteros", min:45},
  {d:4, t:"Deshierbe general de pasillos y camas", min:180},
  {d:5, t:"Censo de camas: en la app, Mapa → \"Actualizar camas\": revisar cada cama (metros y cultivo, de norte a sur) y guardar. Luego en Más → \"Compras y semillas\": anotar lo que haga falta y cuánta semilla queda", min:50},
  {d:5, t:"Composta: voltear la pila y agregar restos de cosecha", min:45},
  {d:5, t:"Preparar las experiencias de visitantes de la semana (ver pestaña Experiencias)", min:45},
];

function where(p) { return p.frac < 0.999 ? `${p.bed} (${mtxt(p.m)})` : p.bed; }

function weekTasks(plan, w) {
  const T = [];
  const d0 = w === 0 && typeof FIRST_DAY !== "undefined" ? FIRST_DAY : 1;
  BASE_TASKS.forEach((b, k) => T.push({id: "base" + k, d: Math.max(d0, b.d), t: b.t, min: b.min, k: "base"}));
  (typeof EXTRA_TASKS !== "undefined" ? EXTRA_TASKS : []).filter(x => wk(x.w) === w).forEach((x, k) => T.push({id: "x" + w + "-" + k, d: x.d || 1, t: x.t, min: x.min, k: x.k || "prep", bed: x.bed}));
  if (traysActive(plan, w).length || plan.P.some(p => p.tray && p.ts === w)) for (let d = d0; d <= 5; d++) T.push({id: "sem-riego" + d, d, t: "Revisar y regar las charolas del semillero (en la mañana; tapar si hay riesgo de helada)", min: 15, k: "base"});
  for (const p of plan.P) {
    const k = p.area / 5;
    if (p.tray && w === p.ts) T.push({id: `ch${p.i}`, d: 1, b: p.c.n, t: `Sembrar ${p.cells * 2} semillas en charola, 2 por cavidad · Destino: ${where(p)} · Trasplante ≈ ${fmt(wkDate(p.s))} · ${p.c.u === "flores" ? "Flores" : "Cosecha"} ≈ ${fmt(wkDate(p.h0))}`, min: 15 + 20 * p.trays, k: "semillero", bed: p.bed});
    if (p.tray && w === p.s - 1) T.push({id: `en${p.i}`, d: 1, b: p.c.n, t: `Endurecer: sacar la charola al sol y al viento toda la semana y regar menos · Destino: ${where(p)} · Trasplante ≈ ${fmt(wkDate(p.s))} · ${p.c.u === "flores" ? "Flores" : "Cosecha"} ≈ ${fmt(wkDate(p.h0))}`, min: 10, k: "semillero", bed: p.bed});
    if (p.prepW !== null && w === p.prepW) {
      const prev = p.prev;
      const txt = prev
        ? `Preparar ${where(p)}: retirar ${prev.c.n.toLowerCase()}, 2 cm de composta, aflojar con bieldo`
        : `Limpiar ${where(p)}: retirar lo que no se queda, 2 cm de composta, aflojar con bieldo sin voltear`;
      T.push({id: `p${p.i}`, d: 1, t: txt, min: (prev ? 60 : 90) * k, k: "prep", bed: p.bed});
    }
    if (!p.ex && w === p.s) {
      const verbo = p.tray ? "Trasplantar del semillero" : p.c.met === "propia" ? "Trasplantar" : p.c.met === "bulbo" ? "Plantar" : p.c.met === "división" ? "Replantar (dividir matas)" : "Sembrar directo";
      const mm = p.tray || p.c.met === "división" || p.c.met === "propia" ? 45 : p.c.met === "bulbo" ? 45 : 25;
      const how = p.direct ? `semilla directa, ${p.c.rows} hileras sobre goteo; ralear a ${Math.round(p.c.esp * 100)} cm` : p.c.dist;
      T.push({id: `s${p.i}`, d: 2, b: p.c.n, t: `${verbo} en ${where(p)}: ${how}${p.c.nokg ? "" : ` · ${p.c.u === "flores" ? "Flores" : "Cosecha"} ≈ ${fmt(wkDate(p.h0))}`}`, min: mm * k, k: "siembra", bed: p.bed});
    }
    if (!p.ex && (p.c.ralear || p.direct) && w === p.s + 3) T.push({id: `r${p.i}`, d: 3, b: p.c.n, t: `Ralear en ${where(p)}`, min: 30 * k, k: "cuidado", bed: p.bed});
    if (!p.ex && p.c.tutor && w === p.s + 3) T.push({id: `t${p.i}`, d: 3, b: p.c.n, t: `Poner tutor o malla en ${where(p)}`, min: 60 * p.frac, k: "cuidado", bed: p.bed});
    if (p.c.semilla && w === p.end) T.push({id: `sm${p.i}`, d: 3, t: `Cosechar la semilla en ${where(p)}, secarla a la sombra y guardarla en frasco con etiqueta`, min: 45, k: "cuidado", bed: p.bed});
    if (!p.c.nokg && w >= p.h0 && w <= p.end) {
      T.push({id: `h${p.i}`, d: 0, t: `Cosechar ${p.c.n.toLowerCase()} en ${where(p)}`, min: Math.max(10, p.c.cos * p.scale), k: "cosecha", bed: p.bed, crop: p.crop, qty: p.c.kg * p.scale, u: p.c.u});
    }
  }
  // una sola tarea de preparación por cama y semana (camas completas o mitades que se preparan juntas)
  const prepBy = {};
  plan.P.filter(p => p.prepW !== null && w === p.prepW).forEach(p => (prepBy[p.bed] = prepBy[p.bed] || []).push(p));
  for (const [bed, ps] of Object.entries(prepBy)) {
    if (ps.length < 2) continue;
    const ids = new Set(ps.map(p => `p${p.i}`));
    const first = T.findIndex(t => ids.has(t.id));
    const mins = T.filter(t => ids.has(t.id)).reduce((a, t) => a + t.min, 0);
    const m = ps.reduce((a, p) => a + p.m, 0);
    const lbl = m >= BED[bed].len - 1e-9 ? `${bed} (cama completa)` : `${bed} (${mtxt(m)})`;
    const prevs = [...new Set(ps.filter(p => p.prev).map(p => p.prev.c.n.toLowerCase()))];
    const t = prevs.length ? `Preparar ${lbl}: retirar ${prevs.join(" y ")}, 2 cm de composta, aflojar con bieldo` : `Limpiar ${lbl}: retirar lo que no se queda, 2 cm de composta, aflojar con bieldo sin voltear`;
    const keep = {...T[first], t, min: mins};
    for (let j = T.length - 1; j >= 0; j--) if (ids.has(T[j].id)) T.splice(j, 1);
    T.splice(first, 0, keep);
  }
  // repartir trabajo en los días: en orden (semillero → preparar → sembrar → cuidar), sin pasar de ~7.5 h por día
  const harvMin = T.filter(t => t.k === "cosecha").reduce((a, t) => a + t.min, 0);
  const load = [0, 0, 0, 0, 0, 0];
  T.filter(t => t.k === "base").forEach(t => load[t.d] += t.min);
  const hd = [1, 3, 5].filter(d => d >= d0); hd.forEach(d => load[d] += harvMin / hd.length);
  const ord = {semillero: 0, prep: 1, siembra: 2, cuidado: 3};
  const bn = id => id ? id.charCodeAt(0) * 100 + parseInt(id.slice(1)) : 0;
  const work = T.filter(t => t.k in ord).sort((a, b) => ord[a.k] - ord[b.k] || bn(a.bed) - bn(b.bed));
  let day = d0;
  for (const t of work) {
    while (day < 5 && load[day] + t.min > 450) day++;
    t.d = day; load[day] += t.min;
  }
  return T;
}

function weekHours(plan, w) { return weekTasks(plan, w).reduce((a, t) => a + t.min, 0) / 60; }

// pronóstico: por mes calendario, cantidad por cultivo
function forecast(plan) {
  const out = {};
  for (const p of plan.P) { if (p.c.nokg) continue; for (let w = Math.max(0, p.h0); w <= p.end; w++) {
    const d = wkDate(w); d.setDate(d.getDate() + 2);
    const key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    out[key] = out[key] || {};
    out[key][p.crop] = (out[key][p.crop] || 0) + p.c.kg * p.scale;
  } }
  return out;
}

// Plan editable: la copia viva vive en la base de datos (tabla plan). Formato: {siembras:[{id,cama,cultivo,siembra,...}], cultivos:{clave:{...}}, tareas:[...], semillas:{...}}.
const OPT_KEYS = ["pos", "m", "ex", "d", "t", "char", "esp", "tsem", "note"];
function plantingToObj(x, i) { const o = {id: "s" + (i + 1), cama: x[0], cultivo: x[1], siembra: x[2] || ""}; const op = x[3] || {}; OPT_KEYS.forEach(k => { if (op[k] !== undefined) o[k] = op[k]; }); return o; }
function objToPlanting(o) { const op = {}; OPT_KEYS.forEach(k => { if (o[k] !== undefined && o[k] !== null && o[k] !== "") op[k] = o[k]; }); return [o.cama, o.cultivo, o.siembra || "", op]; }
function applyPlanData(data) {
  if (!data) return false;
  if (data.cultivos) for (const [k, c] of Object.entries(data.cultivos)) CROPS[k] = Object.assign({}, CROPS[k] || {}, c);
  if (Array.isArray(data.siembras)) PLANTINGS.splice(0, PLANTINGS.length, ...data.siembras.filter(o => CROPS[o.cultivo] && BED[o.cama]).map(objToPlanting));
  if (Array.isArray(data.tareas) && typeof EXTRA_TASKS !== "undefined") EXTRA_TASKS.splice(0, EXTRA_TASKS.length, ...data.tareas);
  if (data.semillas && typeof STOCK !== "undefined") { for (const k of Object.keys(STOCK)) delete STOCK[k]; Object.assign(STOCK, data.semillas); }
  return true;

  toast.cur = me; document.body.appendChild(t);
}

/* ---------- COCINA: pedidos, mensajes y lo que la cocina usa vs. lo que se siembra ---------- */
const hW = iso => Math.floor((D(iso) - wkDate(0)) / (7 * DAY));
const recentDays = (at, n) => { const d = new Date(String(at).replace(" ", "T") + "Z"); return Date.now() - d < n * DAY; };
function kitchenStats(weeks){
  const w1 = nowW(), w0 = Math.max(0, w1 - weeks + 1), rows = {};
  const row = k => rows[k] = rows[k] || {k, c: CROPS[k], m: 0, exp: 0, got: 0, gotCocina: 0, up: 0, down: 0, notes: []};
  plan.P.forEach(p => {
    if (/^Decorativa/.test(p.c.menu || "")) return;
    if ((p.ex || p.s <= w1) && p.end >= w1) row(p.crop).m += p.m;                       // metros en tierra hoy
    if (!p.c.nokg) for (let w = Math.max(w0, p.h0); w <= Math.min(w1, p.end); w++) row(p.crop).exp += p.c.kg * p.scale; // esperado en el periodo
  });
  const keyOf = c => CROPS[c] ? c : (Object.entries(CROPS).find(([k, x]) => x.n.toLowerCase() === String(c).toLowerCase()) || [])[0];
  (state.harvests || []).forEach(h => { const w = hW(h.fecha || ""); const k = keyOf(h.cultivo); if (!k || !(w >= w0 && w <= w1)) return; const r = row(k); r.got += +h.cantidad || 0; if (h.quien === "cocina") r.gotCocina += +h.cantidad || 0; });
  (state.pvotos || []).forEach(x => { const k = keyOf(x.cultivo); if (!k || !x.voto) return; const r = row(k); if (x.voto.voto === 1) r.up++; else { r.down++; if (x.voto.nota) r.notes.push(x.voto.nota); } });
  const list = Object.values(rows).filter(r => r.m > 0 || r.got > 0 || r.exp > 0 || r.down);
  const anyGot = list.some(r => r.got > 0);
  list.forEach(r => { r.pct = r.exp > 0 ? r.got / r.exp : null; r.kgm = r.m > 0 ? r.got / r.m : null;
    r.flag = r.down ? ["La cocina dijo que no lo necesita", "bad"] : anyGot && !r.c.nokg && r.exp >= 2 && r.got < r.exp * 0.4 ? ["Se cosecha mucho menos de lo esperado", "warn"] : r.exp > 0 && r.got > r.exp * 1.3 ? ["La cocina usa más de lo que se siembra", "ok"] : null; });
  const total = BEDS.reduce((a, b) => a + BED[b.id].len, 0);
  return {anyGot, list: list.sort((a, b) => (b.exp + b.got > 0) - (a.exp + a.got > 0) || (a.c.nokg ? 1 : 0) - (b.c.nokg ? 1 : 0) || (b.got + b.exp) - (a.got + a.exp) || b.m - a.m), w0, w1, total, used: list.reduce((a, r) => a + r.m, 0),
    exp: list.reduce((a, r) => a + (r.c.u === "kg" ? r.exp : 0), 0), got: list.reduce((a, r) => a + (r.c.u === "kg" ? r.got : 0), 0)};
}

/* ---------- censo de camas ---------- */
const NOTAS = ["Listo para cosechar", "Recién sembrado", "Creciendo", "Viejo / sacar", "Plaga o enfermedad", "Floreando"];
const nowW = () => Math.max(0, Math.min(PLAN_WEEKS - 1, todayW));
function cropByText(t){ const low = String(t || "").trim().toLowerCase(); if (!low) return null; for (const [k, c] of Object.entries(CROPS)) if (k === low || c.n.toLowerCase() === low) return k; for (const [k, c] of Object.entries(CROPS)) if (c.n.toLowerCase().split(/[ (]/)[0] === low) return k; return null; }
function cropColor(t){ const k = cropByText(t); return k ? CROPS[k].c : "#8f9c7a"; }
function censoFromPlan(bed){
  const w = nowW();
  return (plan.byBed[bed] || []).filter(p => (p.ex || p.s <= w) && p.end >= w).sort((a, b) => a.pos - b.pos)
    .map(p => ({m: p.m, cultivo: p.c.n, nota: "", fecha: ""}));
}
function censoDraft(bed){
  if (!state.cdraft[bed]) { const c = state.censo[bed]; state.cdraft[bed] = c ? c.lineas.map(l => Object.assign({}, l, {cultivo: CROPS[l.cultivo] ? CROPS[l.cultivo].n : l.cultivo})) : censoFromPlan(bed); }
  return state.cdraft[bed];
}
const censoThisWeek = bed => { const c = state.censo[bed]; if (!c) return false; const d = new Date(c.at.replace(" ", "T") + "Z"); return (Date.now() - d) < 7 * DAY; };
const M_OPTS = len => { const o = []; for (let v = 0.5; v <= len + 1e-9; v += 0.5) o.push(Math.round(v * 10) / 10); return o; };
const fm = v => { const r = Math.round(+v * 100) / 100; return (Number.isInteger(r) ? r : r.toString()) + " m"; };
function shortCrop(n){ return String(n || "").replace(/ \(.*\)$/, ""); }
function censoBar(bed, L){
  const len = BED[bed].len; let used = 0;
  // Cada tramo lleva el número de su renglón (el mismo que el cuadrito de color del renglón); el nombre solo si cabe.
  const segs = L.map((l, i) => ({l, i})).filter(x => +x.l.m > 0).map(({l, i}) => { used += +l.m; const w = Math.min(100, +l.m / len * 100), name = l.cultivo ? shortCrop(l.cultivo) : "¿?", col = l.cultivo ? cropColor(l.cultivo) : "#9aa092";
    return `<i${inkOk(col) ? "" : ` class="pill"`} style="flex:0 1 ${w}%;background:${col};color:${inkOn(col)}" title="${esc(fm(l.m) + " " + (l.cultivo || "sin cultivo"))}">${w >= 36 ? `<span class="bn">${i + 1} · ${esc(name)}</span><span>${fm(l.m)}</span>` : w >= 14 ? `<span class="bn">${i + 1}</span><span>${fm(l.m)}</span>` : `<span class="bn">${i + 1}</span>`}</i>`; }).join("");
  const rest = len - used;
  return {html: segs + (rest > 0.01 ? `<i class="vac">${rest / len >= 0.12 ? "vacío " + fm(rest) : ""}</i>` : ""), used};
}
function cropOptionsHtml(cur){
  const names = [...new Set(Object.values(CROPS).filter(c => !/^Decorativa/.test(c.menu || "") || true).map(c => c.n))].sort((a, b) => a.localeCompare(b, "es"));
  const custom = cur && !names.includes(cur) ? `<option value="${esc(cur)}" selected>${esc(cur)}</option>` : "";
  return `<option value=""${cur ? "" : " selected"}>Elegir cultivo…</option>${custom}${names.map(n => `<option value="${esc(n)}"${n === cur ? " selected" : ""}>${esc(n)}</option>`).join("")}<option value="__otro">Otro (escribir)…</option>`;
}
// Sowing date while taking the census: usually an estimate, so offer "how long ago" picks; "Fecha…" for an exact day.
const detSummary = l => { const p = [l.fecha ? `Siembra ≈ ${fmtISO(l.fecha)}` : "", l.cosecha ? `Cosecha ≈ ${fmtISO(l.cosecha)}` : (l.fecha && harvestOf(l) ? `Cosecha ≈ ${fmtISO(harvestOf(l))}` : ""), l.nota ? `“${l.nota}”` : ""].filter(Boolean);
  return p.length ? `<span class="ds">${esc(p.join(" · "))}</span><span class="de">Editar</span>` : `<span class="ds empty">Fecha de siembra, cosecha y nota</span><span class="de">Agregar</span>`; };
const DQ = [["7", "1 sem"], ["14", "2 sem"], ["30", "1 mes"], ["60", "2 meses"], ["90", "3+ meses"], ["otra", "Fecha…"]];
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const dqOf = l => l._dq || (l.fecha ? "otra" : "");
const cropKeyOf = name => (Object.entries(CROPS).find(([k, c]) => c.n === name || k === name) || [])[0];
const harvestOf = l => { const k = cropKeyOf(l.cultivo); return k && l.fecha ? estHarvest(k, l.fecha) : ""; };
function censoStatus(bed){
  const c = state.censo[bed];
  if ((state.cdirty || {})[bed]) return ["sin guardar", "warn"];
  if (censoThisWeek(bed)) return ["✓ revisada " + fmtISO(c.at.slice(0, 10)), "ok"];
  if (c) return ["revisada " + fmtISO(c.at.slice(0, 10)) + " · revisar", "warn"];

function whatsappText(w){
  const T = weekTasks(plan, w);
  const work = T.filter(t => t.k !== "cosecha");
  const harv = T.filter(t => t.k === "cosecha");
  let s = `*Huerto Dos Búhos · semana del ${weekRange(w)}*\n`;
  for (let d = 1; d <= 5; d++) {
    const list = work.filter(t => t.d === d);
    if (w === 0 && typeof FIRST_DAY !== "undefined" && d < FIRST_DAY) continue;
    const date = fmt(new Date(wkDate(w).getTime() + (d - 1) * DAY));
    s += `\n*${DIAS[d].toUpperCase()} ${date}*\n`;
    if (d % 2 === 1 && harv.length) s += `▢ Cosecha para cocina antes de las 10:00, pesar y anotar\n`;
    list.forEach(t => s += `▢ ${t.b ? `*${t.b}* · ` : ""}${t.t}\n`);
  }
  if (harv.length) {
    const byCrop = {};
    harv.forEach(t => { const o = byCrop[t.crop] = byCrop[t.crop] || {beds: [], qty: 0, u: t.u}; o.beds.push(t.bed); o.qty += t.qty; });
    s += `\n*COSECHA DE LA SEMANA* (aprox., repartir lun/mié/vie)\n`;

views.compras = () => {
  const from = state.w, to = Math.min(PLAN_WEEKS - 1, state.w + 5);
  const items = [];
  plan.P.forEach(p => {
    const c = p.c, len = p.m;
    const when = p.tray ? p.ts : p.s;
    if (p.ex || when < from || when > to || c.met === "división" || c.met === "propia") return;
    let q;
    if (p.tray) q = `semilla para ${nf(p.cells)} cavidades (${p.trays} charola${p.trays > 1 ? "s" : ""})`;
    else if (c.met === "bulbo") q = `${nf(Math.ceil(c.rows * Math.floor(len / c.esp) * 1.1))} dientes / bulbos`;
    else if (c.rows) q = `${nf(c.rows * len, 1)} m de hilera`;
    else q = `${nf(p.area, 1)} m² al voleo`;
    items.push({when, c, q, bed: p.bed + (p.frac < .999 ? ` (${nf(p.m, 1)} m)` : ""), uso: p.tray ? "semillero" : "cama"});
  });
  items.sort((a, b) => a.when - b.when);
  // lista del año: semilla total por cultivo
  const yr = {};
  plan.P.forEach(p => {
    const c = p.c, len = p.m;
    if (p.ex || c.met === "división" || c.met === "propia") return;
    const r = yr[p.crop] = yr[p.crop] || {first: p.tray ? p.ts : p.s, cells: 0, meters: 0, bulbs: 0, area: 0, n: 0};
    r.first = Math.min(r.first, p.tray ? p.ts : p.s); r.n++;
    if (p.tray) r.cells += p.cells;
    else if (c.met === "bulbo") r.bulbs += Math.ceil(c.rows * Math.floor(len / c.esp) * 1.1);
    else if (c.rows) r.meters += c.rows * len; else r.area += p.area;
  });
  const yrList = Object.entries(yr).sort((a, b) => (STOCK[a[0]] ? 1 : 0) - (STOCK[b[0]] ? 1 : 0) || a[1].first - b[1].first);
  const yq = (k, r) => [r.cells && `${nf(r.cells)} cavidades`, r.meters && `${nf(r.meters)} m de hilera`, r.bulbs && `${nf(r.bulbs)} ${k === "ajo" ? "dientes y bulbos" : "piezas"}`, r.area && `${nf(r.area)} m² al voleo`].filter(Boolean).join(" + ");
  let maxTrays = 0; for (let w = 0; w < PLAN_WEEKS; w++) maxTrays = Math.max(maxTrays, traysActive(plan, w).reduce((a, p) => a + p.trays, 0));
  return `
  <div class="vtop">${navStepper("cmp", `${weekRange(from).split(" – ")[0]} – ${weekRange(to).split(" – ")[1]}`, "Semillas para 6 semanas", {group: "Semanas", prev: "6 semanas antes", next: "6 semanas después", prevOff: from <= 0, nextOff: from + 6 > PLAN_WEEKS - 1, startNote: "Son las primeras semanas del plan."})}</div>
  <section class="panel"><div class="scroll"><table class="stack"><thead><tr><th>Cultivo</th><th>Se usa</th><th>Dónde</th><th class="r">Cantidad</th><th>Cama</th></tr></thead><tbody>
  ${items.map(r => `<tr><td><span class="dot" style="background:${r.c.c}"></span> ${esc(r.c.n)}</td>${td("Se usa", fmt(wkDate(r.when)), "num")}${td("Dónde", r.uso + (STOCK[Object.keys(CROPS).find(k => CROPS[k] === r.c)] ? ` <span class="chip">en bodega</span>` : ""), "small")}${td("Cantidad", r.q, "r num")}${td("Cama", r.bed, "num small")}</tr>`).join("") || `<tr><td colspan="5" class="muted">No hay siembras en estas semanas.</td></tr>`}
  </tbody></table></div></section>
  <details class="fold yr"><summary><span class="fs"><b>Lista de compra del año</b><span class="small muted">${yrList.filter(([k]) => !STOCK[k]).length} por comprar · ${yrList.filter(([k]) => STOCK[k]).length} en bodega · toca para ver</span></span></summary><div class="yrb">
  <div class="scroll"><table class="stack"><thead><tr><th>Cultivo</th><th>Estado</th><th>Primera siembra</th><th class="r">Semilla para el año</th></tr></thead><tbody>
  ${yrList.map(([k, r]) => `<tr><td><span class="dot" style="background:${CROPS[k].c}"></span> ${esc(CROPS[k].n)}${STOCK[k] && STOCK[k] !== CROPS[k].n ? ` <span class="muted small">· ${esc(STOCK[k])}</span>` : ""}</td>${td("Estado", STOCK[k] ? `<span class="chip">✓ En bodega</span>` : `<span class="chip warn">Comprar</span>`)}${td("Primera siembra", fmt(wkDate(r.first)), "num small")}${td("Semilla", yq(k, r), "r num small")}</tr>`).join("")}
  </tbody></table></div>
  <p class="small muted" style="margin:8px 0 0">"En bodega": revisar que alcance para la cantidad indicada y que la semilla tenga menos de 2 años. Las hierbas perennes no se compran: se dividen las que ya existen.</p></div></details>
  <section class="panel"><h3 style="margin-bottom:8px">En bodega, fuera del plan de camas</h3><div class="scroll"><table class="stack"><tbody>${EXTRA_SEEDS.map(x => `<tr><td class="nw"><b>${esc(x.n)}</b></td><td class="small"><span class="v">${esc(x.uso)}</span></td></tr>`).join("")}</tbody></table></div></section>
  <section class="panel"><h3 style="margin-bottom:8px">Material del semillero (una sola vez)</h3>
  <ul class="small" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px">
    <li><b>Charolas: 30 de 200 cavidades (ya compradas)</b>. Máximo ${maxTrays} en uso a la vez; sobran para la experiencia "Planta y llévatela"</li>
    <li>Mesa de semillero (ya existe), con malla sombra 50% y cerca de una toma de agua</li>
    <li>Sustrato: 2 partes de fibra de coco o peat moss + 1 parte de composta cernida + 1 de perlita</li>
    <li>Manta térmica o plástico para tapar las charolas en noches de helada (dic–feb)</li>
    <li>Regadera de flor fina y etiquetas con cultivo, cama y fecha</li>
  </ul></section>
  <p class="small muted" style="margin:0;max-width:70ch">Para semilla directa, la bolsa indica cuántos metros de hilera rinde; comprar con margen y guardar en lugar fresco y seco. No se compran plántulas: todo lo que va trasplantado sale del semillero.</p>`;
};

    <div class="bar small"><span class="chip">${used} cultivo${used === 1 ? "" : "s"} en la mesa</span>${sowNow.length ? `<span class="chip warn">Sembrar esta semana: ${[...new Set(sowNow.map(p => shortName(p.c.n)))].map(esc).join(", ")}</span>` : ""}</div>

      ${[...new Set([...sowNow, ...act])].map(p => { const st = rowStatus(p); return `<tr><td><span class="dot" style="background:${p.c.c}"></span> <b>${esc(p.c.n)}</b></td>${td("Semillas", p.cells * 2, "r num")}${td("Va a la cama", p.bed, "num small")}${td("Trasplante", fmt(wkDate(p.s)), "num small")}${td("1ª cosecha", fmt(wkDate(p.h0)), "num small")}${td("Estado", `<span class="chip ${st[1]}">${p.ts === w ? "Sembrar hoy" : st[0]}</span>`)}</tr>`; }).join("")}
      </tbody></table></div>` : `<p class="muted small" style="margin:0">La mesa está vacía esta semana.</p>`}

views.registro.bind = root => {
  const f = root.querySelector("#regf"); if (!f) return;
  const cama = f.querySelector("#rf-cama"), cult = f.querySelector("#rf-cultivo");
  const syncCrop = () => { const w = Math.max(0, Math.min(PLAN_WEEKS - 1, Math.floor((D(f.querySelector("#rf-fecha").value) - D(PLAN_START)) / (7 * DAY)))); const st = bedState(plan, cama.value, w); if (st.p) cult.value = st.p.crop; };
  cama.onchange = syncCrop; if (!render.kept || !render.kept["rf-cultivo"]) syncCrop();
  f.onsubmit = async e => {
    e.preventDefault();
    const c = CROPS[cult.value];
    const doc = {fecha: f.querySelector("#rf-fecha").value, cama: cama.value, cultivo: cult.value, cantidad: +f.querySelector("#rf-cant").value, u: c.u, nota: f.querySelector("#rf-nota").value.slice(0, 200), at: Date.now()};
    const btn = f.querySelector("button[type=submit]"); btn.disabled = true;
    try { await state.db.collection("cosechas").add(doc); toast(`Guardado: ${nf(doc.cantidad, 1)} ${c.u} de ${c.n}`); f.querySelector("#rf-cant").value = ""; f.querySelector("#rf-nota").value = ""; }
    catch (err) { saveErr(err); }
    btn.disabled = false;
  };
};

function taskRow(t, pre){
  const done = state.done[t.id], nope = (state.nope || {})[t.id], help = (state.flags || {})[t.id], open = state.topen === t.id;
  const note = nope != null ? nope : help != null ? help : (state.dnote || {})[t.id] || "";
  return `<div class="taskw${done ? " done" : ""}${nope != null ? " nope" : ""}${open ? " open" : ""}"><label class="task${done ? " done" : ""}"><input type="checkbox" data-id="${t.id}" ${done ? "checked" : ""}${nope != null ? ` aria-label="No se pudo"` : ""}><span class="th"><span class="k ${t.k}">${KLAB[t.k]}</span>${t.b ? `<b class="crop">${esc(t.b)}</b>` : ""}${t.min ? `<span class="t">${t.min >= 60 ? nf(t.min / 60, 1) + " h" : Math.round(t.min) + " min"}</span>` : ""}</span><span class="tx">${esc(t.t)}${nope != null ? `<span class="why bad">✗ No se pudo${nope ? ": " + esc(nope) : ""}</span>` : help != null ? `<span class="why warn">Pidió ayuda${help ? ": " + esc(help) : ""}</span>` : done && note ? `<span class="why">${esc(note)}</span>` : ""}</span></label><button type="button" class="tmore" data-more="${t.id}" aria-expanded="${open}" aria-label="Más opciones de la tarea">⋯</button>
  ${open ? `<div class="tpanel">
    <div class="treasons">${NOPE.map(r => `<button type="button" data-tr="${esc(r)}">${esc(r)}</button>`).join("")}</div>
    <input class="tnote" maxlength="200" value="${esc(note)}" placeholder="Nota (opcional): qué pasó" aria-label="Nota de la tarea">
    <div class="tst"><button type="button" data-ts="hecho" aria-pressed="${!!done}">✓ Hecha</button><button type="button" data-ts="no" aria-pressed="${nope != null}">✗ No se pudo</button><button type="button" data-ts="ayuda" aria-pressed="${help != null}">Pedir ayuda</button></div>
    ${t.k === "cosecha" ? `<p class="small muted" style="margin:0">Si no se cosechó, márcala “No se pudo”: así no se cuenta como cosecha.</p>` : ""}</div>` : ""}</div>`;
}
function bindTasks(root){
  root.querySelectorAll(".task input").forEach(cb => cb.addEventListener("change", () => toggleDone(cb.dataset.id, cb.checked)));
  root.querySelectorAll("[data-more]").forEach(b => b.onclick = () => { state.topen = state.topen === b.dataset.more ? null : b.dataset.more; render(); });
  root.querySelectorAll(".taskw.open").forEach(w => {
    const id = w.querySelector("[data-more]").dataset.more, inp = w.querySelector(".tnote");
    w.querySelectorAll("[data-tr]").forEach(b => b.onclick = () => { inp.value = b.dataset.tr; inp.focus(); });
    w.querySelectorAll("[data-ts]").forEach(b => b.onclick = () => { setTaskState(id, b.dataset.ts, inp.value.trim()); state.topen = null; });
  });
}
async function setTaskState(id, estado, nota){
  state.nope = state.nope || {}; state.flags = state.flags || {}; state.dnote = state.dnote || {};
  const prev = {d: state.done[id], n: state.nope[id], f: state.flags[id]};
  delete state.nope[id]; delete state.flags[id]; state.done[id] = false;
  if (estado === "hecho") { state.done[id] = true; state.dnote[id] = nota; } else if (estado === "no") state.nope[id] = nota; else state.flags[id] = nota;
  render();
  if (!state.db) return;
  try { await state.db.doc(`hechas/w${state.w}-${id}`).set({w: state.w, id, estado, nota, at: Date.now()}); toast(estado === "hecho" ? "Tarea hecha" : estado === "no" ? "Anotado: no se pudo" : "Ayuda pedida"); }
  catch (e) { state.done[id] = prev.d; if (prev.n != null) state.nope[id] = prev.n; else delete state.nope[id]; if (prev.f != null) state.flags[id] = prev.f; else delete state.flags[id]; render(); saveErr(e, "No se pudo guardar la tarea."); }
}
/* ---------- datos compartidos ---------- */
const typing = () => { if (document.querySelector(".pinsheet:not([hidden])")) return true; const a = document.activeElement; return !!a && a.matches("input:not([type=checkbox]):not([type=radio]), textarea, select"); };
let unsubDone = null;
function subscribeDone(){
  if (!state.db) return;
  if (unsubDone) unsubDone();
  const w = state.w;
  unsubDone = state.db.collection("hechas").where("w", "==", w).onSnapshot(snap => {
    if (w !== state.w) return;
    const d = {}, f = {}, no = {}, dn = {}; snap.docs.forEach(x => { const v = x.data(); if (!v || !v.id) return; if (v.estado === "ayuda") f[v.id] = v.nota || ""; else if (v.estado === "no") no[v.id] = v.nota || ""; else { d[v.id] = true; if (v.nota) dn[v.id] = v.nota; } });
    state.done = d; state.flags = f; state.nope = no; state.dnote = dn; if ((state.view === "semana" || state.view === "hoy") && !typing()) render();
  }, () => {});
}
async function toggleDone(id, on){
  state.done[id] = on; if (state.nope) delete state.nope[id]; if (state.flags) delete state.flags[id];
  if (state.view === "semana" || state.view === "hoy") render();
  if (!state.db) return;
  const ref = state.db.doc(`hechas/w${state.w}-${id}`);
  try { on ? await ref.set({w: state.w, id, estado: "hecho", at: Date.now()}) : await ref.delete(); }
  catch (e) { state.done[id] = !on; if (state.view === "semana" || state.view === "hoy") render(); saveErr(e, "No se pudo guardar la marca. Revisa la conexión."); }
}
/* ---------- render ---------- */
const TITLES = {cocina: "Cocina", mensajes: "Mensajes con cocina", pedidos: "Pedidos de cocina", insumos: "Compras y banco de semillas", censo: "Censo de camas", hoy: "Hoy", semillero: "Semillero", experiencias: "Experiencias", semana: "Semana", mapa: "Mapa del mes", cosecha: "Cosecha", calendario: "Calendario", cultivos: "Cultivos", compras: "Semillas que pide el plan", registro: "Registro de cosecha"};
const MAIN4 = ["hoy", "semana", "mapa", "cosecha"];
const TOPTABS = ["hoy", "semana", "mapa", "cosecha", "calendario", "censo", "cocina"];
function render(){
  const main = document.getElementById("main");
  const y = window.scrollY;
  // Lo que la persona estaba escribiendo ([data-keep]) sobrevive a cada redibujo (p. ej. al volver de pedir el PIN).
  const kept = {}; main.querySelectorAll("[data-keep]").forEach(e => { kept[e.dataset.keep] = e.value; });
  main.innerHTML = `<div class="view">${views[state.view]()}</div>`;
  const restored = {}; main.querySelectorAll("[data-keep]").forEach(e => { const k = e.dataset.keep; if (k in kept && e.value !== kept[k]) { e.value = kept[k]; restored[k] = 1; } });
  render.kept = restored;
  document.getElementById("vtitle").textContent = TITLES[state.view];
  document.title = TITLES[state.view] + " · Huerto Dos Búhos";
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.v === state.view || (b.dataset.v === "mas" && !TOPTABS.includes(state.view)) ? "page" : "false"));
  document.querySelectorAll("nav.bottom button").forEach(b => b.setAttribute("aria-selected", b.dataset.v === state.view || (b.dataset.v === "mas" && !MAIN4.includes(state.view) && state.view !== "cocina")));
  document.querySelectorAll("#sheet [data-v]").forEach(b => b.setAttribute("aria-current", b.dataset.v === state.view ? "page" : "false"));
  const kn = (state.pedidos || []).filter(x => x.estado === "nueva").length + (state.msgs || []).filter(m => m.de !== "huerto" && Date.now() - new Date(String(m.at).replace(" ", "T") + "Z") < 2 * DAY).length;
  document.querySelectorAll('nav button[data-v="cocina"]').forEach(b => { let x = b.querySelector(".nb"); if (!kn) { if (x) x.remove(); return; } if (!x) { x = document.createElement("span"); x.className = "nb"; b.appendChild(x); } x.textContent = kn; });
  if (views[state.view].bind) views[state.view].bind(main);
  if (render.keep) window.scrollTo(0, y); else window.scrollTo(0, 0);
  render.keep = true;
}
const sheet = document.getElementById("sheet");
let sheetFrom = null;
function openSheet(from){ sheetFrom = from || null; sheet.hidden = false; const c = sheet.querySelector("[data-close]"); if (c) c.focus(); }
function closeSheet(){ if (sheet.hidden) return; sheet.hidden = true; if (sheetFrom) sheetFrom.focus(); }
function go(v){ sheet.hidden = true; if (v === "hoy") state.hd = null; if (v !== "censo") state.cfrom = null; state.view = v; try { localStorage.setItem("huerto-vista", v); } catch (e) {} if (location.hash.slice(1) !== v) history.pushState(null, "", "#" + v); render.keep = false; render(); }
window.addEventListener("popstate", () => { const h = location.hash.slice(1); if (views[h] && h !== state.view) { state.view = h; if (h !== "censo") state.cfrom = null; render.keep = false; render(); } });
document.querySelectorAll("nav.tabs button, nav.bottom button").forEach(b => b.onclick = () => { if (b.dataset.v === "mas") { openSheet(b); return; } state.cfrom = null; go(b.dataset.v); });
sheet.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { state.cfrom = null; go(b.dataset.v); });
sheet.querySelector("[data-close]").onclick = closeSheet;
sheet.addEventListener("click", e => { if (e.target === sheet) closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
state.view = window.matchMedia("(max-width: 859px)").matches ? "hoy" : "semana";
try { const v = localStorage.getItem("huerto-vista"); if (v && views[v]) state.view = v; } catch (e) {}
try { const z = localStorage.getItem("huerto-zona"); if (z) state.zone = z; } catch (e) {}
const hv = location.hash.replace("#", ""); if (views[hv]) state.view = hv;
render();
// Plan vivo: en la versión web se carga de /api/plan (lo editan Eric, Melanie y Claude); si no hay, queda el del código.
function reloadPlan(){ const np = buildPlan(); for (const k of Object.keys(plan)) delete plan[k]; Object.assign(plan, np); }
if (location.protocol.startsWith("http") && !/claude|anthropic/.test(location.hostname)) {
  window.loadLive = async () => { try { const r = await fetch("/api/plan", {cache: "no-store"}); if (!r.ok) return; const j = await r.json(); if (j && j.data && j.v !== loadLive.v) { loadLive.v = j.v; applyPlanData(j.data); applyBank(); reloadPlan(); if (!typing() && !state.upd) render(); } } catch (e) {} };
  loadLive(); setInterval(() => { if (document.visibilityState === "visible") loadLive(); }, 60000);
  window.loadCenso = async () => { try { const r = await fetch("/api/censo", {cache: "no-store"}); if (!r.ok) return; const j = await r.json(); const m = {}; (j.rows || []).forEach(c => { m[c.cama] = c; }); state.censo = m; Object.keys(state.cdraft || {}).forEach(b => { if (!(state.cdirty || {})[b]) delete state.cdraft[b]; }); if (state.view === "censo" ? !typing() : !typing() && !state.upd) render(); } catch (e) {} };
  loadCenso();
  window.loadInsumos = async () => { try { const [a, b] = await Promise.all([fetch("/api/lista", {cache: "no-store"}).then(r => r.json()), fetch("/api/banco", {cache: "no-store"}).then(r => r.json())]); state.lista = a.rows || []; state.bank = b.rows || []; applyBank(); if (!typing() && !state.upd && state.view !== "censo") render(); } catch (e) {} };
  loadInsumos();
  window.loadPedidosHuerto = async () => { try { const [a, b] = await Promise.all([fetch("/api/cocina/pedidos", {cache: "no-store"}).then(r => r.json()), fetch("/api/cocina/siembras", {cache: "no-store"}).then(r => r.json())]); state.pedidos = a.rows || []; state.pvotos = b.rows || []; if ((state.view === "pedidos" || state.view === "cocina") && !typing()) render(); } catch (e) {} };
  loadPedidosHuerto();
  window.loadMsgsHuerto = async () => { try { state.msgs = (await fetch("/api/mensajes", {cache: "no-store"}).then(r => r.json())).rows || []; if ((state.view === "mensajes" || state.view === "cocina") && !typing()) render(); } catch (e) {} };
  loadMsgsHuerto(); setInterval(() => { if (document.visibilityState === "visible" && (state.view === "mensajes" || state.view === "cocina")) loadMsgsHuerto(); }, 20000);
}
(async () => {
  try {
    const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
    state.dbTried = true;
    if (!db) { render(); return; }
    state.db = db;
    subscribeDone();
    db.collection("camas").orderBy("at", "desc").limit(500).onSnapshot(snap => {
      state.reports = snap.docs.map(d => ({...d.data(), _id: d.id}));
      if (["mapa", "registro"].includes(state.view) && !typing() && !state.upd) render();
    }, () => {});
    db.collection("cosechas").orderBy("fecha", "desc").limit(1000).onSnapshot(snap => {
      state.harvests = snap.docs.map(d => d.data());
      if (["registro", "cosecha", "hoy", "cocina"].includes(state.view) && !typing()) render();
    }, () => {});
    render();
  } catch (e) { state.dbTried = true; render(); }
})();
setTimeout(() => { if (!state.dbTried) { state.dbTried = true; render(); } }, 10500);
